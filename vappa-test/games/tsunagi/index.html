<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="ov">
  <div class="emo">🍡🍓🍵🐥</div>
  <h1>一筆書きつなぎ</h1>
  <p>同じ色の<b>もちもち</b>を指でなぞって<b>3つ以上</b><br>つなげよう！ 指をはなすとポン！ 長くつなぐほど高得点。</p>
  <p class="tips">💣 7つ以上でボム出現 → タップで爆発<br>💥 10つ以上で<b>大爆発！</b><br>🍡 にじ玉はどの色ともつながる<br>⏱ 時計つきを消すと <b>+3秒</b><br>😾 おじゃまは爆発でしか消せない<br>🔥 ゲージ満タンで<b>フィーバー</b>（得点2倍）</p>
  <p>制限時間は <b>60秒</b>！</p>
  <button id="startBtn">はじめる</button>
</div>
<script src="../../js/arcade-sdk.js?v=2"></script>

  /* ===================== スプライト（キャンバス描画のキャラ） ===================== */

      g.moveTo(ex-r*0.11,ey+r*0.04);g.lineTo(ex,ey-r*0.08);g.lineTo(ex+r*0.11,ey+r*0.04);g.stroke();}
    else{ell(g,-ex,ey,r*0.085,r*0.12);g.fill();ell(g,ex,ey,r*0.085,r*0.12);g.fill();
      g.fillStyle="#fff";ell(g,-ex+r*0.03,ey-r*0.05,r*0.03,r*0.035);g.fill();ell(g,ex+r*0.03,ey-r*0.05,r*0.03,r*0.035);g.fill();g.fillStyle="#3a2233";}
    var my=r*0.2;
    if(t===2){ // ひよこ：くちばし
      g.fillStyle="#ff9a2e";g.beginPath();g.moveTo(-r*0.12,my-r*0.04);g.lineTo(r*0.12,my-r*0.04);g.lineTo(0,my+(mode==="happy"?r*0.16:r*0.1));g.closePath();g.fill();
      g.lineWidth=r*0.04;g.strokeStyle="#c46a10";g.stroke();return;
    }
    if(mode==="happy"){g.fillStyle="#7a2233";g.beginPath();g.moveTo(-r*0.13,my-r*0.02);g.quadraticCurveTo(0,my+r*0.26,r*0.13,my-r*0.02);g.closePath();g.fill();return;}
    g.lineWidth=r*0.065;g.beginPath();
    if(t===1||t===4){g.moveTo(-r*0.14,my-r*0.02);g.quadraticCurveTo(-r*0.07,my+r*0.09,0,my);g.quadraticCurveTo(r*0.07,my+r*0.09,r*0.14,my-r*0.02);g.stroke();}
    else if(t===3){ell(g,0,my+r*0.02,r*0.06,r*0.07);g.fill();}

  }
  function accMochi(g,r,t){ // 種類ごとの目印（色覚に頼らず見分けられるように）
    var col=TYPES[t];g.lineJoin="round";g.lineCap="round";
    if(t===0){ // いちご：へた
      g.fillStyle="#4cb050";g.strokeStyle="#2e7d32";g.lineWidth=r*0.04;
      for(var i=0;i<5;i++){var a=-Math.PI/2+(i-2)*0.5;g.save();g.translate(0,-r*0.9);g.rotate(a+Math.PI/2);ell(g,0,-r*0.14,r*0.08,r*0.16);g.fill();g.stroke();g.restore();}
      g.fillStyle="rgba(255,255,255,.55)";[[-0.55,-0.1],[0.6,-0.25],[0.2,0.55],[-0.3,0.6],[0.65,0.42]].forEach(function(s){ell(g,s[0]*r,s[1]*r,r*0.035,r*0.05);g.fill();});
    }else if(t===1){ // まっちゃ：ふたば
      g.strokeStyle="#2f7d36";g.lineWidth=r*0.07;g.beginPath();g.moveTo(0,-r*0.9);g.lineTo(0,-r*1.12);g.stroke();

      g.save();g.translate(0,-r*1.12);g.rotate(-0.7);ell(g,-r*0.2,0,r*0.22,r*0.11);g.fill();g.stroke();g.restore();
      g.save();g.translate(0,-r*1.12);g.rotate(0.7);ell(g,r*0.2,0,r*0.22,r*0.11);g.fill();g.stroke();g.restore();

    [["#ffa3c0","#e0628a",-0.32,0.32],["#fff6e8","#d8c4a8",0,0],["#9fdc8c","#5aa848",0.32,-0.32]].forEach(function(b){

    g.fillStyle="rgba(255,255,255,.8)";ell(g,-r*0.45,-r*0.5,r*0.14,r*0.08);g.fill();

        g.fillStyle="#2e2b3c";ell(g,-rr*0.3,rr*0.03,rr*0.035,rr*0.07);g.fill();ell(g,rr*0.3,rr*0.03,rr*0.035,rr*0.07);g.fill();}
      else{g.beginPath();g.moveTo(-rr*0.42,rr*0.04);g.lineTo(-rr*0.18,rr*0.04);g.moveTo(rr*0.42,rr*0.04);g.lineTo(rr*0.18,rr*0.04);g.stroke();}
      g.lineWidth=rr*0.06;g.beginPath();g.moveTo(-rr*0.16,rr*0.42);g.quadraticCurveTo(0,rr*0.28,rr*0.16,rr*0.42);g.stroke();

    g.fillStyle=bg;ell(g,0,0,r*0.98,r*0.98);g.fill();g.strokeStyle="#0c0a12";g.lineWidth=r*0.05;g.stroke();

          if(dx>rs||dx<-rs||dy>rs||dy<-rs)continue;var d2=dx*dx+dy*dy;

      var imp=a.pvy-a.vy;if(imp>260){a.sqv+=Math.min(9,imp*0.0045);}

  /* ===================== ヒント・シャッフル ===================== */
  function findChain(){
    var ok=[],i,j;for(i=0;i<pieces.length;i++)if(linkable(pieces[i])&&pieces[i].y>BT)ok.push(pieces[i]);
    var bestPath=null;
    for(var c=0;c<TYPES.length;c++){
      var nodes=ok.filter(function(p){return p.kind==="rainbow"||p.type===c;});
      for(i=0;i<nodes.length;i++){if(nodes[i].kind!=="n")continue;
        var path=[nodes[i]],cur=nodes[i];
        for(var step=0;step<14;step++){var nx=null;
          for(j=0;j<nodes.length;j++){var q=nodes[j];if(path.indexOf(q)>=0)continue;var dx=q.x-cur.x,dy=q.y-cur.y;
            if(dx*dx+dy*dy<=Math.pow(linkDist(q,cur),2)){nx=q;if(q.kind==="n")break;}}
          if(!nx)break;path.push(nx);cur=nx;}
        if(path.length>=3&&(!bestPath||path.length>bestPath.length))bestPath=path;
      }
    }
    return bestPath;
  }

  /* ===================== 更新 ===================== */
  function update(dt){

    acc+=dt;var hs=1/120,k=0;while(acc>=hs&&k<5){physStep(hs);acc-=hs;k++;}if(k>=5)acc=0;
    var i,p;
    for(i=events.length-1;i>=0;i--){events[i].t-=dt;if(events[i].t<=0){var e=events[i];events.splice(i,1);e.fn();}}
    for(i=pieces.length-1;i>=0;i--){p=pieces[i];if(!p)continue;
      p.sqv+=(-170*p.sq-11*p.sqv)*dt;p.sq+=p.sqv*dt;if(p.sq>0.26)p.sq=0.26;if(p.sq<-0.22)p.sq=-0.22;
      var tv=p.dying>=0&&p.dying<0.08?1.35:p.sel?1.14:1;p.vs+=(tv-p.vs)*Math.min(1,dt*18);
      p.blink-=dt;if(p.blink<-0.13)p.blink=rnd(1.5,5);
      if(p.tw>0)p.tw-=dt;
      if(p.dying>=0){p.dying-=dt;if(p.dying<0)killPiece(p);}
    }
    // 補充
    spawnCD-=dt;

      var placed=false;
      for(var tr=0;tr<8&&!placed;tr++){var x=rnd(BL+R0,BR-R0),y=BT-R0*0.6,free=true;
        for(i=0;i<pieces.length;i++){var q=pieces[i],dx=q.x-x,dy=q.y-y;if(dx*dx+dy*dy<Math.pow(q.r+R0*1.05,2)){free=false;break;}}
        if(free){var np=makeRolled(x,y);np.vy=rnd(250,450);np.vs=0.6;pieces.push(np);spawnQ--;placed=true;
          if(np.kind==="ojama"&&!ojamaHintShown){ojamaHintShown=true;later(0.6,function(){addPop(W/2,BT+R0*2,"😾 おじゃま登場！ボムで消そう","#e0dcf0",15,1.8);});}}}
      spawnCD=placed?0.03:0.06;if(!placed)break;
    }
    // パーティクル類
    for(i=parts.length-1;i>=0;i--){p=parts[i];p.age+=dt;if(p.age>p.life){parts.splice(i,1);continue;}p.vy+=p.g*dt;p.vx*=0.985;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    for(i=pops.length-1;i>=0;i--){pops[i].age+=dt;if(pops[i].age>pops[i].life)pops.splice(i,1);}
    for(i=texts.length-1;i>=0;i--){texts[i].age+=dt;if(texts[i].age>texts[i].life)texts.splice(i,1);}
    for(i=rings.length-1;i>=0;i--){rings[i].age+=dt;if(rings[i].age>rings[i].life)rings.splice(i,1);}
    shake=Math.max(0,shake-dt*2.6);flash=Math.max(0,flash-dt*2.2);timeFlash=Math.max(0,timeFlash-dt*2);
    dscore+=(score-dscore)*Math.min(1,dt*9);if(Math.abs(score-dscore)<1)dscore=score;

    if(phase==="ready"){
      if(phaseT>1.5){phase="play";phaseT=0;callText("スタート！","#ffe066",H*0.42,0.9,58);SFX.go();}
    }else if(phase==="play"){
      timeLeft-=dt;
      if(feverT>0){feverT-=dt;fever=FEVER_MAX*Math.max(0,feverT)/FEVER_TIME;if(feverT<=0){feverT=0;fever=0;}}
      var sec=Math.ceil(timeLeft);if(sec<=10&&sec<lastSec&&sec>0){SFX.tick();if(sec===10)callText("ラスト10秒！","#ff8080",H*0.42,0.9,40);}lastSec=sec;
      if(!chain.length)idleT+=dt;
      hintCheckT-=dt;
      if(hintCheckT<=0){hintCheckT=0.5;
        var busy=spawnQ>0||pieces.some(function(q){return q.dying>=0;});
        if(!busy){var fc=findChain();
          if(!fc&&!pieces.some(function(q){return q.kind==="bomb";}))shuffle();
          if(idleT>3.5&&!hint)hint=fc;}
        if(hint&&hint.some(function(q){return pieces.indexOf(q)<0||q.dying>=0;}))hint=null;}
      if(timeLeft<=0){timeLeft=0;phase="end";phaseT=0;endStep=0;
        if(chain.length>=3)popChain();else{for(i=0;i<chain.length;i++)chain[i].sel=false;chain=[];}
        hint=null;callText("タイムアップ！","#ffffff",H*0.4,1.3,52);SFX.whistle();}
    }else if(phase==="end"){
      if(feverT>0){feverT-=dt;if(feverT<=0){feverT=0;fever=0;}}
      if(endStep===0&&phaseT>1.3){
        var bombs=pieces.filter(function(q){return q.kind==="bomb"&&q.dying<0;});
        if(bombs.length){callText("ラストボーナス！","#ffd54f",H*0.4,1.2,46);
          bombs.forEach(function(b,j){later(0.5+j*0.45,function(){if(pieces.indexOf(b)>=0)detonate(b);});});
          endWait=0.5+bombs.length*0.45+0.9;}else endWait=0.2;
        endStep=1;phaseT=0;}
      else if(endStep===1&&phaseT>endWait&&!events.length&&!pieces.some(function(q){return q.dying>=0;})){endStep=2;gameOver();}
    }
  }

  /* ===================== 描画 ===================== */
  function rr(x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function drawBG(){
    var g=ctx.createLinearGradient(0,0,0,H);
    if(feverT>0){var h=(T*70)%360;g.addColorStop(0,"hsl("+h+",65%,32%)");g.addColorStop(1,"hsl("+((h+70)%360)+",70%,16%)");}
    else{g.addColorStop(0,"#2a1f4a");g.addColorStop(1,"#130e24");}
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    if(feverT>0){ctx.save();ctx.translate(W/2,(BT+BB)/2);ctx.rotate(T*0.6);ctx.fillStyle="rgba(255,255,255,.07)";
      var L=Math.max(W,H);for(var i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(L,-L*0.13);ctx.lineTo(L,L*0.13);ctx.closePath();ctx.fill();}ctx.restore();}
    else{ctx.fillStyle="rgba(255,255,255,.05)";for(var j=0;j<14;j++){var x=(j*97+T*8)%W,y=(j*173)%H;ctx.beginPath();ctx.arc(x,y,2+(j%3),0,6.283);ctx.fill();}}
  }
  function drawJar(front){
    var x=BL-7,w=BR-BL+14,y=BT-6,h=BB-BT+13;
    if(!front){
      var g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,"rgba(255,255,255,.04)");g.addColorStop(1,"rgba(255,220,240,.13)");
      ctx.fillStyle=g;rr(x,y,w,h,CR+6);ctx.fill();
      return;
    }
    ctx.lineWidth=5;
    ctx.strokeStyle=feverT>0?"hsl("+((T*200)%360)+",90%,70%)":"rgba(255,255,255,.32)";
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h-CR-6);ctx.arcTo(x,y+h,x+CR+6,y+h,CR+6);ctx.lineTo(x+w-CR-6,y+h);ctx.arcTo(x+w,y+h,x+w,y+h-CR-6,CR+6);ctx.lineTo(x+w,y);ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle;rr(x-6,y-6,12,10,4);ctx.fill();rr(x+w-6,y-6,12,10,4);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.07)";rr(x+8,y+16,10,h*0.55,5);ctx.fill();
  }
  function drawPiece(p,T2){
    var s=SPS*(p.r/R0)*p.vs,b=Math.sin(T2*3+p.ph)*0.018;
    var sx=1+p.sq*0.55-b,sy=1-p.sq+b,wob=p.tw>0?Math.sin(p.tw*50)*0.12:0;
    ctx.save();ctx.translate(p.x,p.y+p.r*p.sq*0.4);if(wob)ctx.rotate(wob);
    if(p.kind==="bomb"){var pl=1+Math.sin(T2*9)*0.05;sx*=pl;sy*=pl;}
    ctx.scale(sx,sy);
    if(p.sel){ctx.fillStyle="rgba(255,255,255,.5)";ctx.beginPath();ctx.arc(0,0,p.r*1.12,0,6.283);ctx.fill();}
    var img;
    if(p.kind==="n")img=SPR[p.type+"_"+(p.sel?"happy":p.blink<0?"blink":"norm")];
    else if(p.kind==="rainbow")img=SPR.rainbow;
    else if(p.kind==="ojama")img=SPR["ojama"+((Math.floor(T2*0.5+p.ph)%3===0)?1:0)];
    else img=SPR.bomb;
    if(p.kind==="rainbow"){ctx.save();ctx.rotate(T2*1.5);ctx.strokeStyle="hsl("+((T2*180)%360)+",95%,70%)";ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(0,0,p.r*1.08,0,6.283);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
    ctx.drawImage(img,-s/2,-s/2,s,s);
    if(p.time){var cs=s*0.62;ctx.drawImage(SPR.clock,p.r*0.5-cs/2,p.r*0.5-cs/2,cs,cs);}
    if(p.kind==="bomb"){var fx=p.r*0.62,fy=-p.r*0.86;
      for(var i=0;i<3;i++){var a=T2*20+i*2.1;ctx.fillStyle=i===0?"#fff6a0":i===1?"#ffb347":"#ff5d3d";ctx.beginPath();ctx.arc(fx+Math.cos(a)*p.r*0.12,fy+Math.sin(a)*p.r*0.12,p.r*(0.13-i*0.03),0,6.283);ctx.fill();}}
    if(p.dying>=0&&p.dying<0.08){ctx.fillStyle="rgba(255,255,255,"+(1-p.dying/0.08)*0.8+")";ctx.beginPath();ctx.arc(0,0,p.r,0,6.283);ctx.fill();}
    ctx.restore();
  }
  function drawChain(){
    if(!chain.length)return;
    var col=chainColor>=0?TYPES[chainColor].base:"#fff";
    ctx.lineCap="round";ctx.lineJoin="round";
    function path(){ctx.beginPath();ctx.moveTo(chain[0].x,chain[0].y);for(var i=1;i<chain.length;i++)ctx.lineTo(chain[i].x,chain[i].y);}
    path();ctx.strokeStyle="rgba(40,20,70,.45)";ctx.lineWidth=R0*0.46;ctx.stroke();
    path();ctx.strokeStyle=col;ctx.lineWidth=R0*0.32;ctx.stroke();
    path();ctx.strokeStyle="#fff";ctx.lineWidth=R0*0.13;ctx.stroke();
    for(var i=0;i<chain.length;i++){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(chain[i].x,chain[i].y,R0*0.2,0,6.283);ctx.fill();
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(chain[i].x,chain[i].y,R0*0.11,0,6.283);ctx.fill();}
    var lp=chain[chain.length-1];
    ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=4;ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(lp.x,lp.y);ctx.lineTo(ptr.x,ptr.y);ctx.stroke();ctx.setLineDash([]);
  }
  function drawChainCount(){
    if(!chain.length)return;var lp=chain[chain.length-1],n=chain.length;
    var x=Math.max(GX+30,Math.min(GX+GW-30,lp.x)),y=Math.max(CLIPY+20,lp.y-lp.r*1.9);
    var c=n>=15?"#ff7bc8":n>=10?"#ffd54f":n>=7?"#7fe0ff":n>=3?"#ffffff":"rgba(255,255,255,.7)";
    ctx.font="900 "+(n>=7?28:24)+"px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=6;ctx.strokeStyle="rgba(30,15,50,.85)";ctx.strokeText(n+"",x,y);ctx.fillStyle=c;ctx.fillText(n+"",x,y);
  }
  function drawFX(){
    var i,p;
    for(i=0;i<rings.length;i++){var r=rings[i];if(r.age<0)continue;var t=r.age/r.life,e=1-Math.pow(1-t,3);
      ctx.strokeStyle="rgba("+r.col+","+(1-t)+")";ctx.lineWidth=r.w*(1-t)+1;ctx.beginPath();ctx.arc(r.x,r.y,r.r+(r.R-r.r)*e,0,6.283);ctx.stroke();}
    for(i=0;i<parts.length;i++){p=parts[i];var a=1-p.age/p.life;ctx.globalAlpha=a;ctx.fillStyle=p.col;
      if(p.st){var s=p.sz*1.4;ctx.beginPath();ctx.moveTo(p.x,p.y-s);ctx.lineTo(p.x+s*0.3,p.y-s*0.3);ctx.lineTo(p.x+s,p.y);ctx.lineTo(p.x+s*0.3,p.y+s*0.3);ctx.lineTo(p.x,p.y+s);ctx.lineTo(p.x-s*0.3,p.y+s*0.3);ctx.lineTo(p.x-s,p.y);ctx.lineTo(p.x-s*0.3,p.y-s*0.3);ctx.closePath();ctx.fill();}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(0.4+a*0.6),0,6.283);ctx.fill();}}
    ctx.globalAlpha=1;
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
    for(i=0;i<pops.length;i++){p=pops[i];var t2=p.age/p.life,sc=t2<0.15?0.6+t2/0.15*0.5:1.1-Math.min(0.1,(t2-0.15));
      ctx.globalAlpha=t2>0.7?(1-t2)/0.3:1;ctx.font="900 "+Math.round(p.size*sc)+"px "+FONT;
      var hw=ctx.measureText(p.text).width/2+8,px=Math.max(GX+hw,Math.min(GX+GW-hw,p.x)),py=Math.max(CLIPY+16,p.y-t2*40);
      ctx.lineWidth=5;ctx.strokeStyle="rgba(40,20,60,.9)";ctx.strokeText(p.text,px,py);ctx.fillStyle=p.col;ctx.fillText(p.text,px,py);}
    ctx.globalAlpha=1;
  }
  function drawTexts(){
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
    for(var i=0;i<texts.length;i++){var t=texts[i],u=t.age/t.life;
      var sc=u<0.12?0.3+u/0.12*0.9:u<0.22?1.2-(u-0.12)/0.1*0.2:1;
      var al=u>0.8?(1-u)/0.2:1,fs=Math.min(t.size,GW/(t.text.length*0.95+0.6));
      ctx.save();ctx.translate(W/2,t.y-(u>0.8?(u-0.8)*60:0));ctx.scale(sc,sc);ctx.rotate(Math.sin(u*20)*0.02);ctx.globalAlpha=al;
      ctx.font="900 "+Math.round(fs)+"px "+FONT;
      ctx.lineWidth=fs*0.22;ctx.strokeStyle="#2a1240";ctx.strokeText(t.text,0,4);ctx.strokeText(t.text,0,0);
      ctx.lineWidth=fs*0.08;ctx.strokeStyle="#fff";ctx.strokeText(t.text,0,0);
      ctx.fillStyle=t.col;ctx.fillText(t.text,0,0);ctx.restore();}
    ctx.globalAlpha=1;
  }
  function drawHUD(){
    // スコア
    var x=GX+12,y=HUDY;
    ctx.fillStyle="rgba(255,255,255,.11)";rr(x,y,GW*0.56,46,23);ctx.fill();
    ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillStyle="#e7dcff";ctx.font="800 12px "+FONT;ctx.fillText("スコア",x+16,y+23);
    ctx.fillStyle="#ffd166";ctx.font="900 26px "+FONT;ctx.fillText(Math.round(dscore).toLocaleString(),x+60,y+24);
    // 時間（円グラフ）
    var cx=GX+GW-38,cy=HUDY+23,r=23,low=timeLeft<=10&&phase==="play";
    var pul=low?1+Math.sin(T*12)*0.06:1+timeFlash*0.15;
    ctx.save();ctx.translate(cx,cy);ctx.scale(pul,pul);
    ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();
    ctx.strokeStyle=low?"#ff5d6c":timeFlash>0?"#7fd8ff":"#7be37b";ctx.lineWidth=5;ctx.lineCap="round";
    ctx.beginPath();ctx.arc(0,0,r-3,-Math.PI/2,-Math.PI/2+6.283*Math.max(0,Math.min(1,timeLeft/TIME_MAX)));ctx.stroke();
    ctx.fillStyle=low?"#ff9aa4":"#fff";ctx.font="900 20px "+FONT;ctx.textAlign="center";ctx.fillText(Math.ceil(timeLeft),0,1);
    ctx.restore();
    ctx.fillStyle="rgba(255,255,255,.65)";ctx.font="800 11px "+FONT;ctx.textAlign="right";ctx.fillText("のこり",cx-r-6,cy+1);
    // フィーバーゲージ
    var gx=GX+12,gw=GW-24,gy=GAUGEY,gh=16,f=fever/FEVER_MAX;
    ctx.fillStyle="rgba(0,0,0,.35)";rr(gx,gy,gw,gh,8);ctx.fill();
    if(f>0){var gg=ctx.createLinearGradient(gx,0,gx+gw,0);
      if(feverT>0){for(var i=0;i<6;i++)gg.addColorStop(i/5,"hsl("+((T*240+i*60)%360)+",95%,62%)");}
      else{gg.addColorStop(0,"#ff8a3d");gg.addColorStop(1,"#ff4f8b");}
      ctx.fillStyle=gg;rr(gx,gy,Math.max(gh,gw*f),gh,8);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.3)";rr(gx+4,gy+2,Math.max(0,gw*f-8),4,2);ctx.fill();}
    ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=1.5;rr(gx,gy,gw,gh,8);ctx.stroke();
    ctx.font="900 11px "+FONT;ctx.textAlign="center";ctx.fillStyle="#fff";ctx.lineWidth=3;ctx.strokeStyle="rgba(40,20,60,.8)";
    var lab=feverT>0?"🔥 フィーバー中！ 得点2倍 🔥":f>=0.85?"もうすぐフィーバー！":"フィーバーゲージ";
    ctx.strokeText(lab,gx+gw/2,gy+gh/2+1);ctx.fillText(lab,gx+gw/2,gy+gh/2+1);
  }
  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawBG();
    var sx=0,sy=0;if(shake>0){var m=Math.min(1,shake)*12;sx=(Math.random()-.5)*m;sy=(Math.random()-.5)*m;}
    ctx.save();ctx.translate(sx,sy);
    drawJar(false);
    ctx.save();ctx.beginPath();ctx.rect(0,CLIPY,W,H);ctx.clip();
    var i,p;
    for(i=0;i<pieces.length;i++){p=pieces[i];if(!p.sel)drawPiece(p,T);}
    if(hint&&!chain.length){var a=0.35+0.35*Math.sin(T*6);ctx.strokeStyle="rgba(255,255,255,"+a+")";ctx.lineWidth=4;
      for(i=0;i<hint.length;i++){ctx.beginPath();ctx.arc(hint[i].x,hint[i].y,hint[i].r*1.15,0,6.283);ctx.stroke();}}
    for(i=0;i<pieces.length;i++){p=pieces[i];if(p.sel)drawPiece(p,T);}
    drawChain();
    ctx.restore();
    drawJar(true);
    drawFX();
    drawChainCount();
    ctx.restore();
    drawHUD();
    drawTexts();
    if(phase==="ready"){ctx.fillStyle="rgba(255,255,255,.85)";ctx.font="900 34px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.lineWidth=7;ctx.strokeStyle="#2a1240";ctx.strokeText("よーい…",W/2,H*0.42);ctx.fillText("よーい…",W/2,H*0.42);}
    if(phase==="play"&&TIME_MAX-timeLeft<4&&score===0&&!chain.length){ctx.fillStyle="rgba(255,255,255,"+(0.6+0.3*Math.sin(T*5))+")";ctx.font="800 15px "+FONT;ctx.textAlign="center";
      ctx.lineWidth=4;ctx.strokeStyle="rgba(30,15,50,.8)";ctx.strokeText("👆 同じ色を3つ以上なぞろう！",W/2,BT+30);ctx.fillText("👆 同じ色を3つ以上なぞろう！",W/2,BT+30);}
    if(flash>0){ctx.fillStyle="rgba(255,250,235,"+Math.min(0.85,flash*0.7)+")";ctx.fillRect(0,0,W,H);}
    if(phase==="play"&&timeLeft<=5){var va=(5-timeLeft)/5*(0.18+0.1*Math.sin(T*14));
      var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.7);vg.addColorStop(0,"rgba(255,0,60,0)");vg.addColorStop(1,"rgba(255,0,60,"+va+")");ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);}
  }

  /* ===================== ループ・開始・終了 ===================== */
  function loop(t){
    var dt=Math.min(0.05,(t-last)/1000)||0;last=t;
    if(!paused){update(dt);draw();}
    requestAnimationFrame(loop);
  }
  function start(){
    audio();layout();reset(true);
    ov.hidden=true;running=true;paused=false;phase="ready";phaseT=0;acc=0;
    last=performance.now();
    if(window.Arcade)Arcade.ready();
  }
  function gameOver(){
    running=false;phase="over";SFX.over();
    var s=score,nb=s>best;if(nb){best=s;try{localStorage.setItem("vappa_tsunagi_best",String(best));}catch(e){}}
    var emo=s>=40000?"👑":s>=20000?"🎉":s>=8000?"🍡":"🐣";
    var msg=s>=40000?"つなぎの神！ もちもち達も大よろこび！":s>=20000?"すごい腕前！ 長いチェーンが光ってた！":s>=8000?"いい感じ！ ボムとフィーバーを狙ってみよう":"長くつなぐほど点数がぐんと上がるよ！";
    ov.innerHTML='<div class="emo">'+emo+'</div><h1>タイムアップ！</h1><div class="big">'+s.toLocaleString()+' 点</div>'+
      '<div class="sub">最長チェーン <b>'+longest+'</b>　おじゃま撃退 <b>'+ojamaCleared+'</b><br>'+(nb&&s>0?'🏆 自己ベスト更新！':'ベスト '+best.toLocaleString()+' 点')+'</div>'+
      '<p>'+msg+'</p><button id="rb">もう一回</button>';
    ov.hidden=false;
    $("rb").addEventListener("click",function(e){e.stopPropagation();start();});
    if(window.Arcade)Arcade.gameOver(s);
  }

  // 入力（タッチ・マウス共通）
  cv.addEventListener("pointerdown",function(e){if(paused)return;if(ptr.down&&e.pointerId!==ptr.id)return;ptr.down=true;ptr.id=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}onDown(e.clientX,e.clientY);e.preventDefault();});
  cv.addEventListener("pointermove",function(e){if(!ptr.down||e.pointerId!==ptr.id||paused)return;onMove(e.clientX,e.clientY);e.preventDefault();});
  function up(e){if(e.pointerId!==ptr.id)return;ptr.down=false;ptr.id=-1;if(!paused)onUp();}
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  window.addEventListener("resize",function(){layout();});
  $("startBtn").addEventListener("click",function(e){e.stopPropagation();start();});
  if(window.Arcade){
    Arcade.onPause(function(){paused=true;if(chain.length){for(var i=0;i<chain.length;i++)chain[i].sel=false;chain=[];}ptr.down=false;});
    Arcade.onResume(function(){paused=false;last=performance.now();audio();});
    Arcade.onRestart(start);
  }

  // タイトル背景：箱いっぱいのもちもち
  layout();reset(false);
  for(var s0=0;s0<200;s0++)physStep(1/120);
  for(var k0=0;k0<pieces.length;k0++){pieces[k0].vx=0;pieces[k0].vy=0;}
  last=performance.now();requestAnimationFrame(loop);
})();
</script>
<script>
/* iOSダブルタップズーム対策：ボタン類以外のtouchendをpreventDefault */
document.addEventListener("touchend",function(e){
  var t=e.target;
  if(e.cancelable && !(t&&t.closest&&t.closest("button,a,input,select,label"))) e.preventDefault();
},{passive:false});
</script>
