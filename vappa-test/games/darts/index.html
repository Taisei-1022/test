<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
<title>ネコダーツ</title>
<link rel="icon" href="data:," />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;background:#22161f;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;color:#fff;touch-action:none;overscroll-behavior:none;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #hud{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:6px;z-index:3;pointer-events:none;}
  .pill{background:rgba(18,10,20,.68);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:6px 12px;min-width:84px;text-align:center;white-space:nowrap;border:1.5px solid rgba(255,255,255,.12);}
  .pill b{color:#ffd166;font-size:18px;}
  #rd{min-width:0;font-size:13px;color:#ffe9c4;}
  #cbp{transition:transform .12s;}
  #cbp.hot{background:linear-gradient(90deg,#ff4d6d,#ffb02e);border-color:rgba(255,255,255,.4);}
  #cbp.pop{transform:scale(1.18);}
  #msg{position:fixed;left:50%;top:70%;transform:translateX(-50%) scale(.9);z-index:3;pointer-events:none;
    background:#fffaf0;color:#3a2414;font-weight:900;font-size:15px;line-height:1.35;border-radius:16px;padding:8px 14px;max-width:calc(100% - 24px);
    text-align:center;border:3px solid #3a2414;box-shadow:0 5px 0 rgba(0,0,0,.25);opacity:0;transition:opacity .18s,transform .18s;}
  #msg.on{opacity:1;transform:translateX(-50%) scale(1);}
  #msg small{display:block;font-size:12px;font-weight:800;color:#8a5a2b;}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
     background:rgba(20,10,18,.84);text-align:center;padding:24px;z-index:6;}
  #ov h1{font-size:30px;font-weight:900;letter-spacing:.04em;}
  #ov .emo{font-size:56px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4));}
  #ov p{color:#ecdccb;font-size:14px;line-height:1.75;max-width:340px;}
  #ov p b{color:#ffd166;}
  #ov .rules{background:rgba(255,209,102,.1);border:1.5px solid rgba(255,209,102,.5);border-radius:14px;padding:9px 14px;color:#ffe9bf;font-size:13.5px;text-align:left;line-height:1.8;}
  #ov .big{font-size:52px;font-weight:900;color:#ffcf5c;line-height:1;}
  #ov .sub{font-size:15px;color:#f3e6ff;font-weight:800;}
  #ov .stats{font-size:13.5px;color:#e8d8c8;line-height:1.8;background:rgba(255,255,255,.07);border-radius:12px;padding:8px 16px;}
  #ov button{background:#ffb02e;color:#3a2400;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 5px 0 #c47a0b;}
  #ov button:active{transform:translateY(2px);box-shadow:0 3px 0 #c47a0b;}
  #ov[hidden]{display:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="pill">⭐ <b id="sc">0</b> 点</div>
  <div class="pill" id="rd">ラウンド 1</div>
  <div class="pill" id="cbp">🔥 <b id="cb">0</b> コンボ</div>
</div>
<div id="msg"></div>
<div id="ov">
  <div class="emo">🎯🐈</div>
  <h1>ネコダーツ</h1>
  <p><b>指でねらって、はなすと投げる！</b><br>（マウスはクリックで投げる）<br>手がプルプルするのは仕様です。</p>
  <div class="rules">
    🕰 ボードは<b>ゆれる・すべる・まわる</b>！<br>　ゆれの端で止まる瞬間をねらえ<br>
    🐾 ネコが<b>手をあげたら</b>投げるな！ペシッとされる<br>
    💨 ボードが<b>逃げたら</b>追いかけろ<br>
    🎯 10本の合計点で勝負！<b>ラスト1本は2倍</b>
  </div>
  <button id="startBtn">はじめる</button>
</div>
<script src="../../js/arcade-sdk.js?v=2"></script>
<script>
(function(){
  "use strict";
  function $(id){return document.getElementById(id);}
  var cv=$("c"),ctx=cv.getContext("2d"),ov=$("ov"),msgEl=$("msg");
  var W=0,H=0,DPR=1,SC=1,R=140,BX0=0,BY0=0,CT=0,HOMEX=0;
  var FONT='"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif';
  var bg=document.createElement("canvas"),bgx=bg.getContext("2d");
  var bd=document.createElement("canvas"),bdx=bd.getContext("2d"),BS=0;
  var bulbs=[];
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function lerp(a,b,t){return a+(b-a)*t;}
  function rnd(a,b){return a+Math.random()*(b-a);}
  function easeOut(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3);}
  function easeBack(t){t=clamp(t,0,1);var c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function rr(c,x,y,w,h,r){r=Math.min(r,h/2,w/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

  /* ===================== ダーツボード ===================== */
  var ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
  var SEG=Math.PI*2/20,RB=0.09,ROB=0.18,RT1=0.53,RT2=0.62,RD1=0.9,RD2=1.0,RN=1.17;
  function wedge(c,r0,r1,a0,a1,col){c.beginPath();c.arc(0,0,r1,a0,a1);c.arc(0,0,r0,a1,a0,true);c.closePath();c.fillStyle=col;c.fill();}
  function buildBoard(){
    BS=Math.ceil(R*RN*2+6);bd.width=Math.ceil(BS*DPR);bd.height=Math.ceil(BS*DPR);
    var c=bdx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,BS,BS);c.translate(BS/2,BS/2);
    c.fillStyle="#151313";c.beginPath();c.arc(0,0,R*RN,0,Math.PI*2);c.fill();
    c.strokeStyle="#8d8f96";c.lineWidth=Math.max(2,R*0.018);c.beginPath();c.arc(0,0,R*RN-1.5,0,Math.PI*2);c.stroke();
    for(var k=0;k<20;k++){
      var a0=-Math.PI/2+(k-0.5)*SEG,a1=a0+SEG,dark=k%2===0;
      var sc=dark?"#211d1c":"#f1e4c4",rc=dark?"#d8323b":"#1b8a4b";
      wedge(c,0,RD2*R,a0,a1,rc);wedge(c,0,RD1*R,a0,a1,sc);wedge(c,0,RT2*R,a0,a1,rc);wedge(c,0,RT1*R,a0,a1,sc);
    }
    c.fillStyle="#1b8a4b";c.beginPath();c.arc(0,0,ROB*R,0,Math.PI*2);c.fill();
    c.fillStyle="#d8323b";c.beginPath();c.arc(0,0,RB*R,0,Math.PI*2);c.fill();
    c.strokeStyle="rgba(205,208,216,.75)";c.lineWidth=1;
    [RB,ROB,RT1,RT2,RD1,RD2].forEach(function(r){c.beginPath();c.arc(0,0,r*R,0,Math.PI*2);c.stroke();});
    for(k=0;k<20;k++){var a=-Math.PI/2+(k-0.5)*SEG;c.beginPath();c.moveTo(Math.cos(a)*ROB*R,Math.sin(a)*ROB*R);c.lineTo(Math.cos(a)*RD2*R,Math.sin(a)*RD2*R);c.stroke();}
    c.fillStyle="#fff";c.font="900 "+Math.round(R*0.105)+"px "+FONT;c.textAlign="center";c.textBaseline="middle";
    for(k=0;k<20;k++){var an=-Math.PI/2+k*SEG,rn=(RD2+RN)/2*R;c.fillText(String(ORDER[k]),Math.cos(an)*rn,Math.sin(an)*rn+1);}
    var g=c.createRadialGradient(-R*0.35,-R*0.45,R*0.1,0,0,R*1.2);g.addColorStop(0,"rgba(255,255,255,.14)");g.addColorStop(1,"rgba(0,0,0,.12)");
    c.fillStyle=g;c.beginPath();c.arc(0,0,R*RN,0,Math.PI*2);c.fill();
  }
  function scoreAt(dx,dy){
    var d=Math.hypot(dx,dy)/R;
    if(d<=RB)return {p:50,label:"BULL!",kind:"bull"};
    if(d<=ROB)return {p:25,label:"アウターブル",kind:"obull"};
    if(d>RD2)return null;
    var a=Math.atan2(dy,dx)+Math.PI/2;a=((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    var n=ORDER[Math.floor((a+SEG/2)/SEG)%20];
    if(d>=RT1&&d<=RT2)return {p:n*3,label:"トリプル"+n,kind:"t"};
    if(d>=RD1)return {p:n*2,label:"ダブル"+n,kind:"d"};
    return {p:n,label:"シングル"+n,kind:"s"};
  }

  /* ===================== 背景（バーの壁） ===================== */
  function buildBg(){
    bg.width=Math.ceil(W*DPR);bg.height=Math.ceil(H*DPR);var c=bgx;c.setTransform(DPR,0,0,DPR,0,0);
    var g=c.createLinearGradient(0,0,0,CT);g.addColorStop(0,"#2a1824");g.addColorStop(1,"#3d2430");c.fillStyle=g;c.fillRect(0,0,W,CT);
    // れんが
    var bh=22*SC,bw=52*SC;
    for(var y=0,row=0;y<CT;y+=bh,row++){
      for(var x=-(row%2)*bw/2;x<W;x+=bw){
        var s=((x*7+y*13)|0)%5;
        c.fillStyle="rgba("+(120+s*6)+","+(60+s*3)+","+(62+s*2)+",.22)";rr(c,x+1.5,y+1.5,bw-3,bh-3,3);c.fill();
      }
    }
    // スポットライト
    var sp=c.createRadialGradient(BX0,BY0,R*0.3,BX0,BY0,R*2.3);sp.addColorStop(0,"rgba(255,214,140,.30)");sp.addColorStop(1,"rgba(255,214,140,0)");
    c.fillStyle=sp;c.fillRect(0,0,W,CT);
    // ボードを吊るすレール
    var ry0=BY0-R*1.45;
    c.fillStyle="rgba(0,0,0,.3)";c.fillRect(0,ry0-1,W,9);
    for(var bi=0;bi<2;bi++){var bxx=bi?W*0.93:W*0.07;c.fillStyle="#4a3112";rr(c,bxx-5,ry0-10,10,20,3);c.fill();}
    var rg0=c.createLinearGradient(0,ry0-4,0,ry0+4);rg0.addColorStop(0,"#f3d27a");rg0.addColorStop(1,"#8a6216");
    c.fillStyle=rg0;rr(c,4,ry0-4,W-8,8,4);c.fill();
    // ネオン看板
    c.save();c.font="900 "+Math.round(20*SC)+"px "+FONT;c.textAlign="center";c.textBaseline="middle";
    var ny=CT-34*SC;c.shadowColor="#ff4fa3";c.shadowBlur=14*SC;c.fillStyle="#ffb3da";c.fillText("NEKO BAR",W*0.28,ny);
    c.shadowColor="#58e1ff";c.fillStyle="#bff4ff";c.font="900 "+Math.round(22*SC)+"px "+FONT;c.fillText("=^･ω･^=",W*0.72,ny);c.restore();
    // 電球のコード
    c.strokeStyle="rgba(20,10,10,.8)";c.lineWidth=1.5;c.beginPath();
    for(var i=0;i<bulbs.length;i++){var b=bulbs[i];if(i)c.lineTo(b.x,b.y-4);else c.moveTo(b.x,b.y-4);}c.stroke();
    // カウンター
    var tg=c.createLinearGradient(0,CT-8,0,CT+16);tg.addColorStop(0,"#b07444");tg.addColorStop(1,"#7a4826");
    c.fillStyle=tg;c.fillRect(0,CT-8,W,24);
    c.fillStyle="rgba(255,240,210,.25)";c.fillRect(0,CT-8,W,2);
    var fg=c.createLinearGradient(0,CT+16,0,H);fg.addColorStop(0,"#5a321c");fg.addColorStop(1,"#2e180d");c.fillStyle=fg;c.fillRect(0,CT+16,W,H-CT-16);
    c.strokeStyle="rgba(0,0,0,.25)";c.lineWidth=2;for(x=W/12;x<W;x+=W/6){c.beginPath();c.moveTo(x,CT+16);c.lineTo(x,H);c.stroke();}
    c.fillStyle="rgba(0,0,0,.35)";c.fillRect(0,CT+16,W,6);
    // 真鍮のフットレール
    var ry=H-46*SC;var rg=c.createLinearGradient(0,ry-6,0,ry+6);rg.addColorStop(0,"#ffe08a");rg.addColorStop(1,"#a8761c");
    c.fillStyle=rg;rr(c,8,ry-6,W-16,12,6);c.fill();
    // ビールジョッキ（左）
    var mx=34*SC,mw=30*SC,mh=40*SC;
    c.fillStyle="rgba(255,255,255,.22)";rr(c,mx-mw/2-9*SC,CT-8-mh*0.78,12*SC,mh*0.5,6*SC);c.fill();
    var bgr=c.createLinearGradient(0,CT-8-mh,0,CT-8);bgr.addColorStop(0,"#ffcf4a");bgr.addColorStop(1,"#e89512");
    c.fillStyle=bgr;rr(c,mx-mw/2,CT-8-mh,mw,mh,5*SC);c.fill();
    c.fillStyle="#fffaf0";rr(c,mx-mw/2-2*SC,CT-8-mh-7*SC,mw+4*SC,12*SC,6*SC);c.fill();
    c.fillStyle="rgba(255,255,255,.35)";c.fillRect(mx-mw/2+5*SC,CT-8-mh+10*SC,4*SC,mh-16*SC);
  }

  /* ===================== サウンド（WebAudio合成） ===================== */
  var AC=null,NB=null;
  function audio(){try{if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(A){AC=new A();NB=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}}if(AC&&AC.state==="suspended")AC.resume();}catch(e){}}
  function tone(f1,f2,dur,type,vol,delay){
    if(!AC)return;try{var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}
  }
  function noise(dur,f1,f2,vol,delay,q){
    if(!AC||!NB)return;try{var t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=NB;f.type="bandpass";f.Q.value=q||1.2;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+0.02);}catch(e){}
  }
  function meow(p,delay){
    if(!AC)return;p=p||1;try{var t=AC.currentTime+(delay||0),o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
    o.type="sawtooth";o.frequency.setValueAtTime(480*p,t);o.frequency.linearRampToValueAtTime(820*p,t+0.12);o.frequency.linearRampToValueAtTime(560*p,t+0.34);
    f.type="lowpass";f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(2200,t+0.12);f.frequency.linearRampToValueAtTime(900,t+0.34);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.04);g.gain.setValueAtTime(0.12,t+0.22);g.gain.exponentialRampToValueAtTime(0.0001,t+0.38);
    o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.4);}catch(e){}
  }
  var SFX={
    throw_:function(){noise(0.16,2400,600,0.18);},
    hit:function(){tone(170,70,0.12,"sine",0.45);noise(0.05,1800,900,0.22);},
    bull:function(){tone(170,70,0.12,"sine",0.45);var n=[784,988,1175,1568];for(var i=0;i<4;i++)tone(n[i],0,0.13,"square",0.06,0.05+i*0.07);},
    clank:function(){tone(1500,900,0.08,"triangle",0.12);tone(2300,1600,0.06,"triangle",0.06,0.02);},
    pesh:function(){noise(0.09,4200,1800,0.5,0,0.8);tone(950,260,0.12,"square",0.1);},
    mofu:function(){tone(300,170,0.2,"sine",0.3);noise(0.14,700,300,0.15);},
    hop:function(){tone(420,760,0.08,"triangle",0.07);},
    tick:function(){tone(1900,0,0.04,"square",0.035);},
    alert:function(){tone(1400,2000,0.06,"square",0.05);},
    run:function(){noise(0.2,900,2600,0.12);},
    land:function(){tone(500,300,0.05,"triangle",0.06);},
    combo:function(k){var b=[523,659,784,1047,1319];for(var i=0;i<Math.min(5,2+k);i++)tone(b[i],0,0.11,"square",0.06,i*0.06);},
    lucky:function(){var n=[1047,1319,1568,2093];for(var i=0;i<4;i++)tone(n[i],0,0.14,"triangle",0.12,i*0.08);},
    over:function(){tone(523,0,0.16,"triangle",0.16);tone(659,0,0.16,"triangle",0.16,0.16);tone(784,0,0.3,"triangle",0.16,0.32);},
    bonk:function(){tone(150,80,0.14,"sine",0.35);noise(0.06,600,300,0.15);},
    whirl:function(){noise(0.35,800,3000,0.08,0,3);},
    boing:function(){tone(180,620,0.22,"sine",0.14);tone(620,300,0.2,"sine",0.08,0.2);},
    creak:function(){tone(300,180,0.4,"sawtooth",0.03);},
    homer:function(){tone(900,1800,0.12,"square",0.08);noise(0.08,3000,1500,0.3);}
  };

  /* ===================== 状態 ===================== */
  var NDARTS=10;
  var running=false,paused=false,last=0,T=0;
  var phase="title",phT=0,dartIdx=0,plan=[],ev=null,CH=0.2;
  var total=0,combo=0,maxCombo=0,bestHit=null,pecks=0,luckies=0,mofus=0,escapes=0,shownTips={};
  var LP=200,RAILY=100,RRN=160;
  // ボード：レールのフックから吊るされた振り子＋横すべり＋回転＋ずり落ち
  var board={hx:0,hy:0,x:0,y:0,ang:0,sw:0,swv:0,spr:0,spv:0,ox:0,oy:0,oxv:0,oyv:0,otx:0,oty:0,ky:14,kT:1,dropT:0,tilt:0,hooked:true,calm:false,legs:0,bob:0,step:0,vx:0,vy:0,bonkT:0};
  var cat={x:0,y:0,r:24,pose:"sit",dir:-1,hop:null,behind:false,peek:0,ex:null,mo:null,exT:0,em:"",emT:0,blinkT:2,blink:0,tail:0,arm:null,carry:false,carryT:0,earT:0,lookX:0,lookY:0,blush:0,
           on:null,ax:0,act:"",actT:0,tx:0,spd:0,step:0,guard:null,gT:0,gD:0.4,gCycles:0,hk:0,tread:0,moving:false};
  var stuck=[],floorDarts=[],loose=[],flying=null,pops=[],parts=[];
  var aimX=0,aimY=0,retX=0,retY=0,aimKX=0,aimKY=0,fingerX=0,fingerY=0,touching=false,ptype="mouse",shot=0,SHOT=9;
  var shake=0,flash=0,festT=0;
  var best=0;try{best=+localStorage.getItem("vappa_darts_best")||0;}catch(e){}
  var hud={sc:$("sc"),rd:$("rd"),cb:$("cb"),cbp:$("cbp")},hudCache={};

  function wm(){return running&&ev&&(ev.type==="walk"||ev.type==="drag");}
  function resize(){
    W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.ceil(W*DPR);cv.height=Math.ceil(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
    SC=clamp(Math.min(W/390,H/780),0.75,1.35);
    R=Math.min(W*0.39,H*0.205,190);
    BX0=W/2;BY0=Math.max(84+R*1.25,H*0.4);
    CT=Math.round(Math.min(H-150*SC,BY0+R*1.3+95*SC));
    LP=R*1.45;RRN=R*RN;RAILY=BY0-LP;
    msgEl.style.top=Math.round(Math.min(CT+92*SC,H-86))+"px";
    HOMEX=W-48*SC;

  function updateBoard(dt){

    b.swv+=(-15*Math.sin(b.sw)-damp*b.swv)*dt;b.sw+=b.swv*dt;
    if(b.sw>0.5){b.sw=0.5;b.swv=-Math.abs(b.swv)*0.5;}if(b.sw<-0.5){b.sw=-0.5;b.swv=Math.abs(b.swv)*0.5;}

    });
  }

  function nextDart(){
    dartIdx++;

  /* ===================== ネコの行動 ===================== */
  function landKick(){board.swv+=rnd(-0.35,0.35)*(0.6+CH);board.oyv+=140*SC;}
  function batTop(){
    var s=sgn();cat.dir=s;
    cat.arm={tx:board.x+s*R*0.5,ty:board.y-R*0.6,t:0};
    board.spv+=s*rnd(3.5,4+6*CH);board.swv+=s*0.3;
    pop(cat.arm.tx,cat.arm.ty-16*SC,"ｸﾙｸﾙ〜","#bff4ff",22*SC,0.8);SFX.whirl();
    if(!cat.guard){cat.act="bat";cat.actT=0.7;}
  }
  function batSide(){
    var side=cat.x<board.x?-1:1,r=26*SC,oy=rnd(-0.35,0.25)*R;cat.act="hop";
    catHop(0,0,0.42,70*SC,"jump",r,function(){
      var bx=board.x,by=board.y;cat.arm={tx:bx+side*R*0.75,ty:by+oy,t:0};cat.dir=-side;
      board.oxv+=-side*(260+380*CH)*SC;board.otx=clamp(board.ox-side*R*rnd(0.2,0.5),-(W/2-R*0.4),W/2-R*0.4);
      board.spv+=sgn()*rnd(3,4+5*CH);board.swv+=-side*0.4;
      pop(bx+side*R*0.8,by+oy-20*SC,"ﾊﾞｼｯ!","#ffef5a",30*SC,0.8);SFX.pesh();shake=Math.max(shake,4);catSay("ｵﾗｯ",0.6);
      catHop(cat.x,CT-8,0.5,0,"sit",r,function(){cat.act="";});cat.act="hop";
    },function(){return [clamp(board.x+side*(RRN+0.6*r),22*SC,W-22*SC),board.y+oy+1.4*r];});
  }
  function pounce(){
    var tx=retX,ty=retY,r=26*SC;cat.act="hop";
    catHop(tx,ty+1.1*r,0.36,50*SC,"jump",r,function(){
      var s=cat.dir;cat.arm={tx:tx,ty:ty,t:0};
      aimKX+=s*rnd(55,95)*SC;aimKY+=rnd(-45,45)*SC;
      pop(tx,ty-24*SC,"ﾍﾟｼｯ","#ffef5a",30*SC,0.8);burst(tx,ty,8,["#fff","#ffef5a"],200*SC,"star");SFX.pesh();
      catSay("ﾆｬｯ",0.5);
      catHop(clamp(cat.x+s*30*SC,30*SC,W-30*SC),CT-8,0.5,10*SC,"sit",r,function(){cat.act="";});cat.act="hop";
    });
  }
  function doAct(a){
    var c=CH,r=26*SC,s=sgn();
    cat.act=a;
    if(a==="pace"){var tx=rnd(30*SC,W-30*SC);if(Math.abs(tx-cat.x)<70*SC)tx=cat.x<W/2?rnd(W*0.6,W-30*SC):rnd(30*SC,W*0.4);
      cat.tx=tx;cat.spd=(70+130*c)*SC*(Math.random()<0.35*c+0.1?2.2:1);if(cat.spd>230*SC)catSay("ﾀﾞﾀﾞﾀﾞｯ",0.6);}
    else if(a==="chase"){if(phase!=="aim"){doAct("pace");return;}cat.actT=rnd(0.8,1.4);cat.spd=(150+120*c)*SC;catFace("slit","w",cat.actT);catSay("ｼﾞｰｯ",0.7);}
    else if(a==="sit"){cat.actT=rnd(0.3,0.8);if(Math.random()<0.3)catSay(["ﾆｬ","…","ﾌｧ"][Math.floor(Math.random()*3)],0.6);}
    else if(a==="climb"){var ax=rnd(-0.35,0.35)*R;cat.act="hop";
      catHop(0,0,0.5,90*SC,"sit",r,function(){cat.on="top";cat.ax=ax;cat.act="top";cat.actT=rnd(0.2,0.5);landKick();},function(){return topPos(ax);});}
    else if(a==="walkTop"){cat.tx=rnd(-0.5,0.5)*R;cat.spd=(50+80*c)*SC;}
    else if(a==="batTop"){batTop();}
    else if(a==="guard"){cat.guard="calm";cat.gT=rnd(0.3,0.7);cat.gCycles=ev.type==="punch"?99:1;cat.tx=cat.ax;}
    else if(a==="down"){cat.act="hop";catHop(clamp(cat.x+rnd(-140,140)*SC,30*SC,W-30*SC),CT-8,0.5,50*SC,"sit",r,function(){cat.act="";});}
    else if(a==="hang"){var hx=rnd(-0.3,0.3)*R,hh=cat.on==="top"?30*SC:80*SC;cat.act="hop";
      catHop(0,0,0.5,hh,"hang",r,function(){cat.on="hang";cat.ax=hx;cat.act="hang";cat.actT=rnd(1.3,2.3);cat.hk=0.2;catSay("ﾌﾞﾗｰﾝ",0.8);board.oyv+=160*SC;board.swv+=s*0.3;},function(){return hangPos(hx);});}
    else if(a==="climbUp"){var ax2=cat.ax;cat.act="hop";
      catHop(0,0,0.55,60*SC,"sit",r,function(){cat.on="top";cat.ax=ax2;cat.act="top";cat.actT=rnd(0.2,0.5);landKick();},function(){return topPos(ax2);});}
    else if(a==="drop"){cat.act="hop";catHop(cat.x,CT-8,0.45,15*SC,"sit",r,function(){cat.act="";});}
    else if(a==="dash"){var tx2=cat.x>W/2?rnd(28*SC,W*0.3):rnd(W*0.7,W-28*SC);cat.act="hop";catSay("ﾆｬｯﾎｰｲ",0.7);SFX.run();
      catHop(tx2,CT-8,0.8,(CT-8-board.y)+R*rnd(-0.15,0.35),"sit",r,function(){cat.act="";});}
    else if(a==="bat"){batSide();}
  }
  function nextAct(){
    var c=CH,t=ev.type;cat.act="";
    if(cat.on==="top"){
      var o=[["walkTop",2],["batTop",0.4+2*c],["down",1.4],["hang",c>=0.3?1:0.2]];
      if(t==="punch")o=[["walkTop",1.2],["batTop",0.8+c],["guard",3]];
      else if(c>=0.45)o.push(["guard",1.6*c]);
      doAct(wpick(o));
    }else if(cat.on==="hang"){
      doAct(t==="punch"||Math.random()<0.35?"climbUp":"drop");
    }else{
      if(t==="punch"){doAct("climb");return;}
      doAct(wpick([["pace",3-c],["climb",1.5+2*c],["sit",Math.max(0,0.9-c)],["dash",c>=0.3?1.4:0.4],["hang",c>=0.3?1.2:0.3],["bat",c>=0.3?2.2*c:0],["chase",c>=0.34&&phase==="aim"?1.8*c:0]]));
    }
  }
  function guardStep(dt){
    cat.gT-=dt;
    if(cat.guard==="calm"&&ev.type==="punch"){ // 安全なときはボードの上をウロウロ
      var d=cat.tx-cat.ax,st=(40+60*CH)*SC*dt;
      if(Math.abs(d)<=st){cat.ax=cat.tx;if(Math.random()<dt*2.5)cat.tx=rnd(-0.45,0.45)*R;}
      else{cat.ax+=Math.sign(d)*st;cat.dir=d>0?1:-1;cat.moving=true;cat.step+=dt*(40+60*CH)/9;}
    }
    if(cat.gT<=0){
      if(cat.guard==="calm"){cat.guard="alert";cat.gT=cat.gD=alertDur();cat.earT=0.4;catSay("!",0.5);SFX.alert();cat.moving=false;}
      else if(cat.guard==="alert"){cat.guard="ready";cat.gT=readyDur();catSay("ｼｭｯｼｭｯ",cat.gT);}
      else{if(--cat.gCycles<=0){cat.guard=null;cat.act="";}else{cat.guard="calm";cat.gT=calmDur();cat.tx=cat.ax;if(CH>=0.4&&Math.random()<0.45)batTop();}}
    }
  }
  function catAI(dt){
    cat.moving=false;
    if(!running||!ev||!ev.ready||ev.catGone||phase==="end"||phase==="lucky")return;
    var t=ev.type;if(t==="lie"||t==="walk"||t==="drag")return;
    if(cat.hop)return;
    if(cat.act==="hop"||cat.act==="event")cat.act="";
    var c=CH;
    if(cat.on==="top"&&Math.abs(board.spv)>2.4&&cat.guard!=="alert"&&cat.guard!=="ready"){
      if(!cat.tread){cat.tread=1;catSay("ﾀﾀﾀﾀｯ",0.8);catFace("wide","open",0.8);}
      cat.dir=board.spv>0?-1:1;cat.step+=dt*Math.abs(board.spv)*2.5;
    }else cat.tread=0;
    if(cat.guard){guardStep(dt);}
    else if(cat.act==="pace"||cat.act==="chase"){
      if(cat.act==="chase"){cat.tx=clamp(retX,30*SC,W-30*SC);cat.actT-=dt;}
      var dx=cat.tx-cat.x,st=cat.spd*dt;
      if(Math.abs(dx)<=st){cat.x=cat.tx;if(cat.act==="pace")cat.act="";}
      else{cat.x+=Math.sign(dx)*st;cat.dir=dx>0?1:-1;cat.moving=true;cat.step+=dt*cat.spd/(9*SC);}
      cat.y=CT-8;
      if(cat.act==="chase"&&cat.actT<=0){
        if(phase==="aim"){cat.act="stalk";cat.actT=rnd(0.55,0.8)*(1.1-0.3*c);catSay("ﾌﾘﾌﾘ…",cat.actT);catFace("slit","w",cat.actT+0.3);}
        else cat.act="";
      }
    }else if(cat.act==="walkTop"){
      var d2=cat.tx-cat.ax,s2=cat.spd*dt;
      if(Math.abs(d2)<=s2){cat.ax=cat.tx;cat.act="";}else{cat.ax+=Math.sign(d2)*s2;cat.dir=d2>0?1:-1;cat.moving=true;cat.step+=dt*cat.spd/(9*SC);}
    }else if(cat.act==="stalk"){cat.actT-=dt;cat.dir=retX>cat.x?1:-1;if(cat.actT<=0)pounce();}
    else{
      cat.actT-=dt;
      if(cat.act==="hang"&&cat.on==="hang"){cat.hk-=dt;if(cat.hk<=0){cat.hk=0.5;board.swv+=(board.swv>=0?1:-1)*(0.25+0.35*c);}}
      if(cat.actT<=0)cat.act="";
    }
    if(!cat.hop){
      if(cat.on==="hang")cat.pose="hang";
      else if(cat.act==="stalk")cat.pose="crouch";
      else if(cat.tread||cat.moving)cat.pose="run";
      else cat.pose="sit";
    }
    if(cat.act===""&&!cat.hop&&!cat.guard)nextAct();
  }

  /* ===================== 更新 ===================== */
  function updateCat(dt){
    if(cat.hop){var hp=cat.hop;hp.t+=dt/hp.dur;var k=Math.min(1,hp.t);
      if(hp.follow){var p=hp.follow();hp.tx=p[0];hp.ty=p[1];}
      cat.x=lerp(hp.fx,hp.tx,k);cat.y=lerp(hp.fy,hp.ty,k)-Math.sin(Math.PI*k)*hp.h;cat.r=lerp(hp.fr,hp.tr,k);
      if(k>=1){cat.hop=null;cat.pose=hp.pose;SFX.land();if(hp.cb)hp.cb();}}
    if(!cat.hop){
      var q;
      if(cat.on==="top"){q=topPos(cat.ax);cat.x=q[0];cat.y=q[1];}
      else if(cat.on==="hang"){q=hangPos(cat.ax);cat.x=q[0];cat.y=q[1];}
      else if(cat.on==="carry"){cat.x=board.x;cat.y=CT-8;}
      else if(cat.on==="lie"&&ev&&ev.type==="lie"){cat.dir=ev.lh;cat.x=board.x+ev.lx+0.25*cat.r*cat.dir;cat.y=board.y+board.bob+0.62*cat.r;}
    }
    cat.tail+=dt*(cat.pose==="lie"?2.2:cat.pose==="run"?7:3);
    if(cat.exT>0){cat.exT-=dt;if(cat.exT<=0){cat.ex=null;cat.mo=null;}}
    if(cat.emT>0)cat.emT-=dt;
    if(cat.blush>0)cat.blush-=dt;
    if(cat.carryT>0){cat.carryT-=dt;if(cat.carryT<=0){cat.carry=false;catSay("ﾍﾟｯ",0.5);}}
    cat.blinkT-=dt;if(cat.blinkT<=0){cat.blink=0.13;cat.blinkT=rnd(1.8,4);} if(cat.blink>0)cat.blink-=dt;
    if(cat.earT>0)cat.earT-=dt;
    if(cat.arm){cat.arm.t+=dt;if(cat.arm.t>0.36)cat.arm=null;}
    // 視線：照準を見る
    var hx=cat.x,hy=cat.y-2*cat.r,dx=retX-hx,dy=retY-hy,dl=Math.hypot(dx,dy)||1;
    cat.lookX=lerp(cat.lookX,dx/dl,Math.min(1,dt*8));cat.lookY=lerp(cat.lookY,dy/dl,Math.min(1,dt*8));
  }
  function runBoard(dt){
    var drag=ev.type==="drag";
    if(ev.dodge>0){ev.dodge-=dt;board.hx+=board.vx*dt;board.hy+=board.vy*dt;board.vy+=1400*SC*dt;board.vx*=0.94;}
    else if(ev.pauseT>0){ev.pauseT-=dt;board.step+=dt*2;}
    else{
      var dx=ev.tx-board.hx,dy=ev.ty-board.hy,d=Math.hypot(dx,dy),sp=ev.spd*(ev.dash>0?2.6:1);
      if(ev.dash>0){ev.dash-=dt;if(Math.random()<dt*30)parts.push({x:board.x,y:drag?CT-6:board.y+R*1.3,vx:rnd(-40,40),vy:-rnd(10,40),t:0,life:0.5,c:"rgba(220,200,180,.7)",s:rnd(5,9)*SC,kind:"dust"});}
      if(d<sp*dt+2){
        if(Math.random()<0.3){ev.pauseT=rnd(0.3,0.6);catSay("ﾁﾗｯ",0.5);}
        pickWalkTarget();
      }else{board.hx+=dx/d*sp*dt;board.hy+=dy/d*sp*dt;cat.dir=dx>0?1:-1;}
      board.step+=dt*(ev.dash>0?26:15);
    }
    board.hx=clamp(board.hx,R*0.5,W-R*0.5);
    if(drag)board.hy=clamp(board.hy,carryY()-40*SC,carryY()+10);else board.hy=clamp(board.hy,BY0-50*SC,BY0+40*SC);
  }
  function updateEvent(dt){
    if(!ev||!ev.ready||ev.catGone)return;
    if(ev.type==="walk"&&phase!=="reset"){
      if(ev.sink>0){ev.sink-=dt*4;cat.peek=Math.max(0,ev.sink);}
      if(ev.ws==="wait"){
        if(phase==="aim"||phase==="flight"){ev.wT-=dt;}
        if(ev.wT<=0){ev.ws="sprout";ev.wsT=0;board.hooked=false;SFX.run();meow(0.9);escapes++;banner("💨 ボードが逃げた！？<small>追いかけろ！</small>",1.6);}
      }else if(ev.ws==="sprout"){
        ev.wsT+=dt;board.legs=Math.min(1,ev.wsT/0.3);cat.peek=Math.min(1,ev.wsT/0.3);
        if(ev.wsT>0.35){ev.ws="run";pickWalkTarget();}
      }else if(ev.ws==="run")runBoard(dt);
      board.bob=board.legs*Math.abs(Math.sin(board.step))*-6*SC;
      board.tilt=Math.sin(board.step)*0.06*board.legs;
    }
    if(ev.type==="drag"&&phase!=="reset"){
      if(ev.ws==="wait"){
        cat.pose="sit";
        if(phase==="aim"||phase==="flight")ev.wT-=dt;
        if(ev.wT<=0){ev.ws="lift";ev.wsT=0;board.hooked=false;SFX.run();meow(0.9);escapes++;banner("💪 ネコがボードをかついで走りだした！<small>追いかけろ！</small>",1.6);catSay("ﾌﾝｯ!",0.6);}
      }else if(ev.ws==="lift"){
        ev.wsT+=dt;var k=Math.min(1,ev.wsT/0.35);board.hy=lerp(BY0,carryY(),easeOut(k));
        if(k>=1){ev.ws="run";pickWalkTarget();}
      }else if(ev.ws==="run"){
        runBoard(dt);
        var moving=!(ev.pauseT>0);
        cat.pose=moving?"run":"sit";if(moving)cat.step+=dt*(ev.dash>0?26:15);
        board.tilt=-cat.dir*0.14*(moving?1:0.3)+Math.sin(board.step*1.3)*0.08;
        board.bob=moving?-Math.abs(Math.sin(board.step))*10*SC:0;
      }
    }
    if(ev.type==="lie"&&!cat.hop&&cat.on==="lie"){
      ev.actT-=dt;
      if(ev.actT<=0){
        var acts=["idle","groom","yawn","sleep","roll","groom","roll"];if(CH>=0.8)acts.push("roll","yawn");
        var a=acts[Math.floor(Math.random()*acts.length)];if(a===ev.act)a="idle";ev.act=a;
        if(a==="idle"){ev.actT=rnd(0.7,1.2);ev.ltx=rnd(-0.08,0.08)*R;}
        else if(a==="groom"){ev.actT=rnd(1.2,1.8);}
        else if(a==="yawn"){ev.actT=1.1;catSay("ふわぁ〜",1.0);}
        else if(a==="sleep"){ev.actT=rnd(1.2,1.8);}
        else if(a==="roll"){ev.actT=rnd(0.9,1.4);var s=sgn();ev.ltx=s*R*rnd(0.58,0.7);ev.lh=-s;catSay("ｺﾞﾛﾝ",0.6);board.spv+=s*rnd(1.5,3);}
      }
      if(ev.act!=="roll"&&ev.act!=="idle")ev.ltx*=Math.pow(0.2,dt);
      if(ev.act==="roll"&&ev.actT<0.35)ev.ltx=0;
      ev.lx=lerp(ev.lx,ev.ltx,Math.min(1,dt*6));
    }
  }
  function pickWalkTarget(){
    ev.tx=rnd(R*0.55,W-R*0.55);ev.ty=ev.type==="drag"?carryY():BY0+rnd(-45,35)*SC;
    if(Math.random()<0.25+0.3*L()){ev.dash=0.45;catSay("ﾀﾞｯ",0.5);SFX.run();}else ev.dash=0;
  }
  function updateLoose(dt){
    for(var i=loose.length-1;i>=0;i--){var l=loose[i];
      if(l.delay>0){l.delay-=dt;continue;}
      l.vy+=1900*SC*dt;l.x+=l.vx*dt;l.y+=l.vy*dt;l.a+=l.va*dt;
      if(l.x<14){l.x=14;l.vx=Math.abs(l.vx)*0.5;}if(l.x>W-14){l.x=W-14;l.vx=-Math.abs(l.vx)*0.5;}
      if(l.y>=CT-6&&l.vy>0){
        if(l.vy>420*SC&&l.b<1){l.vy*=-0.32;l.vx*=0.55;l.b++;SFX.tick();}
        else{l.y=CT-6;l.a=(l.vx>=0?0:Math.PI)+rnd(-0.12,0.12);l.land=true;floorDarts.push(l);loose.splice(i,1);}
      }
    }
  }
  function updateFx(dt){
    for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}
      if(p.kind==="conf"){p.vy+=(p.g?60:500)*dt;p.vx*=0.99;p.rot+=dt*8;}else if(p.kind==="fur"){p.vy+=120*dt;p.vx*=0.96;}else if(p.kind==="star"){p.vx*=0.92;p.vy*=0.92;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;}
    for(i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>pops[i].life)pops.splice(i,1);}
    shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt);festT=Math.max(0,festT-dt);
  }
  function update(dt){
    T+=dt;phT+=dt;
    if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.className="";}
    // 手ぶれ（後半ほど大きい）＋ネコにはたかれた照準のズレ
    var amp=(4+14*L())*SC,tt=T;
    var wx=amp*(0.62*Math.sin(tt*2.1+1)+0.38*Math.sin(tt*5.3)+0.22*Math.sin(tt*9.7+2));
    var wy=amp*(0.6*Math.sin(tt*1.7+4)+0.4*Math.sin(tt*4.6+1)+0.22*Math.sin(tt*8.9));
    var kd=Math.exp(-2.2*dt);aimKX*=kd;aimKY*=kd;
    retX=clamp(aimX+wx+aimKX,6,W-6);retY=clamp(aimY+wy+aimKY,40,CT-10);
    updateEvent(dt);updateBoard(dt);updateCat(dt);catAI(dt);updateLoose(dt);
    if(phase==="intro"){if(ev.ready&&phT>0.5){phase="aim";phT=0;shot=SHOT;}}
    else if(phase==="aim"){shot-=dt;if(shot<=0){pop(W/2,CT-60*SC,"えいっ！","#fff",24*SC,0.8);throwDart();}}
    else if(phase==="flight"){flying.t+=dt/flying.dur;if(flying.t>=1)arrive();}
    else if(phase==="result"){
      if(ev.lucky){if(ev.missDart&&ev.missDart.land&&phT>0.7)startLucky();else if(phT>2.5){ev.lucky=false;}}
      else if(phT>1.0){phase="reset";phT=0;}
    }
    else if(phase==="lucky"){luckyStep();}
    else if(phase==="reset"){
      if(wm()){
        var dx=BX0-board.hx,dy=BY0-board.hy,d=Math.hypot(dx,dy);
        if(ev.type==="drag"&&cat.on==="carry"&&ev.ws!=="wait"){cat.on=null;cat.pose="sit";catSay("ﾁｪｯ",0.6);}
        if(ev.ws==="wait"){
          if(ev.type==="walk"){cat.peek=Math.min(1,cat.peek+dt*5);if(cat.peek>=1)ev.ws="done";}else ev.ws="done";
        }else if(d>3){var sp=420*SC;if(d<sp*dt){board.hx=BX0;board.hy=BY0;}else{board.hx+=dx/d*sp*dt;board.hy+=dy/d*sp*dt;}board.step+=dt*18;ev.dodge=0;board.tilt*=Math.exp(-6*dt);board.bob*=Math.exp(-8*dt);}
        else{board.hx=BX0;board.hy=BY0;board.legs=Math.max(0,board.legs-dt*4);board.bob=0;board.tilt=0;board.hooked=true;cat.peek=1;
          if(board.legs<=0){ev.ws="done";}}
        if(ev.ws==="done"&&cat.behind){cat.behind=false;cat.on="top";cat.ax=0;cat.pose="sit";cat.r=26*SC;cat.act="";catSay("ﾆｬｯ",0.6);}
        if(ev.ws==="done"&&phT>0.2){board.hooked=true;nextDart();}
      }else if(phT>0.15)nextDart();
    }
    else if(phase==="end"){if(phT>1.1)gameOver();}
    updateFx(dt);
    updateHud();
  }

  function paw(x,y,r,lw){ctx.beginPath();ctx.ellipse(x,y,r,r*0.85,0,0,Math.PI*2);strokeFill(CRM,lw);

  // 横向きで走る／しゃがむ（狩りのかまえ）

  // ボードのふちにぶら下がる
  function drawCatHang(x,y,r){
    var lw=Math.max(1.5,r*0.09),gy=y-2.7*r,k=Math.sin(T*7),sway=Math.sin(T*3)*0.18*r,bx=x+sway,byc=y-0.7*r;

  function drawCat(){
    if(cat.behind)return;
    var x=cat.x,y=cat.y,r=cat.r,p=cat.pose;
    // 影（床の上のときだけ）
    if(p!=="jump"&&p!=="hang"&&(!cat.on||cat.on==="lie"||cat.on==="carry")){ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(x+(p==="lie"?-0.2*r*cat.dir:0),y,(p==="lie"?1.9:p==="run"||p==="crouch"?1.4:0.9)*r,0.16*r,0,0,Math.PI*2);ctx.fill();}
    var base={eyes:"open",mouth:"w"};
    if(p==="jump"){
      if(cat.arm){drawCatSit(x,y,r,{eyes:"slit",mouth:"open"});return;}
      var hp=cat.hop,k=hp?hp.t:1;ctx.save();ctx.translate(x,y);var st=k<0.5?1.12:0.94;ctx.scale(2-st,st);ctx.rotate(cat.dir*(k-0.5)*0.4);
      ctx.translate(-x,-y);drawCatSit(x,y,r,{eyes:cat.carry?"happy":"open",mouth:cat.carry?"dart":"open"});ctx.restore();return;
    }
    if(p==="hang"){drawCatHang(x,y,r);return;}
    if(p==="run"||p==="crouch"){drawCatRun(x,y,r,p==="crouch");return;}
    if(p==="lie"){
      var a=ev&&ev.type==="lie"?ev.act:"idle";
      if(a==="groom")base={eyes:"closed",mouth:"tongue",groom:1};
      else if(a==="yawn")base={eyes:"closed",mouth:"yawn",yawn:1,earsBack:1};
      else if(a==="sleep")base={eyes:"closed",mouth:"w",sleep:1};
      else if(a==="roll")base={eyes:"happy",mouth:"w",blush:1};
      else base={eyes:"sleepy",mouth:"w"};
      drawCatLie(x,y,r,base);
      if(a==="sleep"){ctx.fillStyle="#cfe8ff";ctx.font="900 "+Math.round(r*0.55)+"px "+FONT;ctx.textAlign="center";
        for(var i=0;i<3;i++){var zt=(T*0.8+i/3)%1;ctx.globalAlpha=1-zt;ctx.fillText("Z",x+1.25*r*cat.dir+r*0.9+zt*r*0.8,y-2.1*r-zt*r*1.2);}ctx.globalAlpha=1;}
    }else{
      var g=cat.guard;
      if(g&&running&&!cat.arm){
        if(g==="calm")base={eyes:"sleepy",mouth:"w"};
        else if(g==="smug")base={eyes:"happy",mouth:"w",blush:1};
        else if(g==="alert")base={eyes:"slit",mouth:"w",pawUp:easeOut(1-cat.gT/(cat.gD||0.4))*0.6};
        else base={eyes:"slit",mouth:"open",pawUp:1};
        if(g==="ready"){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(T*16)*0.04);ctx.translate(-x,-y);drawCatSit(x,y,r,base);ctx.restore();}
        else drawCatSit(x,y,r,base);
      }else if(ev&&running&&ev.type==="drag"&&cat.on==="carry"){drawCatSit(x,y,r,{eyes:ev.ws==="wait"?"open":"happy",mouth:"w",pawUp:ev.ws==="wait"?0:0.8});}
      else drawCatSit(x,y,r,base);
    }
  }
  function drawBoardCatBack(){
    // ボードのうしろ：あし・しっぽ・のぞく頭
    var bx=board.x,by=board.y+board.bob,lg=board.legs,r=0.3*R,lw=Math.max(1.5,R*0.022);
    var tsw=Math.sin(T*(lg>0?9:4))*0.25*R,side=-(cat.dir||1);
    var tl=ev.ws==="wait"?0.55:1;
    tail(bx+side*R*0.9,by+R*0.35,bx+side*R*(1.0+0.45*tl),by+R*0.2,bx+side*R*(0.95+0.4*tl)+tsw*tl,by-R*0.35*tl,R*0.11);
    if(lg>0){
      var xs=[-0.55,-0.22,0.22,0.55];
      for(var i=0;i<4;i++){
        var sw=Math.sin(board.step+(i%2?Math.PI:0)+(i>1?0.6:0))*0.45*lg,len=R*0.55*lg;
        var x0=bx+xs[i]*R,y0=by+R*0.72,x1=x0+Math.sin(sw)*len,y1=y0+Math.cos(sw)*len;
        ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.strokeStyle=OL;ctx.lineWidth=R*0.13+lw*2;ctx.stroke();ctx.strokeStyle=OR;ctx.lineWidth=R*0.13;ctx.stroke();
        paw(x1,y1,R*0.085,lw);
      }
    }
    var pk=cat.peek;if(pk>0){var hy=by-lerp(R*0.85,R*1.25,pk);
      var o=faceOpts({eyes:ev.ws==="run"&&!ev.pauseT?"happy":"open",mouth:"w"});if(ev.pauseT>0){o.lx=0;o.ly=0.6;}
      catHead(bx,hy,r,o);}
  }
  function drawBoardCatFront(){
    if(board.legs<=0)return;var bx=board.x,by=board.y+board.bob,lw=Math.max(1.5,R*0.022);
    for(var s=-1;s<=1;s+=2)paw(bx+s*R*1.12,by-R*0.05,R*0.09*board.legs,lw);
  }

  /* ===================== 描画：ダーツ ===================== */
  var FL="#ff4d6d";
  function drawDart(x,y,ang,s,sy){
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s*(sy||1));ctx.lineCap="round";
    ctx.strokeStyle="#aab2bd";ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(8,0);ctx.stroke();
    ctx.fillStyle="#dfe5ec";rr(ctx,7,-2.8,13,5.6,2.4);ctx.fill();
    ctx.fillStyle="#7d8794";ctx.fillRect(10,-2.8,1.4,5.6);ctx.fillRect(13.5,-2.8,1.4,5.6);ctx.fillRect(17,-2.8,1.4,5.6);
    ctx.strokeStyle="#2b2b33";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(31,0);ctx.stroke();
    ctx.fillStyle=FL;ctx.beginPath();ctx.moveTo(27,0);ctx.lineTo(37,-7);ctx.lineTo(40,-7);ctx.lineTo(38,0);ctx.lineTo(40,7);ctx.lineTo(37,7);ctx.closePath();ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(31,0);ctx.lineTo(36,-3.5);ctx.lineTo(36,3.5);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  function drawDartCentered(x,y,a,s){var L2=20*s;drawDart(x-Math.cos(a)*L2,y-Math.sin(a)*L2,a,s);}

  /* ===================== 描画：メイン ===================== */
  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.drawImage(bg,0,0,W,H);
    var sx=shake?(Math.random()-0.5)*shake:0,sy=shake?(Math.random()-0.5)*shake:0;
    ctx.save();ctx.translate(sx,sy);
    // 電球
    for(var i=0;i<bulbs.length;i++){var b=bulbs[i],on=festT>0?((Math.floor(T*10)+i)%2===0):(Math.sin(T*2+i)>-0.6);
      var col=festT>0?["#ff4d6d","#ffd166","#7ae582","#6cc6ff","#c79bff"][(i+Math.floor(T*8))%5]:b.c;
      ctx.fillStyle=on?col:"rgba(120,100,100,.5)";ctx.beginPath();ctx.arc(b.x,b.y,4.2*SC,0,Math.PI*2);ctx.fill();
      if(on){ctx.globalAlpha=festT>0?0.45:0.22;ctx.beginPath();ctx.arc(b.x,b.y,11*SC,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}}
    var walk=ev&&running&&ev.type==="walk";
    var bx=board.x,by=board.y+(board.bob||0);
    // フックとひも
    var hkx=wm()?BX0:board.hx+board.ox;
    if(board.hooked){var hdx=hkx-bx,hdy=RAILY-by,hdl=Math.hypot(hdx,hdy)||1,atx=bx+hdx/hdl*RRN*0.96,aty=by+hdy/hdl*RRN*0.96;
      ctx.lineCap="round";ctx.beginPath();ctx.moveTo(hkx,RAILY);ctx.lineTo(atx,aty);ctx.strokeStyle="#1a1012";ctx.lineWidth=4*SC;ctx.stroke();ctx.strokeStyle="#c9b48a";ctx.lineWidth=1.8*SC;ctx.stroke();}
    else{var dsw=Math.sin(T*3)*6*SC;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(hkx,RAILY);ctx.quadraticCurveTo(hkx+dsw,RAILY+18*SC,hkx+dsw*2,RAILY+34*SC);ctx.strokeStyle="#c9b48a";ctx.lineWidth=1.8*SC;ctx.stroke();}
    ctx.fillStyle="#ffd36b";ctx.strokeStyle="#4a3112";ctx.lineWidth=2;ctx.beginPath();ctx.arc(hkx,RAILY,5.5*SC,0,Math.PI*2);ctx.fill();ctx.stroke();
    // ボードの影
    ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.arc(bx+5,by+9,R*RN,0,Math.PI*2);ctx.fill();
    if(walk&&(cat.behind||board.legs>0))drawBoardCatBack();
    ctx.save();ctx.translate(bx,by);ctx.rotate(board.ang);
    ctx.drawImage(bd,-BS/2,-BS/2,BS,BS);
    for(i=0;i<stuck.length;i++){var s=stuck[i];drawDart(s.rx,s.ry,s.a,1.2*SC,0.66);}
    ctx.restore();
    if(walk)drawBoardCatFront();
    for(i=0;i<floorDarts.length;i++){var f=floorDarts[i];drawDartCentered(f.x,f.y,f.a,0.9*SC);}
    drawCat();
    // エモート
    if(cat.emT>0&&cat.em){
      var ex,ey,cp=cat.pose;
      if(cat.behind){ex=board.x+R*0.42;ey=board.y-R*1.55;}
      else if(cp==="lie"){ex=cat.x+1.25*cat.r*cat.dir;ey=cat.y-2.3*cat.r;}
      else if(cp==="hang"){ex=cat.x-cat.r*1.4;ey=cat.y-3.0*cat.r;}
      else if(cp==="run"||cp==="crouch"){ex=cat.x+cat.dir*0.6*cat.r;ey=cat.y-2.7*cat.r;}
      else{ex=cat.x-cat.r*1.0;ey=cat.y-3.3*cat.r;}
      ex=clamp(ex,44*SC,W-44*SC);ey=Math.max(58*SC,ey);
      var k=easeBack(Math.min(1,(1-cat.emT)*6+0.3));
      ctx.save();ctx.translate(ex,ey);ctx.scale(k,k);ctx.font="900 "+Math.round(17*SC)+"px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";
      var tw=ctx.measureText(cat.em).width+16*SC;ctx.fillStyle="#fff";rr(ctx,-tw/2,-14*SC,tw,28*SC,14*SC);ctx.fill();
      ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#3a2414";ctx.fillText(cat.em,0,1);ctx.restore();
    }
    // 飛んでるダーツ
    if(flying){var ft=flying.t,fx=lerp(flying.sx,flying.tx,ft),fy=lerp(flying.sy,flying.ty,ft)-Math.sin(Math.PI*ft)*70*SC;
      var ang=Math.atan2(flying.sy-fy,flying.sx-fx);drawDart(fx,fy,ang,lerp(2.4,0.95,ft)*SC);}
    for(i=0;i<loose.length;i++){var l=loose[i];drawDartCentered(l.x,l.y,l.a,0.95*SC);}
    // パーティクル
    for(i=0;i<parts.length;i++){var p=parts[i],al=1-p.t/p.life;ctx.globalAlpha=Math.max(0,al);ctx.fillStyle=p.c;
      if(p.kind==="conf"){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}
      else if(p.kind==="star"){ctx.beginPath();ctx.arc(p.x,p.y,p.s*0.6*al+1,0,Math.PI*2);ctx.fill();}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.s*(p.kind==="dust"?(1+p.t*2):0.7),0,Math.PI*2);ctx.fill();}}
    ctx.globalAlpha=1;
    // ポップアップ
    ctx.textAlign="center";ctx.textBaseline="middle";
    for(i=0;i<pops.length;i++){var q=pops[i];if(q.t<0)continue;var u=q.t/q.life,sc=easeBack(Math.min(1,q.t*7)),yy=q.y-easeOut(u)*30*SC;
      ctx.globalAlpha=u>0.75?(1-u)/0.25:1;ctx.save();ctx.translate(clamp(q.x,70*SC,W-70*SC),yy);ctx.scale(sc,sc);
      ctx.font="900 "+Math.round(q.size)+"px "+FONT;ctx.lineJoin="round";ctx.lineWidth=Math.max(4,q.size*0.2);ctx.strokeStyle="#2a1420";ctx.strokeText(q.text,0,0);ctx.fillStyle=q.col;ctx.fillText(q.text,0,0);ctx.restore();}
    ctx.globalAlpha=1;
    // 残りダーツ表示（カウンター前面）
    if(running||phase==="end"){
      var n=NDARTS,gap=Math.min(30*SC,(W-60)/n),x0=W/2-gap*(n-1)/2,yy2=CT+40*SC;
      ctx.font="800 "+Math.round(12*SC)+"px "+FONT;ctx.fillStyle="rgba(255,230,200,.7)";ctx.fillText("のこりのダーツ",W/2,CT+22*SC+4);
      for(i=0;i<n;i++){var used=i<dartIdx||(i===dartIdx&&(phase!=="intro"&&phase!=="aim"));ctx.globalAlpha=used?0.22:(i===dartIdx?0.75+0.25*Math.sin(T*8):1);
        drawDart(x0+i*gap,yy2+8*SC,Math.PI/2,0.85*SC);if(i===NDARTS-1&&!used){ctx.fillStyle="#ffd166";ctx.font="900 "+Math.round(11*SC)+"px "+FONT;ctx.fillText("×2",x0+i*gap,yy2+52*SC);}}
      ctx.globalAlpha=1;
    }
    // 照準
    if(running&&(phase==="aim"||phase==="intro")){
      var rx=retX,ry=retY,rc=phase==="aim"?1:0.45;
      if(touching&&ptype!=="mouse"){ctx.strokeStyle="rgba(255,255,255,.35)";ctx.setLineDash([3,5]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(fingerX,fingerY);ctx.lineTo(rx,ry);ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle="rgba(255,255,255,.18)";ctx.beginPath();ctx.arc(fingerX,fingerY,16*SC,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=rc;
      var rr2=15*SC;ctx.lineWidth=4.5;ctx.strokeStyle="rgba(0,0,0,.55)";ctx.beginPath();ctx.arc(rx,ry,rr2,0,Math.PI*2);ctx.stroke();
      for(i=0;i<4;i++){var aa=i*Math.PI/2;ctx.beginPath();ctx.moveTo(rx+Math.cos(aa)*rr2*0.45,ry+Math.sin(aa)*rr2*0.45);ctx.lineTo(rx+Math.cos(aa)*rr2*1.45,ry+Math.sin(aa)*rr2*1.45);ctx.stroke();}
      ctx.lineWidth=2;ctx.strokeStyle="#fff";ctx.beginPath();ctx.arc(rx,ry,rr2,0,Math.PI*2);ctx.stroke();
      for(i=0;i<4;i++){aa=i*Math.PI/2;ctx.beginPath();ctx.moveTo(rx+Math.cos(aa)*rr2*0.45,ry+Math.sin(aa)*rr2*0.45);ctx.lineTo(rx+Math.cos(aa)*rr2*1.45,ry+Math.sin(aa)*rr2*1.45);ctx.stroke();}
      ctx.fillStyle="#ff4d6d";ctx.beginPath();ctx.arc(rx,ry,2.2,0,Math.PI*2);ctx.fill();
      if(phase==="aim"){var fr=clamp(shot/SHOT,0,1);ctx.lineWidth=3.5;ctx.strokeStyle=shot<3?"#ff5d6e":"#ffd166";ctx.beginPath();ctx.arc(rx,ry,rr2+6*SC,-Math.PI/2,-Math.PI/2+fr*Math.PI*2);ctx.stroke();}
      ctx.globalAlpha=1;
    }
    ctx.restore();
    if(flash>0){ctx.fillStyle="rgba(255,255,255,"+(flash*0.8)+")";ctx.fillRect(0,0,W,H);}
  }

  function loop(t){
    var dt=Math.min(0.05,(t-last)/1000)||0;last=t;
    if(!paused){if(running)update(dt);else idleUpdate(dt);draw();}
    requestAnimationFrame(loop);
  }
  function gameOver(){
    running=false;phase="over";SFX.over();msgEl.className="";board.calm=false;
    var nb=total>best;if(nb){best=total;try{localStorage.setItem("vappa_darts_best",String(best));}catch(e){}}
    var emo=total>=350?"🏆":total>=200?"🎯":total>=100?"😼":"🙀";
    var cm=total>=350?"ネコもびっくりのダーツ王！":total>=200?"なかなかの腕前！ネコに勝ったかも。":total>=100?"ネコのせい…ということにしよう。":"完全にネコの勝ち。また遊んでね。";
    ov.innerHTML='<div class="emo">'+emo+'</div><h1>ゲームセット！</h1><div class="big">'+total+' 点</div>'+
      '<div class="sub">'+(nb&&total>0?'🏆 自己ベスト！':'ベスト '+best+' 点')+'</div>'+
      '<div class="stats">🎯 ベストショット：'+(bestHit?bestHit.label+'（'+bestHit.p+'点）':'なし')+'<br>🔥 最大コンボ：'+maxCombo+'<br>🐾 ネコパンチされた：'+pecks+'回<br>😺 ネコのおかえし：'+luckies+'回</div>'+
      '<p>'+cm+'</p><button id="rb">もう一回</button>';
    ov.hidden=false;
    $("rb").addEventListener("click",function(e){e.stopPropagation();start();});
    if(window.Arcade)Arcade.gameOver(total);
  }

  /* ===================== 入力 ===================== */
  function setAim(e){
    var x=e.clientX,y=e.clientY;ptype=e.pointerType||"mouse";fingerX=x;fingerY=y;
    var off=ptype==="mouse"?0:70*SC;aimX=clamp(x,6,W-6);aimY=clamp(y-off,40,CT-10);
  }
  cv.addEventListener("pointerdown",function(e){audio();if(!running||paused)return;touching=true;setAim(e);try{cv.setPointerCapture(e.pointerId);}catch(err){}});
  cv.addEventListener("pointermove",function(e){if(!running||paused)return;if(touching||e.pointerType==="mouse")setAim(e);});
  cv.addEventListener("pointerup",function(e){if(!touching)return;touching=false;if(!running||paused)return;setAim(e);if(phase==="aim")throwDart();});
  cv.addEventListener("pointercancel",function(){touching=false;});
  $("startBtn").addEventListener("click",function(e){e.stopPropagation();start();});
  if(window.Arcade){Arcade.onPause(function(){paused=true;touching=false;});Arcade.onResume(function(){paused=false;last=performance.now();audio();});Arcade.onRestart(start);}

  resize();
  last=performance.now();requestAnimationFrame(loop);
})();
</script>
<script>
/* iOSダブルタップズーム対策 */
document.addEventListener("touchend",function(e){
  var t=e.target;
  if(e.cancelable && !(t&&t.closest&&t.closest("button,a,input,select,label"))) e.preventDefault();
},{passive:false});
</script>
