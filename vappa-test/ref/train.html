<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
<title>満員電車、降ります！</title>
<script src="../../js/arcade-sdk.js?v=2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:none;}
  html,body{height:100%;background:#0e1320;overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;}
  #c{display:block;width:100%;height:100%;}
  .hud{position:fixed;left:0;right:0;top:0;padding:10px 12px;pointer-events:none;z-index:5;}
  .hudrow{display:flex;align-items:center;gap:10px;}
  .pill{background:rgba(10,14,24,.66);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:5px 11px;backdrop-filter:blur(4px);}
  .pill b{color:#ffd166;}
  .tbar{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;}
  .tfill{height:100%;width:100%;background:linear-gradient(90deg,#3fd27e,#ffd166);transition:width .08s linear;}
  .tfill.warn{background:linear-gradient(90deg,#ff8a5c,#ff5c7a);}
  .sign{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-18px);opacity:0;
    background:#10203a;border:2px solid #2f4f7a;color:#bfe0ff;font-weight:900;font-size:15px;
    padding:8px 16px;border-radius:12px;z-index:6;white-space:nowrap;transition:opacity .3s,transform .3s;
    box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .sign.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;color:#fff;background:rgba(10,14,24,.82);z-index:10;padding:24px;}
  .ov[hidden]{display:none;}
  .ov h1{font-size:30px;letter-spacing:.04em;}
  .ov .big{font-size:54px;font-weight:900;color:#ffd166;line-height:1;}
  .ov p{font-size:14px;color:#c8d2e6;line-height:1.7;max-width:300px;}
  .ov .emoji{font-size:54px;}
  .btn{pointer-events:auto;background:#ffd166;color:#3a2a00;border:0;border-radius:14px;
    padding:14px 30px;font:inherit;font-weight:900;font-size:18px;cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.25);}
  .btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .hint{font-size:12px;color:#8fa0bd;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="hudrow">
    <div class="pill">🚉 <b id="score">0</b> 駅</div>
    <div class="tbar"><div class="tfill" id="tfill"></div></div>
  </div>
</div>
<div class="sign" id="sign">まもなく ○○駅</div>

<div class="ov" id="startOv">
  <div class="emoji">🚃</div>
  <h1>満員電車、降ります！</h1>
  <p>ドアが閉まる前に、人をかき分けて<br><b>下の出口</b>から降りよう。<br>画面をタッチした方向に進むよ。</p>
  <button class="btn" id="startBtn">乗車する</button>
  <div class="hint">降りるほど混雑＆時間が短く…！</div>
</div>

<div class="ov" id="overOv" hidden>
  <div class="emoji" id="overEmoji">😵</div>
  <h1 id="overTitle">乗り過ごした…</h1>
  <div class="big"><span id="finalScore">0</span> 駅</div>
  <p id="overMsg">人混みに負けた。もう一回！</p>
  <button class="btn" id="retryBtn">もう一度</button>
</div>

<script>
(function () {
  "use strict";
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize); resize();

  // ---- 状態 ----
  var running = false, paused = false, last = 0;
  var score = 0, station = 0, timeLeft = 0, timeMax = 0;
  var doorOpen = 0;        // 0=閉, 1=開（演出用）
  var phase = "idle";      // idle / open / play / leave / over
  var shake = 0;
  var player, crowd = [], particles = [];
  var target = null;       // 進みたい先
  var doorW, doorX, wallTop = 96, wallBot;  // ドア位置（下の壁の開口）

  var STATIONS = ["新宿","渋谷","東京","品川","池袋","上野","秋葉原","横浜","大宮","千葉","吉祥寺","中野","蒲田","赤羽"];
  var BODY_HUES = [205, 14, 145, 280, 38, 0, 190, 320];

  function rand(a, b) { return a + Math.random() * (b - a); }

  function layout() {
    wallBot = H - 70;
    doorW = Math.max(86, Math.min(150, W * 0.34));
    doorX = W / 2;
  }

  function spawnCrowd(n) {
    crowd = [];
    for (var i = 0; i < n; i++) {
      crowd.push({
        x: rand(40, W - 40),
        y: rand(wallTop + 40, wallBot - 70),
        r: rand(16, 21),
        vx: 0, vy: 0,
        hue: BODY_HUES[(Math.random() * BODY_HUES.length) | 0],
        drift: rand(0, Math.PI * 2)
      });
    }
  }

  function startStation() {
    layout();
    station++;
    timeMax = Math.max(3.4, 7.2 - station * 0.32);   // だんだん短く
    timeLeft = timeMax;
    var n = Math.min(64, 12 + station * 4);           // だんだん混雑
    spawnCrowd(n);
    // プレイヤーは上から乗車
    player = { x: W / 2, y: wallTop + 36, r: 18, vx: 0, vy: 0 };
    target = null;
    doorOpen = 0; phase = "open";
    showSign("まもなく " + STATIONS[(station - 1) % STATIONS.length] + "駅");
  }

  function showSign(t) {
    var s = document.getElementById("sign");
    s.textContent = t; s.classList.add("show");
    setTimeout(function () { s.classList.remove("show"); }, 1400);
  }

  function puff(x, y, c) {
    for (var i = 0; i < 6; i++) particles.push({ x: x, y: y, vx: rand(-60, 60), vy: rand(-90, -10), life: 1, c: c });
  }

  // ---- 入力（タッチした方向へ進む）----
  function setTarget(e) {
    var t = (e.touches && e.touches[0]) || e;
    var rect = cv.getBoundingClientRect();
    target = { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  // タップ＝その地点まで歩き続ける／ドラッグ＝指に追従（離しても直前の目的地へ進む＝詰まらない）
  function onDown(e) { e.preventDefault(); if (phase === "play") setTarget(e); }
  function onMove(e) { e.preventDefault(); if (phase === "play") setTarget(e); }
  function onUp(e) { e.preventDefault(); }
  cv.addEventListener("touchstart", onDown, { passive: false });
  cv.addEventListener("touchmove", onMove, { passive: false });
  cv.addEventListener("touchend", onUp, { passive: false });
  cv.addEventListener("mousedown", onDown);
  cv.addEventListener("mousemove", function (e) { if (e.buttons) onMove(e); });
  window.addEventListener("mouseup", onUp);

  // ---- 物理 ----
  function collide() {
    // プレイヤー vs 群衆（押し合い）
    var i, j, a, b, dx, dy, d, ov, nx, ny;
    for (i = 0; i < crowd.length; i++) {
      a = crowd[i];
      dx = a.x - player.x; dy = a.y - player.y; d = Math.hypot(dx, dy) || 0.01;
      var min = a.r + player.r;
      if (d < min) {
        ov = (min - d); nx = dx / d; ny = dy / d;
        // プレイヤーは押しやすいが少し抵抗
        a.x += nx * ov * 0.62; a.y += ny * ov * 0.62;
        player.x -= nx * ov * 0.38; player.y -= ny * ov * 0.38;
      }
    }
    // 群衆同士（軽く）
    for (i = 0; i < crowd.length; i++) {
      a = crowd[i];
      for (j = i + 1; j < crowd.length; j++) {
        b = crowd[j];
        dx = b.x - a.x; dy = b.y - a.y; d = Math.hypot(dx, dy) || 0.01;
        var mn = a.r + b.r;
        if (d < mn) { ov = (mn - d) * 0.5; nx = dx / d; ny = dy / d; a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov; }
      }
    }
  }

  function clampIn(o) {
    var pad = o.r + 6;
    if (o.x < pad) o.x = pad;
    if (o.x > W - pad) o.x = W - pad;
    if (o.y < wallTop + pad) o.y = wallTop + pad;
    // 下の壁：ドア開口だけ通れる
    var atDoor = Math.abs(o.x - doorX) < doorW / 2 - 4;
    var bottom = (o === player && (atDoor && doorOpen > 0.6)) ? H + 40 : wallBot - pad;
    if (o.y > bottom) o.y = bottom;
  }

  function update(dt) {
    shake *= 0.86;
    // 演出フェーズ：ドア開
    if (phase === "open") {
      doorOpen = Math.min(1, doorOpen + dt * 2.4);
      if (doorOpen >= 1) phase = "play";
    }
    if (phase === "play") {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; return gameOver(); }
      // プレイヤー移動（タッチ方向へ）
      if (target) {
        var dx = target.x - player.x, dy = target.y - player.y, d = Math.hypot(dx, dy);
        if (d > 2) {
          var spd = 240; // px/s
          player.vx += (dx / d) * spd * dt * 6;
          player.vy += (dy / d) * spd * dt * 6;
        }
      }
      player.vx *= 0.82; player.vy *= 0.82;
      var max = 260;
      var sp = Math.hypot(player.vx, player.vy);
      if (sp > max) { player.vx = player.vx / sp * max; player.vy = player.vy / sp * max; }
      player.x += player.vx * dt; player.y += player.vy * dt;
      // 群衆ドリフト（もたつき）
      for (var k = 0; k < crowd.length; k++) {
        var c = crowd[k]; c.drift += dt * rand(0.5, 1.4);
        c.x += Math.cos(c.drift) * 6 * dt; c.y += Math.sin(c.drift * 1.3) * 6 * dt;
      }
      collide();
      clampIn(player);
      for (var m = 0; m < crowd.length; m++) clampIn(crowd[m]);
      // 降車判定：下の壁より下へ抜けた
      if (player.y > wallBot + 6) return stationClear();
    }
    if (phase === "leave") {
      doorOpen = Math.max(0, doorOpen - dt * 2.2);
      player.y += 220 * dt;
      if (doorOpen <= 0) { startStation(); }
    }
    // パーティクル
    for (var p = particles.length - 1; p >= 0; p--) {
      var q = particles[p]; q.life -= dt * 1.6; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 200 * dt;
      if (q.life <= 0) particles.splice(p, 1);
    }
  }

  function stationClear() {
    score++; document.getElementById("score").textContent = score;
    puff(player.x, wallBot, "#3fd27e");
    shake = 10; phase = "leave";
    showSign("降車成功！ " + score + "駅クリア");
  }

  // ---- 描画 ----
  function drawPerson(o, isPlayer) {
    var x = o.x, y = o.y, r = o.r;
    ctx.save();
    // 影
    ctx.fillStyle = "rgba(0,0,0,.22)";
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.78, r * 0.9, r * 0.4, 0, 0, 7); ctx.fill();
    // 体
    if (isPlayer) {
      var g = ctx.createLinearGradient(x, y - r, x, y + r);
      g.addColorStop(0, "#ffe08a"); g.addColorStop(1, "#ffb02e");
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = "hsl(" + o.hue + ",42%,58%)";
    }
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    // 頭
    ctx.fillStyle = isPlayer ? "#5a3b00" : "hsl(" + o.hue + ",30%,32%)";
    ctx.beginPath(); ctx.arc(x, y - r * 0.55, r * 0.52, 0, 7); ctx.fill();
    // 目（プレイヤーだけ表情）
    if (isPlayer) {
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x - r * 0.2, y - r * 0.55, 2.4, 0, 7); ctx.arc(x + r * 0.2, y - r * 0.55, 2.4, 0, 7); ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(x - r * 0.2, y - r * 0.55, 1.2, 0, 7); ctx.arc(x + r * 0.2, y - r * 0.55, 1.2, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    var sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.save(); ctx.translate(sx, sy);
    // 床
    ctx.fillStyle = "#1b2438"; ctx.fillRect(-10, -10, W + 20, H + 20);
    // 車内（明るい床）
    ctx.fillStyle = "#27324a";
    roundRect(8, wallTop - 8, W - 16, (wallBot) - (wallTop) + 16, 18); ctx.fill();
    // 床のライン
    ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 2;
    for (var gx = 40; gx < W; gx += 56) { ctx.beginPath(); ctx.moveTo(gx, wallTop); ctx.lineTo(gx, wallBot); ctx.stroke(); }
    // 上の壁（座席）
    ctx.fillStyle = "#33405e"; ctx.fillRect(8, wallTop - 8, W - 16, 14);
    // 下の壁＋ドア
    drawDoorWall();
    // 群衆
    for (var i = 0; i < crowd.length; i++) drawPerson(crowd[i], false);
    // プレイヤー
    drawPerson(player, true);
    // ターゲット印
    if (target && phase === "play") {
      ctx.strokeStyle = "rgba(255,209,102,.8)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(target.x, target.y, 12, 0, 7); ctx.stroke();
    }
    // パーティクル
    for (var p = 0; p < particles.length; p++) { var q = particles[p]; ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, 4, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawDoorWall() {
    var y = wallBot;
    ctx.fillStyle = "#33405e";
    ctx.fillRect(8, y, (doorX - doorW / 2) - 8, 16);
    ctx.fillRect(doorX + doorW / 2, y, (W - 8) - (doorX + doorW / 2), 16);
    // ドア開口（外＝降りる先）
    var open = doorOpen * (doorW / 2);
    // 外の光
    ctx.fillStyle = "#0e1320"; ctx.fillRect(doorX - doorW / 2, y, doorW, 22);
    if (doorOpen > 0.02) {
      ctx.fillStyle = "rgba(120,200,255,.18)";
      ctx.fillRect(doorX - open, y - 2, open * 2, 20);
      // 「降車」矢印
      ctx.fillStyle = "rgba(190,224,255," + (0.4 + 0.4 * doorOpen) + ")";
      ctx.font = "900 13px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("▼ 降車口", doorX, y + 36);
    }
    // ドア板（左右にスライド）
    ctx.fillStyle = "#9fb4d6";
    ctx.fillRect(doorX - doorW / 2, y, doorW / 2 - open, 16);
    ctx.fillRect(doorX + open, y, doorW / 2 - open, 16);
    ctx.fillStyle = "rgba(255,255,255,.25)";
    ctx.fillRect(doorX - doorW / 2, y, 3, 16); ctx.fillRect(doorX + doorW / 2 - 3, y, 3, 16);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function updateHud() {
    var f = document.getElementById("tfill");
    var pct = timeMax > 0 ? Math.max(0, timeLeft / timeMax) : 0;
    f.style.width = (pct * 100) + "%";
    f.className = "tfill" + (pct < 0.34 ? " warn" : "");
  }

  // ---- ループ ----
  function loop(t) {
    if (!running) return;
    var dt = Math.min(0.04, (t - last) / 1000) || 0; last = t;
    if (!paused) { update(dt); updateHud(); draw(); }
    requestAnimationFrame(loop);
  }

  function start() {
    document.getElementById("startOv").hidden = true;
    document.getElementById("overOv").hidden = true;
    running = true; paused = false; score = 0; station = 0;
    document.getElementById("score").textContent = "0";
    particles = [];
    startStation();
    last = performance.now();
    if (window.Arcade) Arcade.ready();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    if (phase === "over") return;
    phase = "over"; running = false;
    var ov = document.getElementById("overOv");
    document.getElementById("finalScore").textContent = score;
    if (score >= 8) { document.getElementById("overEmoji").textContent = "🏆"; document.getElementById("overTitle").textContent = "通勤の達人！"; document.getElementById("overMsg").textContent = score + "駅も降りられた。すごい人混み捌き！"; }
    else if (score >= 3) { document.getElementById("overEmoji").textContent = "😤"; document.getElementById("overTitle").textContent = "乗り過ごした…"; document.getElementById("overMsg").textContent = "なかなかの混雑突破。あと少し！"; }
    else { document.getElementById("overEmoji").textContent = "😵"; document.getElementById("overTitle").textContent = "乗り過ごした…"; document.getElementById("overMsg").textContent = "人混みに負けた。もう一回！"; }
    ov.hidden = false;
    if (window.Arcade) Arcade.gameOver(score);
  }

  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("retryBtn").addEventListener("click", start);

  if (window.Arcade) {
    Arcade.onPause(function () { paused = true; });
    Arcade.onResume(function () { paused = false; last = performance.now(); });
    Arcade.onRestart(start);
  }
})();
</script>
<script>
/* iOSダブルタップズーム対策：touch-action:noneでは止まらない端末があるため、
   ボタン類以外のtouchendをpreventDefault（ボタンはclick合成を守るため触らない） */
document.addEventListener("touchend",function(e){
  var t=e.target;
  if(e.cancelable && !(t&&t.closest&&t.closest("button,a,input,select,label"))) e.preventDefault();
},{passive:false});
</script>
</body>
</html>
