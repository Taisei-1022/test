<title>Vappa 公式ゲーム試遊室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* layout: 1列のカードの棚。タップでゲームを全画面で重ねて開く */
:root{
  --bg:#f3f1fb; --panel:#ffffff; --ink:#23203a; --muted:#6c6886; --line:#dcd8ee;
  --accent:#ff5a3c; --badge:#ece9fb;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17152a; --panel:#221f3b; --ink:#f1eefc; --muted:#a7a2c4; --line:#36325a; --accent:#ff7a5c; --badge:#2e2a4f; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17152a; --panel:#221f3b; --ink:#f1eefc; --muted:#a7a2c4; --line:#36325a; --accent:#ff7a5c; --badge:#2e2a4f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:20px}
h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
.list{display:grid;gap:12px}
.game{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.game:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.game img,.game .ph{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--badge);display:grid;place-items:center;font-size:34px}
.game .t{font-family:var(--display);font-weight:800;font-size:17px}
.game .b{color:var(--muted);font-size:13px;min-width:0}
.game .best{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.game .best b{display:block;font-size:18px;color:var(--accent);font-family:var(--display)}
.game[disabled]{opacity:.55;cursor:default}
.tag{display:inline-block;font-size:11px;letter-spacing:.04em;background:var(--badge);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
#stage{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column}
#stage iframe{flex:1;border:0;width:100%;background:#000}
#bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#111;color:#fff;font-size:13px}
#bar button{font:inherit;background:#fff2;color:#fff;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
#last{font-variant-numeric:tabular-nums}
</style>

<div class="wrap">
  <header>
    <h1>公式ゲーム 試遊室</h1>
    <p class="lead">本番に出す前のテスト版です。あなたしか開けません。遊んだら、○△×と気になった所を教えてください。</p>
  </header>
  <div class="list" id="list"></div>
  <p class="note">最高点はこの端末の中にだけ記録されます。ゲームの右上の「もどる」で一覧に戻れます。</p>
</div>

<div id="stage" hidden>
  <div id="bar"><span id="now"></span><span id="last"></span><button id="close" type="button">もどる</button></div>
  <iframe id="frame" title="ゲーム" allow="autoplay"></iframe>
</div>

<script>
var GAMES = [
  { id:"beer",  title:"ビール注ぎ名人", emoji:"🍺", blurb:"泡7:3をねらって長押しで注ぐ。ジョッキがどんどん変になる。", unit:"点" },
  { id:"steak", title:"ステーキ等分",   emoji:"🥩", blurb:"指でなぞってステーキを切る。ぴったり等分できる？", unit:"点" },
  { id:"hata",  title:"旗あげ",         emoji:"🚩", blurb:"赤あげて、白さげない。指示がどんどんひねくれる。", unit:"回" },
  { id:"lturn", title:"L字路 切り返し", emoji:"🚗", blurb:"せまいL字路を切り返しで曲がれ。全5ステージの合計タイム勝負。", unit:"秒", low:true },
  { id:"darts", title:"ネコダーツ", emoji:"🎯", blurb:"的をねらうと、ネコがじゃまをする。理不尽すぎるダーツ。", unit:"点" },
  { id:"softcream", title:"ソフトクリーム職人", emoji:"🍦", blurb:"タップでうず巻きを重ねる。どこまで高く巻ける？", unit:"cm" },
  { id:"yuka", title:"落ちる床", emoji:"🟥", blurb:"言われた色の床へ逃げろ。ほかの床は落ちる。", unit:"点" },
  { id:"kazuate", title:"数字当て", emoji:"🔐", blurb:"かくれた数字を、ヒントだけで当てる金庫破り。", unit:"点" },
  { id:"shinkei", title:"神経衰弱タイムアタック", emoji:"🃏", blurb:"3面連続の神経衰弱。いたずら札がカードをまぜる。", unit:"秒", low:true },
  { id:"tsunagi", title:"一筆書きつなぎ", emoji:"🍡", blurb:"同じおもちを指でなぞってつなげる。長いほど大爆発。", unit:"点" }
];
var READY = ["beer","steak","hata","lturn","yuka","darts","kazuate","softcream"]; // 遊べる状態のゲームID
function best(id){ try{ return localStorage.getItem("best_"+id); }catch(e){ return null; } }
function setBest(id,v,low){ try{ var b=best(id); if(b===null||(low?+v<+b:+v>+b)) localStorage.setItem("best_"+id,v); }catch(e){} }
var list=document.getElementById("list"), stage=document.getElementById("stage"), frame=document.getElementById("frame"), cur=null;
function render(){
  list.innerHTML="";
  GAMES.forEach(function(g){
    var ok = READY.indexOf(g.id)>=0, b=best(g.id);
    var el=document.createElement("button"); el.type="button"; el.className="game"; el.disabled=!ok;
    el.innerHTML=(ok?'<img alt="" src="games/'+g.id+'/thumb.png" onerror="this.outerHTML=\'<div class=ph>'+g.emoji+'</div>\'">':'<div class="ph">'+g.emoji+'</div>')+
      '<div style="min-width:0"><div class="t">'+g.title+(ok?'':'<span class="tag">準備中</span>')+'</div><div class="b">'+g.blurb+'</div></div>'+
      '<div class="best">最高<b>'+(b===null?'—':b)+'</b>'+(b===null?'':g.unit)+'</div>';
    if(ok) el.addEventListener("click",function(){ open(g); });
    list.appendChild(el);
  });
}
function open(g){ cur=g; document.getElementById("now").textContent=g.title; document.getElementById("last").textContent=""; frame.src="games/"+g.id+"/index.html"; stage.hidden=false; }
document.getElementById("close").addEventListener("click",function(){ stage.hidden=true; frame.src="about:blank"; render(); });
window.addEventListener("message",function(e){
  var d=e.data; if(!d||!d.__arcade||!cur) return;
  if(d.call==="gameOver"&&d.payload&&typeof d.payload.score!=="undefined"){
    setBest(cur.id,d.payload.score,cur.low); document.getElementById("last").textContent="今回 "+d.payload.score+cur.unit;
  }
});
render();
</script>
