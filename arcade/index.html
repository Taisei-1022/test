<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ミニアーケード" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" />
<link rel="stylesheet" href="css/app.css?v=4" />
<title>ミニアーケード</title>
</head>
<body>
<div class="screen">

  <!-- 遊ぶ -->
  <section id="view-play" class="view active">
    <div class="app">
      <div class="top"><div class="brand">ミニアーケード<small>あそぶ</small></div></div>
      <div class="section">ゲーム一覧</div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- 作る -->
  <section id="view-create" class="view">
    <!-- ① 作品一覧 -->
    <div id="cr-list" class="crscreen on">
      <div class="crbar"><div class="t">作る</div><button class="newbtn" id="newBtn">＋ 新規作成</button></div>
      <div class="crbody"><div id="creations"></div></div>
    </div>
    <!-- ② チャット -->
    <div id="cr-chat" class="crscreen">
      <div class="crbar">
        <button class="back" id="chatBack" aria-label="戻る">‹</button>
        <div class="t">作る（AI）</div>
        <button class="act off" id="toPreview">プレビュー</button>
      </div>
      <div class="chatlog" id="chatlog"></div>
      <div class="chips" id="chips">
        <button>落ちてくる寿司をキャッチ</button>
        <button>もぐらたたき</button>
        <button>色をそろえるパズル</button>
      </div>
      <div class="composer">
        <input id="chatInput" placeholder="作りたいゲーム / 直したい所を書く…" autocomplete="off" />
        <button id="chatSend">送信</button>
      </div>
    </div>
    <!-- ③ プレビュー -->
    <div id="cr-preview" class="crscreen">
      <div class="crbar">
        <button class="back" id="pvBack" aria-label="戻る">‹</button>
        <div class="t">プレビュー</div>
        <button class="act" id="pvToChat">チャット</button>
      </div>
      <div class="crbody">
        <div class="pvframe"><iframe id="pvFrame" title="preview"></iframe></div>
        <p class="pvnote" id="pvTitle"></p>
        <div class="pvbtns">
          <button id="pvEdit">チャットで直す</button>
          <button class="pri" id="pvToPublish">公開設定へ ›</button>
        </div>
      </div>
    </div>
    <!-- ④ 公開設定 -->
    <div id="cr-publish" class="crscreen">
      <div class="crbar">
        <button class="back" id="pubBack" aria-label="戻る">‹</button>
        <div class="t" id="pubBarTitle">公開設定</div>
      </div>
      <div class="crbody">
        <div class="section2">サムネイル</div>
        <div class="thumbpick">
          <div class="thumbprev" id="thumbPrev"></div>
          <div class="thumbacts">
            <label class="filebtn">画像を選ぶ<input type="file" id="thumbInput" accept="image/*" style="display:none"></label>
            <button class="ghostbtn" id="thumbClear">画像なし（色背景）</button>
          </div>
        </div>
        <div class="section2">タイトル</div>
        <input id="pubTitle" class="field" maxlength="40" placeholder="ゲームのタイトル" />
        <div class="section2">説明（任意）</div>
        <textarea id="pubDesc" class="field" rows="3" maxlength="140" placeholder="どんなゲーム？ 遊び方やコツなど"></textarea>
        <div class="pvbtns" style="margin-top:16px">
          <button id="pubBack2">プレビューに戻る</button>
          <button class="pri" id="pubDo">公開する</button>
        </div>
      </div>
    </div>
  </section>

  <!-- マイページ -->
  <section id="view-mypage" class="view">
    <div class="app">
      <div class="top"><div class="brand">マイページ<small>あなたの記録</small></div></div>
      <div class="section">なまえ</div>
      <label class="name"><input id="name" maxlength="16" placeholder="ゲスト" style="width:180px" /></label>
      <div class="section">自己ベスト</div>
      <ul class="records" id="records"></ul>
      <div class="section">作ったゲーム</div>
      <div id="myCreations"></div>
    </div>
  </section>
</div>

<nav class="tabbar">
  <button data-tab="play" class="on">
    <svg viewBox="0 0 24 24"><path class="icf" d="M8 6 L18 12 L8 18 Z"/></svg>遊ぶ
  </button>
  <button data-tab="create">
    <svg viewBox="0 0 24 24"><path class="ic" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>作る
  </button>
  <button data-tab="mypage">
    <svg viewBox="0 0 24 24"><circle class="ic" stroke-width="2" cx="12" cy="8" r="3.4"/><path class="ic" stroke-width="2" stroke-linecap="round" d="M5.5 19c1-3.4 4-5 6.5-5s5.5 1.6 6.5 5"/></svg>マイページ
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="js/games.js?v=2"></script>
<script src="js/config.js?v=2"></script>
<script src="js/store.js?v=2"></script>
<script src="js/ai.js?v=4"></script>
<script src="js/catalog.js?v=4"></script>
<script src="js/arcade-embed.js?v=3"></script>
<script>
(function () {
  "use strict";
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function shade(hex){ var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r*.55);g=Math.round(g*.55);b=Math.round(b*.55);
    return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
  function grad(c){ return "linear-gradient(140deg,"+(c||"#e6b450")+","+shade(c||"#e6b450")+")"; }
  function me(){ return Store.name() || "ゲスト"; }
  function fmtDate(t){ try{ return new Date(t).toLocaleDateString("ja-JP"); }catch(e){ return ""; } }
  var toast=document.getElementById("toast");
  function showToast(m){ toast.textContent=m; toast.classList.add("show"); setTimeout(function(){toast.classList.remove("show");},1500); }

  /* ---------- タブ切替 ---------- */
  var tabs=document.querySelectorAll(".tabbar button");
  function show(tab){
    document.querySelectorAll(".view").forEach(function(v){ v.classList.toggle("active", v.id==="view-"+tab); });
    tabs.forEach(function(b){ b.classList.toggle("on", b.dataset.tab===tab); });
    if(tab==="play") renderFeed();
    if(tab==="mypage") renderMypage();
    if(tab==="create") enterCreate();
    if(location.hash!=="#"+tab) history.replaceState(null,"","#"+tab);
  }
  tabs.forEach(function(b){ b.addEventListener("click", function(){ show(b.dataset.tab); }); });

  /* ---------- 遊ぶ：フィード ---------- */
  var grid=document.getElementById("grid");
  function thumbDiv(it){
    return it.thumb
      ? '<div class="thumb" style="background:url('+it.thumb+') center/cover"></div>'
      : '<div class="thumb" style="background:'+grad(it.accent)+'"><b>'+esc(it.title)+'</b></div>';
  }
  function renderFeed(){
    Catalog.listGenerated().then(function(gen){
      var items = GAMES.map(function(g){
        return {id:g.id,title:g.title,author:g.author,category:g.category,accent:g.accent,blurb:g.blurb,score:g.score,thumb:null};
      }).concat(gen.map(function(g){
        return {id:g.id,title:g.title,author:g.author||"ゲスト",category:"みんなの作品",accent:g.accent||"#e6b450",
                thumb:g.thumb||null,blurb:(g.description||"AIで作られたゲーム"),score:{type:"high",unit:"点"}};
      }));
      return Promise.all(items.map(function(it){
        return Promise.all([Store.plays(it.id),Store.top(it.id,it.score.type,1)]).then(function(r){
          return {it:it,plays:r[0],top:r[1][0]||null};
        });
      }));
    }).then(function(rows){
      grid.innerHTML=rows.map(function(row){
        var it=row.it, topTxt=row.top?(row.top.score+it.score.unit+" / "+row.top.player):"まだ記録なし";
        return '<div class="card">'+
          thumbDiv(it)+
          '<span class="cat">'+esc(it.category)+'</span>'+
          '<div class="ttl">'+esc(it.title)+'</div>'+
          '<div class="meta">作 '+esc(it.author)+' ・ '+row.plays+'プレイ</div>'+
          '<div class="blurb">'+esc(it.blurb)+'</div>'+
          '<div class="meta" style="margin-top:6px;color:var(--gold)">1位 '+esc(topTxt)+'</div>'+
          '<div class="cardbtns">'+
            '<a class="cbtn pri" href="play.html?game='+it.id+'">遊ぶ</a>'+
            '<a class="cbtn" href="leaderboard.html?game='+it.id+'">ランキング</a>'+
          '</div></div>';
      }).join("");
    });
  }

  /* ---------- マイページ ---------- */
  var nameEl=document.getElementById("name"), records=document.getElementById("records");
  nameEl.addEventListener("change", function(){ Store.setName(nameEl.value.trim()); renderMypage(); });
  function renderMypage(){
    nameEl.value=Store.name();
    renderCreationsInto("myCreations");
    Promise.all(GAMES.map(function(g){ return Store.myBest(g.id,g.score.type,me()).then(function(b){return {g:g,best:b};}); }))
    .then(function(rows){
      records.innerHTML=rows.map(function(r){
        var v=r.best===null?'<span class="bs none">未プレイ</span>':'<span class="bs">'+r.best+r.g.score.unit+'</span>';
        return '<li><span class="nm">'+esc(r.g.title)+'</span>'+v+'</li>';
      }).join("");
    });
  }

  /* ---------- 作る：自作リスト（編集/複製/削除） ---------- */
  function creationCardHTML(list){
    if(!list.length) return '<div class="emptybox">まだ作品がありません。<br>右上の「＋ 新規作成」から作ろう。</div>';
    return '<ul class="crelist">'+list.map(function(c){
      var ic = c.thumb ? '<div class="ic" style="background:url('+c.thumb+') center/cover"></div>'
                       : '<div class="ic" style="background:'+grad(c.accent||"#e6b450")+'"></div>';
      return '<li>'+ic+
        '<div class="mid"><div class="nm">'+esc(c.title)+'</div><div class="dt">'+fmtDate(c.created_at)+'</div></div>'+
        '<div class="liacts">'+
          '<a class="play" href="play.html?game='+c.id+'">遊ぶ</a>'+
          '<button data-act="edit" data-id="'+c.id+'">編集</button>'+
          '<button data-act="copy" data-id="'+c.id+'">複製</button>'+
          '<button data-act="del" class="del" data-id="'+c.id+'">削除</button>'+
        '</div></li>';
    }).join("")+'</ul>';
  }
  function renderCreationsInto(elId){
    var el=document.getElementById(elId); if(!el) return;
    el.onclick=handleCreationClick;
    Catalog.listGenerated().then(function(all){
      var mine=all.filter(function(g){ return Catalog.mine(g); });
      el.innerHTML=creationCardHTML(mine);
    });
  }
  function refreshCreations(){ renderCreationsInto("creations"); renderCreationsInto("myCreations"); }
  function handleCreationClick(e){
    var btn=e.target.closest && e.target.closest("[data-act]"); if(!btn) return;
    var id=btn.getAttribute("data-id"), act=btn.getAttribute("data-act");
    if(act==="edit"){ editGame(id); }
    else if(act==="copy"){ Catalog.copy(id).then(function(){ showToast("複製しました"); refreshCreations(); }).catch(function(){ showToast("複製に失敗"); }); }
    else if(act==="del"){ if(confirm("このゲームを削除する？元に戻せません")){ Catalog.remove(id).then(function(){ showToast("削除しました"); refreshCreations(); }).catch(function(){ showToast("削除に失敗"); }); } }
  }

  /* ---------- 作る：サブ画面ルーター ---------- */
  var createEntered=false, lastGen=null;
  var toPreviewBtn=document.getElementById("toPreview");
  function crShow(s){
    document.querySelectorAll("#view-create .crscreen").forEach(function(el){ el.classList.toggle("on", el.id==="cr-"+s); });
    if(s==="list") renderCreationsInto("creations");
    if(s==="preview") renderPreview();
    if(s==="publish") renderPublish();
  }
  function enterCreate(){ if(!createEntered){ createEntered=true; crShow("list"); } }

  document.getElementById("newBtn").addEventListener("click", function(){ resetChat(); crShow("chat"); });
  document.getElementById("chatBack").addEventListener("click", function(){ crShow("list"); });
  document.getElementById("pvBack").addEventListener("click", function(){ crShow("chat"); });
  document.getElementById("pvToChat").addEventListener("click", function(){ crShow("chat"); });
  document.getElementById("pvEdit").addEventListener("click", function(){ crShow("chat"); });
  document.getElementById("pvToPublish").addEventListener("click", function(){ crShow("publish"); });
  document.getElementById("pubBack").addEventListener("click", function(){ crShow("preview"); });
  document.getElementById("pubBack2").addEventListener("click", function(){ crShow("preview"); });
  toPreviewBtn.addEventListener("click", function(){
    if(lastGen) crShow("preview"); else showToast("まずアイデアを送って生成してね");
  });
  function renderPreview(){
    if(!lastGen) return;
    document.getElementById("pvTitle").textContent="「"+lastGen.title+"」のプレビュー（公開設定でタイトル・説明・サムネを決められます）";
    document.getElementById("pvFrame").srcdoc = buildSrcdoc(lastGen.html);
  }

  /* ---------- 公開フォーム ---------- */
  function updateThumbPrev(){
    var el=document.getElementById("thumbPrev");
    if(lastGen && lastGen.thumb){ el.style.background="url("+lastGen.thumb+") center/cover"; el.textContent=""; }
    else { el.style.background=grad(lastGen?lastGen.accent:"#e6b450"); el.textContent=(lastGen&&lastGen.title)||""; }
  }
  function renderPublish(){
    if(!lastGen) return;
    document.getElementById("pubBarTitle").textContent = lastGen.editingId ? "編集（上書き保存）" : "公開設定";
    document.getElementById("pubDo").textContent = lastGen.editingId ? "保存する" : "公開する";
    document.getElementById("pubTitle").value = lastGen.title || "";
    document.getElementById("pubDesc").value = lastGen.description || "";
    updateThumbPrev();
  }
  function resizeImage(file, cb){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=360, w=img.width, h=img.height, sc=Math.min(1, max/Math.max(w,h));
        var cw=Math.round(w*sc), ch=Math.round(h*sc);
        var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
        cv.getContext("2d").drawImage(img,0,0,cw,ch);
        try{ cb(cv.toDataURL("image/jpeg",0.82)); }catch(e){ cb(null); }
      };
      img.onerror=function(){ cb(null); };
      img.src=reader.result;
    };
    reader.onerror=function(){ cb(null); };
    reader.readAsDataURL(file);
  }
  document.getElementById("thumbInput").addEventListener("change", function(e){
    var f=e.target.files&&e.target.files[0]; if(!f||!lastGen) return;
    resizeImage(f, function(dataUrl){ if(dataUrl){ lastGen.thumb=dataUrl; updateThumbPrev(); } else showToast("画像を読めませんでした"); });
    e.target.value="";
  });
  document.getElementById("thumbClear").addEventListener("click", function(){ if(lastGen){ lastGen.thumb=null; updateThumbPrev(); } });
  document.getElementById("pubDo").addEventListener("click", function(){
    if(!lastGen) return;
    lastGen.title = (document.getElementById("pubTitle").value||"").trim() || lastGen.title || "ゲーム";
    lastGen.description = (document.getElementById("pubDesc").value||"").trim();
    var btn=this; btn.disabled=true;
    var editing=lastGen.editingId;
    var p = editing ? Catalog.update(editing, lastGen) : Catalog.publish(lastGen);
    p.then(function(){ btn.disabled=false; showToast(editing?"保存しました":"公開しました！"); crShow("list"); })
     .catch(function(e){ btn.disabled=false; showToast("失敗："+String(e.message||e).slice(0,40)); });
  });

  /* ---------- 作る：AIチャット（本実装＋編集=案A） ---------- */
  var chatlog=document.getElementById("chatlog"), input=document.getElementById("chatInput"),
      sendBtn=document.getElementById("chatSend"), chatInit=false, busy=false;
  var ACCENTS=["#e6b450","#4c8dff","#3fb950","#e5484d","#b07cf0","#39c5bb"];
  function bubble(cls,text){ var d=document.createElement("div"); d.className="msg "+cls; d.textContent=text;
    chatlog.appendChild(d); chatlog.scrollTop=chatlog.scrollHeight; return d; }
  function resetChat(){
    chatlog.innerHTML=""; chatInit=false; busy=false; lastGen=null;
    toPreviewBtn.classList.add("off"); initChat();
  }
  function initChat(){
    if(chatInit) return; chatInit=true;
    bubble("bot", Ai.available()
      ? "どんなゲームを作る？\nひと言で教えて。例：「落ちてくる寿司をキャッチ」\n（できたあとは「もっと速く」「敵を増やして」のように直せます）"
      : "AI生成はまだ設定されていません。\nSupabaseのEdge Function（generate）とAPIキーを設定すると使えるようになります。");
  }
  function editGame(id){
    Catalog.getGenerated(id).then(function(g){
      if(!g) return;
      chatlog.innerHTML=""; chatInit=true; busy=false;
      lastGen={ title:g.title, html:g.html, accent:g.accent||"#e6b450", description:g.description||"", thumb:g.thumb||null, editingId:g.id };
      toPreviewBtn.classList.remove("off");
      bubble("bot","「"+g.title+"」を編集中。直したい所を言ってね（例：もっと速く／敵を増やして／色を青に）。\nプレビュー → 公開設定 → 保存 で上書きできます。");
      show("create"); crShow("chat");
    });
  }
  function sendIdea(text){
    text=(text||"").trim(); if(!text||busy) return;
    bubble("user",text); input.value=""; busy=true;
    var prev = (lastGen && lastGen.html) ? lastGen.html : "";
    var typing=bubble("bot typing", (prev?"直しているよ…":"作っているよ…")+"（10〜30秒かかることがあります）");
    Ai.generate(text, prev).then(function(g){
      typing.remove();
      var k = lastGen || {};
      lastGen={ title:g.title, html:g.html,
        accent: k.accent || ACCENTS[Math.floor(Math.random()*ACCENTS.length)],
        description: k.description || "", thumb: k.thumb || null, editingId: k.editingId || null };
      toPreviewBtn.classList.remove("off");
      bubble("bot","「"+g.title+"」ができたよ！下のボタンか右上の「プレビュー」で遊んでみて。\nさらに直したい時はそのまま続けて話してね。");
      showGenCard();
      busy=false;
    }).catch(function(err){
      typing.remove(); busy=false;
      var s=String(err&&err.message||err);
      var msg = /not_configured/.test(s)
        ? "AI生成が未設定です。SupabaseのEdge Functionとキーを設定してね。"
        : "生成に失敗しちゃった。もう一度、短い言葉で試してみて。\n("+s.slice(0,90)+")";
      bubble("bot", msg);
    });
  }
  function showGenCard(){
    var card=document.createElement("div"); card.className="gencard";
    card.innerHTML='<div class="pv" style="background:'+grad(lastGen.accent)+'"><b>'+esc(lastGen.title)+'</b></div>'+
      '<div class="bd"><div class="t">できあがり</div>'+
      '<div class="row"><button class="pri toPv">プレビューで遊ぶ ›</button></div></div>';
    chatlog.appendChild(card); chatlog.scrollTop=chatlog.scrollHeight;
    card.querySelector(".toPv").addEventListener("click", function(){ crShow("preview"); });
  }
  sendBtn.addEventListener("click", function(){ sendIdea(input.value); });
  input.addEventListener("keydown", function(e){ if(e.key==="Enter") sendIdea(input.value); });
  document.getElementById("chips").addEventListener("click", function(e){
    if(e.target.tagName==="BUTTON"){ sendIdea(e.target.textContent); }
  });

  /* ---------- 初期表示 ---------- */
  var start=(location.hash||"#play").slice(1);
  if(!/^(play|create|mypage)$/.test(start)) start="play";
  show(start);
})();
</script>
</body>
</html>
