<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}

.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  duration:    { v: 30,   label: '制限時間(秒)',     min: 15, max: 60,  step: 5 },
  coinSpeed:   { v: 85,   label: 'コインの速さ',     min: 30, max: 240, step: 10 },
  coinCount:   { v: 4,    label: 'コインの枚数',     min: 3,  max: 8,   step: 1 },
  rainbowRate: { v: 0.12, label: '虹コインの割合',   min: 0,  max: 0.4, step: 0.02 },
  chestRate:   { v: 0.10, label: '宝箱の割合',       min: 0,  max: 0.4, step: 0.02 },
  clockRate:   { v: 0.08, label: '時計の割合',       min: 0,  max: 0.4, step: 0.02 },
  bombRate:    { v: 0.14, label: '爆弾の割合',       min: 0,  max: 0.5, step: 0.02 },
  rushBoost:   { v: 1.6,  label: 'ラスト10秒の倍速', min: 1,  max: 3,   step: 0.1 }
};

var PL = 22, PR = 458, PT = 64, PB = 668;
var EMO = { coin: '🪙', rainbow: '🌈', chest: '🎁', bomb: '💣', clock: '⏰' };
var ents, parts, clouds, bigPop, timeLeft, score, combo, comboT, mult, slowT, shake, et, hudT, finished;

function init(){
  PL = 22; PR = W - 22; PT = 64; PB = H - 52;
  ents = []; parts = []; clouds = []; bigPop = null;
  for (var i = 0; i < 6; i++){
    clouds.push({ x: Math.random() * W, y: 120 + Math.random() * 520, s: 0.6 + Math.random() * 0.9, v: 6 + Math.random() * 16 });
  }
  timeLeft = TUNE.duration.v;
  score = 0; combo = 0; comboT = 0; mult = 1;
  slowT = 0; shake = 0; et = 0; hudT = -1; finished = false;
  var n = Math.round(TUNE.coinCount.v);
  for (var j = 0; j < n; j++) spawnEnt(true, undefined, undefined);
  Game.score(0);
  Game.hud('⏱ ' + Math.ceil(timeLeft));
}

function pickType(){
  var coinN = 0, bombN = 0, chestN = 0;
  for (var i = 0; i < ents.length; i++){
    var t = ents[i].type;
    if (t === 'coin') coinN++;
    else if (t === 'bomb') bombN++;
    else if (t === 'chest') chestN++;
  }
  var need = Math.ceil(TUNE.coinCount.v * 0.5);
  if (coinN < need) return 'coin';
  if (bombN >= Math.max(1, Math.floor(TUNE.coinCount.v * 0.5))) return 'coin';
  if (chestN >= Math.max(1, Math.ceil(TUNE.coinCount.v * 0.25))) return 'coin';
  var r = Math.random();
  if (r < TUNE.rainbowRate.v) return 'rainbow';
  r -= TUNE.rainbowRate.v;
  if (r < TUNE.chestRate.v) return 'chest';
  r -= TUNE.chestRate.v;
  if (r < TUNE.clockRate.v) return 'clock';
  r -= TUNE.clockRate.v;
  if (r < TUNE.bombRate.v) return 'bomb';
  return 'coin';
}

function spawnEnt(initial, ax, ay){
  var type = pickType();
  var r = 26;
  if (type === 'rainbow') r = 18;
  else if (type === 'chest') r = 28;
  else if (type === 'clock') r = 25;
  var sp = TUNE.coinSpeed.v;
  if (type === 'rainbow') sp *= 1.8;
  else if (type === 'chest') sp *= 0.5;
  else if (type === 'clock') sp *= 0.85;
  sp *= 0.7 + Math.random() * 0.6;
  var x = W / 2, y = H / 2, tries = 0;
  do {
    x = PL + r + Math.random() * (PR - PL - r * 2);
    y = PT + r + Math.random() * (PB - PT - r * 2);
    tries++;
  } while (ax !== undefined && tries < 14 && Math.sqrt((x - ax) * (x - ax) + (y - ay) * (y - ay)) < 100);
  var a = Math.random() * Math.PI * 2;
  ents.push({
    x: x, y: y, r: r, type: type, hp: 3,
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    wob: Math.random() * 6.283, scale: initial ? 1 : 0.2, pop: 0
  });
}

function refill(ax, ay){
  var target = Math.round(TUNE.coinCount.v);
  var guard = 0;
  while (ents.length < target && guard < 12){ spawnEnt(false, ax, ay); guard++; }
}

function burst(x, y, color, n){
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var s = 70 + Math.random() * 200;
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.45 + Math.random() * 0.35, c: color, r: 2 + Math.random() * 3.5 });
  }
}

function gain(e, base, color){
  combo = comboT > 0 ? combo + 1 : 1;
  comboT = 0.8;
  mult = combo >= 10 ? 3 : (combo >= 5 ? 2 : 1);
  var pts = base * mult;
  score += pts;
  Game.score(score);
  burst(e.x, e.y, color, 12);
  shake = 0.16;
  if (base >= 5){
    bigPop = { text: '+' + pts + '!', t: 0.9, max: 0.9, color: color };
  } else {
    Game.float(e.x, e.y - 20, '+' + pts, color);
  }
}

function hit(i){
  var e = ents[i];
  if (!e) return;
  if (e.type === 'bomb'){
    score = Math.max(0, score - 3);
    Game.score(score);
    combo = 0; comboT = 0; mult = 1;
    shake = 0.45;
    burst(e.x, e.y, '#ff6b6b', 16);
    Game.float(e.x, e.y - 26, '-3', '#ff5f6d');
    ents.splice(i, 1);
    refill(e.x, e.y);
    return;
  }
  if (e.type === 'chest'){
    e.hp--;
    e.pop = 1;
    if (e.hp > 0){
      burst(e.x, e.y, '#ffd166', 6);
      shake = 0.1;
      return;
    }
    gain(e, 10, '#ff8f1f');
    ents.splice(i, 1);
    refill(e.x, e.y);
    return;
  }
  if (e.type === 'clock'){
    slowT = 3;
    gain(e, 2, '#2f9bff');
    Game.toast('⏰ スローモーション！');
    ents.splice(i, 1);
    refill(e.x, e.y);
    return;
  }
  if (e.type === 'rainbow'){
    gain(e, 5, '#ff4fd8');
    ents.splice(i, 1);
    refill(e.x, e.y);
    return;
  }
  gain(e, 1, '#ffb703');
  ents.splice(i, 1);
  refill(e.x, e.y);
}

function onDown(x, y){
  if (finished) return;
  var best = -1, bd = 1e9;
  for (var i = 0; i < ents.length; i++){
    var e = ents[i];
    var dx = e.x - x, dy = e.y - y;
    var d2 = dx * dx + dy * dy;
    var rad = e.r + 20;
    if (d2 < rad * rad && d2 < bd){ bd = d2; best = i; }
  }
  if (best >= 0) hit(best);
}

function update(dt){
  if (finished) return;
  et += dt;
  if (shake > 0) shake -= dt;
  if (slowT > 0) slowT -= dt;
  if (comboT > 0){
    comboT -= dt;
    if (comboT <= 0){ comboT = 0; combo = 0; mult = 1; }
  }

  timeLeft -= dt;
  if (timeLeft <= 0){
    timeLeft = 0;
    Game.hud('⏱ 0');
    finished = true;
    Game.over(score);
    return;
  }
  var ht = Math.ceil(timeLeft);
  if (ht !== hudT){ hudT = ht; Game.hud('⏱ ' + ht); }

  var rush = 1;
  if (timeLeft <= 10) rush = 1 + (TUNE.rushBoost.v - 1) * (1 - timeLeft / 10);
  var ts = rush * (slowT > 0 ? 0.35 : 1);

  for (var i = 0; i < ents.length; i++){
    var e = ents[i];
    e.wob += dt * 2.4;
    e.x += e.vx * dt * ts;
    e.y += (e.vy + Math.sin(e.wob) * 26) * dt * ts;
    if (e.x < PL + e.r){ e.x = PL + e.r; e.vx = Math.abs(e.vx); }
    if (e.x > PR - e.r){ e.x = PR - e.r; e.vx = -Math.abs(e.vx); }
    if (e.y < PT + e.r){ e.y = PT + e.r; e.vy = Math.abs(e.vy); }
    if (e.y > PB - e.r){ e.y = PB - e.r; e.vy = -Math.abs(e.vy); }
    if (e.scale < 1) e.scale = Math.min(1, e.scale + dt * 4);
    if (e.pop > 0) e.pop -= dt * 3;
  }

  for (var p = parts.length - 1; p >= 0; p--){
    var q = parts[p];
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.vy += 520 * dt;
    q.life -= dt;
    if (q.life <= 0) parts.splice(p, 1);
  }

  if (bigPop){ bigPop.t -= dt; if (bigPop.t <= 0) bigPop = null; }

  for (var c = 0; c < clouds.length; c++){
    var cl = clouds[c];
    cl.x += cl.v * dt * (slowT > 0 ? 0.35 : 1);
    if (cl.x > W + 100) cl.x = -100;
  }
}

function drawCloud(x, y, s){
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(x, y, 24 * s, 0, Math.PI * 2);
  ctx.arc(x + 26 * s, y + 8 * s, 18 * s, 0, Math.PI * 2);
  ctx.arc(x - 28 * s, y + 9 * s, 16 * s, 0, Math.PI * 2);
  ctx.arc(x + 4 * s, y - 16 * s, 17 * s, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function draw(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = 1;

  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#45bdf2');
  g.addColorStop(0.5, '#9fdcff');
  g.addColorStop(1, '#eaf9ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (var c = 0; c < clouds.length; c++){
    var cl = clouds[c];
    drawCloud(cl.x, cl.y, cl.s);
  }

  var sh = shake > 0 ? shake : 0;
  var amp = sh > 0 ? 12 * (sh / 0.45) : 0;
  var ox = amp > 0 ? (Math.random() * 2 - 1) * amp : 0;
  var oy = amp > 0 ? (Math.random() * 2 - 1) * amp : 0;

  ctx.save();
  ctx.translate(ox, oy);

  for (var i = 0; i < ents.length; i++){
    var e = ents[i];
    var sc = e.scale * (e.pop > 0 ? 1 + e.pop * 0.5 : 1);
    if (e.type === 'bomb'){
      var pu = 0.5 + 0.5 * Math.sin(et * 8);
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * (1.15 + pu * 0.18), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,90,90,' + (0.16 + pu * 0.18) + ')';
      ctx.fill();
    } else if (e.type === 'rainbow'){
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 1.3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fill();
    } else if (e.type === 'clock'){
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(120,210,255,0.4)';
      ctx.fill();
    }
    ctx.font = Math.round(e.r * 2 * sc) + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(EMO[e.type], e.x, e.y);
    if (e.type === 'chest' && e.hp < 3){
      for (var k = 0; k < 3; k++){
        ctx.beginPath();
        ctx.arc(e.x - 14 + k * 14, e.y + e.r + 13, 5, 0, Math.PI * 2);
        ctx.fillStyle = k < e.hp ? '#ff9f1c' : 'rgba(255,255,255,0.7)';
        ctx.fill();
      }
    }
  }

  for (var p = 0; p < parts.length; p++){
    var q = parts[p];
    var a = Math.max(0, Math.min(1, q.life / 0.45));
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.r * (0.4 + a), 0, Math.PI * 2);
    ctx.fillStyle = q.c;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (slowT > 0){
    ctx.fillStyle = 'rgba(70,190,255,0.14)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(70,190,255,0.8)';
    ctx.fillRect(0, 56, W * Math.min(1, slowT / 3), 6);
  }

  if (bigPop){
    var kk = Math.max(0, bigPop.t / bigPop.max);
    var al = Math.min(1, kk * 3);
    var fs = Math.round(44 + (1 - kk) * 16);
    ctx.globalAlpha = al;
    ctx.font = 'bold ' + fs + 'px sans-serif';
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeText(bigPop.text, W / 2, 116);
    ctx.fillStyle = bigPop.color;
    ctx.fillText(bigPop.text, W / 2, 116);
    ctx.globalAlpha = 1;
  }

  if (combo > 0){
    var label = mult > 1 ? ('コンボ ' + combo + '  ×' + mult) : ('コンボ ' + combo);
    ctx.font = 'bold 20px sans-serif';
    var tw = ctx.measureText(label).width;
    var pw = tw + 52, ph = 40;
    var px = W / 2 - pw / 2, py = 690 - ph / 2;
    roundRect(px, py, pw, ph, 20);
    ctx.fillStyle = mult > 1 ? 'rgba(255,213,74,0.95)' : 'rgba(255,255,255,0.85)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(11,61,92,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#0b3d5c';
    ctx.fillText(label, W / 2, 690);
    var frac = Math.max(0, comboT / 0.8);
    roundRect(px + 16, py + ph - 9, (pw - 32) * frac, 4, 2);
    ctx.fillStyle = 'rgba(11,61,92,0.55)';
    ctx.fill();
  } else if (!finished){
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = 'rgba(11,61,92,0.55)';
    ctx.fillText('コインをタップしてあつめよう！', W / 2, 690);
  }
}
/*__VAPPA_JS_END__*/
</script>
