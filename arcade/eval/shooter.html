<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.vp-hud span{background:rgba(8,12,26,.55);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px 12px}
.vp-hud span:empty{display:none}
.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}
.vp-ov h1{font-size:28px}
.vp-ov p{color:#b9c1de;font-size:14.5px;line-height:1.8;max-width:340px;white-space:pre-line}
.vp-ov .vp-big{font-size:44px;font-weight:900;color:#ffd166}
.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
[hidden]{display:none!important}
</style>

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  fireInterval: { v: 0.20, label: '連射間隔(秒)',       min: 0.08, max: 0.6, step: 0.02 },
  bulletSpeed:  { v: 560,  label: '弾の速さ',           min: 300,  max: 900, step: 20 },
  enemySpeed:   { v: 30,   label: '敵の基本速度',       min: 12,   max: 90,  step: 2 },
  waveSpeedUp:  { v: 0.12, label: '波ごとの加速',       min: 0,    max: 0.4, step: 0.02 },
  spawnGap:     { v: 1.70, label: '編隊の出現間隔(秒)', min: 0.6,  max: 3.0, step: 0.1 },
  powerTime:    { v: 8,    label: '3WAYの持続(秒)',     min: 3,    max: 15,  step: 1 },
  lives:        { v: 3,    label: 'ライフ数',           min: 1,    max: 6,   step: 1 },
  bossHp:       { v: 26,   label: 'ボスのHP',           min: 8,    max: 60,  step: 2 }
};

var F_ENEMY = "32px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
var F_BOSS  = "92px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
var F_SHIP  = "44px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
var F_DROP  = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";

var player, bullets, enemies, ebullets, drops, parts, stars, bgGrad;
var lives, score, wave, kills, powerT, invT, fireT, spawnT, shake;
var mode, boss, warnT, tGlobal, waveMsgT, over;

function init(){
  player = { x: W / 2, tx: W / 2, y: H - 80 };
  bullets = []; enemies = []; ebullets = []; drops = []; parts = [];
  lives = TUNE.lives.v; score = 0; wave = 1; kills = 0;
  powerT = 0; invT = 0; fireT = 0.25; spawnT = 1.0; shake = 0;
  mode = 'play'; boss = null; warnT = 0; tGlobal = 0; waveMsgT = 0; over = false;
  stars = [];
  for (var i = 0; i < 80; i++){
    stars.push({ x: Math.random() * W, y: 58 + Math.random() * (H - 60), r: 0.4 + Math.random() * 1.5, s: 6 + Math.random() * 24 });
  }
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#050a20');
  bgGrad.addColorStop(0.5, '#0a1030');
  bgGrad.addColorStop(1, '#160a32');
  Game.score(0);
  Game.hud(hudText());
}

function hudText(){ return '❤️'.repeat(Math.max(0, lives)) + ' W' + wave; }

function clampX(v){ return Math.max(28, Math.min(W - 28, v)); }

function glowEllipse(x, y, rx, ry, color, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.translate(x, y);
  ctx.scale(rx, ry);
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function boom(x, y, color, n){
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 50 + Math.random() * 170;
    var lf = 0.35 + Math.random() * 0.4;
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: lf, max: lf, c: color, r: 1.5 + Math.random() * 2.5 });
  }
  while (parts.length > 240) parts.shift();
}

function shoot(){
  var y = player.y - 24;
  var bs = TUNE.bulletSpeed.v;
  bullets.push({ x: player.x, y: y, vx: 0, vy: -bs });
  if (powerT > 0){
    bullets.push({ x: player.x - 12, y: y + 8, vx: -155, vy: -bs * 0.94 });
    bullets.push({ x: player.x + 12, y: y + 8, vx: 155, vy: -bs * 0.94 });
  }
}

function spawnRow(){
  if (enemies.length > 22) return;
  var n = 3 + Math.min(3, Math.floor((wave - 1) / 2));
  var margin = 54;
  var avail = W - margin * 2;
  var spd = TUNE.enemySpeed.v * (1 + (wave - 1) * TUNE.waveSpeedUp.v);
  var ghostCh = Math.min(0.38, 0.07 * (wave - 1));
  var tankCh = Math.min(0.30, 0.055 * (wave - 1));
  for (var i = 0; i < n; i++){
    var bx = margin + (i + 0.5) * (avail / n) + (Math.random() * 14 - 7);
    var r = Math.random();
    var e = { x: bx, baseX: bx, y: 66 + Math.random() * 10, t: Math.random() * 6, flash: 0 };
    if (r < tankCh){
      e.type = 'tank'; e.hp = 3; e.pts = 30; e.emoji = '🤖'; e.speed = spd * 0.68; e.r = 17;
    } else if (r < tankCh + ghostCh){
      e.type = 'ghost'; e.hp = 1; e.pts = 20; e.emoji = '👻'; e.speed = spd * 1.12; e.r = 15;
      e.amp = 32 + Math.random() * 24; e.freq = 2.2 + Math.random() * 1.4;
    } else {
      e.type = 'grunt'; e.hp = 1; e.pts = 10; e.emoji = '👾'; e.speed = spd; e.r = 15;
    }
    enemies.push(e);
  }
}

function spawnBoss(){
  var lvl = Math.floor(wave / 3);
  if (lvl < 1) lvl = 1;
  var hp = TUNE.bossHp.v + (lvl - 1) * 12;
  boss = { x: W / 2, y: 150, t: 0, lvl: lvl, hp: hp, maxhp: hp,
           vx: 62 + lvl * 14, dir: 1, fireT: 1.6,
           fireGap: Math.max(0.75, 1.8 - lvl * 0.25), hitT: 0 };
  Game.toast('ボス出現！');
}

function damage(x, y){
  if (over || invT > 0) return;
  lives--;
  invT = 1.4;
  shake = 0.35;
  Game.hud(hudText());
  Game.float(x, y, '-1', '#f87171');
  boom(x, y, '#f87171', 10);
  if (lives <= 0){ over = true; Game.over(score); }
}

function killEnemy(idx){
  var e = enemies[idx];
  enemies.splice(idx, 1);
  score += e.pts;
  Game.score(score);
  kills++;
  boom(e.x, e.y, e.pts >= 30 ? '#fbbf24' : (e.pts >= 20 ? '#c4b5fd' : '#67e8f9'), 12);
  Game.float(e.x, e.y, '+' + e.pts, '#fde68a');
  if (Math.random() < 0.11) drops.push({ x: e.x, y: e.y, vy: 95, t: 0 });
  if (mode === 'play' && kills >= 10){
    kills -= 10;
    wave++;
    Game.hud(hudText());
    waveMsgT = 1.5;
    if (wave % 3 === 0){
      mode = 'warning';
      warnT = 2.4;
      spawnT = 0.8;
    }
  }
}

function killBoss(){
  var bx = boss.x, by = boss.y;
  boss = null;
  score += 100;
  Game.score(score);
  for (var i = 0; i < 5; i++){
    boom(bx + (Math.random() * 90 - 45), by + (Math.random() * 70 - 35), '#fbbf24', 16);
  }
  Game.float(bx, by, '+100', '#fde68a');
  shake = 0.5;
  mode = 'play';
  wave++;
  kills = 0;
  Game.hud(hudText());
  waveMsgT = 1.5;
  spawnT = 1.6;
}

function update(dt){
  if (over) return;
  tGlobal += dt;
  if (shake > 0) shake -= dt;
  if (waveMsgT > 0) waveMsgT -= dt;
  if (invT > 0) invT -= dt;
  if (powerT > 0){ powerT -= dt; if (powerT < 0) powerT = 0; }

  var i, j, e, b, p;

  for (i = 0; i < stars.length; i++){
    var st = stars[i];
    st.y += st.s * dt;
    if (st.y > H) { st.y = 58; st.x = Math.random() * W; }
  }

  player.x += (player.tx - player.x) * Math.min(1, dt * 18);
  if (player.x < 28) player.x = 28;
  if (player.x > W - 28) player.x = W - 28;

  fireT -= dt;
  if (fireT <= 0){ fireT = TUNE.fireInterval.v; shoot(); }

  if (mode === 'warning'){
    warnT -= dt;
    if (warnT <= 0){ spawnBoss(); mode = 'boss'; }
  } else if (mode === 'play'){
    spawnT -= dt;
    if (spawnT <= 0){
      spawnRow();
      spawnT = Math.max(0.55, TUNE.spawnGap.v - (wave - 1) * 0.1);
    }
  }

  if (boss){
    boss.t += dt;
    boss.x += boss.vx * boss.dir * dt;
    if (boss.x > W - 76){ boss.x = W - 76; boss.dir = -1; }
    if (boss.x < 76){ boss.x = 76; boss.dir = 1; }
    boss.y = 150 + Math.sin(boss.t * 1.6) * 16;
    if (boss.hitT > 0) boss.hitT -= dt;
    boss.fireT -= dt;
    if (boss.fireT <= 0){
      boss.fireT = boss.fireGap;
      var sp = 190 + boss.lvl * 28;
      var n = boss.lvl >= 2 ? 3 : 1;
      var baseA = Math.atan2(player.y - (boss.y + 24), player.x - boss.x);
      for (var k = 0; k < n; k++){
        var a = baseA + (k - (n - 1) / 2) * 0.30;
        ebullets.push({ x: boss.x + (k - (n - 1) / 2) * 28, y: boss.y + 30,
                        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
      }
    }
  }

  for (i = bullets.length - 1; i >= 0; i--){
    b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < 40 || b.x < -20 || b.x > W + 20){ bullets.splice(i, 1); continue; }
    var hit = false;
    for (j = enemies.length - 1; j >= 0; j--){
      e = enemies[j];
      var dx = b.x - e.x, dy = b.y - e.y;
      var rr = e.r + 5;
      if (dx * dx + dy * dy < rr * rr){
        hit = true;
        e.hp--;
        boom(b.x, b.y - 4, '#67e8f9', 4);
        if (e.hp <= 0) killEnemy(j);
        else e.flash = 0.12;
        break;
      }
    }
    if (!hit && boss && Math.abs(b.x - boss.x) < 60 && Math.abs(b.y - boss.y) < 46){
      hit = true;
      boss.hp--;
      boss.hitT = 0.12;
      boom(b.x, b.y, '#fda4af', 4);
      if (boss.hp <= 0) killBoss();
    }
    if (hit) bullets.splice(i, 1);
  }

  for (i = enemies.length - 1; i >= 0; i--){
    e = enemies[i];
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    e.y += e.speed * dt;
    if (e.type === 'ghost'){
      e.x = e.baseX + Math.sin(e.t * e.freq) * e.amp;
      if (e.x < 26) e.x = 26;
      if (e.x > W - 26) e.x = W - 26;
    }
    if (Math.abs(e.x - player.x) < 26 && Math.abs(e.y - player.y) < 26){
      enemies.splice(i, 1);
      boom(e.x, e.y, '#f87171', 12);
      damage(player.x, player.y - 22);
      if (over) return;
      continue;
    }
    if (e.y > 704){
      enemies.splice(i, 1);
      damage(e.x, 690);
      if (over) return;
      continue;
    }
  }

  for (i = ebullets.length - 1; i >= 0; i--){
    var eb = ebullets[i];
    eb.x += eb.vx * dt;
    eb.y += eb.vy * dt;
    if (eb.y > 708 || eb.x < -30 || eb.x > W + 30){ ebullets.splice(i, 1); continue; }
    if (Math.abs(eb.x - player.x) < 24 && Math.abs(eb.y - player.y) < 26){
      ebullets.splice(i, 1);
      damage(player.x, player.y - 20);
      if (over) return;
    }
  }

  for (i = drops.length - 1; i >= 0; i--){
    var d = drops[i];
    d.t += dt;
    d.y += d.vy * dt;
    d.x += Math.sin(d.t * 5) * 34 * dt;
    if (Math.abs(d.x - player.x) < 30 && Math.abs(d.y - player.y) < 32){
      drops.splice(i, 1);
      powerT = TUNE.powerTime.v;
      Game.float(player.x, player.y - 34, '3WAY!', '#22d3ee');
      boom(player.x, player.y, '#22d3ee', 12);
      continue;
    }
    if (d.y > 706) drops.splice(i, 1);
  }

  for (i = parts.length - 1; i >= 0; i--){
    p = parts[i];
    p.life -= dt;
    if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (1 - 1.8 * dt);
    p.vy *= (1 - 1.8 * dt);
  }
}

function draw(){
  ctx.fillStyle = bgGrad || '#070c22';
  ctx.fillRect(0, 0, W, H);

  var i;
  for (i = 0; i < stars.length; i++){
    var st = stars[i];
    ctx.globalAlpha = 0.18 + st.r * 0.45;
    ctx.fillStyle = '#c7d2fe';
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 56, W, H - 56);
  ctx.clip();
  var ox = shake > 0 ? (Math.random() * 8 - 4) : 0;
  var oy = shake > 0 ? (Math.random() * 6 - 3) : 0;
  ctx.translate(ox, oy);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = F_DROP;
  for (i = 0; i < drops.length; i++){
    var d = drops[i];
    var pulse = 15 + 3 * Math.sin(tGlobal * 10);
    glowEllipse(d.x, d.y, pulse, pulse, '#22d3ee', 0.28);
    ctx.fillText('🔋', d.x, d.y);
  }

  ctx.font = F_ENEMY;
  for (i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if (e.flash > 0) glowEllipse(e.x, e.y, e.r + 8, e.r + 8, '#ffffff', 0.4);
    if (e.type === 'tank') glowEllipse(e.x, e.y, 22, 22, '#fbbf24', 0.16);
    if (e.type === 'ghost') glowEllipse(e.x, e.y, 20, 20, '#a78bfa', 0.16);
    ctx.fillText(e.emoji, e.x, e.y);
  }

  if (boss){
    if (boss.hitT > 0) glowEllipse(boss.x, boss.y, 72, 62, '#ffffff', 0.45);
    glowEllipse(boss.x, boss.y + 10, 64, 46, '#7c3aed', 0.28);
    ctx.font = F_BOSS;
    ctx.fillText('🐲', boss.x, boss.y);

    var bw = 260, bh = 12, bx0 = (W - bw) / 2, by0 = 62;
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(bx0, by0, bw, bh);
    var ratio = Math.max(0, boss.hp / boss.maxhp);
    ctx.fillStyle = '#f43f5e';
    ctx.fillRect(bx0, by0, bw * ratio, bh);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx0, by0, bw, bh);
  }

  for (i = 0; i < bullets.length; i++){
    var b = bullets[i];
    glowEllipse(b.x, b.y, 5, 11, '#22d3ee', 0.35);
    glowEllipse(b.x, b.y, 2.4, 7, '#e0fbff', 1);
  }

  for (i = 0; i < ebullets.length; i++){
    var eb = ebullets[i];
    glowEllipse(eb.x, eb.y, 9, 9, '#f43f5e', 0.32);
    glowEllipse(eb.x, eb.y, 4, 4, '#fecdd3', 1);
  }

  if (powerT > 0){
    ctx.strokeStyle = 'rgba(34,211,238,' + (0.45 + 0.3 * Math.sin(tGlobal * 10)) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 27, 0, Math.PI * 2);
    ctx.stroke();
  }
  glowEllipse(player.x, player.y + 20, 11 + Math.random() * 4, 15, '#38bdf8', 0.5);
  var blink = invT > 0 && Math.sin(tGlobal * 30) < 0;
  ctx.globalAlpha = blink ? 0.35 : 1;
  ctx.font = F_SHIP;
  ctx.fillText('🛸', player.x, player.y);
  ctx.globalAlpha = 1;

  for (i = 0; i < parts.length; i++){
    var p = parts[i];
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  if (mode === 'warning'){
    ctx.save();
    ctx.globalAlpha = 0.08 + 0.07 * Math.sin(tGlobal * 10);
    ctx.fillStyle = '#f43f5e';
    ctx.fillRect(0, 56, W, H - 56);
    ctx.restore();
    if (Math.sin(tGlobal * 16) > -0.3){
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 42px sans-serif';
      ctx.fillStyle = '#f43f5e';
      ctx.fillText('WARNING', W / 2, 330);
      ctx.restore();
    }
  }

  if (waveMsgT > 0){
    ctx.save();
    ctx.globalAlpha = Math.min(1, waveMsgT / 0.5);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillStyle = '#67e8f9';
    ctx.fillText('WAVE +1', W / 2, 410);
    ctx.restore();
  }
}

function onDown(x, y, id){ player.tx = clampX(x); }
function onMove(x, y, id){ player.tx = clampX(x); }
function onUp(x, y, id){}

/*__VAPPA_JS_END__*/
</script>
