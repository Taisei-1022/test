<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Vappa 運営管理</title>
<style>
  :root{--bg:#141221;--ink:#f1eefb;--dim:#9a93b5;--rule:#2c2740;--plate:#1d1a2e;--accent:#8b5cf6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;font-size:14px}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 48px}
  h1{font-size:20px;margin:0 0 4px} h2{font-size:15px;margin:22px 0 8px;color:var(--dim);letter-spacing:.04em}
  .sub{color:var(--dim);font-size:12.5px;line-height:1.6;margin:0 0 14px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .tile{background:var(--plate);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
  .tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums} .tile span{font-size:11.5px;color:var(--dim)}
  .tile.alert b{color:var(--bad)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--plate);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-bottom:6px}
  .row .nm{flex:1 1 220px;min-width:0} .row .nm b{display:block;overflow-wrap:anywhere} .row .nm small{color:var(--dim);font-size:11.5px}
  .pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:4px}
  .p-hidden{background:rgba(248,113,113,.15);color:var(--bad)} .p-draft{background:rgba(251,191,36,.14);color:var(--warn)} .p-user{background:rgba(52,211,153,.13);color:var(--ok)}
  button,a.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:.45rem .75rem;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;text-decoration:none;white-space:nowrap}
  button.sec,a.btn.sec{background:transparent;border:1px solid #3a3460;color:#cdbcff}
  button.bad{background:#b4413a}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #cdbcff;outline-offset:2px}
  .rep{font-size:12.5px;color:var(--ink);margin-top:6px;padding-top:6px;border-top:1px dashed var(--rule);width:100%}
  .rep div{margin:2px 0} .rep small{color:var(--dim)}
  .login{background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:18px;max-width:360px}
  input{width:100%;background:var(--bg);border:1px solid var(--rule);color:#fff;border-radius:10px;padding:.65rem .7rem;font:inherit;margin:8px 0}
  .empty{color:var(--dim);font-size:13px;padding:6px 2px}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #err{color:var(--bad);font-size:12.5px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>運営管理</h1>
  <p class="sub">通報の確認、作品の非表示・再表示、作成数の確認ができます。運営専用ページで、アプリからはリンクしていません。</p>

  <div id="loginView" class="login">
    <b>パスワード</b>
    <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" />
    <div id="err"></div>
    <button id="pwGo" type="button">開く</button>
  </div>

  <div id="mainView" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="links">
      <button class="sec" id="reload" type="button">更新</button>
      <a class="btn sec" href="admin.html">賑わい演出（サクラのスコア）</a>
      <a class="btn sec" href="eval/">生成品質チェック</a>
      <button class="sec" id="logout" type="button">閉じる（パスワードを忘れる）</button>
    </div>
    <h2 id="repHead">未対応の通報</h2>
    <div id="reports"></div>
    <h2>新しい作品（最新40件）</h2>
    <div id="recent"></div>
  </div>
</div>
<script src="js/config.js?v=6"></script>
<script>
(function () {
  "use strict";
  var cfg = window.ARCADE_CONFIG || {};
  var url = cfg.supabaseUrl.replace(/\/$/, "") + "/functions/v1/generate";
  var KEY = "vappa.manage.pw";
  var pass = "";
  try { pass = sessionStorage.getItem(KEY) || ""; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function when(t) { var d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }

  function call(op, id) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: cfg.supabaseKey, Authorization: "Bearer " + cfg.supabaseKey },
      body: JSON.stringify({ panel: { pass: pass, op: op || "summary", id: id || "" } })
    }).then(function (r) { return r.json(); });
  }
  function showLogin(msg) { $("mainView").hidden = true; $("loginView").hidden = false; $("err").textContent = msg || ""; }

  function load() {
    return call("summary").then(function (d) {
      if (d.error === "bad_password") { try { sessionStorage.removeItem(KEY); } catch (e) {} showLogin(pass ? "パスワードが違います" : ""); return; }
      if (d.error === "rate_limited") { showLogin("失敗が多すぎます。明日もう一度試してください"); return; }
      if (!d.ok) { showLogin("読み込めませんでした（" + esc(d.error || "") + "）"); return; }
      try { sessionStorage.setItem(KEY, pass); } catch (e) {}
      $("loginView").hidden = true; $("mainView").hidden = false;
      render(d);
    }).catch(function () { showLogin("通信できませんでした"); });
  }

  function render(d) {
    var s = d.stats;
    var tiles = [
      [s.openReports, "未対応の通報", s.openReports > 0],
      [s.published, "公開中の作品"],
      [s.total, "作品の総数（下書き含む）"],
      [s.hidden, "非表示の作品", s.hidden > 0],
      [s.withUser, "ログインして作られた作品"],
      [s.buildsToday + " / " + s.buildLimit, "今日の生成数 / 全体上限"],
      [s.requestsToday, "今日のAIへの依頼（相談含む）"],
      [d.login_required ? "必須" : "不要", "作る時のログイン"]
    ];
    $("tiles").innerHTML = tiles.map(function (t) { return '<div class="tile' + (t[2] ? " alert" : "") + '"><b>' + esc(t[0]) + "</b><span>" + esc(t[1]) + "</span></div>"; }).join("");

    // 通報：作品ごとにまとめる
    var by = {};
    d.reports.forEach(function (r) { (by[r.game_id] = by[r.game_id] || []).push(r); });
    var ids = Object.keys(by).sort(function (a, b) { return by[b].length - by[a].length; });
    $("repHead").textContent = "未対応の通報（" + ids.length + "作品・" + d.reports.length + "件。" + d.hideAt + "人から届くと自動で非表示）";
    $("reports").innerHTML = ids.length ? ids.map(function (gid) {
      var g = d.titles[gid] || { title: "（削除済み or 公式ゲーム）", hidden: false };
      return '<div class="row"><div class="nm"><b>' + (g.hidden ? '<span class="pill p-hidden">非表示中</span>' : "") + esc(g.title) + "</b><small>" + esc(gid) + "</small></div>" +
        '<a class="btn sec" href="play.html?game=' + encodeURIComponent(gid) + '" target="_blank" rel="noopener">遊んで確認</a>' +
        (g.hidden ? '<button data-op="unhide" data-id="' + esc(gid) + '">問題なし（再表示）</button>' : '<button class="bad" data-op="hide" data-id="' + esc(gid) + '">非表示にする</button>') +
        '<button class="sec" data-op="resolve" data-id="' + esc(gid) + '">対応済みにする</button>' +
        '<div class="rep">' + by[gid].map(function (r) { return "<div>・" + esc(r.reason) + (r.detail ? "：" + esc(r.detail) : "") + " <small>" + when(r.created_at) + "</small></div>"; }).join("") + "</div></div>";
    }).join("") : '<div class="empty">未対応の通報はありません。</div>';

    $("recent").innerHTML = d.recent.map(function (g) {
      return '<div class="row"><div class="nm"><b>' +
        (g.hidden ? '<span class="pill p-hidden">非表示</span>' : "") + (g.published === false ? '<span class="pill p-draft">下書き</span>' : "") +
        (g.user_id ? '<span class="pill p-user">ログイン</span>' : "") + esc(g.title) + "</b><small>" + esc(g.author) + "・" + when(g.created_at) + "</small></div>" +
        '<a class="btn sec" href="play.html?game=' + encodeURIComponent(g.id) + '" target="_blank" rel="noopener">遊ぶ</a>' +
        (g.hidden ? '<button data-op="unhide" data-id="' + esc(g.id) + '">再表示</button>' : '<button class="sec" data-op="hide" data-id="' + esc(g.id) + '">非表示</button>') + "</div>";
    }).join("") || '<div class="empty">まだ作品がありません。</div>';
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button[data-op]"); if (!b) return;
    b.disabled = true;
    call(b.getAttribute("data-op"), b.getAttribute("data-id")).then(load, load);
  });
  $("pwGo").addEventListener("click", function () { pass = $("pw").value; load(); });
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") { pass = $("pw").value; load(); } });
  $("reload").addEventListener("click", load);
  $("logout").addEventListener("click", function () { pass = ""; try { sessionStorage.removeItem(KEY); } catch (e) {} $("pw").value = ""; showLogin(); });
  if (pass) load(); else showLogin();
})();
</script>
</body>
</html>
