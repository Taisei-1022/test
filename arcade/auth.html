<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>ログイン中… | Vappa</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141221;color:#f1eefb;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  p{line-height:1.8;font-size:15px} a{color:#cdbcff}
</style>
</head>
<body>
<p id="msg">ログインしています…</p>
<script src="js/config.js?v=7"></script>
<script src="js/catalog.js?v=15"></script>
<script src="js/auth.js?v=4"></script>
<script>
Auth.handleCallback().then(function (r) {
  if (r.ok) { location.replace(r.ret); return; }
  document.getElementById("msg").innerHTML = "ログインできませんでした。<br><small>" + String(r.error).replace(/[<>&]/g, "") + "</small><br><br><a href=\"./#create\">もどる</a>";
}).catch(function (e) {
  document.getElementById("msg").innerHTML = "ログインできませんでした。<br><small>" + String(e && e.message || e).replace(/[<>&]/g, "") + "</small><br><br><a href=\"./#create\">もどる</a>";
});
</script>
</body>
</html>
