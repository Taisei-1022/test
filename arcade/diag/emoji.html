<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>絵文字canvas診断</title>
<style>
body{margin:0;padding:16px;background:#141221;color:#f1eefb;font-family:system-ui,sans-serif}
h1{font-size:16px;margin:0 0 4px}
#sum{font-size:15px;font-weight:900;background:#1d1a2e;border:1px solid #2c2740;border-radius:10px;padding:10px;margin:10px 0;line-height:1.9;word-break:break-all}
.row{display:flex;align-items:center;gap:10px;background:#1d1a2e;border:1px solid #2c2740;border-radius:10px;padding:8px;margin-bottom:8px}
.row canvas,.row .dom{width:80px;height:48px;background:#2a5a7c;border-radius:6px;flex:none}
.dom{display:flex;align-items:center;justify-content:center;font-size:34px}
.lbl{font-size:11.5px;line-height:1.5;color:#9a93b5;min-width:0}
.lbl b{color:#f1eefb;font-size:12.5px}
.v{font-weight:900;font-size:18px;margin-left:auto;flex:none}
.ok{color:#34d399}.ng{color:#f87171}
#env{font-size:10.5px;color:#9a93b5;margin-top:12px;word-break:break-all;line-height:1.6}
</style></head><body>
<h1>🔬 絵文字canvas診断</h1>
<div id="sum">計測中…</div>
<div id="rows"></div>
<div class="row"><div class="dom">🚢</div><div class="lbl"><b>0. DOM絵文字（参照）</b><br>HTMLとして表示</div><div class="v ok">—</div></div>
<div id="env"></div>
<script>
(function(){
var TPL="40px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
var tests=[
 {n:"1. テンプレのfont行 そのまま", f:TPL, t:"🚢"},
 {n:"2. テンプレfont行＋変換/クリップ（実機ランタイム再現）", f:TPL, t:"🚢", xform:true},
 {n:"3. font指定なし（既定10px）", f:null, t:"🚢"},
 {n:"4. 40px sans-serif（一般名のみ）", f:"40px sans-serif", t:"🚢"},
 {n:"5. 40px system-ui", f:"40px system-ui", t:"🚢"},
 {n:"6. 40px 'Apple Color Emoji' 単独", f:"40px 'Apple Color Emoji'", t:"🚢"},
 {n:"7. テンプレfont行で普通の文字", f:TPL, t:"AB"}
];
var DPR=Math.min(window.devicePixelRatio||1,3);
var rows=document.getElementById("rows");
var res=[];
tests.forEach(function(ts,i){
  var row=document.createElement("div");row.className="row";
  var cv=document.createElement("canvas");
  cv.width=80*DPR;cv.height=48*DPR;
  var lbl=document.createElement("div");lbl.className="lbl";
  var v=document.createElement("div");v.className="v";
  row.appendChild(cv);row.appendChild(lbl);row.appendChild(v);rows.appendChild(row);
  var ctx=cv.getContext("2d");
  var fontBack="(未設定)";
  try{
    if(ts.xform){
      var sc=0.75; // プレビュー相当の縮小
      ctx.setTransform(DPR*sc,0,0,DPR*sc,0,0);
      ctx.beginPath();ctx.rect(0,0,80/sc,48/sc);ctx.clip();
      if(ts.f)ctx.font=ts.f;
      fontBack=ctx.font;
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(ts.t,40/sc,24/sc);
    }else{
      ctx.setTransform(DPR,0,0,DPR,0,0);
      if(ts.f)ctx.font=ts.f;
      fontBack=ctx.font;
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(ts.t,40,24);
    }
  }catch(e){fontBack="ERR:"+e.message;}
  var drawn=false;
  try{
    var d=ctx.getImageData(0,0,cv.width,cv.height).data,n=0;
    for(var p=3;p<d.length;p+=4){if(d[p]>16){n++;if(n>30){drawn=true;break;}}}
  }catch(e){}
  v.textContent=drawn?"✓":"✗";v.className="v "+(drawn?"ok":"ng");
  lbl.innerHTML="<b>"+ts.n+"</b><br>font読み戻し: "+fontBack;
  res.push((i+1)+(drawn?"✓":"✗"));
});
document.getElementById("sum").textContent="結果: "+res.join("  ")+"  （このまま画面ごとスクショして送ってください）";
document.getElementById("env").textContent="UA: "+navigator.userAgent+" / DPR: "+(window.devicePixelRatio||1);
})();
</script>
</body></html>
