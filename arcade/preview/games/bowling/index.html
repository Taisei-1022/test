<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
<title>へんてこボウリング</title>
<link rel="icon" href="data:," />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;background:#17122b;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";color:#fff;touch-action:none;overscroll-behavior:none;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #sheet{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:0;right:0;margin:0 auto;max-width:520px;padding:0 8px;display:flex;gap:3px;z-index:3;pointer-events:none;}
  .fr{flex:1 1 0;min-width:0;background:#fffaf0;color:#2a1a3a;border-radius:9px;overflow:hidden;border:2px solid #2a1a3a;display:flex;flex-direction:column;box-shadow:0 3px 0 rgba(0,0,0,.3);}
  .fr.last{flex:1.32 1 0;}
  .fr.tot{flex:1.08 1 0;background:#ffd166;}
  .fr .no{font-size:10.5px;font-weight:900;background:#2a1a3a;color:#ffe9c4;text-align:center;line-height:16px;white-space:nowrap;overflow:hidden;}
  .fr.cur .no{background:#ff4d8d;color:#fff;}
  .fr.cur{border-color:#ff4d8d;}
  .fr .mk{display:flex;justify-content:flex-end;height:18px;}
  .fr .mk span{width:18px;flex:0 0 18px;border-left:1.5px solid #c9b9a6;border-bottom:1.5px solid #c9b9a6;font-size:12.5px;font-weight:900;text-align:center;line-height:17px;}
  .fr .mk span.x{color:#e5244f;} .fr .mk span.s{color:#1f7ae0;} .fr .mk span.g{color:#9a7b5f;}
  .fr .cum{font-size:15px;font-weight:900;text-align:center;line-height:20px;height:20px;}
  .fr.tot .cum{font-size:21px;line-height:38px;height:38px;}
  #lp{position:fixed;top:calc(env(safe-area-inset-top) + 74px);left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;
    background:rgba(20,12,36,.78);border:1.5px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 14px;font-weight:800;font-size:13px;white-space:nowrap;color:#ffe9c4;}
  #lp b{color:#ffd166;}
  #banner{position:fixed;left:18px;right:18px;top:42%;z-index:4;pointer-events:none;text-align:center;
    background:linear-gradient(180deg,#fffaf0,#ffe9c4);color:#2a1a3a;border:3px solid #2a1a3a;border-radius:20px;padding:14px 12px 13px;
    box-shadow:0 7px 0 rgba(0,0,0,.35);opacity:0;transform:translateY(-50%) scale(.6) rotate(-3deg);transition:opacity .22s,transform .3s cubic-bezier(.3,1.6,.5,1);}
  #banner.on{opacity:1;transform:translateY(-50%) scale(1) rotate(0deg);}
  #banner .be{font-size:40px;line-height:1.1;}
  #banner .bt{font-size:21px;font-weight:900;margin:4px 0 6px;letter-spacing:.02em;}
  #banner .bs{font-size:13.5px;font-weight:800;color:#7a4a2a;line-height:1.6;}
  #banner .tap{font-size:11px;color:#a08670;margin-top:6px;font-weight:800;}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
     background:rgba(16,10,30,.86);text-align:center;padding:24px;z-index:6;}
  #ov h1{font-size:30px;font-weight:900;letter-spacing:.04em;}
  #ov .emo{font-size:56px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4));}
  #ov p{color:#e6dcf2;font-size:14px;line-height:1.75;max-width:340px;}
  #ov p b{color:#ffd166;}
  #ov .rules{background:rgba(255,209,102,.1);border:1.5px solid rgba(255,209,102,.5);border-radius:14px;padding:9px 14px;color:#ffe9bf;font-size:13.5px;text-align:left;line-height:1.8;}
  #ov .big{font-size:52px;font-weight:900;color:#ffcf5c;line-height:1;}
  #ov .sub{font-size:15px;color:#f3e6ff;font-weight:800;}
  #ov .stats{font-size:13.5px;color:#e8d8f0;line-height:1.8;background:rgba(255,255,255,.07);border-radius:12px;padding:8px 16px;}
  #ov button{background:#ffb02e;color:#3a2400;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 5px 0 #c47a0b;}
  #ov button:active{transform:translateY(2px);box-shadow:0 3px 0 #c47a0b;}
  #ov[hidden]{display:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sheet"></div>
<div id="lp"></div>
<div id="banner"></div>
<div id="ov">
  <div class="emo">🎳🌀</div>
  <h1>へんてこボウリング</h1>
  <p><b>指で左右に動かして、上にスワイプで投げる！</b><br>速くはじくと速いボール。<br>カーブを描くとボールも曲がるよ。</p>
  <div class="rules">
    🎳 1F：ふつうのレーン（練習）<br>
    ⛰️ 2F：でこぼこ坂レーン<br>
    🧊 3F：つるつる氷レーン<br>
    ↪️ 4F：くねくね曲がり道<br>
    🔄 5F：ベルトコンベア床<br>
    全5フレーム・最高150点！
  </div>
  <button id="startBtn">はじめる</button>
</div>
<script src="../../js/arcade-sdk.js?v=2"></script>
<script>
(function(){
  "use strict";

  /* ===== 物理（レーン・ボール・ピン） ===== */
  var PHYS=(function(){
    var C={LHW:52.5,KICK:62,DECK:470,PIT:652,END:680,START:-40,BR:11,BM:7,PR:6,PRF:8.5,PM:1.6,HEAD:520,HOOK:170};
    var SPOTS=[];
    for(var r=0;r<4;r++)for(var i=0;i<=r;i++)SPOTS.push({x:(i-r/2)*30.5,y:C.HEAD+r*26.4});
    function sm(v,a,b){var t=(v-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);}
    function laneDef(idx,v){
      var L={idx:idx,v:v,walls:[],gutter:true,hill:null,ice:null,belts:null,chains:null};
      function chain(pts){var out=[];for(var i=0;i<pts.length;i++)out.push({x:pts[i][0]*v,y:pts[i][1]});
        for(i=0;i<out.length-1;i++)L.walls.push({ax:out[i].x,ay:out[i].y,bx:out[i+1].x,by:out[i+1].y});return out;}
      if(idx===3){
        L.gutter=false;
        L.chains=[chain([[-60,C.START],[-60,C.END+30]]),chain([[60,C.START],[60,160],[-4,245],[-4,325],[60,410],[60,C.END+30]])];
      }else{
        L.walls.push({ax:-C.KICK,ay:C.DECK,bx:-C.KICK,by:C.END+30});
        L.walls.push({ax:C.KICK,ay:C.DECK,bx:C.KICK,by:C.END+30});
      }
      if(idx===1)L.hill={x:12*v,y:300,s:36,k:360};
      if(idx===2)L.ice={y0:170,y1:C.END+60};
      if(idx===4){L.belts=[{y0:130,y1:185,d:v},{y0:245,y1:300,d:-v},{y0:360,y1:415,d:v}];L.beltSpeed=150;}
      return L;
    }
    function Sim(idx,v){
      this.L=laneDef(idx,v);this.t=0;this.ball=null;this.ev=[];this.pins=[];
      for(var i=0;i<10;i++)this.pins.push({n:i,sx:SPOTS[i].x,sy:SPOTS[i].y,x:SPOTS[i].x,y:SPOTS[i].y,vx:0,vy:0,z:0,vz:0,a:0,av:0,fallen:false,out:false,on:true});
    }
    Sim.prototype.setStanding=function(mask){
      for(var i=0;i<10;i++){var p=this.pins[i];p.on=!!mask[i];p.x=p.sx;p.y=p.sy;p.vx=p.vy=p.z=p.vz=p.av=0;p.a=0;p.fallen=false;p.out=false;}
    };
    Sim.prototype.standingMask=function(){var m=[];for(var i=0;i<10;i++){var p=this.pins[i];m.push(p.on&&!p.fallen&&!p.out);}return m;};
    Sim.prototype.knocked=function(){var n=0;for(var i=0;i<10;i++){var p=this.pins[i];if(p.on&&(p.fallen||p.out))n++;}return n;};
    Sim.prototype.throwBall=function(x0,ang,spd,spin){
      this.ball={x:x0,y:0,vx:spd*Math.sin(ang),vy:spd*Math.cos(ang),spin:spin,gutter:0,done:false,roll:0,hit:false};
      this.t=0;
    };
    Sim.prototype.onIce=function(y){var I=this.L.ice;return !!I&&y>I.y0&&y<I.y1;};
    function fall(p,imp,tang){
      if(p.fallen)return;
      p.fallen=true;p.vz=Math.min(330,40+imp*0.5);p.a=Math.atan2(p.vy,p.vx)||0;p.av=(tang>=0?1:-1)*Math.min(14,2+imp*0.03);
    }
    function circ(a,ra,ma,b,rb,mb,e){
      var dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,R=ra+rb;
      if(d2>=R*R||d2<1e-9)return null;
      var d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ia=1/ma,ib=1/mb,pen=R-d,s=ia+ib;
      a.x-=nx*pen*ia/s;a.y-=ny*pen*ia/s;b.x+=nx*pen*ib/s;b.y+=ny*pen*ib/s;
      var rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
      if(vn>=0)return {imp:0,t:0};
      var j=-(1+e)*vn/s;
      a.vx-=j*ia*nx;a.vy-=j*ia*ny;b.vx+=j*ib*nx;b.vy+=j*ib*ny;
      return {imp:-vn,t:rvx*ny-rvy*nx};
    }
    function wallHit(o,r,w,e){
      var ex=w.bx-w.ax,ey=w.by-w.ay,L2=ex*ex+ey*ey,t=((o.x-w.ax)*ex+(o.y-w.ay)*ey)/L2;
      t=t<0?0:t>1?1:t;
      var cx=w.ax+ex*t,cy=w.ay+ey*t,dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
      if(d2>=r*r)return 0;
      var d=Math.sqrt(d2)||1e-6,nx=dx/d,ny=dy/d;
      o.x=cx+nx*r;o.y=cy+ny*r;
      var vn=o.vx*nx+o.vy*ny;
      if(vn<0){o.vx-=(1+e)*vn*nx;o.vy-=(1+e)*vn*ny;return -vn;}
      return 0;
    }
    Sim.prototype.step=function(dt){
      var b=this.ball,L=this.L,pins=this.pins,i,j,p,q,res;
      this.t+=dt;
      if(b&&!b.done){
        var sp=Math.hypot(b.vx,b.vy),ice=this.onIce(b.y);
        if(!b.gutter){
          var ax=0,ay=0;
          if(!ice&&sp>1){var h=b.spin*C.HOOK*sm(b.y,90,400);ax+=h*b.vy/sp;ay-=h*b.vx/sp;}
          if(L.hill){var dx=b.x-L.hill.x,dy=b.y-L.hill.y,s=L.hill.s,k=L.hill.k*Math.exp(-(dx*dx+dy*dy)/(2*s*s))/s;ax+=dx*k;ay+=dy*k;}
          if(L.belts)for(i=0;i<L.belts.length;i++){var B=L.belts[i];if(b.y>=B.y0&&b.y<=B.y1)ax+=4*(B.d*L.beltSpeed-b.vx);}
          b.vx+=ax*dt;b.vy+=ay*dt;
          var mu=ice?0.01:0.05;b.vx*=1-mu*dt;b.vy*=1-mu*dt;
        }
        b.x+=b.vx*dt;b.y+=b.vy*dt;b.roll+=sp*dt/C.BR;
        if(L.gutter&&!b.gutter&&b.y<C.DECK&&Math.abs(b.x)>C.LHW){
          b.gutter=b.x>0?1:-1;b.vx=0;b.vy=Math.max(130,Math.min(b.vy*0.55,200));this.ev.push({k:"gutter"});
        }
        if(b.gutter){b.x+=(b.gutter*(C.LHW+4.5)-b.x)*Math.min(1,dt*10);b.vx=0;}
        else{
          for(i=0;i<L.walls.length;i++){var wi=wallHit(b,C.BR,L.walls[i],0.72);if(wi>30)this.ev.push({k:"wall",s:wi});}
          for(i=0;i<10;i++){p=pins[i];if(!p.on||p.out)continue;
            res=circ(b,C.BR,C.BM,p,p.fallen?C.PRF:C.PR,C.PM,0.55);
            if(res&&res.imp>0){b.hit=true;this.ev.push({k:"pin",s:res.imp});if(res.imp>10)fall(p,res.imp,res.t);}
          }
        }
        if(b.y>C.PIT+16||b.y<C.START-30||sp<4)b.done=true;
      }
      for(i=0;i<10;i++){p=pins[i];if(!p.on||p.out&&p.y>C.PIT+40)continue;
        var ps=Math.hypot(p.vx,p.vy);
        if(ps>0){var f=(this.onIce(p.y)?45:260)*dt;if(ps<=f){p.vx=0;p.vy=0;}else{p.vx*=1-f/ps;p.vy*=1-f/ps;}}
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.av*dt;p.av*=1-1.5*dt;
        if(p.z>0||p.vz>0){p.vz-=980*dt;p.z+=p.vz*dt;if(p.z<0){p.z=0;p.vz=Math.abs(p.vz)>60?-p.vz*0.3:0;}}
        if(p.out)continue;
        if(!p.fallen&&Math.hypot(p.x-p.sx,p.y-p.sy)>4)fall(p,20,1);
        if(p.y>C.PIT){p.out=true;p.fallen=true;this.ev.push({k:"pit"});}
        else if(L.gutter&&p.y<C.DECK&&Math.abs(p.x)>C.LHW+3){p.out=true;p.fallen=true;}
      }
      for(i=0;i<10;i++){p=pins[i];if(!p.on||p.out)continue;
        for(j=i+1;j<10;j++){q=pins[j];if(!q.on||q.out)continue;
          res=circ(p,p.fallen?C.PRF:C.PR,C.PM,q,q.fallen?C.PRF:C.PR,C.PM,0.6);
          if(res&&res.imp>0){if(res.imp>6)this.ev.push({k:"pp",s:res.imp});if(res.imp>10){fall(p,res.imp*0.8,-res.t);fall(q,res.imp*0.8,res.t);}}
        }
        for(j=0;j<L.walls.length;j++)wallHit(p,p.fallen?C.PRF:C.PR,L.walls[j],0.55);
      }
    };
    Sim.prototype.pinSpeed=function(){var m=0;for(var i=0;i<10;i++){var p=this.pins[i];if(!p.on||p.out)continue;m=Math.max(m,Math.hypot(p.vx,p.vy));}return m;};
    Sim.prototype.settled=function(){var b=this.ball;return !!b&&b.done&&this.pinSpeed()<3;};
    function clampX(x){return Math.max(-(C.LHW-C.BR-1),Math.min(C.LHW-C.BR-1,x));}
    return {C:C,SPOTS:SPOTS,Sim:Sim,clampX:clampX};
  })();
  /* ===== 物理ここまで ===== */

  /* ===== スコア計算 ===== */
  function scoreGame(rolls,N){
    var frames=[],i=0,cum=0,blocked=false;
    function mk(n){return n===0?"-":String(n);}
    for(var f=0;f<N;f++){
      var fr={ri:[],marks:[],cum:null};
      if(f<N-1){
        if(i<rolls.length){
          if(rolls[i]===10){fr.ri=[i];fr.marks=["X"];
            if(i+2<rolls.length&&!blocked){cum+=10+rolls[i+1]+rolls[i+2];fr.cum=cum;}else blocked=true;i+=1;}
          else{fr.ri=[i];fr.marks=[mk(rolls[i])];
            if(i+1<rolls.length){var a=rolls[i],b=rolls[i+1];fr.ri.push(i+1);fr.marks.push(a+b===10?"/":mk(b));
              if(a+b===10){if(i+2<rolls.length&&!blocked){cum+=10+rolls[i+2];fr.cum=cum;}else blocked=true;}
              else if(!blocked){cum+=a+b;fr.cum=cum;}
              i+=2;}
            else{blocked=true;i+=1;}}
        }else blocked=true;
      }else{
        var r=rolls.slice(i);
        for(var k=0;k<r.length&&k<3;k++){
          fr.ri.push(i+k);
          if(k===0)fr.marks.push(r[0]===10?"X":mk(r[0]));
          else if(k===1)fr.marks.push(r[0]===10?(r[1]===10?"X":mk(r[1])):(r[0]+r[1]===10?"/":mk(r[1])));
          else fr.marks.push((r[0]===10&&r[1]!==10)?(r[1]+r[2]===10?"/":mk(r[2])):(r[2]===10?"X":mk(r[2])));
        }
        var done=r.length>=3||(r.length===2&&r[0]+r[1]<10);
        if(done&&!blocked){cum+=r[0]+r[1]+(r[2]||0);fr.cum=cum;}
      }
      frames.push(fr);
    }
    return {frames:frames,total:cum};
  }
  function lastFrameDone(r){return r.length>=3||(r.length===2&&r[0]+r[1]<10);}
  /* ===== スコア計算ここまで ===== */

  function $(id){return document.getElementById(id);}
  var C=PHYS.C,NF=5;
  var cv=$("c"),ctx=cv.getContext("2d"),ov=$("ov"),sheetEl=$("sheet"),lpEl=$("lp"),bannerEl=$("banner");
  var FONT='"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif';
  var EFONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  var W=0,H=0,DPR=1,SC=1,K0=2.7,SYF=600,YTOP=150;
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function lerp(a,b,t){return a+(b-a)*t;}
  function rnd(a,b){return a+Math.random()*(b-a);}
  function easeOut(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3);}
  function easeBack(t){t=clamp(t,0,1);var c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
  function rr(c,x,y,w,h,r){r=Math.min(r,h/2,w/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

  var LINFO=[
    {em:"🎳",name:"ふつうのレーン",title:"フレーム1：ふつうのレーン",sub:"まずは練習！<br>指で左右に動かして、上にスワイプ！<br>カーブを描くとボールも曲がるよ"},
    {em:"⛰️",name:"でこぼこ坂レーン",title:"フレーム2：でこぼこ坂レーン！",sub:"まんなかの丘でボールがそれる！<br>坂を読んでねらおう"},
    {em:"🧊",name:"つるつる氷レーン",title:"フレーム3：つるつる氷レーン！",sub:"カーブがきかない！<br>ピンもツルツルすべるぞ"},
    {em:"↪️",name:"くねくね曲がり道",title:"フレーム4：くねくね曲がり道！",sub:"まっすぐじゃ届かない！<br>カベに当てて曲がれ"},
    {em:"🔄",name:"ベルトコンベア床",title:"フレーム5：ベルトコンベア床！",sub:"動く床でボールが流される！<br>ストライク・スペアでボーナス投球"}
  ];

  /* ===================== 投影（なんちゃって遠近） ===================== */
  function kx(y){return K0*(1-0.48*y/C.END);}
  function gy(y){var t=y/C.END;return t<0?1.2*t:t*(1.2-0.2*t);}
  function PY(y){return SYF-(SYF-YTOP)*gy(y);}
  function PX(x,y){return W/2+x*kx(y);}
  function VD(y){var t=y/C.END;return (SYF-YTOP)/C.END*(t<0?1.2:1.2-0.4*t);}
  function invY(sy){var u=(SYF-sy)/(SYF-YTOP);if(u<0)return u/1.2*C.END;var t=(1.2-Math.sqrt(Math.max(0,1.44-0.8*u)))/0.4;return t*C.END;}
  function quad(c,x0,y0,x1,y1){c.beginPath();c.moveTo(PX(x0,y0),PY(y0));c.lineTo(PX(x1,y0),PY(y0));c.lineTo(PX(x1,y1),PY(y1));c.lineTo(PX(x0,y1),PY(y1));c.closePath();}
  function poly(c,pts){c.beginPath();for(var i=0;i<pts.length;i++){var X=PX(pts[i].x,pts[i].y),Y=PY(pts[i].y);if(i)c.lineTo(X,Y);else c.moveTo(X,Y);}c.closePath();}

  function resize(){
    W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    SC=clamp(Math.min(W/390,H/760),0.8,1.4);
    var lr=lpEl.getBoundingClientRect();
    YTOP=Math.max(lr.bottom||100,90)+48*SC;
    SYF=H-150*SC;
    K0=Math.min(W*0.45/64,(SYF-YTOP)*0.0072,4.2);
    buildBg();
  }
  window.addEventListener("resize",resize);

  /* ===================== 背景（ボウリング場） ===================== */
  var bg=document.createElement("canvas"),bgx=bg.getContext("2d");
  function buildBg(){

  /* ===================== 更新 ===================== */
  var STEP=1/240;
  function update(dt){
    T+=dt;phT+=dt;
    if(flash>0)flash=Math.max(0,flash-dt*2.2);
    if(shake>0)shake=Math.max(0,shake-dt*30);
    if(fest>0)fest=Math.max(0,fest-dt);
    if(big)big.t+=dt;
    if(phase==="intro"&&phT>2.6){hideBanner();phase="aim";}
    if(phase==="roll"||phase==="result"){
      acc+=dt;var n=0;
      while(acc>=STEP&&n<20){sim.step(STEP);acc-=STEP;n++;}
      if(acc>STEP)acc=0;
      var evs=sim.ev;sim.ev=[];
      for(var i=0;i<evs.length;i++){var e=evs[i];
        if(e.k==="pin"){SFX.clack(e.s*1.6);if(e.s>150&&!rollWall)shake=Math.max(shake,4);}
        else if(e.k==="pp")SFX.clack(e.s);
        else if(e.k==="wall"){SFX.wall();rollWall=true;shake=Math.max(shake,3);}
        else if(e.k==="gutter"&&phase==="roll"){rollGutter=true;SFX.gutter();
          if(!sim.ball.hit)addPop("ガーター…",W/2,PY(240),"#9fb4d8",28*SC);}
      }
      var b=sim.ball;
      if(phase==="roll"){
        rollT+=dt;
        if(b)rumbleSet(b.done?0.0001:clamp(Math.hypot(b.vx,b.vy)/2200,0.02,0.22));
        if(b&&b.done)doneT+=dt;
        if((b&&b.done&&doneT>0.5&&sim.pinSpeed()<3)||doneT>3||rollT>10)endRoll();
      }
    }
    if(phase==="result"){resultT+=dt;var need=resultKind==="strike"?(big&&big.turkey?2.8:2.2):resultKind==="spare"||resultKind==="gutter"||resultKind==="miss"?1.7:1.2;if(resultT>need)nextRoll();}
    if(phase==="sweep"){sweepT+=dt;if(sweepT>0.8)finishSweep();}
    for(i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;if(p.vr)p.rot+=p.vr*dt;if(p.kind==="conf")p.vx+=Math.sin(T*3+i)*30*dt;if(p.t>p.life)parts.splice(i,1);}
    for(i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>pops[i].life)pops.splice(i,1);}
  }

      var lc=L.chains[0],rc=L.chains[1],pts=[];

  function drawHill(c){

  function pinPath(c,k){ // 原点=底、上が-y、単位px

  }

  function drawBall(c,b){

    c.restore();
    c.fillStyle="rgba(255,255,255,.55)";c.beginPath();c.ellipse(X-r*0.38,cy-r*0.45,r*0.25,r*0.14,-0.6,0,Math.PI*2);c.fill();

  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.drawImage(bg,0,0,W,H);
    if(!sim)return;
    var sx=shake?(Math.random()-0.5)*shake:0,sy=shake?(Math.random()-0.5)*shake:0;
    ctx.save();ctx.translate(sx,sy);
    if(fest>0){ // お祭りライト
      ctx.save();ctx.globalAlpha=Math.min(1,fest)*0.35;
      for(var i=0;i<8;i++){var a=T*1.5+i*Math.PI/4;ctx.fillStyle=CONF[i%6];ctx.beginPath();ctx.moveTo(W/2,PY(C.END));
        ctx.arc(W/2,PY(C.END),H*1.2,a,a+0.18);ctx.closePath();ctx.fill();}
      ctx.restore();
    }
    drawLaneFloor(ctx);drawHill(ctx);drawIce(ctx);drawBelts(ctx);drawWalls(ctx);
    // 奥から順に
    var objs=[],b=sim.ball;
    var sw=phase==="sweep"?clamp(sweepT/0.45,0,1):0;
    for(i=0;i<10;i++){var p=sim.pins[i];if(!p.on)continue;if(p.out&&p.y>C.PIT+30)continue;
      var al=1;if(phase==="sweep"&&(p.fallen||p.out))al=1-sw;if(al<=0)continue;objs.push({y:p.y,p:p,al:al});}
    var showBall=b||phase==="aim"||phase==="intro";
    if(phase==="sweep")showBall=true;
    if(showBall)objs.push({y:b&&phase!=="sweep"?b.y:0,ball:true});
    objs.sort(function(a,b){return b.y-a.y;});
    for(i=0;i<objs.length;i++){var o=objs[i];if(o.ball)drawBall(ctx,phase==="sweep"?null:b);else drawPin(ctx,o.p,o.al);}
    if(phase==="sweep"){ // ピンセッターのバー
      var st=sweepT/0.8,by=lerp(C.END,C.HEAD-40,Math.sin(Math.min(1,st)*Math.PI));
      ctx.fillStyle="rgba(40,30,70,.92)";quad(ctx,-C.KICK,by,C.KICK,by+6);ctx.fill();
      ctx.fillStyle="#ffd166";quad(ctx,-C.KICK,by,C.KICK,by+1.5);ctx.fill();
    }
    drawHousing(ctx);
    drawGuide(ctx);
    // 待機ヒント
    if(phase==="aim"&&!drag&&running){
      var hx=PX(ballX,0),hy=PY(0)-60*SC-((T*1.4)%1)*40*SC;
      ctx.globalAlpha=0.9-((T*1.4)%1)*0.7;ctx.font=Math.round(30*SC)+"px "+EFONT;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("👆",hx,hy);ctx.globalAlpha=1;
      ctx.font="900 "+Math.round(14*SC)+"px "+FONT;ctx.lineJoin="round";ctx.lineWidth=4;ctx.strokeStyle="rgba(20,10,30,.85)";
      var tx=frame===0&&rolls.length===0?"指で左右に動かして、上にスワイプ！":"上にスワイプで投げる！";
      ctx.strokeText(tx,W/2,H-62*SC);ctx.fillStyle="#fff";ctx.fillText(tx,W/2,H-62*SC);
    }
    // パーティクル
    for(i=0;i<parts.length;i++){var q=parts[i],qa=1-q.t/q.life;ctx.globalAlpha=Math.max(0,Math.min(1,qa*2));
      if(q.kind==="conf"){ctx.fillStyle=q.c;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);ctx.restore();}
      else if(q.kind==="emo"){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.font=Math.round(q.s)+"px "+EFONT;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(q.e,0,0);ctx.restore();}
      else{ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s*qa+1,0,Math.PI*2);ctx.fill();}}
    ctx.globalAlpha=1;
    // ポップ
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
    for(i=0;i<pops.length;i++){var pp=pops[i],u=pp.t/pp.life,s=easeBack(Math.min(1,pp.t*7));
      ctx.globalAlpha=u>0.75?(1-u)/0.25:1;ctx.save();ctx.translate(pp.x,pp.y-easeOut(u)*30*SC);ctx.scale(s,s);
      ctx.font="900 "+Math.round(pp.size)+"px "+FONT;ctx.lineWidth=Math.max(4,pp.size*0.2);ctx.strokeStyle="#20142e";ctx.strokeText(pp.text,0,0);ctx.fillStyle=pp.col;ctx.fillText(pp.text,0,0);ctx.restore();}
    ctx.globalAlpha=1;
    // 大きな結果表示
    if(big){
      var bt=big.t,sc2=big.sad?lerp(0.6,1,easeOut(bt*3)):easeBack(Math.min(1,bt*4)),yy=H*0.42+(big.sad?Math.min(1,bt)*14*SC:0);
      var rot=big.sad?Math.sin(bt*2)*0.04:Math.sin(bt*9)*0.03;
      ctx.save();ctx.translate(W/2,yy);ctx.rotate(rot);ctx.scale(sc2,sc2);
      var fs=(big.turkey?60:big.text.length>5?44:52)*SC;
      ctx.font="900 "+Math.round(fs)+"px "+FONT;ctx.lineWidth=fs*0.24;ctx.strokeStyle="#20142e";ctx.strokeText(big.text,0,0);
      if(big.sad)ctx.fillStyle=big.col;else{var gg=ctx.createLinearGradient(0,-fs/2,0,fs/2);gg.addColorStop(0,"#fff6c9");gg.addColorStop(0.5,big.col);gg.addColorStop(1,"#ff6b3d");ctx.fillStyle=gg;}
      ctx.fillText(big.text,0,0);
      ctx.font="900 "+Math.round(17*SC)+"px "+FONT;ctx.lineWidth=5;ctx.strokeText(big.sub,0,fs*0.85);ctx.fillStyle="#fff";ctx.fillText(big.sub,0,fs*0.85);
      if(big.turkey){ctx.font=Math.round(64*SC)+"px "+EFONT;ctx.fillText("🦃",0,-fs*1.25+Math.sin(bt*8)*6);}
      ctx.restore();
    }
    ctx.restore();
    if(flash>0){ctx.fillStyle="rgba(255,250,230,"+(flash*0.55)+")";ctx.fillRect(0,0,W,H);}
  }

  function loop(t){

  function gameOver(){
    running=false;phase="over";rumbleStop();hideBanner();SFX.over();
    var sg=updateSheet(),total=sg.total;
    var nb=total>best;if(nb){best=total;try{localStorage.setItem("vappa_bowling_best",String(best));}catch(e){}}
    var emo=total>=110?"🏆":total>=70?"🎳":total>=35?"😆":"🐢";
    var cm=total>=110?"へんてこレーンを完全攻略！プロ級！":total>=70?"なかなかの腕前！どのレーンも楽しめたね。":total>=35?"レーンのせい…ということにしよう。":"ガーターも思い出。また遊んでね！";
    ov.innerHTML='<div class="emo">'+emo+'</div><h1>ゲームセット！</h1><div class="big">'+total+' 点</div>'+
      '<div class="sub">'+(nb&&total>0?'🏆 自己ベスト！':'ベスト '+best+' 点')+'</div>'+
      '<div class="stats">🎳 ストライク：'+stats.strike+'回<br>✨ スペア：'+stats.spare+'回<br>🦃 ターキー：'+stats.turkey+'回<br>😢 ガーター：'+stats.gutter+'回</div>'+
      '<p>'+cm+'</p><button id="rb">もう一回</button>';
    ov.hidden=false;
    $("rb").addEventListener("click",function(e){e.stopPropagation();start();});
    if(window.Arcade)Arcade.gameOver(total);
  }

  /* ===================== 入力（スワイプ） ===================== */
  function analyze(pts){
    var n=pts.length;if(n<2)return null;
    var S=pts[0],E=pts[n-1];
    if(S.y-E.y<45*SC)return null;
    var lens=[0],tot=0;for(var i=1;i<n;i++){tot+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);lens.push(tot);}
    var mi=0;while(mi<n-1&&lens[mi]<tot*0.6)mi++;
    var M=pts[Math.max(1,mi)];
    var d1x=M.x-S.x,d1y=M.y-S.y;if(d1y>-5){d1x=E.x-S.x;d1y=E.y-S.y;}
    var a1=Math.atan2(d1x,-d1y),spin=0;
    var d2x=E.x-M.x,d2y=E.y-M.y;
    if(Math.hypot(d2x,d2y)>12*SC){var a2=Math.atan2(d2x,Math.max(1,-d2y)),cv2=a2-a1;spin=clamp(cv2/0.7,-1,1);if(Math.abs(spin)<0.12)spin=0;}
    // スクリーン方向 → レーン上のねらい
    var bx=PX(ballX,0),by=PY(0),hy=PY(C.HEAD),dl=Math.hypot(d1x,d1y),ux=d1x/dl,uy=d1y/dl;
    var tt=(by-hy)/Math.max(0.2,-uy),tx=bx+ux*tt,wx=(tx-W/2)/kx(C.HEAD);
    var ang=clamp(Math.atan2(wx-ballX,C.HEAD),-0.26,0.26);
    // 速さ
    var dur=Math.max(0.03,(E.t-S.t)/1000),vAll=tot/dur,j=n-1;
    while(j>0&&E.t-pts[j].t<120)j--;
    var rd=Math.max(0.03,(E.t-pts[j].t)/1000),vRec=(lens[n-1]-lens[j])/rd;
    var v=Math.max(vAll,vRec)/SC,spd=clamp(170+v*0.16,200,560);
    return {ang:ang,spd:spd,spin:spin};
  }
  function ptr(e){return {x:e.clientX,y:e.clientY,t:performance.now()};}
  cv.addEventListener("pointerdown",function(e){
    audio();if(!running||paused)return;
    if(phase==="intro"){hideBanner();phase="aim";}
    if(phase!=="aim")return;
    var p=ptr(e);drag={id:e.pointerId,x0:p.x,bx0:ballX,pts:[p],swipe:false,maxY:p.y,mi:0};
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
  });
  cv.addEventListener("pointermove",function(e){
    if(!drag||e.pointerId!==drag.id||!running||paused)return;
    var p=ptr(e);drag.pts.push(p);
    if(!drag.swipe){
      if(p.y>=drag.maxY){drag.maxY=p.y;drag.mi=drag.pts.length-1;}
      if(drag.maxY-p.y>22*SC){drag.swipe=true;drag.pts=drag.pts.slice(drag.mi);}
      else ballX=PHYS.clampX(drag.bx0+(p.x-drag.x0)/kx(0));
    }
    if(drag.swipe)guide=analyze(drag.pts);
  });
  function up(e){
    if(!drag||e.pointerId!==drag.id)return;
    var d=drag;drag=null;
    if(!running||paused||phase!=="aim"){guide=null;return;}
    if(d.swipe){d.pts.push(ptr(e));var r=analyze(d.pts);guide=null;if(r)throwBall(r.ang,r.spd,r.spin);}
    else guide=null;
  }
  cv.addEventListener("pointerup",up);
  cv.addEventListener("pointercancel",function(){drag=null;guide=null;});
  $("startBtn").addEventListener("click",function(e){e.stopPropagation();start();});
  if(window.Arcade){
    Arcade.onPause(function(){paused=true;drag=null;guide=null;rumbleSet(0.0001);});
    Arcade.onResume(function(){paused=false;last=performance.now();audio();});
    Arcade.onRestart(function(){audio();start();});
  }
  resize();newLane();updateSheet();updatePill();
  last=performance.now();requestAnimationFrame(loop);
})();
</script>
