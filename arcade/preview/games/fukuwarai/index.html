<!DOCTYPE html>
<html lang="ja">

<link rel="icon" href="data:," />
<style>

  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;

  #ov[hidden]{display:none;}
  .gal{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:360px;}
  .card{width:min(30vw,15.5vh,112px);background:#fbf3e3;border-radius:10px;padding:3px 3px 5px;color:#4a1a10;box-shadow:0 3px 0 rgba(0,0,0,.25);border:2px solid #c8102e;}
  .card img{width:100%;display:block;border-radius:7px;}
  .card .cs{font-weight:800;color:#c8102e;font-size:14px;line-height:1.2;}
  .card .cc{font-size:10px;font-weight:800;line-height:1.25;min-height:2.5em;display:flex;align-items:center;justify-content:center;}

  <p>上を <b>パーツがすーっと流れる</b> よ。<br><b>タップでストン！</b> と落として顔を完成させよう。<br>答え合わせで、どんな顔になったかな？<br>全5面・ピタッ3連続で <b>「福来たる」</b>！</p>
  <button id="startBtn">はじめる</button>
</div>
<script src="../../js/arcade-sdk.js?v=2"></script>
<script>
(function(){
  "use strict";
  var cv=document.getElementById("c"),ctx=cv.getContext("2d"),ov=document.getElementById("ov");
  var FONT='"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
  var W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1),S=1,F=140,railY=120,CX=195,CY=420,trayTop=600,HB=46;
  var paper=null;

  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function rnd(a,b){return a+Math.random()*(b-a);}
  function easeOut(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3);}
  function easeBack(t){t=clamp(t,0,1);var c=2.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
  function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,h/2,w/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);}

  function resize(){
    W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
    S=clamp(Math.min(W/390,H/760),0.8,1.25);
    F=clamp(Math.min(W*0.4,H*0.188),96,180);
    HB=Math.round(44*S);
    railY=Math.round(HB+F*0.5+8);
    CX=W/2;
    trayTop=Math.round(H-12-Math.min(196*S,H*0.25));
    var lo=railY+F*1.55+10,hi=trayTop-F*1.2;
    CY=Math.round(hi>lo?(lo+hi)/2:lo);
    if(CY+F*1.1>trayTop)trayTop=Math.round(Math.min(H-150*S,CY+F*1.1));
    makePaper();
  }
  function makePaper(){
    paper=document.createElement("canvas");paper.width=Math.round(W*DPR);paper.height=Math.round(H*DPR);
    var p=paper.getContext("2d");p.setTransform(DPR,0,0,DPR,0,0);
    var g=p.createRadialGradient(W/2,H*0.5,40,W/2,H*0.5,Math.max(W,H)*0.8);
    g.addColorStop(0,"#fbf4e4");g.addColorStop(1,"#ead9b9");p.fillStyle=g;p.fillRect(0,0,W,H);
    // 和紙の繊維
    for(var i=0;i<420;i++){
      var x=Math.random()*W,y=Math.random()*H,l=rnd(6,26),a=Math.random()*Math.PI;
      p.strokeStyle="rgba("+(Math.random()<0.5?"150,118,80":"255,255,255")+","+rnd(0.05,0.16)+")";p.lineWidth=rnd(0.4,1.1);
      p.beginPath();p.moveTo(x,y);p.quadraticCurveTo(x+Math.cos(a)*l*0.5+rnd(-4,4),y+Math.sin(a)*l*0.5+rnd(-4,4),x+Math.cos(a)*l,y+Math.sin(a)*l);p.stroke();
    }
    for(i=0;i<160;i++){p.fillStyle="rgba(140,100,60,"+rnd(0.05,0.14)+")";p.beginPath();p.arc(Math.random()*W,Math.random()*H,rnd(0.4,1.3),0,Math.PI*2);p.fill();}
    // 青海波（うっすら）
    p.strokeStyle="rgba(200,16,46,.06)";p.lineWidth=1.2;var R=22;
    for(var row=0;row*R*0.5<H*0.2;row++){var yy=H-row*R*0.5;for(var col=-1;col*R*2<W+R*2;col++){var xx=col*R*2+(row%2?R:0);for(var k=1;k<=3;k++){p.beginPath();p.arc(xx,yy,R*k/3,Math.PI,0);p.stroke();}}}
  }
  window.addEventListener("resize",function(){resize();});

  /* ===================== サウンド（合成） ===================== */
  var AC=null,NB=null;
  function initAudio(){
    if(AC){if(AC.state==="suspended")try{AC.resume();}catch(e){}return;}
    try{var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}catch(e){AC=null;}
    if(AC){try{NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){NB=null;}}
  }
  function tone(freq,dur,type,vol,delay,slide){
    if(!AC)return;
    try{
      var t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
      o.type=type||"sine";o.frequency.setValueAtTime(freq,t0);
      if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.1,t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.05);
    }catch(e){}
  }
  function noise(dur,vol,delay,ftype,f1,f2,q,attack){
    if(!AC||!NB)return;
    try{
      var t0=AC.currentTime+(delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
      s.buffer=NB;s.loop=true;fl.type=ftype||"bandpass";fl.frequency.setValueAtTime(f1,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+dur);fl.Q.value=q||1;
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+(attack||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t0,Math.random()*0.5);s.stop(t0+dur+0.05);
    }catch(e){}
  }
  function sfxDrop(){noise(0.14,0.05,0,"highpass",1200,4200,0.7);}
  function sfxLand(){noise(0.08,0.2,0,"bandpass",1600,600,1.1);tone(150,0.09,"sine",0.12,0,80);}
  function sfxPita(){tone(1318,0.09,"triangle",0.1);tone(1760,0.24,"triangle",0.09,0.07);tone(2637,0.18,"sine",0.04,0.12);}
  function sfxFuku(){var n=[587,659,784,880,1047,1175,1568];for(var i=0;i<n.length;i++)tone(n[i],0.3,"triangle",0.08,i*0.06);}
  function sfxWind(){noise(1.3,0.09,0,"bandpass",450,1500,4,0.25);tone(880,1.0,"sine",0.02,0.1,1500);}
  function sfxKoto(){var n=[440,523,587,659,880];for(var i=0;i<n.length;i++){tone(n[i],0.45,"triangle",0.07,i*0.08);tone(n[i]*2,0.15,"sine",0.02,i*0.08);}}
  function sfxDrum(){for(var i=0;i<24;i++){noise(0.06,0.03+0.09*i/24,i*0.048,"bandpass",1700,1300,0.8);if(i%3===0)tone(95,0.08,"sine",0.05+0.05*i/24,i*0.048,70);}}
  function sfxJan(){var c=[523,659,784,1047];for(var i=0;i<c.length;i++){tone(c[i],1.3,"sawtooth",0.035,0);tone(c[i],1.4,"triangle",0.05,0);}noise(1.5,0.12,0,"highpass",3500,7000,0.7);tone(130,0.5,"sine",0.18,0,60);}
  function sfxGood(){var n=[784,988,1175,1568];for(var i=0;i<n.length;i++)tone(n[i],0.22,"triangle",0.08,0.75+i*0.09);}
  function sfxWah(){tone(392,0.28,"sawtooth",0.045,0.7,370);tone(370,0.28,"sawtooth",0.045,0.98,349);tone(349,0.75,"sawtooth",0.045,1.26,300);}
  function sfxMiss(){tone(330,0.18,"triangle",0.06,0,220);}

  /* ===================== 顔とパーツ ===================== */
  // u,v は顔の中心からの位置（Fを1とした単位）。右まゆ＝顔の右＝画面の左。
  var FACES=[
    {n:"おかめ",skin:"#fff6ea",mouthName:"口",praise:["美人さん！","福がきそう〜"],mid:["ほんわか美人","なかなかの福顔"],side:"振り向き美人",
     parts:[{k:"okBrow",n:"右まゆ",g:"brow",u:-0.36,v:-0.4},{k:"okBrow",n:"左まゆ",g:"brow",u:0.36,v:-0.4},
            {k:"okEye",n:"右め",g:"eye",u:-0.36,v:-0.1},{k:"okEye",n:"左め",g:"eye",u:0.36,v:-0.1},
            {k:"okNose",n:"はな",g:"nose",u:0,v:0.2},{k:"okMouth",n:"くち",g:"mouth",u:0,v:0.5}]},
    {n:"ひょっとこ",skin:"#f4cfa2",mouthName:"口",praise:["ひょっとこ名人！","お祭り準備OK"],mid:["ひょうきん者","いい味出てる"],side:"よそ見ひょっとこ",
     parts:[{k:"hyBrow",n:"右まゆ",g:"brow",u:-0.34,v:-0.36},{k:"hyBrow",n:"左まゆ",g:"brow",u:0.34,v:-0.36},
            {k:"hyEye",n:"右め（大）",g:"eye",u:-0.34,v:-0.1},{k:"hyEyeS",n:"左め（小）",g:"eye",u:0.34,v:-0.08},
            {k:"hyNose",n:"はな",g:"nose",u:0,v:0.17},{k:"hyMouth",n:"くち",g:"mouth",u:0.24,v:0.52}]},
    {n:"しば犬",skin:"#e2954a",mouthName:"口",praise:["おりこうワンちゃん！","なでなでしたい"],mid:["人なつっこい顔","しっぽフリフリ"],side:"よそ見ワンちゃん",
     parts:[{k:"dgBrow",n:"右まゆ",g:"brow",u:-0.3,v:-0.4},{k:"dgBrow",n:"左まゆ",g:"brow",u:0.3,v:-0.4},
            {k:"dgEye",n:"右め",g:"eye",u:-0.34,v:-0.13},{k:"dgEye",n:"左め",g:"eye",u:0.34,v:-0.13},
            {k:"dgNose",n:"はな",g:"nose",u:0,v:0.22},{k:"dgMouth",n:"くち",g:"mouth",u:0,v:0.42}]},
    {n:"おじいさん",skin:"#f5d0ae",mouthName:"ひげ",praise:["ダンディじいさん！","長生きしそう"],mid:["やさしいおじいちゃん","縁側が似合う"],side:"そっぽ向きじいさん",
     parts:[{k:"jiBrow",n:"右まゆ",g:"brow",u:-0.34,v:-0.36},{k:"jiBrow",n:"左まゆ",g:"brow",u:0.34,v:-0.36},
            {k:"jiEye",n:"右め",g:"eye",u:-0.33,v:-0.12},{k:"jiEye",n:"左め",g:"eye",u:0.33,v:-0.12},
            {k:"jiGlass",n:"めがね",g:"glass",u:0,v:-0.12},{k:"jiNose",n:"はな",g:"nose",u:0,v:0.17},
            {k:"jiBeard",n:"おひげ",g:"mouth",u:0,v:0.42}]},
    {n:"信楽たぬき",skin:"#8f5f37",mouthName:"口",praise:["商売繁盛！","お店に飾りたい"],mid:["愛嬌たっぷり","ぽんぽこ合格"],side:"よそ見たぬき",
     parts:[{k:"tnBrow",n:"右まゆ",g:"brow",u:-0.34,v:-0.38},{k:"tnBrow",n:"左まゆ",g:"brow",u:0.34,v:-0.38},
            {k:"tnEye",n:"右め",g:"eye",u:-0.34,v:-0.1},{k:"tnEye",n:"左め",g:"eye",u:0.34,v:-0.1},
            {k:"tnNose",n:"はな",g:"nose",u:0,v:0.2},{k:"tnMouth",n:"くち",g:"mouth",u:0,v:0.47}]}
  ];
  // パーツの大きさ（幅・高さ）
  var PK={okBrow:[0.22,0.1],okEye:[0.28,0.1],okNose:[0.14,0.17],okMouth:[0.22,0.14],
    hyBrow:[0.28,0.14],hyEye:[0.26,0.26],hyEyeS:[0.18,0.18],hyNose:[0.17,0.16],hyMouth:[0.3,0.16],
    dgBrow:[0.15,0.1],dgEye:[0.15,0.18],dgNose:[0.24,0.14],dgMouth:[0.3,0.16],
    jiBrow:[0.32,0.14],jiEye:[0.2,0.1],jiGlass:[1.16,0.34],jiNose:[0.26,0.18],jiBeard:[0.5,0.5],
    tnBrow:[0.28,0.12],tnEye:[0.32,0.32],tnNose:[0.18,0.18],tnMouth:[0.34,0.18]};
  var MIRROR={okBrow:1,okEye:1,hyBrow:1,jiBrow:1,jiEye:1,tnBrow:1};
  var ROUNDS=[
    {face:0,spd:150,inc:8, bob:0, vary:0,wind:0,  tip:"まずは小手しらべ",hint:"正解の場所を思いうかべて…"},
    {face:1,spd:215,inc:12,bob:0, vary:0,wind:0,  tip:"スピードアップ！",hint:"ひょっとこの口は ちょっと横！"},
    {face:2,spd:195,inc:10,bob:22,vary:0,wind:0,  tip:"パーツが ゆ〜らゆら",hint:"上下のゆれが まん中の時がねらい目"},
    {face:3,spd:205,inc:10,bob:15,vary:1,wind:1,  tip:"緩急 ＆ 風に注意！",hint:"「ピュー」の間は 待つのもアリ"},
    {face:4,spd:235,inc:12,bob:24,vary:1,wind:1.3,tip:"ぜんぶ盛り！",hint:"たぬきは 目がまんまる"}
  ];
  var DK="#2b2220";

  function drawPartShape(k,side,blink){
    ctx.save();
    if(side>0&&MIRROR[k])ctx.scale(-1,1);
    ctx.lineCap="round";ctx.lineJoin="round";
    var g;
    switch(k){
      case "okBrow":
        ctx.rotate(-0.16);ctx.scale(1,0.48);
        g=ctx.createRadialGradient(0,0,0,0,0,0.11);g.addColorStop(0,"rgba(30,24,26,.95)");g.addColorStop(0.62,"rgba(30,24,26,.85)");g.addColorStop(1,"rgba(30,24,26,0)");
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,0.11,0,Math.PI*2);ctx.fill();break;
      case "okEye":
        ctx.strokeStyle=DK;ctx.lineWidth=0.034;ctx.rotate(-0.06);
        ctx.beginPath();ctx.moveTo(-0.125,0.03);ctx.quadraticCurveTo(0,blink?0.02:-0.075,0.125,0.03);ctx.stroke();
        ctx.lineWidth=0.018;ctx.beginPath();ctx.moveTo(-0.12,0.028);ctx.lineTo(-0.155,0.0);ctx.stroke();break;
      case "okNose":
        ctx.strokeStyle="#9a6450";ctx.lineWidth=0.022;
        ctx.beginPath();ctx.moveTo(-0.02,-0.08);ctx.quadraticCurveTo(-0.045,0.0,-0.058,0.035);ctx.quadraticCurveTo(-0.03,0.07,0,0.055);ctx.quadraticCurveTo(0.03,0.07,0.058,0.035);ctx.stroke();
        ctx.fillStyle="rgba(255,190,170,.35)";ell(0,0.02,0.05,0.04);ctx.fill();break;
      case "okMouth":
        ctx.fillStyle="#d4233a";ctx.beginPath();ctx.moveTo(-0.1,0.0);ctx.quadraticCurveTo(-0.05,-0.075,0,-0.03);ctx.quadraticCurveTo(0.05,-0.075,0.1,0.0);ctx.quadraticCurveTo(0,0.085,-0.1,0.0);ctx.closePath();ctx.fill();
        ctx.strokeStyle="#7a0f1d";ctx.lineWidth=0.012;ctx.beginPath();ctx.moveTo(-0.09,0.0);ctx.quadraticCurveTo(0,0.018,0.09,0.0);ctx.stroke();
        ctx.fillStyle="rgba(255,255,255,.45)";ell(-0.03,0.035,0.022,0.01);ctx.fill();break;
      case "hyBrow":
        ctx.strokeStyle="#1d1715";ctx.lineWidth=0.055;ctx.beginPath();ctx.moveTo(-0.12,0.045);ctx.quadraticCurveTo(-0.03,-0.08,0.12,-0.035);ctx.stroke();break;
      case "hyEye": case "hyEyeS":
        if(k==="hyEyeS")ctx.scale(0.66,0.66);
        if(blink){ctx.strokeStyle=DK;ctx.lineWidth=0.03;ctx.beginPath();ctx.moveTo(-0.12,0);ctx.quadraticCurveTo(0,0.05,0.12,0);ctx.stroke();break;}
        ctx.fillStyle="#fff";ctx.strokeStyle=DK;ctx.lineWidth=0.024;ell(0,0,0.12,0.12);ctx.fill();ctx.stroke();
        ctx.fillStyle="#1a1412";ell(0.02,0.01,0.058,0.062);ctx.fill();ctx.fillStyle="#fff";ell(0.04,-0.015,0.018,0.018);ctx.fill();break;
      case "hyNose":
        ctx.fillStyle="#eab07f";ctx.strokeStyle="#7a4a2a";ctx.lineWidth=0.02;ell(0,0,0.078,0.072);ctx.fill();ctx.stroke();
        ctx.fillStyle="#5a2f1c";ell(-0.03,0.035,0.016,0.012);ctx.fill();ell(0.03,0.035,0.016,0.012);ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.45)";ell(-0.02,-0.03,0.025,0.015);ctx.fill();break;
      case "hyMouth":
        ctx.rotate(-0.14);ctx.fillStyle="#f0bd8e";ctx.strokeStyle="#7a4a2a";ctx.lineWidth=0.02;
        rr(-0.15,-0.06,0.27,0.12,0.05);ctx.fill();ctx.stroke();
        ctx.fillStyle="#d9566b";ell(0.115,0,0.045,0.072);ctx.fill();ctx.stroke();
        ctx.fillStyle="#5c1414";ell(0.12,0,0.022,0.04);ctx.fill();
        ctx.strokeStyle="rgba(122,74,42,.5)";ctx.lineWidth=0.012;ctx.beginPath();ctx.moveTo(-0.08,-0.03);ctx.lineTo(0.04,-0.03);ctx.stroke();break;
      case "dgBrow":
        ctx.fillStyle="#fff6e2";ctx.strokeStyle="rgba(120,70,30,.35)";ctx.lineWidth=0.012;ell(0,0,0.068,0.046,-0.1);ctx.fill();ctx.stroke();break;
      case "dgEye":
        if(blink){ctx.strokeStyle="#1b1412";ctx.lineWidth=0.03;ctx.beginPath();ctx.moveTo(-0.07,0);ctx.quadraticCurveTo(0,0.05,0.07,0);ctx.stroke();break;}
        ctx.fillStyle="#1b1412";ell(0,0,0.066,0.084);ctx.fill();
        ctx.fillStyle="#fff";ell(0.022,-0.034,0.024,0.024);ctx.fill();ell(-0.02,0.03,0.01,0.01);ctx.fill();break;
      case "dgNose":
        ctx.fillStyle="#1b1412";ctx.beginPath();ctx.moveTo(-0.115,-0.045);ctx.quadraticCurveTo(0,-0.1,0.115,-0.045);ctx.quadraticCurveTo(0.1,0.045,0,0.07);ctx.quadraticCurveTo(-0.1,0.045,-0.115,-0.045);ctx.closePath();ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.55)";ell(-0.03,-0.045,0.04,0.015,-0.1);ctx.fill();break;

  // 顔＋パーツをまとめて描く（list: {k,u,v,side,t0}）
  function drawFace(fi,list,cx,cy,us,o){
    o=o||{};
    ctx.save();ctx.translate(cx,cy);
    if(o.rot)ctx.rotate(o.rot);
    if(o.sc)ctx.scale(o.sc,o.sc);
    ctx.save();ctx.scale(us,us);drawFaceBase(fi);ctx.restore();
    var i,p;
    if(o.ghost){
      for(i=0;i<list.length;i++){p=list[i];
        ctx.save();ctx.globalAlpha=0.3*o.ghost;drawPart(p.k,p.tu>0.02?1:p.tu<-0.02?-1:0,false,p.tu*us,p.tv*us,us);ctx.restore();
      }
    }
    for(i=0;i<list.length;i++){p=list[i];
      var sq=0;if(o.now!=null&&p.t0!=null){var e=o.now-p.t0;if(e<0.6)sq=0.34*Math.exp(-e*9)*Math.cos(e*26);}
      drawPart(p.k,p.side,o.blink&&(p.g==="eye"),p.u*us,p.v*us,us,Math.max(1,us*0.02),sq);
    }
    if(o.ghost){
      ctx.save();ctx.globalAlpha=0.55*o.ghost;ctx.strokeStyle="#c8102e";ctx.lineWidth=1.4;ctx.setLineDash([3,4]);
      for(i=0;i<list.length;i++){p=list[i];var dx=(p.u-p.tu)*us,dy=(p.v-p.tv)*us;if(dx*dx+dy*dy<64)continue;
        ctx.beginPath();ctx.moveTo(p.tu*us,p.tv*us);ctx.lineTo(p.u*us,p.v*us);ctx.stroke();
        ctx.fillStyle="#c8102e";ctx.beginPath();ctx.arc(p.tu*us,p.tv*us,2.4,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
    ctx.restore();
  }

  /* ===================== 判定・コメント ===================== */
  var PITA=0.07;
  function partAcc(err){return clamp(1-Math.pow(err/0.62,1.25),0,1);}
  function analyze(fi,list,score){
    var f=FACES[fi],c=[],i,p,by={};
    for(i=0;i<list.length;i++){p=list[i];(by[p.g]=by[p.g]||[]).push(p);}
    var mn=f.mouthName;
    function add(sev,t,s){var j=Array.isArray(t)?(Math.random()*t.length)|0:0;c.push({sev:sev,t:Array.isArray(t)?t[j]:t,s:Array.isArray(s)?s[Math.min(j,s.length-1)]:s});}
    var off=0;for(i=0;i<list.length;i++){p=list[i];if(Math.abs(p.u)>0.98||p.v<-0.95||p.v>1.08)off++;}
    if(off)add(2.1+off*0.1,"はみ出し注意！","パーツが顔から脱走中");
    var E=by.eye,B=by.brow,N=by.nose&&by.nose[0],M=by.mouth&&by.mouth[0],G=by.glass&&by.glass[0];
    var eyeV=0;
    if(E&&E.length===2){
      var gap=Math.abs(E[0].u-E[1].u),tg=Math.abs(E[0].tu-E[1].tu),vd=Math.abs(E[0].v-E[1].v);
      eyeV=(E[0].v+E[1].v)/2;var edv=((E[0].v-E[0].tv)+(E[1].v-E[1].tv))/2;
      if(gap<0.13&&vd<0.16)add(3,"ひとつ目小僧！？","目がくっついちゃった");
      else if(gap<tg*0.55)add(1.6+(tg*0.55-gap)*3,["寄り目さん","まん中に集合！"],["鼻のあたまが気になる？","目がなかよし"]);
      else if(gap>tg*1.6)add(1.5+(gap-tg*1.6)*2,["宇宙人？","カメレオン？"],["目がはなれすぎ","うしろまで見えてそう"]);
      if(vd>0.2)add(1.4+vd*2,["ピカソ風","芸術的すぎる"],["芸術は爆発だ！","美術館に飾れそう"]);
      if(edv>0.13)add(1.3+edv*2,["なんか眠そう","月曜の朝っぽい"],["目がとろ〜ん","あと5分だけ…"]);
      else if(edv<-0.13)add(1.3-edv*2,["びっくり顔","おでこに目が！"],["目が上に飛んでった","いつも上を見てる"]);
    }
    if(B&&B.length===2){
      var bg=Math.abs(B[0].u-B[1].u),tbg=Math.abs(B[0].tu-B[1].tu),bv=(B[0].v+B[1].v)/2;
      if(bg<tbg*0.5)add(1.7+(tbg*0.5-bg)*2,["事件の犯人っぽい","ご機嫌ななめ"],["まゆげが寄りすぎ","眉間にシワが…"]);
      else if(bg>tbg*1.7)add(1.2,"こまり顔","まゆげが はなればなれ");
      if(E&&E.length===2&&bv>eyeV+0.02)add(2,"まゆげが迷子","目の下にまゆげ…？");
    }
    if(N){if(Math.abs(N.u-N.tu)>0.22)add(1.4+Math.abs(N.u-N.tu),["鼻が家出中","鼻だけ よそ見"],["鼻がどこかへ行きたそう","においを追いかけ中"]);}
    if(M){
      if(E&&E.length===2&&M.v<eyeV)add(3,"さかさま顔！？",mn+"が おでこに…");
      else if(N&&M.v<N.v-0.03)add(2.5,mn+"と鼻が入れかわった！","よ〜く見ると…");
      else if(M.v-M.tv<-0.15)add(1.2,mn+"が のぼってきた","鼻の下みじかめ");
      else if(M.v-M.tv>0.18)add(1.2,"アゴがしゃくれ気味",mn+"が下がりすぎ");
      if(Math.abs(M.u-M.tu)>0.28)add(1.1+Math.abs(M.u-M.tu)*0.8,["ニヒルな笑み",mn+"が おでかけ中"],[mn+"が かたよってる","ちょっとそこまで"]);
    }
    if(G&&E&&E.length===2){var gd=Math.hypot(G.u-(E[0].u+E[1].u)/2,G.v-eyeV);if(gd>0.24)add(2+gd,"メガネ…そこ？","おでこメガネ？");}

  function update(dt){

    for(i=fx.length-1;i>=0;i--){var p=fx[i];p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.type==="paper"||p.type==="confetti"){p.vy+=500*dt;p.vx*=0.98;p.rot+=dt*8;}
      else if(p.type==="leaf"){p.rot+=dt*6;p.vy+=Math.sin(p.life*8)*30*dt;}
      else{p.vx*=0.94;p.vy*=0.94;}

    for(i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>1.1)pops.splice(i,1);}
    if(banner&&time-banner.t0>banner.dur)banner=null;
    if(flash>0)flash=Math.max(0,flash-dt*2.2);
    if(fuku&&Math.random()<dt*10){var ex=Math.random()<0.5?rnd(4,18):W-rnd(4,18);fx.push({type:"spark",x:ex,y:rnd(HB,H),vx:0,vy:-20,life:0,max:rnd(0.5,0.9),sz:rnd(2,5),col:"#ffd54a",rot:0});}
    if(st==="intro"){if(stT>1.7)spawnPart();}
    else if(st==="aim"||st==="fall"||st==="land"){

        cur.ph+=dt*3.3;
      }

        if(wind.st==="blow")fall.x+=wind.dir*115*rc.wind*(F/140)*dt;
        fall.x=clamp(fall.x,8,W-8);

      }

  function drawResultCard(x,y,w,h){
    if(st==="drum"){
      var n=Math.floor(stT*10)%4;ctx.fillStyle="#8a2a1a";fitFont("ドゥルルルル"+"…".repeat(n),w-30,26*S,"800");
      ctx.fillText("ドゥルルルル"+"…".repeat(n),W/2,y+h*0.42);
      ctx.font="700 "+Math.round(12*S)+"px "+FONT;ctx.fillStyle="rgba(138,42,26,.7)";ctx.fillText("答え合わせ…",W/2,y+h*0.42+28*S);
      return;
    }
    var r=Math.min(50*S,h*0.3),sx=x+w-r-16*S,sy=y+Math.min(h*0.4,r+22*S);
    var tx=x+18*S,tw=sx-r-tx-8*S;
    ctx.textAlign="left";
    var ap=easeOut(stT/0.35);
    ctx.globalAlpha=ap;
    ctx.fillStyle="#8a2a1a";ctx.font="700 "+Math.round(12*S)+"px "+FONT;ctx.fillText(face.n+"の 判定は…",tx,y+24*S);
    var tc=res.cm.good===2?"#c8102e":res.cm.good===1?"#b5562a":"#5a2a7a";
    var t="「"+res.cm.t+"」";var fs=fitFont(t,tw+10*S,30*S,"800");ctx.fillStyle=tc;ctx.fillText(t,tx-8*S,y+24*S+fs*0.5+20*S);
    ctx.fillStyle="#6b3a2a";fitFont(res.cm.s,tw,15*S,"700");ctx.fillText(res.cm.s,tx,y+24*S+fs+40*S);
    ctx.font="700 "+Math.round(12*S)+"px "+FONT;ctx.fillStyle="#8a5a40";
    ctx.fillText("顔点 "+res.base+(res.bonus?"　＋ボーナス "+res.bonus:""),tx,y+24*S+fs+66*S);
    ctx.globalAlpha=1;
    // 判子
    var sp=stampT<0.25?2.2-1.2*easeOut(stampT/0.25):1;
    if(stampT>0.05){
      ctx.save();ctx.translate(sx,sy);ctx.scale(sp,sp);ctx.rotate(-0.12);ctx.globalAlpha=Math.min(1,stampT*6);
      ctx.fillStyle="rgba(200,16,46,.08)";ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#c8102e";ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
      ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,r-5,0,Math.PI*2);ctx.stroke();
      var shown=Math.round(res.total*easeOut(stampT/0.8));
      ctx.fillStyle="#c8102e";ctx.textAlign="center";ctx.font="800 "+Math.round(r*0.78)+"px "+FONT;ctx.fillText(String(shown),0,-r*0.08);
      ctx.font="800 "+Math.round(r*0.3)+"px "+FONT;ctx.fillText("点",0,r*0.52);
      ctx.restore();
    }
    if(stT>1.3){ctx.globalAlpha=0.55+0.45*Math.sin(time*5);ctx.fillStyle="#c8102e";ctx.textAlign="center";ctx.font="800 "+Math.round(14*S)+"px "+FONT;
      ctx.fillText(ri+1>=ROUNDS.length?"タップで 結果発表 ▶":"タップで つぎの顔へ ▶",W/2,y+h-18*S);ctx.globalAlpha=1;}
  }
  function drawFx(){
    for(var i=0;i<fx.length;i++){var p=fx[i],a=1-p.life/p.max;ctx.save();ctx.globalAlpha=clamp(a*1.4,0,1);
      if(p.type==="spark"){ctx.fillStyle=p.col;ctx.translate(p.x,p.y);var s=p.sz*(0.5+a*0.6);ctx.beginPath();for(var k=0;k<8;k++){var rr2=k%2?s*0.35:s,an=k*Math.PI/4;ctx.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2);}ctx.closePath();ctx.fill();}
      else if(p.type==="leaf"){ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;var z=p.sz;ctx.beginPath();ctx.moveTo(-z,0);ctx.quadraticCurveTo(0,-z*0.8,z,0);ctx.quadraticCurveTo(0,z*0.8,-z,0);ctx.fill();}
      else{ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.sz/2,-p.sz*0.35,p.sz,p.sz*0.7);}
      ctx.restore();}
    for(i=0;i<pops.length;i++){var o=pops[i],e=o.t,sc=e<0.18?easeBack(e/0.18):1,al=e>0.75?1-(e-0.75)/0.35:1;
      ctx.save();ctx.globalAlpha=clamp(al,0,1);ctx.translate(o.x,o.y-e*30);ctx.scale(sc,sc);ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.font="800 "+Math.round((o.big?24:15)*S)+"px "+FONT;ctx.lineWidth=5;ctx.strokeStyle="#fff";ctx.strokeText(o.txt,0,0);ctx.fillStyle=o.col;ctx.fillText(o.txt,0,0);
      if(o.sub){ctx.font="800 "+Math.round(14*S)+"px "+FONT;ctx.strokeText(o.sub,0,20*S);ctx.fillStyle="#c8102e";ctx.fillText(o.sub,0,20*S);}
      ctx.restore();}
  }
  function drawBanner(){
    if(!banner)return;
    var e=time-banner.t0,d=banner.dur,sc=e<0.25?easeBack(e/0.25):1,al=e>d-0.3?(d-e)/0.3:1;
    var y=banner.gold?CY-F*0.1:railY+F*0.75+20*S;
    ctx.save();ctx.globalAlpha=clamp(al,0,1);ctx.translate(W/2,y);ctx.scale(sc,sc);
    ctx.font="800 "+Math.round(26*S)+"px "+FONT;var tw=ctx.measureText(banner.t).width;ctx.font="700 "+Math.round(13*S)+"px "+FONT;
    var bw=Math.min(W-24,Math.max(tw,ctx.measureText(banner.s).width)+56*S),bh=72*S;
    ctx.fillStyle=banner.gold?"#fff6d6":"#fffaf0";ctx.strokeStyle=banner.col;ctx.lineWidth=3;rr(-bw/2,-bh/2,bw,bh,14*S);ctx.fill();ctx.stroke();
    ctx.strokeStyle=banner.gold?"#e8b84a":"rgba(200,16,46,.4)";ctx.lineWidth=1;rr(-bw/2+5,-bh/2+5,bw-10,bh-10,10*S);ctx.stroke();
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=banner.col;ctx.font="800 "+Math.round(26*S)+"px "+FONT;ctx.fillText(banner.t,0,-10*S);
    ctx.fillStyle="#6b3a2a";ctx.font="700 "+Math.round(13*S)+"px "+FONT;ctx.fillText(banner.s,0,18*S);
    ctx.restore();
  }
  function drawFukuFrame(){
    if(!fuku)return;var a=0.45+0.25*Math.sin(time*6);
    ctx.save();ctx.strokeStyle="rgba(255,200,40,"+a+")";ctx.lineWidth=6;ctx.strokeRect(3,HB+3,W-6,H-HB-6);
    ctx.strokeStyle="rgba(255,240,170,"+a+")";ctx.lineWidth=2;ctx.strokeRect(9,HB+9,W-18,H-HB-18);ctx.restore();
  }
  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.drawImage(paper,0,0,W,H);
    drawFan(-6,CY+F*1.02,52*S,0.5,0.85);drawFan(W+6,CY+F*1.02,52*S,-0.5,0.85);
    drawRail();
    var o={now:time};
    if(st==="drum"){o.rot=Math.sin(time*40)*0.006;}
    if(st==="reveal"){
      o.ghost=easeOut((stT-0.1)/0.6);o.blink=blinkOn;
      var b=stT<0.6?Math.sin(stT/0.6*Math.PI)*0.06:0;
      o.sc=1+b;
      if(res&&!res.cm.good)o.rot=Math.sin(time*2.2)*0.035;else o.sc+=Math.abs(Math.sin(time*3))*0.012;
    }
    drawFace(rc.face,placed,CX,CY,F,o);
    drawFall();
    drawCur();
    drawWind();
    drawTray();
    drawHUD();
    drawFx();
    drawBanner();
    drawFukuFrame();
    if(flash>0){ctx.fillStyle="rgba(255,250,235,"+flash*0.75+")";ctx.fillRect(0,0,W,H);}
  }

  /* ===================== サムネ画像 ===================== */
  function faceImage(fi,list,pw,ph,us,bg){
    var c=document.createElement("canvas");c.width=pw*2;c.height=ph*2;
    var saved=ctx;ctx=c.getContext("2d");ctx.scale(2,2);
    if(bg){ctx.fillStyle=bg;ctx.fillRect(0,0,pw,ph);}
    drawFace(fi,list,pw/2,ph*0.52,us,{});
    ctx=saved;
    try{return c.toDataURL("image/png");}catch(e){return "";}
  }

  /* ===================== ループ・開始・終了 ===================== */
  function loop(t){if(!running)return;var dt=Math.min(0.04,(t-last)/1000)||0;last=t;if(!paused){update(dt);if(running)draw();}requestAnimationFrame(loop);}
  function start(){resize();reset();ov.hidden=true;running=true;paused=false;last=performance.now();if(window.Arcade)Arcade.ready();requestAnimationFrame(loop);}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function gameOver(){
    running=false;st="over";
    var isBest=total>best&&total>0;
    if(isBest){best=total;try{localStorage.setItem("vappa_fukuwarai_best",String(best));}catch(e){}}
    var cards="",top=null;
    for(var i=0;i<results.length;i++){var r=results[i];if(!top||r.total>top.total)top=r;
      cards+='<div class="card"><img alt="" src="'+faceImage(r.fi,r.list,120,140,44,"#f6ecd8")+'"><div class="cs">'+r.total+'点</div><div class="cc">「'+esc(r.cm.t)+'」</div></div>';}
    var title=total>=450?"福だらけ！":total>=330?"なかなかの福顔ぞろい":total>=200?"笑いの絶えない一家":"爆笑ギャラリー完成！";
    ov.innerHTML='<h1>'+title+'</h1><div class="big">'+total+' 点</div>'+
      (isBest?'<div class="best">ベスト更新！</div>':(best>0?'<div class="stats">ベスト '+best+' 点</div>':''))+
      '<div class="gal">'+cards+'</div>'+
      '<div class="stats">ピタッ '+pitaN+'回 ・ 最大連続 '+maxCombo+'</div>'+
      '<button id="rb">もう一回</button>';
    ov.hidden=false;document.getElementById("rb").addEventListener("click",function(e){e.stopPropagation();initAudio();start();});
    if(window.Arcade)Arcade.gameOver(total);
  }

  function tap(){
    initAudio();
    if(!running||paused)return;
    if(st==="aim")drop();
    else if(st==="intro"&&stT>0.35){banner=null;spawnPart();}
    else if(st==="reveal"&&stT>1.3)nextRound();
  }
  cv.addEventListener("pointerdown",function(e){if(e.cancelable)e.preventDefault();if(e.button!=null&&e.button>0)return;tap();});
  cv.addEventListener("contextmenu",function(e){e.preventDefault();});
  document.addEventListener("keydown",function(e){if(e.code==="Space"||e.code==="Enter"){if(running&&!paused){e.preventDefault();tap();}}});
  document.getElementById("startBtn").addEventListener("click",function(e){e.stopPropagation();initAudio();start();});
  if(window.Arcade){
    Arcade.onPause(function(){paused=true;});
    Arcade.onResume(function(){paused=false;last=performance.now();});
    Arcade.onRestart(function(){initAudio();start();});
  }
  // タイトル画面：正解のおかめ
  resize();reset();
  var hero=FACES[0].parts.map(function(p,i){return {k:p.k,g:p.g,u:p.u,v:p.v,side:p.u<0?-1:p.u>0?1:0};});
  document.getElementById("heroImg").src=faceImage(0,hero,150,170,62,null);
  draw();
})();
</script>
<script>
/* iOSダブルタップズーム対策：ボタン類以外のtouchendをpreventDefault */
document.addEventListener("touchend",function(e){
  var t=e.target;
  if(e.cancelable && !(t&&t.closest&&t.closest("button,a,input,select,label"))) e.preventDefault();
},{passive:false});
document.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();},{passive:false});
</script>
