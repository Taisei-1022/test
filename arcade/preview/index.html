<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>試遊室 | Vappa</title>
<style>
:root{--bg:#141221;--ink:#f1eefb;--dim:#9a93b5;--rule:#2c2740;--plate:#1d1a2e;--gold:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;padding:18px 14px 40px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--dim);font-size:12.5px;line-height:1.7;margin-bottom:14px}
.card{background:var(--plate);border:1px solid var(--rule);border-radius:14px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:96px 1fr;gap:12px}
.th{width:96px;height:72px;border-radius:10px;background:#2a2545 center/cover;display:flex;align-items:center;justify-content:center;font-size:32px}
.nm{font-weight:900;font-size:15px}.bl{font-size:12px;color:var(--dim);margin:3px 0 8px;line-height:1.5}
.play{display:inline-block;background:var(--gold);color:#fff;text-decoration:none;font-weight:900;border-radius:10px;padding:8px 14px;font-size:14px}
.rate{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rate button{flex:1;min-width:70px;background:transparent;border:1px solid var(--rule);color:var(--ink);border-radius:10px;padding:8px 4px;font:inherit;font-size:13px;font-weight:800}
.rate button.on[data-v="○"]{background:#34d399;color:#062a1c;border-color:#34d399}
.rate button.on[data-v="△"]{background:#fbbf24;color:#2a1d00;border-color:#fbbf24}
.rate button.on[data-v="×"]{background:#f87171;color:#2a0606;border-color:#f87171}
.memo{grid-column:1/-1;background:var(--bg);border:1px solid var(--rule);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;font-size:13px}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;display:flex;gap:8px;align-items:center}
.bar button{flex:1;background:var(--gold);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:900;font-size:15px}
#cnt{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<h1>試遊室（運営用）</h1>
<p class="sub">Claude Code が作った新作ゲームです。本番でユーザーの作品を遊ぶ時と<b>同じ隔離された箱</b>の中で動くので、取り込み後と同じ条件で確かめられます。記録は保存されません。<br>遊んだら ○△× とひとことを付けて「評価をコピー」してください。</p>
<div id="list"></div>
<div class="bar"><span id="cnt"></span><button id="copy" type="button">評価をコピー</button></div>
<script src="games-test.js?v=1"></script>
<script>
(function(){
  var KEY="vappa.previewrate.v1", st={};
  try{ st=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} count(); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var games=(window.TEST_GAMES||[]);
  document.getElementById("list").innerHTML=games.map(function(g){
    return '<div class="card" data-id="'+g.id+'"><div class="th" style="background-image:url(games/'+g.id+'/thumb.png)"></div>'+
      '<div><div class="nm">'+esc(g.emoji||"")+' '+esc(g.title)+'</div><div class="bl">'+esc(g.blurb)+'（'+(g.low?'少ないほど良い':'多いほど良い')+'・'+esc(g.unit)+'）</div>'+
      '<a class="play" href="play.html?g='+g.id+'">▶ 遊ぶ</a></div>'+
      '<div class="rate"><button data-v="○" type="button">○ 使える</button><button data-v="△" type="button">△ 惜しい</button><button data-v="×" type="button">× ゴミ</button></div>'+
      '<input class="memo" maxlength="80" placeholder="ひとこと（例：操作が分かりにくい）"></div>';
  }).join("");
  function count(){ document.getElementById("cnt").textContent=Object.keys(st).filter(function(k){return st[k]&&st[k].v;}).length+"/"+games.length+" 評価済み"; }
  document.querySelectorAll(".card").forEach(function(card){
    var id=card.getAttribute("data-id"), s=st[id]||{}, memo=card.querySelector(".memo");
    card.querySelectorAll(".rate button").forEach(function(b){
      if(s.v===b.getAttribute("data-v")) b.classList.add("on");
      b.addEventListener("click", function(){ card.querySelectorAll(".rate button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); st[id]=Object.assign(st[id]||{},{v:b.getAttribute("data-v")}); save(); });
    });
    memo.value=s.m||""; memo.addEventListener("input", function(){ st[id]=Object.assign(st[id]||{},{m:memo.value}); save(); });
  });
  count();
  document.getElementById("copy").addEventListener("click", function(){
    var lines=["試遊室の評価"]; games.forEach(function(g){ var s=st[g.id]||{}; lines.push(g.title+"："+(s.v||"未")+(s.m?"（"+s.m+"）":"")); });
    var t=lines.join("\n"), btn=this, done=function(){ btn.textContent="コピーしました"; setTimeout(function(){btn.textContent="評価をコピー";},1600); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,function(){ window.prompt("コピーしてください", t); }); else window.prompt("コピーしてください", t);
  });
})();
</script>
</body>
</html>
