<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/app.css?v=40" />
<title>ランキング</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6804943232069371" crossorigin="anonymous"></script>
</head>
<body>
<div class="play">
  <div class="bar">
    <a class="back" id="back" aria-label="戻る">‹</a>
    <div class="t" id="title">ランキング</div>
    <button class="rankbtn shareic2" id="shareBtn" aria-label="共有"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    <div class="best"><span>あなた</span><b id="myrank">—</b></div>
  </div>
  <div class="lb" style="max-height:none;flex:1;border-top:0">
    <h3 id="sub">全ランキング</h3>
    <ol id="list"></ol>
  </div>
</div>

<script src="js/games.js?v=9"></script>
<script src="js/config.js?v=6"></script>
<script src="js/store.js?v=7"></script>
<script src="js/catalog.js?v=10"></script>
<script src="js/share.js?v=5"></script>
<script src="js/sw-reg.js?v=2"></script>
<script>
(function () {
  "use strict";
  var id = new URLSearchParams(location.search).get("game");
  if (!id) { location.replace("index.html"); return; }
  var player = Store.player();
  // どこから来たかで戻り先を変える（ホーム一覧→ホーム / プレイ画面→プレイ）
  var from = new URLSearchParams(location.search).get("from");
  document.getElementById("back").href = (from === "play") ? ("play.html?game=" + id) : "index.html";
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  Catalog.resolve(id).then(function (game) {
    if (!game) { location.replace("index.html"); return; }
    var stype = game.score.type, unit = game.score.unit;
    document.getElementById("title").textContent = game.title + " のランキング";
    document.title = game.title + " のランキング";
    var sb = document.getElementById("shareBtn");
    if (sb) sb.addEventListener("click", function () { if (window.Share) Share.open({ gameId: game.id, gameTitle: game.title }); });

    return Store.top(game.id, stype, 100).then(function (rows) {
      var list = document.getElementById("list");
      var myRank = null;
      if (!rows.length) { list.innerHTML = '<li class="empty">まだ記録がありません。最初の1位になろう。</li>'; return; }
      list.innerHTML = rows.map(function (row, i) {
        if (row.player === player && myRank === null) myRank = i + 1;
        var meCls = row.player === player ? " me" : "";
        return '<li class="'+meCls+'"><span class="rk">'+(i+1)+'</span>'+
          '<span class="pl">'+esc(row.player)+'</span>'+
          '<span class="sc">'+row.score+unit+'</span></li>';
      }).join("");
      document.getElementById("myrank").textContent = myRank ? (myRank + "位") : "—";
      document.getElementById("sub").textContent = "全 " + rows.length + " 人";
    });
  });
})();
</script>
</body>
</html>
