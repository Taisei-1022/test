<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/app.css?v=2" />
<title>プレイ</title>
</head>
<body>
<div class="play">
  <div class="bar">
    <a class="back" href="index.html" aria-label="戻る">‹</a>
    <div class="t" id="title">…</div>
    <a class="rankbtn" id="rankBtn">ランキング</a>
    <div class="best"><span>自己ベスト</span><b id="best">—</b></div>
  </div>
  <div class="frameWrap"><iframe id="frame" allow="autoplay; fullscreen" title="game"></iframe></div>
</div>
<div class="toast" id="toast"></div>

<script src="js/games.js?v=2"></script>
<script src="js/config.js?v=2"></script>
<script src="js/store.js?v=2"></script>
<script>
(function () {
  "use strict";
  var id = new URLSearchParams(location.search).get("game");
  var game = getGame(id);
  if (!game) { location.replace("index.html"); return; }

  var stype = game.score.type, unit = game.score.unit;
  var player = Store.name() || "ゲスト";

  document.getElementById("title").textContent = game.title;
  document.title = game.title;
  var frame = document.getElementById("frame");
  frame.src = game.path;

  var bestEl = document.getElementById("best");
  var toast = document.getElementById("toast");
  document.getElementById("rankBtn").href = "leaderboard.html?game=" + game.id;

  function fmt(v) { return v + unit; }
  function refreshBest() {
    return Store.myBest(game.id, stype, player).then(function (b) {
      bestEl.textContent = (b === null ? "—" : fmt(b));
    });
  }
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add("show");
    setTimeout(function () { toast.classList.remove("show"); }, 1500);
  }

  // ゲーム → 殻
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || !d.__arcade) return;
    if (d.call === "gameOver") {
      var score = Math.round(Number(d.payload.score) || 0);
      Store.myBest(game.id, stype, player).then(function (prev) {
        Store.submit(game.id, stype, player, score).then(function () {
          var better = prev === null || (stype === "low" ? score < prev : score > prev);
          refreshBest();
          showToast(better ? "自己ベスト更新！ " + fmt(score) : "結果 " + fmt(score));
        });
      });
    }
  });

  // タブが隠れたら一時停止を通知
  document.addEventListener("visibilitychange", function () { ctl(document.hidden ? "pause" : "resume"); });
  function ctl(call) { try { frame.contentWindow.postMessage({ __arcadeCtl: true, call: call }, "*"); } catch (e) {} }

  refreshBest();
})();
</script>
</body>
</html>
