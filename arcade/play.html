<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/app.css?v=42" />
<title>プレイ</title>
<style>
  .menupop{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 54px);z-index:9980;min-width:210px;background:#1d1a2e;border:1px solid #3a3460;border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
  .menupop .mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px 12px;border:0;background:none;color:#f1eefb;font:inherit;font-size:14px;font-weight:800;text-align:left;text-decoration:none;border-radius:10px;cursor:pointer}
  .menupop .mi:active,.menupop .mi:hover{background:#2a2545}
  .menupop .mi svg{width:18px;height:18px;flex:none;opacity:.85}
  .menupop #reportBtn{color:#f3a3a3}
  .menupop .mi[hidden]{display:none}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6804943232069371" crossorigin="anonymous"></script>
<meta property="og:type" content="website" />
<meta property="og:title" content="Vappa" />
<meta property="og:description" content="AIでミニゲームを作って遊べる Vappa" />
<meta property="og:image" content="https://vappa.app/arcade/og.png?v=4" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
</head>
<body>
<div class="play">
  <div class="bar">
    <a class="back" href="index.html" aria-label="戻る">‹</a>
    <div class="t" id="title">…</div>
    <button class="rankbtn shareic2" id="menuBtn" aria-label="メニュー" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="best"><span>自己ベスト</span><b id="best">—</b></div>
  </div>
  <!-- ハンバーガーメニュー：ランキング／共有／通報 -->
  <div id="menuPop" class="menupop" role="menu" hidden>
    <a class="mi" id="rankBtn" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>ランキング</a>
    <a class="mi" id="authorBtn" role="menuitem" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19c1-3.4 4-5 6.5-5s5.5 1.6 6.5 5"/></svg><span id="authorTxt">作者のページ</span></a>
    <button class="mi" id="shareBtn" type="button" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>共有・挑戦状を送る</button>
    <button class="mi" id="reportBtn" type="button" role="menuitem" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>この作品を通報</button>
  </div>
  <div class="frameWrap"><iframe id="frame" allow="autoplay; fullscreen" title="game"></iframe></div>
</div>
<div class="toast" id="toast"></div>

<script src="js/games.js?v=10"></script>
<script src="js/config.js?v=7"></script>
<script src="js/netstate.js?v=1"></script>
<script src="js/store.js?v=9"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/catalog.js?v=13"></script>
<script src="js/ai.js?v=21"></script>
<script src="js/share.js?v=6"></script>
<script src="js/sw-reg.js?v=2"></script>
<script src="js/arcade-embed.js?v=4"></script>
<script>
(function () {
  "use strict";
  var qp = new URLSearchParams(location.search);
  var id = qp.get("game");
  if (!id) { location.replace("index.html"); return; }

  // ---- 挑戦状（誰かがスコアを添えて送ってきたリンク）----
  var chScore = null, chBy = "";
  (function () {
    var c = qp.get("ch");
    if (c != null && c !== "" && isFinite(+c)) chScore = Math.round(+c);
    chBy = (qp.get("by") || "").slice(0, 16);
  })();

  var frame = document.getElementById("frame");
  var bestEl = document.getElementById("best");
  var toast = document.getElementById("toast");
  var stype = "high", unit = "点", player = Store.player();
  var myBestScore = null, lastScore = null, GAME = null;

  function fmt(v) { return v + unit; }
  function isBetter(a, b) { return stype === "low" ? a < b : a > b; }   // a が b より良いか
  function showToast(msg) { toast.textContent = msg; toast.classList.add("show"); setTimeout(function(){toast.classList.remove("show");}, 1500); }
  function refreshBest(gid) { return Store.myBest(gid, stype, player).then(function (b) { myBestScore = b; bestEl.textContent = (b === null ? "—" : fmt(b)); }); }
  function ctl(call) { try { frame.contentWindow.postMessage({ __arcadeCtl: true, call: call }, "*"); } catch (e) {} }

  // ---- 画面端スワイプ（iOSの「戻る」ジェスチャー）対策 ----
  // ジェスチャー自体はOSの仕組みでJSから無効化できない（preventDefaultが効かない）。
  // そこで履歴にガードを1つ積んでおき、戻られたら同じページを積み直す＝実際には離脱しない。
  // ページはリロードされないのでiframeのゲームも中断されない。抜けるのは左上の「‹」。
  (function guardBack() {
    var hinted = false;
    function push() { try { history.pushState({ vpGuard: 1 }, "", location.href); } catch (e) {} }
    push();
    window.addEventListener("popstate", function () {
      push();                                  // 戻された分を積み直す
      if (!hinted) { hinted = true; showToast("戻るときは左上の ‹ を押してね"); }
    });
  })();

  // ---- 受け取った挑戦状のバナー（張り合いの動機づけ。数秒で自然に消える）----
  function showChallengeBanner() {
    if (chScore == null) return;
    var b = document.createElement("div");
    b.textContent = "🔥 " + (chBy || "だれか") + "の挑戦：" + fmt(chScore) + "。抜ける？";
    b.setAttribute("style", "position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);" +
      "z-index:9998;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" +
      "background:linear-gradient(90deg,#ff6b57,#ff9950);color:#2a1200;font-weight:900;font-size:14px;" +
      "padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(255,107,87,.4)");
    document.body.appendChild(b);
    setTimeout(function () { b.style.transition = "opacity .5s"; b.style.opacity = "0"; }, 4200);
    setTimeout(function () { try { b.remove(); } catch (e) {} }, 4800);
  }

  // ---- ゲームオーバー時の結果シート（勝敗＋挑戦状を送る/返す）----
  function sheetBtn(label, accent) {
    var el = document.createElement("button");
    el.textContent = label;
    el.setAttribute("style", "display:block;width:100%;text-align:center;font-weight:800;font-size:15px;" +
      "padding:15px 14px;margin:8px 0 0;border-radius:14px;border:1px solid " + (accent ? "#7b61ff" : "#3a3d52") + ";" +
      "background:" + (accent ? "#7b61ff" : "#23263a") + ";color:#fff;cursor:pointer");
    return el;
  }
  function closeResult() { var o = document.getElementById("__resultov"); if (o) o.remove(); }
  function showResult(score, prevBest) {
    closeResult();
    var ov = document.createElement("div");
    ov.id = "__resultov";
    ov.setAttribute("style", "position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center");
    var sheet = document.createElement("div");
    sheet.setAttribute("style", "width:100%;max-width:520px;background:#181a27;border-radius:20px 20px 0 0;" +
      "padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 36px rgba(0,0,0,.55);text-align:center");

    // 大きくスコア表示
    var big = document.createElement("div");
    big.innerHTML = '<span style="font-size:40px;font-weight:900;color:#ffd166">' + score + '</span>' +
      '<span style="font-size:18px;font-weight:800;color:#ffd166;margin-left:2px">' + unit + '</span>';
    big.setAttribute("style", "margin:2px 0 4px");
    sheet.appendChild(big);

    // 勝敗（挑戦状を受けているときだけ）
    var verdict = document.createElement("div");
    verdict.setAttribute("style", "font-weight:900;font-size:16px;margin:2px 0 6px;min-height:20px");
    var challengeMode = chScore != null;
    if (challengeMode) {
      if (isBetter(score, chScore)) {
        verdict.textContent = "🎉 " + (chBy || "相手") + "に勝った！（" + fmt(chScore) + "）";
        verdict.style.color = "#34d399";
      } else if (score === chScore) {
        verdict.textContent = "🤝 " + (chBy || "相手") + "と同点！（" + fmt(chScore) + "）";
        verdict.style.color = "#facc15";
      } else {
        var diff = stype === "low" ? (score - chScore) : (chScore - score);
        verdict.textContent = "😢 " + (chBy || "相手") + "にあと " + Math.abs(diff) + unit + "（" + fmt(chScore) + "）";
        verdict.style.color = "#f87171";
      }
    } else {
      var upd = (prevBest == null) || isBetter(score, prevBest);
      verdict.textContent = upd ? "✨ 自己ベスト更新！" : "自己ベスト " + fmt(prevBest);
      verdict.style.color = upd ? "#34d399" : "#9aa0b5";
    }
    sheet.appendChild(verdict);

    // 主導線：挑戦状を送る/返す（＝ループの心臓）
    var send = sheetBtn(challengeMode ? "🔥 挑戦状を返す（" + fmt(score) + "）" : "🔥 スコアを添えて挑戦状を送る", true);
    send.addEventListener("click", function () {
      closeResult();
      if (window.Share && GAME) Share.open({ gameId: GAME.id, gameTitle: GAME.title, score: score, unit: unit, by: player });
    });
    sheet.appendChild(send);

    // 「もう一回」と「ランキング」は横並び（結果シートが縦に伸びすぎないように）。
    // ランキングは結果シートからも必ず行けるようにする（シートが上に乗って
    // バーのランキングボタンを塞ぐため。プレイ直後こそ順位を見たい）。
    var row = document.createElement("div");
    row.setAttribute("style", "display:flex;gap:8px");
    var again = sheetBtn("🔄 もう一回", false);
    again.style.flex = "1";
    again.addEventListener("click", function () { closeResult(); ctl("restart"); });
    var rank = sheetBtn("🏆 ランキング", false);
    rank.style.flex = "1";
    rank.addEventListener("click", function () {
      if (GAME) location.href = "leaderboard.html?game=" + encodeURIComponent(GAME.id) + "&from=play";
    });
    row.appendChild(again); row.appendChild(rank);
    sheet.appendChild(row);

    if (GAME && GAME.source !== "seed" && window.Ai) {
      var rl = document.createElement("button");
      rl.type = "button"; rl.textContent = "この作品を通報";
      rl.setAttribute("style", "background:none;border:0;color:#9aa0b5;font-size:12px;text-decoration:underline;margin-top:10px;cursor:pointer");
      rl.addEventListener("click", openReport);
      sheet.appendChild(rl);
    }
    var cl = sheetBtn("とじる", false);
    cl.style.marginTop = "12px";
    cl.style.opacity = "0.85";
    cl.addEventListener("click", closeResult);
    sheet.appendChild(cl);

    ov.appendChild(sheet);
    ov.addEventListener("click", function (e) { if (!(e.target.closest && e.target.closest("button"))) closeResult(); });
    document.body.appendChild(ov);
  }

  // ---- 通報（ユーザーが作った作品だけ）----
  // 理由を選んで送る。同じ人の2回目は数えない。別々の人から3件で自動的に一覧から外れ、運営が確認する。
  function openReport() {
    if (!GAME) return;
    closeResult();
    var ov = document.createElement("div");
    ov.id = "__reportov";
    ov.setAttribute("style", "position:fixed;inset:0;z-index:9995;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center");
    var sh = document.createElement("div");
    sh.setAttribute("style", "width:100%;max-width:520px;background:#181a27;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));color:#f1eefb");
    sh.innerHTML = '<div style="font-weight:900;font-size:16px;margin-bottom:4px">この作品を通報</div>' +
      '<div style="font-size:12px;color:#9aa0b5;line-height:1.6;margin-bottom:10px">運営が内容を確認します。通報した人の情報は作者には伝わりません。<a href="guidelines.html" style="color:#cdbcff">投稿ガイドライン</a></div>';
    var reason = "";
    var wrap = document.createElement("div");
    wrap.setAttribute("style", "display:flex;flex-wrap:wrap;gap:6px");
    ["不適切な内容", "暴力・差別的", "著作権・なりすまし", "個人情報", "動かない・壊れている", "その他"].forEach(function (r) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = r;
      b.setAttribute("style", "flex:1 1 45%;padding:11px 8px;border-radius:12px;border:1px solid #3a3d52;background:#23263a;color:#fff;font-weight:800;font-size:13px");
      b.addEventListener("click", function () {
        reason = r;
        wrap.querySelectorAll("button").forEach(function (x) { x.style.background = "#23263a"; x.style.borderColor = "#3a3d52"; });
        b.style.background = "#7b61ff"; b.style.borderColor = "#7b61ff";
      });
      wrap.appendChild(b);
    });
    sh.appendChild(wrap);
    var ta = document.createElement("textarea");
    ta.maxLength = 500; ta.rows = 3; ta.placeholder = "くわしく（任意）";
    ta.setAttribute("style", "width:100%;box-sizing:border-box;margin-top:10px;background:#0f1019;border:1px solid #3a3d52;color:#fff;border-radius:12px;padding:10px;font:inherit;font-size:14px");
    sh.appendChild(ta);
    var send = sheetBtn("通報する", true), cancel = sheetBtn("やめる", false);
    send.addEventListener("click", function () {
      if (!reason) { showToast("理由を選んでね"); return; }
      send.disabled = true; send.textContent = "送信中…";
      Ai.report(GAME.id, reason, ta.value.trim()).then(function () {
        ov.remove(); showToast("通報しました。ご協力ありがとうございます");
      }).catch(function () {
        send.disabled = false; send.textContent = "通報する"; showToast("送れませんでした。時間をおいてもう一度試してね");
      });
    });
    cancel.addEventListener("click", function () { ov.remove(); });
    sh.appendChild(send); sh.appendChild(cancel);
    ov.appendChild(sh);
    ov.addEventListener("click", function (e) { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }

  // ---- メニュー（ランキング／共有／通報）。開いている間はゲームを一時停止 ----
  var menuBtn = document.getElementById("menuBtn"), menuPop = document.getElementById("menuPop");
  function setMenu(open) {
    menuPop.hidden = !open; menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    ctl(open ? "pause" : "resume");
  }
  menuBtn.addEventListener("click", function (e) { e.stopPropagation(); setMenu(menuPop.hidden); });
  document.addEventListener("click", function (e) { if (!menuPop.hidden && !menuPop.contains(e.target)) setMenu(false); });
  menuPop.addEventListener("click", function (e) { if (e.target.closest(".mi")) setMenu(false); });

  Catalog.resolve(id).then(function (game) {
    if (!game) { location.replace("index.html"); return; }
    GAME = game;
    stype = game.score.type; unit = game.score.unit;
    document.getElementById("title").textContent = game.title;
    document.title = game.title;
    document.getElementById("rankBtn").href = "leaderboard.html?game=" + game.id + "&from=play";
    var sb = document.getElementById("shareBtn");
    // 共有ボタン：スコアがあれば自動で「挑戦状」モードになる（直近スコア優先、なければ自己ベスト）
    if (sb) sb.addEventListener("click", function () {
      if (!window.Share) return;
      var s = (lastScore != null) ? lastScore : myBestScore;
      Share.open({ gameId: game.id, gameTitle: game.title, unit: unit, score: s, by: player });
    });

    // 作者のページ（@ID がある作者の作品だけ）
    if (game.user_id && window.Auth && Auth.profilesFor) Auth.profilesFor([game.user_id]).then(function (m) {
      var pf = m[game.user_id]; if (!pf) return;
      var ab = document.getElementById("authorBtn");
      ab.href = "creator.html?u=" + encodeURIComponent(pf.handle); ab.hidden = false;
      document.getElementById("authorTxt").textContent = "作者：" + pf.display_name + "（@" + pf.handle + "）";
    });
    var rb = document.getElementById("reportBtn");
    if (rb && game.source !== "seed" && window.Ai) { rb.hidden = false; rb.addEventListener("click", openReport); }

    if (game.source === "seed") frame.src = game.path;        // シード：ファイルを読み込む
    else loadGameFrame(frame, game.html);                      // 生成・持ち込み：隔離（sandbox+CSP）して再生

    refreshBest(game.id).then(showChallengeBanner);

    // ゲーム → 殻
    window.addEventListener("message", function (e) {
      var d = e.data;
      if (!d || !d.__arcade) return;
      if (d.call === "gameOver") {
        var score = Math.round(Number(d.payload.score) || 0);
        var prevBest = myBestScore;   // 更新前の自己ベスト（勝敗表示用に退避）
        Store.submit(game.id, stype, player, score).then(function () {
          lastScore = score;
          refreshBest(game.id).then(function () { showResult(score, prevBest); });
        });
      }
    });

    document.addEventListener("visibilitychange", function () { ctl(document.hidden ? "pause" : "resume"); });
  });
})();
</script>
</body>
</html>
