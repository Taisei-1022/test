name: Eval generate (品質評価の生成)

# 設計書セットを本番の generate 関数で作り、結果を tests/gamegen-eval/results-ci/<tag>/ にコミットする。
# 採点（自動テストプレイ）は Claude のセッション側で行う。
# 管理者扱いにするため、Supabase のサービス鍵を Management API から取り出してリクエストに付ける（ログには出さない）。
# 起動：tests/gamegen-eval/eval-request.json を書き換えて push する（手動起動は main にしか置けないため）。
#   { "runs": [ { "set": "heavy", "tag": "heavy_A_r1", "maxout": "", "flow": false }, ... ] }  ← 上から順に実行
on:
  push:
    branches: [claude/railway-switching-game-4p5ijn]
    paths: ["tests/gamegen-eval/eval-request.json"]

permissions:
  contents: write

concurrency:
  group: eval-gen
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: httrzepweyxzbkosdoau
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Get service key
        run: |
          KEY=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[] | select(.name=="service_role") | .api_key' | head -1)
          [ -z "$KEY" ] && { echo "service key not found"; exit 1; }
          echo "::add-mask::$KEY"
          echo "EVAL_SRV=$KEY" >> "$GITHUB_ENV"
      - name: Generate and commit (requests in order)
        run: |
          git config user.name "vappa-eval-bot"; git config user.email "eval-bot@users.noreply.github.com"
          N=$(jq '.runs | length' tests/gamegen-eval/eval-request.json)
          for i in $(seq 0 $((N-1))); do
            SET=$(jq -r ".runs[$i].set // \"heavy\"" tests/gamegen-eval/eval-request.json)
            TAG=$(jq -r ".runs[$i].tag" tests/gamegen-eval/eval-request.json)
            MAXOUT=$(jq -r ".runs[$i].maxout // \"\"" tests/gamegen-eval/eval-request.json)
            FLOW=$(jq -r ".runs[$i].flow // false" tests/gamegen-eval/eval-request.json)
            ARGS="--tag=$TAG --set=$SET"
            [ -n "$MAXOUT" ] && ARGS="$ARGS --maxout=$MAXOUT"
            [ "$FLOW" = "true" ] && ARGS="$ARGS --flow"
            TWO=$(jq -r ".runs[$i].two // false" tests/gamegen-eval/eval-request.json)
            [ "$TWO" = "true" ] && ARGS="$ARGS --two"
            echo "=== $ARGS"
            node tests/gamegen-eval/prod.js $ARGS || true
            mkdir -p tests/gamegen-eval/results-ci && rm -rf tests/gamegen-eval/results-ci/$TAG
            cp -r tests/gamegen-eval/results/$TAG tests/gamegen-eval/results-ci/
            git add -f tests/gamegen-eval/results-ci/$TAG
            git commit -q -m "eval: $TAG の生成結果（$SET${MAXOUT:+ / maxout $MAXOUT}${TWO/false/}）" || true
            for t in 1 2 3 4; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((t*3)); done
          done
