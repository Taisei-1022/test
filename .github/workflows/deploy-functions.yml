name: Deploy Edge Functions

# arcade/supabase/functions 以下が変わって push されたら、Supabase に自動デプロイする。
# 必要な GitHub Secret（1つだけ）: SUPABASE_ACCESS_TOKEN
#   Supabase → Account → Access Tokens で発行して登録する。
# project ref は公開URLの一部なので秘密ではない。

on:
  push:
    branches: [claude/railway-switching-game-4p5ijn, main]
    paths:
      - "arcade/supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: httrzepweyxzbkosdoau
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy generate function
        working-directory: arcade
        run: supabase functions deploy generate --project-ref "$PROJECT_REF" --no-verify-jwt
