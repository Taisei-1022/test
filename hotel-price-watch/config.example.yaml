# =====================================================================
#  ホテル価格ウォッチャー 設定ファイル
#  - 監視したい「特定ホテル」と、通知したい「閾値」をここに書きます。
#  - APIキーやSlack URLは *ここには書きません*（環境変数 / GitHub Secrets）。
# =====================================================================

locale:
  currency: JPY   # 価格の通貨
  gl: jp          # Google Hotels の国 (jp)
  hl: ja          # 表示言語 (ja)

# ---------------------------------------------------------------------
# 監視するホテル（特定ホテルを指定）
#   name        : Google Hotels / 楽天で検索する名前（できるだけ正式名称）
#   threshold_jpy: この金額（1泊・税込目安）以下になったら Slack 通知
#   adults      : 宿泊人数（省略時 1）
#   property_token: 任意。SerpApiでホテルを一意に固定したいとき（README参照）
# ---------------------------------------------------------------------
hotels:
  - id: royne-sendai
    name: "ダイワロイネットホテル仙台"
    threshold_jpy: 9000
    adults: 1

  - id: metropolitan-sendai
    name: "ホテルメトロポリタン仙台"
    threshold_jpy: 13000
    adults: 1

  - id: richmond-sendai
    name: "リッチモンドホテル仙台"
    threshold_jpy: 9500
    adults: 1

# ---------------------------------------------------------------------
# チェックする宿泊日の決め方
#   mode: weekly | rolling | fixed
# ---------------------------------------------------------------------
dates:
  mode: weekly

  # 毎週この曜日にチェックインする想定で、直近 weeks_ahead 週分を毎回確認
  weekly:
    weekday: fri      # mon/tue/wed/thu/fri/sat/sun
    nights: 1
    weeks_ahead: 6

  # 今日から span_days 日ぶんを毎日ローリングでチェック（曜日問わず最安を探す）
  rolling:
    start_offset_days: 1
    span_days: 30
    nights: 1

  # 特定日を固定で監視
  fixed:
    - checkin: 2026-08-14
      nights: 1

# ---------------------------------------------------------------------
# 使うデータ源（上から順に問い合わせ、取れた中の最安を採用）
#   serpapi_google_hotels : 複数OTA横断（要 SERPAPI_KEY）
#   rakuten               : 楽天のみ（要 RAKUTEN_APP_ID・無料）
# 使わない源は行を消せばOK。
# ---------------------------------------------------------------------
sources:
  - serpapi_google_hotels
  - rakuten

# ---------------------------------------------------------------------
# 通知の挙動
# ---------------------------------------------------------------------
alerts:
  renotify_after_hours: 24   # 同一ホテル・同一日付の再通知はこの時間あける
  only_on_new_low: false     # true にすると「閾値以下」かつ「過去最安更新」時のみ通知
