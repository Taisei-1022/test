<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.vp-hud span{background:rgba(8,12,26,.55);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px 12px}
.vp-hud span:empty{display:none}
.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}
.vp-ov h1{font-size:28px}
.vp-ov p{color:#b9c1de;font-size:14.5px;line-height:1.8;max-width:340px;white-space:pre-line}
.vp-ov .vp-big{font-size:44px;font-weight:900;color:#ffd166}
.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
[hidden]{display:none!important}
</style>

<canvas id="vpc"></canvas>
<div id="vpstage">
  <div id="vpdom"></div>
  <div class="vp-hud" id="vphud" hidden><span id="vphl">0点</span><span id="vphr"></span></div>
  <div class="vp-toast" id="vptoast"></div>
  <div class="vp-ov" id="vpov">
    <h1>弾幕ボスラッシュ</h1>
    <p>ドラッグで自機✈️を操作（自動連射）。4体のボスを倒せ！ 画面ダブルタップでボム💣発動。</p>
    <button class="vp-btn" id="vpstart">スタート</button>
  </div>
</div>
<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TAU = Math.PI * 2;
var TUNE = {
  bossHp:   { v: 240, label: 'ボスHP基準',      min: 80,  max: 600, step: 10 },
  fireRate: { v: 10,  label: '連射速度(毎秒)',  min: 3,   max: 20,  step: 1 },
  eSpeed:   { v: 115, label: '敵弾の速さ',      min: 50,  max: 260, step: 5 },
  density:  { v: 1.0, label: '弾の密度',        min: 0.5, max: 2,   step: 0.05 },
  lives:    { v: 3,   label: 'ライフ数',        min: 1,   max: 6,   step: 1 },
  bombs:    { v: 3,   label: 'ボム数',          min: 1,   max: 5,   step: 1 },
  graze:    { v: 20,  label: 'グレイズ距離',    min: 10,  max: 40,  step: 2 },
  loopMul:  { v: 1.5, label: '2周目の弾速倍率', min: 1,   max: 2.5, step: 0.1 }
};

var BOSSES = [
  { e: '🐙', c: '#ff5ec4', hp: 0.75, r: 48 },
  { e: '🦂', c: '#c6ff3c', hp: 1.00, r: 44 },
  { e: '🐲', c: '#3cf0ff', hp: 1.35, r: 50 },
  { e: '👁️', c: '#b070ff', hp: 1.80, r: 46 }
];

var player, pB, eB, zakos, pows, parts, booms, boss, stars;
var state, waveIndex, loop, score, lives, bombs, power, fireT;
var timeScale, flashWhite, shake, warnT, zakoLeft, zakoSpawnT, clearT, boomT;
var invul, nowT, ended, lastTapT, lastTapX, lastTapY, dragId, lastGraze;
var bossNoDamage, bossX, bossY, spdMul;

function init() {
  pB = []; eB = []; zakos = []; pows = []; parts = []; booms = []; stars = [];
  boss = null;
  player = { x: W / 2, y: H - 150, tx: W / 2, ty: H - 150, r: 4 };
  state = 'zako';
  waveIndex = 0; loop = 1;
  score = 0; lives = TUNE.lives.v; bombs = TUNE.bombs.v; power = 0;
  fireT = 0; timeScale = 1; flashWhite = 0; shake = 0;
  warnT = 0; zakoLeft = 5; zakoSpawnT = 0.6; clearT = 0; boomT = 0;
  invul = 1.0; nowT = 0; ended = false;
  lastTapT = -99; lastTapX = -999; lastTapY = -999; dragId = -1; lastGraze = -1;
  bossNoDamage = true; bossX = W / 2; bossY = 132; spdMul = 1;
  for (var i = 0; i < 80; i++) {
    stars.push({ x: Math.random() * W, y: 56 + Math.random() * (H - 56), s: 0.7 + Math.random() * 1.8, v: 14 + Math.random() * 46 });
  }
  Game.score(0);
  updateHud();
}

function updateHud() {
  Game.hud('❤️' + Math.max(0, lives) + '  💣' + bombs);
}

function addScore(n) {
  score += n;
  Game.score(Math.floor(score));
}

function spark(x, y, n, c) {
  if (parts.length > 240) parts.splice(0, 30);
  for (var i = 0; i < n; i++) {
    var a = Math.random() * TAU;
    var sp = 30 + Math.random() * 150;
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.3 + Math.random() * 0.45, max: 0.75, c: c || '#9ff', sz: 1.5 + Math.random() * 2.6 });
  }
}

function eShot(x, y, ang, spd, r, col) {
  if (eB.length > 400) return;
  eB.push({ x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: r, c: col, grazed: false });
}

function setTarget(x, y) {
  player.tx = Math.max(16, Math.min(W - 16, x));
  player.ty = Math.max(190, Math.min(H - 26, y - 56));
}

function onDown(x, y, id) {
  if (nowT - lastTapT < 0.33 && Math.abs(x - lastTapX) < 110 && Math.abs(y - lastTapY) < 110) {
    lastTapT = -99;
    doBomb();
  } else {
    lastTapT = nowT; lastTapX = x; lastTapY = y;
  }
  dragId = id;
  setTarget(x, y);
}
function onMove(x, y, id) { if (id === dragId) setTarget(x, y); }
function onUp(x, y, id) { if (id === dragId) dragId = -1; }

function doBomb() {
  if (ended || bombs <= 0) return;
  bombs--; updateHud();
  flashWhite = Math.max(flashWhite, 0.65);
  shake = Math.max(shake, 0.75);
  invul = Math.max(invul, 1.4);
  Game.toast('💣 ボム！');
  var n = eB.length;
  for (var i = 0; i < eB.length; i++) spark(eB[i].x, eB[i].y, 1, '#9ff');
  eB.length = 0;
  addScore(n * 2);
  for (var k = zakos.length - 1; k >= 0; k--) {
    spark(zakos[k].x, zakos[k].y, 8, '#ff9f43');
    addScore(25);
    zakos.splice(k, 1);
  }
  if (boss && state === 'boss') {
    var dmg = Math.round(boss.hpMax * 0.15);
    boss.hp -= dmg; addScore(dmg); boss.flash = 0.5;
    spark(boss.x, boss.y, 20, boss.c);
    if (boss.hp <= 0) defeatBoss();
  }
}

function hitPlayer() {
  if (invul > 0 || ended) return;
  lives--; updateHud();
  invul = 2.2;
  shake = 0.85;
  bossNoDamage = false;
  Game.float(player.x, player.y - 30, '💥', '#ff4d6d');
  spark(player.x, player.y, 24, '#ff8fa3');
  for (var i = eB.length - 1; i >= 0; i--) {
    var dx = eB[i].x - player.x, dy = eB[i].y - player.y;
    if (dx * dx + dy * dy < 130 * 130) { spark(eB[i].x, eB[i].y, 2, '#9ff'); eB.splice(i, 1); }
  }
  if (lives <= 0) endGame();
}

function endGame() {
  if (ended) return;
  ended = true;
  state = 'over';
  Game.over(Math.floor(score));
}

function spawnZako() {
  var bx = 60 + Math.random() * (W - 120);
  zakos.push({ x: bx, bx: bx, y: -30, hp: 3, vy: 90 + loop * 14 + Math.random() * 18, fireT: 1.2 + Math.random() * 0.8, t: Math.random() * 3, hit: 0 });
}

function killZako(idx) {
  var zk = zakos[idx];
  spark(zk.x, zk.y, 12, '#ff9f43');
  addScore(25);
  if (Math.random() < 0.7) pows.push({ x: zk.x, y: zk.y, t: 0 });
  zakos.splice(idx, 1);
}

function spawnBoss() {
  var type = waveIndex % 4;
  var def = BOSSES[type];
  var hp = TUNE.bossHp.v * def.hp * (1 + 0.55 * (loop - 1));
  boss = { type: type, e: def.e, c: def.c, r: def.r, x: W / 2, y: 132, t: 0, hp: hp, hpMax: hp, p2: false, flash: 0, f1: 0.9, f2: 1.1, f3: 0.6, ang: 0, burst: 0, bt: 0 };
  state = 'boss';
  bossNoDamage = true;
  Game.toast(def.e + ' ボス出現！');
}

function updateBoss(dt) {
  var b = boss;
  if (!b) return;
  b.t += dt;
  b.x = W / 2 + Math.sin(b.t * 0.6) * (88 + b.type * 7);
  b.y = 132 + Math.sin(b.t * 1.3) * 7;
  if (b.flash > 0) b.flash -= dt;

  if (!b.p2 && b.hp < b.hpMax * 0.5) {
    b.p2 = true;
    Game.toast('⚠️ 第2形態！');
    shake = Math.max(shake, 0.5);
    invul = Math.max(invul, 0.7);
    for (var k = 0; k < 26; k++) spark(b.x, b.y, 1, b.c);
    eB.length = 0;
  }

  var spd = TUNE.eSpeed.v * spdMul * (b.p2 ? 1.35 : 1);
  var dens = TUNE.density.v * (b.p2 ? 1.22 : 1) * (1 + 0.05 * (loop - 1));
  var i, n, a;

  if (b.type === 0 || b.type === 3) {
    b.f1 -= dt;
    if (b.f1 <= 0) {
      b.f1 = (b.type === 0 ? 1.25 : 2.1) / dens;
      n = Math.round((b.type === 0 ? 11 : 13) * dens) + (loop - 1) * 2;
      var off = b.t * 1.8;
      for (i = 0; i < n; i++) eShot(b.x, b.y + 6, off + i * TAU / n, spd, 6, b.c);
    }
  }
  if (b.type === 1 || b.type === 3) {
    b.f2 -= dt;
    if (b.f2 <= 0) {
      b.f2 = (b.type === 1 ? 1.7 : 2.5) / dens;
      b.burst = 3 + (b.p2 ? 2 : 0);
      b.bt = 0;
    }
    if (b.burst > 0) {
      b.bt -= dt;
      if (b.bt <= 0) {
        b.bt = 0.12;
        var ang = Math.atan2(player.y - b.y, player.x - b.x);
        var spr = (b.burst - 2) * 0.13;
        eShot(b.x, b.y + 6, ang + spr, spd * 1.12, 6, b.c);
        b.burst--;
      }
    }
  }
  if (b.type === 2 || b.type === 3) {
    b.f3 -= dt;
    if (b.f3 <= 0) {
      b.f3 = (b.type === 2 ? 0.09 : 0.16) / dens;
      b.ang += 0.42;
      var arms = (b.type === 2 && b.p2) ? 4 : 2;
      for (i = 0; i < arms; i++) eShot(b.x, b.y, b.ang + i * TAU / arms, spd * 0.92, 5, b.c);
    }
  }
}

function defeatBoss() {
  if (!boss) return;
  bossX = boss.x; bossY = boss.y;
  boss = null;
  eB.length = 0;
  flashWhite = 1;
  timeScale = 0.18;
  shake = 0.9;
  state = 'clear';
  clearT = 2.2;
  boomT = 0;
  addScore(250);
  for (var i = 0; i < 50; i++) {
    var a = Math.random() * TAU, sp = 40 + Math.random() * 260;
    parts.push({ x: bossX, y: bossY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.6 + Math.random() * 0.8, max: 1.4, c: i % 3 === 0 ? '#ffffff' : '#ffd166', sz: 2 + Math.random() * 3 });
  }
  if (bossNoDamage) {
    addScore(500);
    Game.float(bossX, bossY, 'PERFECT +500', '#ffd166');
    Game.toast('パーフェクト！ +500');
  }
}

function nextRound() {
  loop = 1 + Math.floor(waveIndex / 4);
  state = 'zako';
  zakoLeft = 5 + Math.min(4, loop - 1) * 2;
  zakoSpawnT = 0.5;
  timeScale = 1;
}

function update(dt) {
  if (ended) return;
  nowT += dt;
  if (flashWhite > 0) flashWhite = Math.max(0, flashWhite - dt * 1.8);
  if (shake > 0) shake = Math.max(0, shake - dt * 2.0);
  if (invul > 0) invul -= dt;
  if (timeScale < 1) timeScale = Math.min(1, timeScale + dt * 0.5);
  var sdt = dt * timeScale;
  spdMul = Math.pow(TUNE.loopMul.v, loop - 1);

  var i, j, s;

  for (i = 0; i < stars.length; i++) {
    s = stars[i];
    s.y += s.v * dt;
    if (s.y > H + 4) { s.y = 56; s.x = Math.random() * W; }
  }

  player.x += (player.tx - player.x) * Math.min(1, dt * 20);
  player.y += (player.ty - player.y) * Math.min(1, dt * 20);

  fireT -= sdt;
  if (fireT <= 0) {
    fireT = 1 / TUNE.fireRate.v;
    var cols = 1 + 2 * Math.floor(power / 3);
    if (cols > 5) cols = 5;
    for (j = 0; j < cols; j++) {
      var off = (j - (cols - 1) / 2) * 13;
      pB.push({ x: player.x + off, y: player.y - 18, vy: -720 });
    }
  }

  for (i = pB.length - 1; i >= 0; i--) {
    var pb = pB[i];
    pb.y += pb.vy * sdt;
    if (pb.y < 40) { pB.splice(i, 1); continue; }
    var hit = false;
    if (boss && state === 'boss') {
      var b = boss;
      if (Math.abs(pb.x - b.x) < b.r * 0.82 && Math.abs(pb.y - b.y) < b.r * 0.78) {
        b.hp -= 1;
        addScore(1);
        spark(pb.x, pb.y, 1, b.c);
        hit = true;
        if (b.hp <= 0) defeatBoss();
      }
    }
    if (!hit) {
      for (j = 0; j < zakos.length; j++) {
        var zk = zakos[j];
        if (Math.abs(pb.x - zk.x) < 20 && Math.abs(pb.y - zk.y) < 20) {
          zk.hp -= 1;
          zk.hit = 0.12;
          hit = true;
          spark(pb.x, pb.y, 2, '#9ff');
          if (zk.hp <= 0) killZako(j);
          break;
        }
      }
    }
    if (hit) pB.splice(i, 1);
  }

  var hitR = player.r + 1;
  for (i = eB.length - 1; i >= 0; i--) {
    var eb = eB[i];
    eb.x += eb.vx * sdt;
    eb.y += eb.vy * sdt;
    if (eb.x < -30 || eb.x > W + 30 || eb.y < -30 || eb.y > H + 30) { eB.splice(i, 1); continue; }
    var dx = eb.x - player.x, dy = eb.y - player.y;
    var d2 = dx * dx + dy * dy;
    var hr = hitR + eb.r * 0.72;
    if (d2 < hr * hr) {
      if (invul <= 0) hitPlayer();
      eB.splice(i, 1);
      continue;
    }
    var gr = TUNE.graze.v + eb.r;
    if (!eb.grazed && d2 < gr * gr) {
      eb.grazed = true;
      addScore(5);
      spark(eb.x, eb.y, 3, '#9ff');
      if (nowT - lastGraze > 0.16) {
        lastGraze = nowT;
        Game.float(eb.x, eb.y - 14, '+5', '#9ff');
      }
    }
  }

  for (i = zakos.length - 1; i >= 0; i--) {
    var z = zakos[i];
    z.t += sdt;
    z.y += z.vy * sdt;
    z.x = z.bx + Math.sin(z.t * 1.6) * 36;
    if (z.hit > 0) z.hit -= dt;
    if (z.y > 60 && z.y < H - 140 && state !== 'clear') {
      z.fireT -= sdt;
      if (z.fireT <= 0) {
        z.fireT = 1.7;
        var za = Math.atan2(player.y - z.y, player.x - z.x);
        eShot(z.x, z.y + 12, za, TUNE.eSpeed.v * 0.72 * spdMul, 6, '#ff9f43');
      }
    }
    if (z.y > H + 40) zakos.splice(i, 1);
  }

  for (i = pows.length - 1; i >= 0; i--) {
    var pu = pows[i];
    pu.t += sdt;
    pu.y += 85 * sdt;
    var pdx = player.x - pu.x, pdy = player.y - pu.y;
    var pd = Math.sqrt(pdx * pdx + pdy * pdy);
    if (pd > 1 && pd < 90) {
      pu.x += pdx / pd * 170 * sdt;
      pu.y += pdy / pd * 170 * sdt;
    }
    if (pd < 32) {
      pows.splice(i, 1);
      power++;
      addScore(10);
      spark(pu.x, pu.y, 7, '#ffd166');
      Game.float(pu.x, pu.y - 12, '🔸', '#ffd166');
      if (power % 3 === 0 && power <= 6) Game.toast('弾が強化！');
      continue;
    }
    if (pu.y > H + 30) pows.splice(i, 1);
  }

  for (i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (i = booms.length - 1; i >= 0; i--) {
    booms[i].t -= dt;
    if (booms[i].t <= 0) booms.splice(i, 1);
  }

  if (state === 'zako') {
    zakoSpawnT -= sdt;
    if (zakoLeft > 0 && zakoSpawnT <= 0) {
      spawnZako();
      zakoLeft--;
      zakoSpawnT = 0.7;
    }
    if (zakoLeft === 0 && zakos.length === 0) {
      state = 'warning';
      warnT = 2.0;
    }
  } else if (state === 'warning') {
    warnT -= dt;
    if (warnT <= 0) spawnBoss();
  } else if (state === 'boss') {
    updateBoss(sdt);
  } else if (state === 'clear') {
    clearT -= dt;
    boomT -= dt;
    if (boomT <= 0) {
      boomT = 0.18;
      var ex = bossX + (Math.random() - 0.5) * 150;
      var ey = bossY + (Math.random() - 0.5) * 100;
      spark(ex, ey, 14, '#ffffff');
      booms.push({ x: ex, y: ey, t: 0.45 });
      shake = Math.max(shake, 0.3);
    }
    if (clearT <= 0) {
      waveIndex++;
      nextRound();
    }
  }
}

function band(y, h, ph) {
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y, W, h); ctx.clip();
  ctx.fillStyle = '#ffd400'; ctx.fillRect(0, y, W, h);
  ctx.fillStyle = '#141414';
  for (var i = -2; i < 18; i++) {
    var x = i * 36 + ph;
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x + 16, y + h);
    ctx.lineTo(x + 16 + h * 0.75, y);
    ctx.lineTo(x + h * 0.75, y);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 18, (Math.random() - 0.5) * shake * 18);

  var g = ctx.createLinearGradient(0, 56, 0, H);
  g.addColorStop(0, '#060a18');
  g.addColorStop(0.55, '#0b1030');
  g.addColorStop(1, '#140a26');
  ctx.fillStyle = g;
  ctx.fillRect(-40, -20, W + 80, H + 40);

  var i, s;
  for (i = 0; i < stars.length; i++) {
    s = stars[i];
    ctx.globalAlpha = 0.2 + 0.5 * Math.abs(Math.sin(nowT * 2 + i));
    ctx.fillStyle = i % 5 === 0 ? '#9fd8ff' : '#ffffff';
    ctx.fillRect(s.x, s.y, s.s, s.s * 2.6);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (i = 0; i < pows.length; i++) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(nowT * 8));
    ctx.fillText('🔸', pows[i].x, pows[i].y);
  }
  ctx.globalAlpha = 1;

  ctx.font = "38px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (i = 0; i < zakos.length; i++) {
    var zk = zakos[i];
    if (zk.hit > 0) ctx.globalAlpha = 0.5;
    ctx.fillText('👾', zk.x, zk.y);
    ctx.globalAlpha = 1;
  }

  ctx.lineCap = 'round';
  for (i = 0; i < pB.length; i++) {
    var pb = pB[i];
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#7ff';
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(pb.x, pb.y - 9); ctx.lineTo(pb.x, pb.y + 9); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#e6ffff';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(pb.x, pb.y - 9); ctx.lineTo(pb.x, pb.y + 9); ctx.stroke();
  }

  if (boss && state === 'boss') {
    var b = boss;
    var glowC = b.p2 ? '#ff3355' : b.c;
    var pulse = 0.09 + 0.05 * Math.sin(b.t * 7);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = glowC;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.35, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.26;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.98, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = glowC;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.16, 0, TAU); ctx.stroke();
    ctx.font = "76px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(b.e, b.x, b.y);
    if (b.flash > 0) {
      ctx.globalAlpha = Math.min(0.8, b.flash * 2);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.95, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  for (i = 0; i < eB.length; i++) {
    var eb = eB[i];
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = eb.c;
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r * 2.1, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r * 0.42, 0, TAU); ctx.fill();
  }

  for (i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.font = "44px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (i = 0; i < booms.length; i++) {
    ctx.globalAlpha = Math.max(0, Math.min(1, booms[i].t * 2.6));
    ctx.fillText('💥', booms[i].x, booms[i].y);
  }
  ctx.globalAlpha = 1;

  var blink = invul > 0 && Math.floor(nowT * 14) % 2 === 0;
  if (!blink) {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(-Math.PI / 2);
    ctx.font = "40px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('✈️', 0, 0);
    ctx.restore();
  }
  ctx.fillStyle = '#ff4d6d';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(player.x, player.y, 1.8, 0, TAU); ctx.fill();

  if (boss && state === 'boss') {
    var bw = W - 96, bx = 48, by = 60, bh = 10;
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.fillRect(bx, by, bw, bh);
    var ratio = Math.max(0, boss.hp / boss.hpMax);
    ctx.fillStyle = boss.p2 ? '#ff3355' : '#3cf0ff';
    ctx.fillRect(bx, by, bw * ratio, bh);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.font = "22px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.textAlign = 'left';
    ctx.fillText(boss.e, 16, by + 5);
    ctx.textAlign = 'center';
  }

  if (state === 'warning') {
    var ph = (nowT * 60) % 36;
    band(56, 44, ph);
    band(H - 56, 44, ph);
    ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(nowT * 7));
    ctx.fillStyle = '#ffd400';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('WARNING', W / 2, H / 2 - 20);
    ctx.globalAlpha = 1;
    ctx.font = "64px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(BOSSES[waveIndex % 4].e, W / 2, H / 2 + 70);
    if (loop > 1) {
      ctx.fillStyle = '#ffd400';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('第' + loop + '周目', W / 2, H / 2 + 140);
    }
  }

  if (flashWhite > 0) {
    ctx.globalAlpha = Math.min(0.85, flashWhite);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-60, -60, W + 120, H + 120);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

</script>
