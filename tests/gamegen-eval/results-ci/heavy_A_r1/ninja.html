<style>

html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}

/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}

.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}
.vp-ov h1{font-size:28px}

.vp-ov .vp-big{font-size:44px;font-weight:900;color:#ffd166}
.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="m";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  startSpeed: { v: 220, label: '開始スピード', min: 140, max: 320, step: 10 },
  speedRamp:  { v: 4.5, label: '加速ペース', min: 1, max: 12, step: 0.5 },
  jumpPower:  { v: -560, label: 'ジャンプ力', min: -760, max: -420, step: 10 },
  gravity:    { v: 1500, label: '重力', min: 900, max: 2200, step: 50 },
  glideFall:  { v: 120, label: '滑空の落下', min: 40, max: 280, step: 10 },
  gapStart:   { v: 90, label: '穴の初期幅', min: 60, max: 160, step: 5 },
  gapGrow:    { v: 0.028, label: '穴の広がり', min: 0, max: 0.08, step: 0.002 },
  coinRate:   { v: 0.55, label: '小判・巻物の頻度', min: 0.1, max: 1, step: 0.05 },
  kiteRate:   { v: 0.28, label: '凧の出やすさ', min: 0, max: 0.6, step: 0.02 }
};

var player, objs, particles, dist, score, speed, groundY, runX, glide, jumps, alive, shake, spawnX, nextGap, ninjaShadow, boss, bossTimer, bossEscaped, nightLevel, lastNight, kamiHand, kamiTimer, kamiActive, respawn, combo, comboT, cooldowns, rooftopY, bgSeed, kiteGlide;

function init(){
  groundY = 560;
  runX = W*0.28;
  player = { x: runX, y: groundY, vy: 0, onGround: true };
  objs = [];
  particles = [];
  dist = 0; score = 0;
  speed = TUNE.startSpeed.v;
  glide = false; jumps = 0; alive = true; shake = 0;
  spawnX = W + 60;
  nextGap = 0;
  boss = null; bossTimer = 0; bossEscaped = false;
  nightLevel = 0; lastNight = 0;
  kamiActive = false; kamiTimer = 0; kamiHand = null;
  respawn = false;
  combo = 0; comboT = 0;
  kiteGlide = false;
  bgSeed = Math.random()*1000;
  cooldowns = {};
  nextGap = groundY;
  spawnInit();
  Game.score(0);
  Game.hud('🪙 0');
}

function spawnInit(){
  var x = 640;
  for (var i = 0; i < 6; i++){
    var w = 140 + Math.random()*120;
    objs.push({ type:'roof', x:x, w:w, y:groundY });
    x += w + gapFor(dist, i);
  }
  spawnX = x;
}

function gapFor(d, i){
  var g = TUNE.gapStart.v + d * TUNE.gapGrow.v;
  if (g > 230) g = 230;
  g = g * (0.85 + Math.random()*0.4);
  return g;
}

function addRoof(x, w){
  objs.push({ type:'roof', x:x, w:w, y:groundY });
}

function ensureRoofs(){
  var right = 0;
  for (var i = 0; i < objs.length; i++){
    var o = objs[i];
    if (o.type === 'roof' && o.x + o.w > right) right = o.x + o.w;
  }
  while (right < W + 900){
    var w = 120 + Math.random()*160;
    var gap = gapFor(dist + right, 0);
    var nx = right + gap;
    addRoof(nx, w);
    var d = right;
    var type = 'empty';
    var r = Math.random();
    var interval = 90;
    var n = Math.floor((nx - (right + gap*0.3)) / interval);
    if (n > 0){
      for (var k = 0; k < n; k++){
        var px = right + gap*0.3 + k*interval + 20;
        if (px > nx - 30) continue;
        var rr = Math.random();
        if (rr < 0.10){
          objs.push({ type:'tile', x:px, y:groundY, w:34, h:34, dead:false });
        } else if (rr < 0.16){
          objs.push({ type:'samurai', x:px, y:groundY, w:40, h:48, hp:1 });
        } else if (rr < 0.16 + TUNE.coinRate.v*0.5){
          objs.push({ type:'coin', x:px, y:groundY-70 - Math.random()*90, w:26, h:26, got:false, spin:Math.random()*6 });
        } else if (rr < 0.16 + TUNE.coinRate.v*0.5 + 0.05){
          objs.push({ type:'scroll', x:px, y:groundY-90 - Math.random()*70, w:30, h:30, got:false });
        } else if (rr < 0.16 + TUNE.coinRate.v*0.5 + 0.05 + TUNE.kiteRate.v*0.4){
          objs.push({ type:'kite', x:px+60, y:groundY-200-Math.random()*80, w:44, h:44, got:false, bob:Math.random()*6 });
        }
      }
    }
    right = nx + w;
  }
}

function spawnShuriken(){
  var r = Math.random();
  objs.push({ type:'shuriken', x: W + 40, y: groundY - 60 - Math.random()*140, w:28, h:28, spin:0 });
}

function update(dt){
  if (!alive) return;
  
  var boost = kiteGlide ? 2.4 : 1;
  speed += TUNE.speedRamp.v * dt;
  var vx = speed * boost;
  
  dist += vx * dt * 0.1;
  score += vx * dt * 0.1;
  
  // night each 500m
  var nightNow = Math.floor(dist / 500);
  if (nightNow > lastNight){ lastNight = nightNow; nightLevel = nightNow; Game.toast('🌙 ' + (nightNow*500) + 'm 夜になった！'); }
  
  // boss each 1000m
  var bossNow = Math.floor(dist / 1000);
  if (bossNow > bossEscaped && !boss && bossNow > 0){
    bossEscaped = bossNow;
    boss = { x: W + 80, y: groundY - 90, t: 0, throw: 0.8, escaped: false };
    bossTimer = 10;
    Game.toast('👹 大天狗出現！10秒逃げ切れ！');
  }
  
  if (kiteGlide){
    // move fast
  }
  
  // physics
  var g = TUNE.gravity.v;
  if (glide && player.vy > 0) g = TUNE.glideFall.v;
  player.vy += g * dt;
  player.y += player.vy * dt;
  
  var onRoof = checkRoof();
  if (onRoof){
    if (player.y >= groundY){
      player.y = groundY;
      player.vy = 0;
      if (!player.onGround){
        jumps = 0;
        for (var i=0;i<5;i++) addParticle(player.x, groundY, 'dust');
      }
      player.onGround = true;
    }
  } else {
    player.onGround = false;
  }
  
  if (glide) player.onGround = false;
  
  // fall in hole
  if (player.y > groundY + 80 && !onRoof){
    if (player.y > H + 40){
      if (respawn){ respawn = false; player.y = groundY - 60; player.vy = 0; player.x = runX; jumps = 0; Game.toast('🥷 影分身で復活！'); }
      else { die('穴に落ちた'); return; }
    }
  }
  
  // move world
  var dx = vx * dt;
  for (var i = objs.length-1; i >= 0; i--){
    var o = objs[i];
    o.x -= dx;
    if (o.type === 'kite' && kiteGlide && o.got) o.x = -999;
    if (o.x + (o.w||60) < -120) objs.splice(i,1);
  }
  kamiTimer -= dt;
  
  // combo timer
  if (comboT > 0){ comboT -= dt; if (comboT <= 0) combo = 0; }
  
  // spawn
  ensureRoofs();
  var sinceShuriken = cooldowns.shuriken || 0;
  sinceShuriken -= dt;
  if (sinceShuriken <= 0 && dist > 60){
    spawnShuriken();
    cooldowns.shuriken = Math.max(1.4, 3.5 - dist*0.002);
  } else cooldowns.shuriken = sinceShuriken;
  
  // collisions
  var px = player.x, py = player.y - 34;
  for (var i = objs.length-1; i >= 0; i--){
    var o = objs[i];
    if (o.type === 'roof' || o.type === 'empty') continue;
    var hit = false;
    if (o.type === 'coin' && !o.got && near(px,py,o.x,o.y,30,30)){
      o.got = true; combo++; comboT = 2.2;
      var add = 4 + combo;
      score += add;
      Game.float(o.x, o.y, '+' + add, '#ffd166');
      addParticle(o.x, o.y, 'spark');
      objs.splice(i,1);
      continue;
    }
    if (o.type === 'scroll' && !o.got && near(px,py,o.x,o.y,32,32)){
      o.got = true; respawn = true;
      Game.float(o.x,o.y,'📜影分身','#a78bfa');
      addParticle(o.x,o.y,'spark');
      objs.splice(i,1); continue;
    }
    if (o.type === 'kite' && !o.got && near(px,py,o.x,o.y,40,40)){
      o.got = true; kiteGlide = true;
      Game.float(o.x,o.y,'🪁 つかまった！','#67e8f9');
      Game.toast('🪁 凧で加速！');
      var self = this;
      setTimeout(function(){ kiteGlide = false; }, 1600);
      objs.splice(i,1); continue;
    }
    if (o.type === 'tile' && !o.dead){
      if (near(px,py,o.x,o.y-24,32,44)){
        if (player.vy > 0 && py < o.y - 50){
          o.dead = true; score += 10; Game.float(o.x,o.y-40,'+10','#fca5a5'); addParticle(o.x,o.y-30,'dust');
        } else {
          if (player.y - 20 > groundY - 10){ /* on ground awkward */ }
          die('瓦の山に激突'); return;
        }
      }
    }
    if (o.type === 'samurai' && !o.dead){
      if (near(px,py,o.x,o.y-30,38,54)){
        if (player.vy > 0 && player.y - 34 < o.y - 54){
          o.dead = true; o.y = groundY + 6; score += 20; Game.float(o.x,o.y-50,'+20','#86efac'); addParticle(o.x,o.y-30,'dust');
        } else {
          if (respawn){ respawn=false; player.y = groundY-80; player.vy = -200; Game.toast('🥷 影分身で復活！'); }
          else { die('侍にやられた'); return; }
        }
      }
    }
    if (o.type === 'shuriken'){
      o.spin += dt*20;
      if (near(px,py,o.x,o.y,30,30)){
        if (respawn){ respawn=false; Game.toast('🥷 影分身で復活！'); objs.splice(i,1); }
        else { die('手裏剣に当たった'); return; }
      }
    }
  }
  
  // boss
  if (boss){
    bossTimer -= dt;
    boss.x -= dx*0.6;
    if (boss.x < W*0.72) boss.x = W*0.72;
    boss.y = groundY - 110 + Math.sin(bossTimer*4)*14;
    boss.throw -= dt;
    if (boss.throw <= 0){
      boss.throw = 1.1;
      objs.push({ type:'shuriken', x: boss.x-20, y: boss.y+20, w:28, h:28, spin:0 });
    }
    if (bossTimer <= 0){
      score += 300; Game.float(W/2, 300, '+300 撃退！', '#fde047');
      Game.toast('👹 大天狗を振り切った！+300');
      boss = null;
    }
  }
  
  // particles
  for (var i = particles.length-1; i >= 0; i--){
    var p = particles[i];
    p.x -= dx; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 400*dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i,1);
  }
  
  if (shake > 0) shake -= dt;
  if (player.x < runX) player.x += Math.min(runX-player.x, 200*dt);
  
  score = Math.floor(score);
  Game.score(score);
  Game.hud('🪙 ' + Math.floor(dist) + 'm');
}

function checkRoof(){
  var px = player.x;
  for (var i = 0; i < objs.length; i++){
    var o = objs[i];
    if (o.type !== 'roof') continue;
    if (px > o.x - 2 && px < o.x + o.w + 2){
      if (player.y >= o.y || player.y > groundY - 1) return true;
      return true;
    }
  }
  return false;
}

function near(ax,ay,bx,by,rw,rh){
  return Math.abs(ax-bx) < rw && Math.abs(ay-by) < rh;
}

function addParticle(x,y,type){
  var n = type === 'spark' ? 8 : 4;
  for (var i = 0; i < n; i++){
    particles.push({ x:x, y:y, vx:(Math.random()-0.5)*180, vy:-Math.random()*160, life:0.5+Math.random()*0.4, type:type });
  }
}

function jump(){
  if (jumps < 2){
    player.vy = TUNE.jumpPower.v * (jumps===1?0.92:1);
    jumps++;
    player.onGround = false;
    if (jumps === 2){
      for (var i=0;i<14;i++) addParticle(player.x + (Math.random()-0.5)*30, player.y-10, 'smoke');
    } else {
      for (var i=0;i<5;i++) addParticle(player.x, groundY, 'dust');
    }
  }
}

function die(reason){
  alive = false;
  shake = 0.5;
  if (respawn){ respawn = false; alive = true; player.y = groundY - 80; player.vy=-200; Game.toast('🥷 影分身で復活！'); return; }
  Game.over(score);
}

function draw(){
  var t = dist;
  // sky based on area
  var band = Math.floor(dist / 500) % 3;
  var skyTop, skyBot;
  if (nightLevel % 2 === 1){
    skyTop = '#141a33'; skyBot = '#2a1e3a';
  } else if (band === 0){
    skyTop = '#ff9a56'; skyBot = '#ffd29d';
  } else if (band === 1){
    skyTop = '#7dd3a0'; skyBot = '#d9f4c0';
  } else {
    skyTop = '#8b5cf6'; skyBot = '#c4b5fd';
  }
  var g = ctx.createLinearGradient(0,56,0,H);
  g.addColorStop(0, skyTop); g.addColorStop(1, skyBot);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  
  // sun/moon
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.font = "56px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (nightLevel % 2 === 1){
    ctx.fillText('🌙', W - 90, 150);
  } else {
    ctx.fillText('☀️', W - 90, 140);
  }
  ctx.restore();
  
  // dusk overlay for night - limited vision
  
  // parallax town silhouettes
  drawBackground(t, band);
  
  var ox = shake > 0 ? (Math.random()*8-4) : 0;
  var oy = shake > 0 ? (Math.random()*6-3) : 0;
  ctx.save(); ctx.translate(ox, oy);
  
  // roofs
  for (var i = 0; i < objs.length; i++){
    var o = objs[i];
    if (o.type !== 'roof') continue;
    drawRoof(o.x, o.w);
  }
  
  // objects
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < objs.length; i++){
    var o = objs[i];
    if (o.type === 'coin' && !o.got){
      ctx.save();
      var sc = Math.abs(Math.cos(o.spin + performance.now()*0.004));
      ctx.translate(o.x, o.y); ctx.scale(0.4+sc*0.6, 1);
      ctx.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('🪙', 0, 0); ctx.restore();
    }
    if (o.type === 'scroll' && !o.got){ ctx.font = "28px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; ctx.fillText('📜', o.x, o.y); }
    if (o.type === 'kite' && !o.got){ ctx.font = "40px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; ctx.fillText('🪁', o.x, o.y + Math.sin(performance.now()*0.004+o.bob)*6); }
    if (o.type === 'tile' && !o.dead){ ctx.font = "34px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; ctx.fillText('🧱', o.x, o.y-22); }
    if (o.type === 'samurai' && !o.dead){ ctx.font = "40px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; ctx.fillText('👺', o.x, o.y-32); }
    if (o.type === 'shuriken'){
      ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.spin);
      ctx.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; ctx.fillText('🌀', 0, 0); ctx.restore();
    }
  }
  
  // boss
  if (boss){
    ctx.font = "64px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('👹', boss.x, boss.y);
    // timer bar
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(W*0.72-50, boss.y-70, 100, 10);
    ctx.fillStyle = '#f87171'; ctx.fillRect(W*0.72-50, boss.y-70, 100*Math.max(0,bossTimer/10), 10);
  }
  
  // particles
  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    var a = Math.max(0, p.life);
    if (p.type === 'spark'){ ctx.fillStyle = 'rgba(253,224,71,' + a + ')'; ctx.fillRect(p.x-2, p.y-2, 4, 4); }
    else if (p.type === 'smoke'){ ctx.fillStyle = 'rgba(220,220,220,' + (a*0.7) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 6.28); ctx.fill(); }
    else { ctx.fillStyle = 'rgba(255,255,255,' + (a*0.6) + ')'; ctx.fillRect(p.x-2, p.y-2, 3, 3); }
  }
  
  // player ninja
  var px = player.x, py = player.y;
  ctx.save();
  if (respawn){
    ctx.globalAlpha = 0.5 + 0.5*Math.sin(performance.now()*0.01);
  }
  ctx.font = "48px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🥷', px, py - 32);
  // scarf trail
  ctx.globalAlpha = 0.6;
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.moveTo(px-16, py-38);
  ctx.lineTo(px-44 - Math.sin(performance.now()*0.02)*4, py-46 + Math.sin(performance.now()*0.02)*4);
  ctx.lineTo(px-42, py-34);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  if (kiteGlide){ ctx.font = "36px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; ctx.fillText('🪁', px+30, py-80); }
  
  ctx.restore();
  
  // night vignette
  if (nightLevel % 2 === 1){
    var rg = ctx.createRadialGradient(runX, 480, 90, runX, 480, 520);
    rg.addColorStop(0, 'rgba(0,0,0,0)');
    rg.addColorStop(1, 'rgba(0,0,10,0.92)');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
    ctx.font = "30px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.textAlign='center'; ctx.fillText('🏮', runX, 420);
  }
}

function drawRoof(x, w){
  ctx.fillStyle = '#3b2a4a';
  ctx.fillRect(x, groundY, w, H - groundY);
  ctx.fillStyle = '#5b3a5e';
  var sh = Math.floor((x/28)) % 2 === 0 ? 0 : 6;
  ctx.fillRect(x, groundY, w, 14);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  var kn = Math.floor(w/24);
  for (var k = 0; k < kn; k++){
    ctx.fillRect(x + k*24 + 2, groundY + 2, 18, 4);
  }
  ctx.fillStyle = '#2a1e35';
  ctx.fillRect(x, groundY + 14, w, 6);
}

function drawBackground(t, band){
  var p = (t * 2.2) % 480;
  ctx.fillStyle = 'rgba(60,30,70,0.45)';
  for (var layer = 0; layer < 2; layer++){
    var speed = layer === 0 ? 0.25 : 0.5;
    var off = (t * speed * 3) % 200;
    var base = groundY - 40 + layer*20;
    for (var i = -1; i < 6; i++){
      var bx = i*200 - off;
      var h = (i%2===0? 120:90) + layer*30;
      ctx.fillStyle = layer===0 ? 'rgba(70,40,90,0.5)' : 'rgba(50,30,70,0.7)';
      ctx.fillRect(bx, base - h, 120, h);
      // roof triangle
      ctx.beginPath();
      ctx.moveTo(bx-10, base-h);
      ctx.lineTo(bx+60, base-h-30);
      ctx.lineTo(bx+130, base-h);
      ctx.closePath(); ctx.fill();
    }
  }
}

function onDown(x,y){
  if (!alive) return;
  jump();
}

function onUp(x,y){
  if (!alive) return;
  // nothing; glide handled by hold state via timestamp
}

setInterval && 0;
/*__VAPPA_JS_END__*/
</script>
</body></html>
