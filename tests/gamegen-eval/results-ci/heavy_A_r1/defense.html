<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">

};

var PATH = [
  { x: -40, y: 132 }, { x: 108, y: 132 }, { x: 108, y: 268 }, { x: 364, y: 268 },
  { x: 364, y: 404 }, { x: 108, y: 404 }, { x: 108, y: 540 }, { x: 324, y: 540 },
  { x: 324, y: 596 }, { x: 376, y: 596 }
];
var SEG = [];
var TOTAL = 0;
for (var _si = 0; _si < PATH.length - 1; _si++) {
  var _a = PATH[_si], _b = PATH[_si + 1];
  var _dd = Math.sqrt((_b.x - _a.x) * (_b.x - _a.x) + (_b.y - _a.y) * (_b.y - _a.y));
  SEG.push(_dd);
  TOTAL += _dd;
}

var SPOT_POS = [

];
var FARM = { x: 376, y: 544, w: 88, h: 102 };

var DEFS = [
  { key: 'scare', name: 'かかし', emo: '🧑‍🌾', cost: 45, range: [88, 98, 110], slow: [0.42, 0.56, 0.70] },
  { key: 'archer', name: '弓の小屋', emo: '🏹', cost: 55, range: [118, 132, 146], dmg: [8, 13, 19], rate: [1.3, 1.6, 2.0] },

  { key: 'falcon', name: '鷹匠', emo: '🦅', cost: 70, range: [120, 135, 150], dmgAir: [20, 32, 46], dmgGround: [6, 9, 13], rate: [1.0, 1.2, 1.5] }
];

var EDEF = {
  rat: { emo: '🐀', hp: 14, speed: 78, reward: 6, air: false, size: 24 },
  boar: { emo: '🐗', hp: 58, speed: 48, reward: 13, air: false, size: 30 },
  crow: { emo: '🐦‍⬛', hp: 34, speed: 66, reward: 11, air: true, size: 26 },
  bear: { emo: '🐻', hp: 170, speed: 34, reward: 60, air: false, size: 42 }
};

var UI = {
  barY: 650,
  harv: { x: 296, y: 658, w: 172, h: 46 },
  menu: { x: 8, y: 514, w: 464, h: 132 },
  cardX0: 16, cardW: 106, cardGap: 8, cardY: 546, cardH: 92,
  up: { x: 8, y: 552, w: 464, h: 94 },
  upBtn: { x: 292, y: 566, w: 168, h: 66 }
};

var bg = null;
var spots, towers, enemies, shots, parts;
var money, veggies, kills, wave, combo, comboT, score;
var state, prepT, spawnQ, spawnT, nextPlan;
var selected, menuSpot, harvestCost, gameOver, shake, time;

function defOf(k) {
  for (var i = 0; i < DEFS.length; i++) { if (DEFS[i].key === k) return DEFS[i]; }
  return DEFS[0];
}

function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function strokePath(g, arr) {
  g.beginPath();
  g.moveTo(arr[0].x, arr[0].y);
  for (var i = 1; i < arr.length; i++) g.lineTo(arr[i].x, arr[i].y);
  g.stroke();
}

function buildBg() {
  var dpr = Math.min(3, window.devicePixelRatio || 1);
  bg = document.createElement('canvas');
  bg.width = Math.round(W * dpr);
  bg.height = Math.round(H * dpr);
  var g = bg.getContext('2d');
  g.scale(dpr, dpr);
  var gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#8ed26a');
  gr.addColorStop(0.55, '#6fbe4f');
  gr.addColorStop(1, '#4f9a3c');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(20,70,20,0.06)';
  for (var y = 58; y < 650; y += 26) g.fillRect(0, y, W, 11);
  g.lineJoin = 'round';
  g.lineCap = 'round';
  g.strokeStyle = '#a8814d'; g.lineWidth = 40; strokePath(g, PATH);
  g.strokeStyle = '#c9a267'; g.lineWidth = 32; strokePath(g, PATH);
  g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = 9; strokePath(g, PATH);
  var deco = [[28, 210], [452, 210], [28, 340], [452, 340], [28, 470], [452, 470]];
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (var i = 0; i < deco.length; i++) g.fillText('🌳', deco[i][0], deco[i][1]);
  g.font = "16px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  var fl = [[150, 90], [330, 90], [30, 590], [450, 590], [240, 372]];
  for (var j = 0; j < fl.length; j++) g.fillText('🌼', fl[j][0], fl[j][1]);
  g.fillStyle = '#7a5230';
  rr(g, FARM.x, FARM.y, FARM.w, FARM.h, 10); g.fill();
  g.strokeStyle = '#5c3c22'; g.lineWidth = 3;
  rr(g, FARM.x, FARM.y, FARM.w, FARM.h, 10); g.stroke();
  g.fillStyle = 'rgba(12,20,14,0.78)';
  rr(g, 8, 650, 464, 62, 14); g.fill();
}

function init() {

  selected = null; menuSpot = -1; gameOver = false;
  harvestCost = 90; shake = 0; time = 0;
  spots = [];
  for (var i = 0; i < SPOT_POS.length; i++) spots.push({ x: SPOT_POS[i][0], y: SPOT_POS[i][1], tower: -1 });
  state = 'prep';
  prepT = TUNE.waveGap.v;
  spawnQ = []; spawnT = 0;
  nextPlan = planWave(1);
  if (!bg) buildBg();
  Game.score(0);
  Game.hud('🥕×' + veggies);
}

function updateScore() {
  score = kills * 10 + Math.max(0, veggies) * 50 + wave * 100;
  Game.score(score);
}

function planWave(w) {
  var scale = 1 + TUNE.enemyHpScale.v * (w - 1);
  var boss = (w % 5 === 0);
  var n = Math.round(3 + w * TUNE.enemyCount.v);
  if (n > 24) n = 24;
  var pool = ['rat', 'rat', 'rat'];
  if (w >= 2) { pool.push('boar'); pool.push('boar'); }
  if (w >= 3) { pool.push('crow'); pool.push('crow'); }
  var list = [];
  if (boss) {
    n = Math.round(n * 0.5);
    list.push({ type: 'bear', scale: scale * (1 + 0.05 * w) });
  }
  for (var i = 0; i < n; i++) list.push({ type: pool[(Math.random() * pool.length) | 0], scale: scale });
  return list;
}

function startWave() {
  wave++;
  spawnQ = nextPlan || planWave(wave);
  nextPlan = null;
  spawnT = 0.5;
  state = 'wave';
  updateScore();
  if (wave % 5 === 0) Game.toast('WAVE ' + wave + '  👑ボス襲来！');
  else Game.toast('WAVE ' + wave + ' 開始！');
}

function posAt(s) {
  var i = 0;
  while (i < SEG.length && s > SEG[i]) { s -= SEG[i]; i++; }
  if (i >= SEG.length) return { x: PATH[PATH.length - 1].x, y: PATH[PATH.length - 1].y };
  var a = PATH[i], b = PATH[i + 1];
  var t = s / SEG[i];
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function spawnEnemy(type, scale) {
  var d = EDEF[type];
  var hp = Math.round(d.hp * scale);
  enemies.push({
    type: type, hp: hp, maxHp: hp, speed: d.speed, s: 0, x: PATH[0].x, y: PATH[0].y,
    air: d.air, reward: d.reward, size: d.size, stopT: 0, slow: 1, hitT: 0,
    bob: Math.random() * 6, dead: false
  });
}

function spark(x, y, n, col) {
  if (parts.length > 110) return;
  for (var i = 0; i < n; i++) {
    var a = Math.random() * 6.283;
    var sp = 40 + Math.random() * 130;
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50, t: 0.35 + Math.random() * 0.3, max: 0.65, col: col || '#ffe9a8' });
  }
}

function hitEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg;
  e.hitT = 0.16;
  spark(e.x, e.y, 2);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.dead = true;
  kills++;
  comboT = 2.2;
  combo++;
  var mult = 1 + (combo - 1) * 0.15;
  var gain = Math.max(1, Math.round(e.reward * mult * TUNE.killMoney.v));
  money += gain;
  Game.float(e.x, e.y - 10, '+' + gain + '💰', '#ffe066');
  if (combo > 1) Game.float(e.x, e.y - 36, '×' + combo + 'コンボ', '#ff9f43');
  spark(e.x, e.y, 7, '#fff2b0');
  updateScore();
}

function loseVeggie() {
  veggies--;
  shake = 0.5;
  combo = 0; comboT = 0;
  Game.hud('🥕×' + Math.max(0, veggies));
  Game.float(FARM.x + 14, FARM.y + 24, '-1🥕', '#ff6b6b');
  spark(FARM.x + 44, FARM.y + 50, 10, '#ff9f9f');
  updateScore();
  if (veggies <= 0) {
    gameOver = true;
    updateScore();
    Game.over(score);
  }
}

function towerAct(t, dt) {
  var d = defOf(t.key);
  var r = d.range[t.lv - 1];
  if (t.flash > 0) t.flash -= dt;
  if (t.key === 'scare') {
    var amt = 1 - d.slow[t.lv - 1];
    for (var i = 0; i < enemies.length; i++) {
      var es = enemies[i];
      if (es.air || es.dead) continue;
      var dx = es.x - t.x, dy = es.y - t.y;
      if (dx * dx + dy * dy <= r * r && es.slow > amt) es.slow = amt;
    }
    return;
  }
  t.cd -= dt;
  if (t.key === 'pit') {
    if (t.cd > 0) return;
    var bestP = null;
    var bsP = -1;
    for (var j = 0; j < enemies.length; j++) {
      var ep = enemies[j];
      if (ep.air || ep.dead || ep.stopT > 0) continue;
      var px = ep.x - t.x, py = ep.y - t.y;
      if (px * px + py * py > r * r) continue;
      if (ep.s > bsP) { bsP = ep.s; bestP = ep; }
    }
    if (bestP) {
      bestP.stopT = d.stop[t.lv - 1];
      t.cd = d.cd[t.lv - 1];
      t.flash = 0.4;
      spark(bestP.x, bestP.y, 5, '#c8a06a');
    }
    return;
  }
  if (t.cd > 0) return;
  var tgt = null;
  var bestS = -1;
  for (var m = 0; m < enemies.length; m++) {
    var en = enemies[m];
    if (en.dead) continue;
    var ex = en.x - t.x, ey = en.y - t.y;
    if (ex * ex + ey * ey > r * r) continue;
    var pri = en.s + (t.key === 'falcon' && en.air ? 5000 : 0);
    if (pri > bestS) { bestS = pri; tgt = en; }
  }
  if (!tgt) return;
  var dmg;
  if (t.key === 'archer') dmg = d.dmg[t.lv - 1];
  else dmg = tgt.air ? d.dmgAir[t.lv - 1] : d.dmgGround[t.lv - 1];
  hitEnemy(tgt, dmg);
  t.cd = 1 / d.rate[t.lv - 1];
  t.recoil = 0.12;
  shots.push({
    x1: t.x, y1: t.y - 6, x2: tgt.x, y2: tgt.y, t: 0.14, max: 0.14,
    col: t.key === 'archer' ? '#ffe9a8' : '#b9e6ff'
  });
}

function update(dt) {
  time += dt;
  if (shake > 0) shake -= dt * 2;
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.t -= dt;
    if (p.t <= 0) parts.splice(i, 1);
  }
  for (var s = shots.length - 1; s >= 0; s--) {
    shots[s].t -= dt;
    if (shots[s].t <= 0) shots.splice(s, 1);
  }
  if (gameOver) return;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  if (state === 'prep') {
    prepT -= dt;
    if (prepT <= 0) startWave();
  } else if (spawnQ.length > 0) {
    spawnT -= dt;
    if (spawnT <= 0) {
      var item = spawnQ.shift();
      spawnEnemy(item.type, item.scale);
      spawnT = Math.max(0.34, 1.05 - wave * 0.04);
    }
  }
  for (var a = 0; a < enemies.length; a++) {
    enemies[a].slow = 1;
    if (enemies[a].hitT > 0) enemies[a].hitT -= dt;
  }
  for (var t = 0; t < towers.length; t++) towerAct(towers[t], dt);
  for (var k = enemies.length - 1; k >= 0; k--) { if (enemies[k].dead) enemies.splice(k, 1); }
  for (var e = enemies.length - 1; e >= 0; e--) {
    var en = enemies[e];
    if (en.stopT > 0) en.stopT -= dt;
    else en.s += en.speed * en.slow * dt;
    var pp = posAt(en.s);
    en.x = pp.x; en.y = pp.y;
    if (en.s >= TOTAL) {
      enemies.splice(e, 1);
      loseVeggie();
      if (gameOver) return;
    }
  }
  if (state === 'wave' && spawnQ.length === 0 && enemies.length === 0) {
    var bonus = 8 + wave * 3;
    money += bonus;
    state = 'prep';
    prepT = TUNE.waveGap.v;
    nextPlan = planWave(wave + 1);
    combo = 0; comboT = 0;
    Game.toast('WAVE ' + wave + ' クリア！ +💰' + bonus);
  }
}

function drawFarm() {
  var cols = 5, rows = 3;
  var cw = FARM.w / cols, ch = FARM.h / rows;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = "15px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  var n = Math.min(veggies, cols * rows);
  for (var i = 0; i < n; i++) {
    var cx = i % cols, cy = Math.floor(i / cols);
    ctx.fillText('🥕', FARM.x + cw * (cx + 0.5), FARM.y + ch * (cy + 0.5));
  }
}

function drawSpots() {
  for (var i = 0; i < spots.length; i++) {
    var s = spots[i];
    if (s.tower >= 0) continue;
    var pulse = 0.5 + 0.5 * Math.sin(time * 3.5 + i * 1.3);
    ctx.beginPath();
    ctx.arc(s.x, s.y, 22, 0, 6.283);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.08 + 0.10 * pulse) + ')';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s.x, s.y, 18, 0, 6.283);
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.35 * pulse) + ')';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.45 + 0.4 * pulse) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x - 6, s.y); ctx.lineTo(s.x + 6, s.y);
    ctx.moveTo(s.x, s.y - 6); ctx.lineTo(s.x, s.y + 6);
    ctx.stroke();
  }
}

function drawRanges() {
  if (selected === null) return;
  var t = towers[selected];
  if (!t) return;
  var r = defOf(t.key).range[t.lv - 1];
  ctx.beginPath();
  ctx.arc(t.x, t.y, r, 0, 6.283);
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 5]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawTowers() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < towers.length; i++) {
    var t = towers[i];
    var d = defOf(t.key);
    if (t.flash > 0) {
      ctx.beginPath();
      ctx.arc(t.x, t.y, 30 + (0.4 - t.flash) * 60, 0, 6.283);
      ctx.strokeStyle = 'rgba(255,230,150,' + t.flash + ')';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(t.x, t.y + 5, 16, 0, 6.283);
    ctx.fillStyle = 'rgba(50,35,15,0.22)';
    ctx.fill();
    if (t.lv >= 3) {
      ctx.beginPath();
      ctx.arc(t.x, t.y, 20, 0, 6.283);
      ctx.strokeStyle = 'rgba(255,209,102,0.9)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    var size = Math.round(26 + (t.lv - 1) * 4);
    ctx.font = size + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillStyle = '#fff';
    ctx.fillText(d.emo, t.x, t.y);
    for (var k = 0; k < t.lv; k++) {
      ctx.beginPath();
      ctx.arc(t.x - 8 + k * 8, t.y + 19, 3, 0, 6.283);
      ctx.fillStyle = '#ffd166';
      ctx.fill();
    }
  }
}

function drawEnemies() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    var size = e.size * (1 + Math.max(0, e.hitT) * 1.1);
    var yy = e.y + (e.air ? -7 + Math.sin(time * 6 + e.bob) * 2 : 0);
    if (e.air) {
      ctx.beginPath();
      ctx.save();
      ctx.translate(e.x, e.y + 15);
      ctx.scale(1, 0.4);
      ctx.arc(0, 0, 12, 0, 6.283);
      ctx.restore();
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.fill();
    }
    if (e.slow < 1) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, size * 0.62, 0, 6.283);
      ctx.fillStyle = 'rgba(120,200,255,0.30)';
      ctx.fill();
    }
    ctx.font = Math.round(size) + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillStyle = '#fff';
    ctx.fillText(EDEF[e.type].emo, e.x, yy);
    if (e.stopT > 0) {
      ctx.font = "16px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('💫', e.x, yy - size * 0.75);
    }
    if (e.hp < e.maxHp || e.type === 'bear') {
      var bw = e.size * 0.95, bh = 4;
      var bx = e.x - bw / 2, by = yy - size * 0.62 - 9;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = e.air ? '#7dd3fc' : '#ef4444';
      ctx.fillRect(bx, by, bw * Math.max(0, e.hp / e.maxHp), bh);
    }
  }
}

function drawShots() {
  for (var i = 0; i < shots.length; i++) {
    var s = shots[i];
    ctx.globalAlpha = s.t / s.max;
    ctx.strokeStyle = s.col;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawParts() {
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.globalAlpha = Math.max(0, p.t / p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, 6.283);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function previewText() {
  if (!nextPlan || nextPlan.length === 0) return '';
  var counts = {};
  var order = [];
  for (var i = 0; i < nextPlan.length; i++) {
    var ty = nextPlan[i].type;
    if (!counts[ty]) { counts[ty] = 0; order.push(ty); }
    counts[ty]++;
  }
  var s = '';
  for (var j = 0; j < order.length; j++) {
    if (j > 0) s += '  ';
    s += EDEF[order[j]].emo + '×' + counts[order[j]];
  }
  return s;
}

function statsText(t) {
  var d = defOf(t.key);
  var i = t.lv - 1;
  if (t.key === 'scare') return 'Lv' + t.lv + '  鈍足' + Math.round(d.slow[i] * 100) + '%  範囲' + d.range[i];
  if (t.key === 'archer') return 'Lv' + t.lv + '  威力' + d.dmg[i] + '  連射' + d.rate[i] + '/秒';
  if (t.key === 'pit') return 'Lv' + t.lv + '  停止' + d.stop[i] + '秒  範囲' + d.range[i];
  return 'Lv' + t.lv + '  対空' + d.dmgAir[i] + '  対地' + d.dmgGround[i];
}

    ctx.lineWidth = 2;

    ctx.font = "bold 17px 'Apple Color Emoji','Noto Color Emoji',sans-serif";

    ctx.font = "16px 'Apple Color Emoji','Noto Color Emoji',sans-serif";

  } else if (state === 'wave') {
    rr(ctx, 140, 62, 200, 34, 12);
    ctx.fillStyle = 'rgba(10,20,12,0.55)';
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = "bold 16px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('WAVE ' + wave + '  のこり' + (spawnQ.length + enemies.length), 240, 80);
  }
  if (menuSpot >= 0) drawMenu();
  if (selected !== null && towers[selected]) drawUpPanel();
}

function draw() {
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  else { ctx.fillStyle = '#6fbe4f'; ctx.fillRect(0, 0, W, H); }
  drawFarm();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
  drawSpots();
  drawRanges();
  drawTowers();
  drawEnemies();
  drawShots();
  drawParts();
  ctx.restore();
  drawUI();
}

function tryBuild(si, d) {
  if (money < d.cost) { Game.toast('💰が足りない！'); menuSpot = -1; return; }
  money -= d.cost;
  var sp = spots[si];
  towers.push({ key: d.key, lv: 1, x: sp.x, y: sp.y, cd: 0, recoil: 0, flash: 0 });
  sp.tower = towers.length - 1;
  menuSpot = -1;
  Game.float(sp.x, sp.y - 26, d.name + ' 設置！', '#a7f3d0');
  spark(sp.x, sp.y, 10, '#d9f7c8');
}

function tryUpgrade(idx) {
  var t = towers[idx];
  if (!t || t.lv >= 3) return;
  var d = defOf(t.key);
  var cost = Math.round(d.cost * TUNE.upgradeCostRate.v * t.lv);
  if (money < cost) { Game.toast('💰が足りない！'); return; }
  money -= cost;
  t.lv++;
  Game.float(t.x, t.y - 28, 'Lv' + t.lv + '！', '#ffd166');
  spark(t.x, t.y, 12, '#ffe9a8');
}

function doHarvest() {
  if (veggies >= 15) { Game.toast('畑がいっぱいだ'); return; }
  if (money < harvestCost) { Game.toast('💰が足りない！'); return; }
  money -= harvestCost;
  veggies++;
  harvestCost += 30;
  Game.hud('🥕×' + veggies);
  updateScore();
  Game.float(FARM.x + 44, FARM.y + 20, '+1🥕', '#86efac');
}

function onDown(x, y) {
  if (gameOver) return;
  if (menuSpot >= 0) {
    if (y >= UI.menu.y && y <= UI.menu.y + UI.menu.h) {
      for (var i = 0; i < DEFS.length; i++) {
        var cx = UI.cardX0 + i * (UI.cardW + UI.cardGap);
        if (x >= cx && x <= cx + UI.cardW && y >= UI.cardY && y <= UI.cardY + UI.cardH) {
          tryBuild(menuSpot, DEFS[i]);
          return;
        }
      }
      return;
    }
    menuSpot = -1;
  }
  if (selected !== null) {
    if (x >= UI.upBtn.x && x <= UI.upBtn.x + UI.upBtn.w && y >= UI.upBtn.y && y <= UI.upBtn.y + UI.upBtn.h) {
      tryUpgrade(selected);
      return;
    }
    if (y >= UI.up.y && y <= UI.up.y + UI.up.h && x >= UI.up.x && x <= UI.up.x + UI.up.w) return;
    selected = null;
  }
  if (x >= UI.harv.x && x <= UI.harv.x + UI.harv.w && y >= UI.harv.y && y <= UI.harv.y + UI.harv.h) {
    doHarvest();
    return;
  }
  for (var s = 0; s < spots.length; s++) {
    var sp = spots[s];
    var dx = x - sp.x, dy = y - sp.y;
    if (dx * dx + dy * dy <= 26 * 26) {
      if (sp.tower >= 0) { selected = sp.tower; menuSpot = -1; }
      else { menuSpot = s; selected = null; }
      return;
    }
  }
  selected = null;
  menuSpot = -1;
}
