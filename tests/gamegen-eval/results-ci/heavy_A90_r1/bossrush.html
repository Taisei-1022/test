<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.vp-hud span{background:rgba(8,12,26,.55);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px 12px}
.vp-hud span:empty{display:none}
.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}
.vp-ov h1{font-size:28px}
.vp-ov p{color:#b9c1de;font-size:14.5px;line-height:1.8;max-width:340px;white-space:pre-line}
.vp-ov .vp-big{font-size:44px;font-weight:900;color:#ffd166}
.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
[hidden]{display:none!important}
</style>

<canvas id="vpc"></canvas>
<div id="vpstage">
  <div id="vpdom"></div>
  <div class="vp-hud" id="vphud" hidden><span id="vphl">0点</span><span id="vphr"></span></div>
  <div class="vp-toast" id="vptoast"></div>
  <div class="vp-ov" id="vpov">
    <h1>弾幕ボスラッシュ</h1>
    <p>ドラッグで自機✈️を上下左右に移動（指の少し上に自機が来る）。弾は自動連射。画面をダブルタップでボム💣。4体のボスを倒して2周目を目指せ！</p>
    <button class="vp-btn" id="vpstart">スタート</button>
  </div>
</div>
<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;
</script>
<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TAU = Math.PI * 2;
var TUNE = {
  follow:      { v: 1.0, label: '自機の追従速度', min: 0.4, max: 2.0, step: 0.05 },
  bulletSpeed: { v: 1.0, label: '敵弾の速さ',     min: 0.6, max: 2.0, step: 0.05 },
  fireRate:    { v: 1.0, label: '連射速度',       min: 0.5, max: 2.5, step: 0.1 },
  bossHp:      { v: 1.0, label: 'ボスHP倍率',     min: 0.5, max: 3.0, step: 0.1 },
  bombCount:   { v: 3,   label: 'ボム数',         min: 0,   max: 5,   step: 1 },
  grazeBonus:  { v: 5,   label: 'グレイズ点',     min: 1,   max: 20,  step: 1 },
  lives:       { v: 3,   label: 'ライフ',         min: 1,   max: 5,   step: 1 },
  loopSpeed:   { v: 1.5, label: '2周目の弾速',    min: 1.0, max: 3.0, step: 0.1 }
};
var BOSS_DEFS = [
  { e: '🐙', name: 'オクトパス', hp: 800,  hue: 320 },
  { e: '🦂', name: 'スコルピオ', hp: 1400, hue: 28  },
  { e: '🐲', name: 'ドラゴン',   hp: 2100, hue: 140 },
  { e: '👁️', name: 'アイ',       hp: 3000, hue: 272 }
];
var player, ebullets, pbullets, particles, drops, minions, boss, stars;
var lives, bombs, power, powerCnt, score, loop, stageIdx;
var state, stateT, warnT, spawnTimer, spawnedMinions, minionsToSpawn;
var shake, flash, timeScale, invuln, bossHitless;
var lastTapT, lastTapX, lastTapY, activeId;
var bgGrad;

function init(){
  player = { x: W/2, y: H-170, tx: W/2, ty: H-170, r: 4, graze: 15, fireT: 0 };
  ebullets = []; pbullets = []; particles = []; drops = []; minions = []; stars = [];
  boss = null;
  lives = TUNE.lives.v; bombs = TUNE.bombCount.v;
  power = 0; powerCnt = 0; score = 0; loop = 0; stageIdx = 0;
  state = 'warning'; stateT = 0; warnT = 2.2;
  spawnTimer = 0; spawnedMinions = 0; minionsToSpawn = 4;
  shake = 0; flash = 0; timeScale = 1; invuln = 0; bossHitless = true;
  lastTapT = -9; lastTapX = 0; lastTapY = 0; activeId = null;
  for (var i = 0; i < 70; i++){
    stars.push({ x: Math.random()*W, y: Math.random()*H, s: 8 + Math.random()*34, r: 0.5 + Math.random()*1.4, a: 0.2 + Math.random()*0.6 });
  }
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#04050d');
  bgGrad.addColorStop(0.55, '#0a0f22');
  bgGrad.addColorStop(1, '#05060f');
  Game.hud(hudText());
  Game.score(0);
}

function hudText(){
  var s = '';
  for (var i = 0; i < lives; i++) s += '❤️';
  s += ' 💣' + bombs;
  return s;
}

function addScore(n){
  score += n;
  Game.score(Math.floor(score));
}

function spark(x, y, hue, n){
  for (var i = 0; i < n; i++){
    var a = Math.random()*TAU, sp = 30 + Math.random()*130;
    particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.22 + Math.random()*0.35, max: 0.6, hue: hue, size: 1 + Math.random()*2 });
  }
}

function updateStars(dt){
  for (var i = 0; i < stars.length; i++){
    var s = stars[i];
    s.y += s.s * dt;
    if (s.y > H + 4){ s.y = -4; s.x = Math.random()*W; }
  }
}

function updateParticles(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function setTarget(x, y){
  var tx = Math.max(18, Math.min(W - 18, x));
  var ty = Math.max(230, Math.min(H - 40, y - 66));
  player.tx = tx; player.ty = ty;
}

function onDown(x, y, id){
  if (state === 'over') return;
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now()/1000 : Date.now()/1000;
  if (now - lastTapT < 0.32 && Math.abs(x - lastTapX) < 90 && Math.abs(y - lastTapY) < 90){
    useBomb();
    lastTapT = -9;
  } else {
    lastTapT = now;
  }
  lastTapX = x; lastTapY = y;
  if (activeId === null){
    activeId = id;
    setTarget(x, y);
  }
}

function onMove(x, y, id){
  if (id === activeId) setTarget(x, y);
}

function onUp(x, y, id){
  if (id === activeId) activeId = null;
}

function useBomb(){
  if (state === 'over' || bombs <= 0) return;
  bombs--;
  flash = Math.max(flash, 0.9);
  shake = Math.max(shake, 0.9);
  invuln = Math.max(invuln, 1.2);
  for (var i = 0; i < ebullets.length; i += 2) spark(ebullets[i].x, ebullets[i].y, 55, 2);
  ebullets.length = 0;
  if (boss && !boss.entering && !boss.dead) damageBoss(350, boss.x, boss.y);
  for (var m = minions.length - 1; m >= 0; m--) hitMinion(m, 200);
  Game.hud(hudText());
  Game.toast('💣 ボム！');
}

function firePlayer(){
  var n = power === 0 ? 1 : (power === 1 ? 3 : 5);
  var spd = 640;
  for (var i = 0; i < n; i++){
    var off = i - (n - 1)/2;
    var a = -Math.PI/2 + off * 0.085;
    pbullets.push({ x: player.x + off*9, y: player.y - 14, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, dmg: 5 });
  }
}

function spawnEB(x, y, ang, spd, r, hue, p2){
  if (ebullets.length > 320) return;
  ebullets.push({ x: x, y: y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, r: r, hue: p2 ? (hue + 150) % 360 : hue, grazed: false });
}

function spawnBoss(){
  var def = BOSS_DEFS[stageIdx % 4];
  var mul = TUNE.bossHp.v * (1 + 0.75*loop);
  var hp = def.hp * mul;
  boss = { idx: stageIdx % 4, e: def.e, name: def.name, hue: def.hue, x: W/2, y: -80, r: 34,
           hp: hp, maxHp: hp, t: 0, fireT: 1.0, t2: 0.5, t3: 0.3, ang: 0, spin: 0,
           phase: 1, entering: true, dead: false, deadT: 0, moveT: 0 };
  bossHitless = true;
  state = 'boss'; stateT = 0;
}

function updateBoss(dt, raw){
  var b = boss;
  if (!b) return;
  b.t += dt; b.moveT += raw;
  if (b.entering){
    b.y += (140 - b.y) * Math.min(1, raw*3.5);
    if (b.y > 138){ b.y = 140; b.entering = false; b.fireT = 0.8; }
  } else {
    b.x = W/2 + Math.sin(b.moveT*0.7)*105;
    b.y = 140 + Math.sin(b.moveT*1.3)*14;
    bossFire(dt);
  }
}

function bossFire(dt){
  var b = boss;
  var p2 = b.hp <= b.maxHp*0.5;
  if (p2 && b.phase === 1){
    b.phase = 2;
    flash = Math.max(flash, 0.6);
    shake = Math.max(shake, 0.35);
    for (var k = 0; k < 24; k++){
      var a = Math.random()*TAU, sp = 60 + Math.random()*220;
      particles.push({ x: b.x, y: b.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.4 + Math.random()*0.6, max: 1, hue: b.hue + 150, size: 2 + Math.random()*2.5 });
    }
    Game.toast('第2形態！');
    b.fireT = 0.6; b.t2 = 0.6; b.t3 = 0.3;
  }
  var spd = 175 * TUNE.bulletSpeed.v * (loop === 0 ? 1 : TUNE.loopSpeed.v) * (p2 ? 1.3 : 1);
  b.spin += dt * (p2 ? 4.8 : 3.2);
  b.fireT -= dt;
  var base, i, n;
  if (b.idx === 0){
    if (b.fireT <= 0){
      b.fireT = p2 ? 0.95 : 1.5;
      n = p2 ? 20 : 13;
      b.ang += 0.35;
      for (i = 0; i < n; i++) spawnEB(b.x, b.y, b.ang + i*TAU/n, spd*0.85, 6, b.hue, p2);
    }
  } else if (b.idx === 1){
    if (b.fireT <= 0){
      b.fireT = p2 ? 0.6 : 0.95;
      base = Math.atan2(player.y - b.y, player.x - b.x);
      for (i = -1; i <= 1; i++) spawnEB(b.x, b.y + 12, base + i*0.15, spd*1.5, 5, b.hue, p2);
    }
    b.t2 -= dt;
    if (b.t2 <= 0){
      b.t2 = p2 ? 1.3 : 2.0;
      for (i = 0; i < 9; i++) spawnEB(b.x, b.y, Math.PI*0.15 + i*(Math.PI*0.7/8), spd*0.85, 6, b.hue, p2);
    }
  } else if (b.idx === 2){
    if (b.fireT <= 0){
      b.fireT = p2 ? 0.075 : 0.105;
      var arms = p2 ? 4 : 2;
      for (i = 0; i < arms; i++) spawnEB(b.x, b.y, b.spin + i*TAU/arms, spd*0.9, 6, b.hue, p2);
    }
    b.t2 -= dt;
    if (b.t2 <= 0){
      b.t2 = p2 ? 1.5 : 2.4;
      base = Math.atan2(player.y - b.y, player.x - b.x);
      for (i = -1; i <= 1; i++) spawnEB(b.x, b.y, base + i*0.14, spd*1.4, 5, b.hue, p2);
    }
  } else {
    if (b.fireT <= 0){
      b.fireT = p2 ? 0.85 : 1.3;
      n = p2 ? 22 : 15;
      b.ang += 0.45;
      for (i = 0; i < n; i++) spawnEB(b.x, b.y, b.ang + i*TAU/n, spd*0.8, 6, b.hue, p2);
    }
    b.t2 -= dt;
    if (b.t2 <= 0){
      b.t2 = p2 ? 0.55 : 0.9;
      base = Math.atan2(player.y - b.y, player.x - b.x);
      for (i = -1; i <= 1; i++) spawnEB(b.x, b.y, base + i*0.18, spd*1.5, 5, b.hue, p2);
    }
    b.t3 -= dt;
    if (b.t3 <= 0){
      b.t3 = 0.13;
      for (i = 0; i < 2; i++) spawnEB(b.x, b.y, b.spin + i*Math.PI, spd*0.85, 5, b.hue, p2);
    }
  }
}

function damageBoss(d, x, y){
  if (!boss || boss.dead) return;
  boss.hp -= d;
  addScore(d);
  if (x !== undefined && Math.random() < 0.5) spark(x, y, boss.phase === 2 ? (boss.hue + 150) % 360 : boss.hue, 2);
  if (boss.hp <= 0){ boss.hp = 0; killBoss(); }
}

function killBoss(){
  if (bossHitless){
    addScore(500);
    Game.float(boss.x, boss.y - 26, 'パーフェクト +500', '#fde047');
  }
  boss.dead = true; boss.deadT = 0;
  ebullets.length = 0;
  for (var i = 0; i < 46; i++){
    var a = Math.random()*TAU, sp = 40 + Math.random()*260;
    particles.push({ x: boss.x, y: boss.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.6 + Math.random()*0.9, max: 1.6, hue: boss.hue + Math.random()*70, size: 2 + Math.random()*3 });
  }
  flash = 1; shake = 0.8; timeScale = 0.3;
  state = 'bossdown'; stateT = 0;
  stageIdx++;
  if (stageIdx >= 4){ stageIdx = 0; loop++; }
  Game.toast('撃破！');
}

function startInterval(){
  state = 'interval'; stateT = 0;
  minionsToSpawn = 4; spawnedMinions = 0; spawnTimer = 0.4;
  Game.toast('ザコ出現！');
}

function updateInterval(raw){
  spawnTimer -= raw;
  if (spawnedMinions < minionsToSpawn && spawnTimer <= 0){
    spawnedMinions++;
    spawnTimer = 0.65;
    var mx = 70 + Math.random()*(W - 140);
    minions.push({ x: mx, baseX: mx, y: -30, hp: 30, r: 20, vy: 70, phase: Math.random()*TAU, targetY: 160 + Math.random()*170, fireT: 1.4 + Math.random() });
  }
  if (minions.length === 0 && spawnedMinions >= minionsToSpawn && stateT > 1.2){ nextBoss(); }
  else if (stateT > 11){ minions.length = 0; nextBoss(); }
}

function nextBoss(){
  state = 'warning'; warnT = 2.0; stateT = 0;
}

function hitMinion(i, dmg){
  var mn = minions[i];
  if (!mn) return;
  mn.hp -= dmg;
  if (mn.hp <= 0){
    minions.splice(i, 1);
    addScore(50);
    for (var k = 0; k < 12; k++){
      var a = Math.random()*TAU, sp = 40 + Math.random()*140;
      particles.push({ x: mn.x, y: mn.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.3 + Math.random()*0.4, max: 0.8, hue: 300, size: 1.5 + Math.random()*2 });
    }
    drops.push({ x: mn.x, y: mn.y });
  }
}

function playerHit(){
  if (invuln > 0 || state === 'over') return;
  lives--;
  invuln = 2.4;
  bossHitless = false;
  shake = Math.max(shake, 0.7);
  flash = Math.max(flash, 0.5);
  ebullets.length = 0;
  spark(player.x, player.y, 0, 26);
  Game.hud(hudText());
  Game.float(player.x, player.y - 26, '被弾！', '#f87171');
  if (lives <= 0){
    state = 'over';
    Game.over(Math.floor(score));
  }
}

function update(rawDt){
  var raw = rawDt;

  if (state === 'over'){
    updateStars(raw);
    updateParticles(raw);
    if (shake > 0) shake -= raw;
    if (flash > 0) flash -= raw*1.8;
    return;
  }

  if (state === 'bossdown'){ timeScale += (0.3 - timeScale) * Math.min(1, raw*6); }
  else { timeScale += (1 - timeScale) * Math.min(1, raw*3); }
  var dt = raw * timeScale;
  if (dt > 0.05) dt = 0.05;

  updateStars(raw);
  if (shake > 0) shake -= raw;
  if (flash > 0) flash -= raw*1.8;
  if (invuln > 0) invuln -= dt;

  var f = Math.min(1, raw*14*TUNE.follow.v);
  player.x += (player.tx - player.x)*f;
  player.y += (player.ty - player.y)*f;

  player.fireT -= dt;
  var cd = 0.095 / TUNE.fireRate.v;
  var guard = 0;
  while (player.fireT <= 0 && guard < 6){
    player.fireT += cd;
    firePlayer();
    guard++;
  }

  stateT += raw;
  if (state === 'warning'){
    warnT -= raw;
    if (warnT <= 0) spawnBoss();
  } else if (state === 'boss'){
    updateBoss(dt, raw);
  } else if (state === 'bossdown'){
    if (boss){
      boss.deadT += raw;
      if (Math.random() < 0.5){
        var ea = Math.random()*TAU, esp = 60 + Math.random()*220;
        particles.push({ x: boss.x, y: boss.y, vx: Math.cos(ea)*esp, vy: Math.sin(ea)*esp, life: 0.5 + Math.random()*0.7, max: 1.2, hue: 40 + Math.random()*30, size: 2 + Math.random()*3 });
      }
    }
    if (stateT > 1.8){ boss = null; startInterval(); }
  } else if (state === 'interval'){
    updateInterval(raw);
  }

  var i, b, dx, dy, d2;

  for (i = ebullets.length - 1; i >= 0; i--){
    b = ebullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.x < -30 || b.x > W + 30 || b.y < -40 || b.y > H + 40){ ebullets.splice(i, 1); continue; }
    dx = b.x - player.x; dy = b.y - player.y;
    d2 = dx*dx + dy*dy;
    var hitR = b.r + player.r;
    if (d2 < hitR*hitR){
      ebullets.splice(i, 1);
      playerHit();
      if (state === 'over') return;
      continue;
    }
    var gr = b.r + player.graze;
    if (!b.grazed && d2 < gr*gr){
      b.grazed = true;
      addScore(TUNE.grazeBonus.v);
      spark(b.x, b.y, 190, 3);
      if (Math.random() < 0.3) Game.float(b.x, b.y, 'GRAZE +' + TUNE.grazeBonus.v, '#7dd3fc');
    }
  }

  for (i = pbullets.length - 1; i >= 0; i--){
    b = pbullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.y < 40 || b.x < -20 || b.x > W + 20){ pbullets.splice(i, 1); continue; }
    if (boss && !boss.entering && !boss.dead){
      dx = b.x - boss.x; dy = b.y - boss.y;
      if (dx*dx + dy*dy < boss.r*boss.r){
        pbullets.splice(i, 1);
        damageBoss(b.dmg, b.x, b.y);
        if (state === 'bossdown' || state === 'over'){ if (state === 'bossdown') { /* continue clearing */ } }
        continue;
      }
    }
    var hitM = -1;
    for (var m = minions.length - 1; m >= 0; m--){
      var mn = minions[m];
      dx = b.x - mn.x; dy = b.y - mn.y;
      if (dx*dx + dy*dy < mn.r*mn.r){ hitM = m; break; }
    }
    if (hitM >= 0){
      pbullets.splice(i, 1);
      hitMinion(hitM, b.dmg);
    }
  }

  for (i = minions.length - 1; i >= 0; i--){
    var mi = minions[i];
    if (mi.y < mi.targetY){
      mi.y += mi.vy*dt;
      if (mi.y > mi.targetY) mi.y = mi.targetY;
    } else {
      mi.phase += dt*1.3;
      mi.x = mi.baseX + Math.sin(mi.phase)*46;
    }
    if (mi.x < 28) mi.x = 28;
    if (mi.x > W - 28) mi.x = W - 28;
    mi.fireT -= dt;
    if (mi.fireT <= 0 && mi.y > 70){
      mi.fireT = 1.6 + Math.random()*0.9;
      var ang = Math.atan2(player.y - mi.y, player.x - mi.x);
      spawnEB(mi.x, mi.y + 14, ang, 165*TUNE.bulletSpeed.v, 6, 45, false);
    }
  }

  for (i = drops.length - 1; i >= 0; i--){
    var d = drops[i];
    d.y += 70*dt;
    if (d.y > H + 20){ drops.splice(i, 1); continue; }
    dx = d.x - player.x; dy = d.y - player.y;
    if (dx*dx + dy*dy < 32*32){
      drops.splice(i, 1);
      powerCnt++;
      spark(d.x, d.y, 50, 8);
      if (powerCnt >= 3){
        powerCnt = 0;
        if (power < 2){
          power++;
          Game.toast('パワーアップ！ ' + (power === 1 ? 3 : 5) + '列');
        } else {
          addScore(300);
          Game.float(player.x, player.y - 30, '+300', '#fde047');
        }
      } else {
        Game.float(d.x, d.y, '🔸', '#fbbf24');
      }
    }
  }

  updateParticles(dt);
}

function drawBand(y0, h){
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, y0, W, h);
  ctx.clip();
  ctx.fillStyle = '#facc15';
  ctx.fillRect(0, y0, W, h);
  ctx.fillStyle = '#151515';
  for (var x = -h - 44; x < W + h + 44; x += 44){
    ctx.beginPath();
    ctx.moveTo(x, y0 + h);
    ctx.lineTo(x + 22, y0 + h);
    ctx.lineTo(x + 22 + h, y0);
    ctx.lineTo(x + h, y0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function draw(){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  var i;
  for (i = 0; i < stars.length; i++){
    var s = stars[i];
    ctx.fillStyle = 'rgba(170,200,255,' + s.a.toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }

  ctx.save();
  var ox = 0, oy = 0;
  if (shake > 0){
    ox = (Math.random()*2 - 1) * shake * 12;
    oy = (Math.random()*2 - 1) * shake * 12;
  }
  ctx.translate(ox, oy);

  ctx.font = "24px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (i = 0; i < drops.length; i++) ctx.fillText('🔸', drops[i].x, drops[i].y);

  ctx.font = "34px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (i = 0; i < minions.length; i++) ctx.fillText('👾', minions[i].x, minions[i].y);

  if (boss){
    var p2 = boss.hp <= boss.maxHp*0.5;
    var bhue = p2 ? (boss.hue + 150) % 360 : boss.hue;
    var bsc = boss.dead ? 1 + boss.deadT*0.6 : 1;
    var bal = boss.dead ? Math.max(0, 1 - boss.deadT/1.5) : 1;
    ctx.save();
    ctx.globalAlpha = bal;
    ctx.fillStyle = 'hsla(' + bhue + ',100%,60%,0.20)';
    ctx.beginPath();
    ctx.arc(boss.x, boss.y, 46*bsc, 0, TAU);
    ctx.fill();
    ctx.font = Math.round(62*bsc) + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(boss.e, boss.x, boss.y);
    ctx.restore();
  }

  ctx.fillStyle = 'rgba(90,230,255,0.35)';
  for (i = 0; i < pbullets.length; i++) ctx.fillRect(pbullets[i].x - 4, pbullets[i].y - 11, 8, 22);
  ctx.fillStyle = '#d8fbff';
  for (i = 0; i < pbullets.length; i++) ctx.fillRect(pbullets[i].x - 1.6, pbullets[i].y - 9, 3.2, 18);

  for (i = 0; i < ebullets.length; i++){
    var eb = ebullets[i];
    ctx.fillStyle = 'hsla(' + eb.hue + ',100%,58%,0.32)';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r*2.0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'hsl(' + eb.hue + ',100%,72%)';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, TAU); ctx.fill();
  }

  for (i = 0; i < particles.length; i++){
    var p = particles[i];
    var pa = Math.max(0, p.life / p.max);
    ctx.fillStyle = 'hsla(' + p.hue + ',100%,65%,' + pa.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
  }

  if (state !== 'over'){
    var blink = invuln > 0 && Math.floor(invuln*12) % 2 === 0;
    ctx.globalAlpha = blink ? 0.3 : 1;
    ctx.font = "36px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('✈️', player.x, player.y);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#f87171';
    ctx.beginPath(); ctx.arc(player.x, player.y, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(player.x, player.y, 1.4, 0, TAU); ctx.fill();
  }

  ctx.restore();

  if (flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.9, flash*0.9).toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (boss && !boss.dead){
    var bw = 340, bx = (W - bw)/2, by = 62, bh = 10;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(bx, by, bw, bh);
    var ratio = Math.max(0, boss.hp / boss.maxHp);
    ctx.fillStyle = ratio <= 0.5 ? '#fb923c' : '#22d3ee';
    ctx.fillRect(bx, by, bw*ratio, bh);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    ctx.fillStyle = '#cbd5e1';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(boss.name + (ratio <= 0.5 ? '  第2形態' : ''), bx, by + bh + 14);
  }

  if (state === 'warning'){
    ctx.globalAlpha = 0.85;
    drawBand(56, 46);
    drawBand(664, 48);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fs = Math.round(32 + Math.sin(stateT*10)*3);
    ctx.font = 'bold ' + fs + 'px sans-serif';
    ctx.fillStyle = '#111827';
    ctx.fillText('WARNING', W/2 + 2, 232);
    ctx.fillStyle = '#facc15';
    ctx.fillText('WARNING', W/2, 230);
    var def = BOSS_DEFS[stageIdx % 4];
    ctx.save();
    ctx.globalAlpha = 0.85 + Math.sin(stateT*8)*0.15;
    ctx.fillStyle = 'hsla(' + def.hue + ',100%,60%,0.22)';
    ctx.beginPath(); ctx.arc(W/2, 340, 60 + Math.sin(stateT*6)*6, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = "72px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(def.e, W/2, 340);
    ctx.restore();
    if (loop > 0){
      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('LOOP ' + (loop + 1), W/2, 430);
    }
  }
}

</script>
