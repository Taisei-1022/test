<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  songLen:   { v: 45,    label: '曲の長さ(秒)',        min: 20,   max: 90,   step: 5 },
  bpmStart:  { v: 100,   label: '開始BPM',             min: 60,   max: 160,  step: 5 },
  bpmEnd:    { v: 170,   label: '終盤BPM',             min: 80,   max: 240,  step: 5 },
  noteSpeed: { v: 1.1,   label: 'ノーツ落下時間(秒)',   min: 0.55, max: 2.0,  step: 0.05 },
  density:   { v: 1.0,   label: 'ノーツ密度',           min: 0.5,  max: 1.8,  step: 0.1 },
  lifeMax:   { v: 100,   label: 'ライフ最大',           min: 40,   max: 200,  step: 10 },
  missDamage:{ v: 9,     label: 'ミスのダメージ',       min: 2,    max: 25,   step: 1 },
  feverGain: { v: 0.028, label: 'フィーバー増加量',     min: 0.01, max: 0.08, step: 0.002 }
};

var LM = 16, LTOP = 56, JUDGE_Y = 530, PAD_TOP = 608, PAD_BOT = 700;
var LANE_W = (480 - LM * 2) / 4;
var LANE_RGB = [[34, 211, 238], [255, 95, 210], [110, 231, 160], [167, 139, 250]];
var PAD_EMO = ['🥁', '🎹', '🎸', '🎺'];
var W_PERFECT = 0.05, W_GREAT = 0.10, W_HIT = 0.13;

var PATTERNS = {
  a: [0, 1, 2, 3],
  b: [0, 0.5, 1, 2, 2.5, 3],
  c: [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5],
  d: [0, 0.25, 0.5, 1, 1.5, 2, 2.25, 2.5, 3, 3.5],
  e: [0, 0.25, 0.5, 0.75, 1, 1.5, 2, 2.5, 3, 3.25, 3.5]
};

var notes = [], time = 0, score = 0, combo = 0, maxCombo = 0;
var life = 100, fever = 0, feverT = 0;
var perfect = 0, great = 0, missCount = 0, judgedTotal = 0;
var particles = [], fingers = {}, laneFingers = [0, 0, 0, 0], laneFlash = [0, 0, 0, 0];
var shake = 0, judgeText = '', judgeCol = '#ffffff', judgeT = 0;
var state = 'play', resultT = 0, ended = false, failed = false, rank = 'C';
var lastHudRem = -1;
var actx = null;

function rgbStr(i){ return 'rgb(' + LANE_RGB[i][0] + ',' + LANE_RGB[i][1] + ',' + LANE_RGB[i][2] + ')'; }
function rgba(i, a){ return 'rgba(' + LANE_RGB[i][0] + ',' + LANE_RGB[i][1] + ',' + LANE_RGB[i][2] + ',' + a + ')'; }
function laneX(i){ return LM + LANE_W * i + LANE_W / 2; }
function pxPerSec(){ return (JUDGE_Y + 40) / TUNE.noteSpeed.v; }
function emoji(size){ ctx.font = size + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; }
function lbl(size, weight){ ctx.font = (weight ? weight + ' ' : '') + size + 'px system-ui,-apple-system,sans-serif'; }
function rr(x, y, w, h, r){
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/* ===== 音（WebAudioで自動生成） ===== */
function audioInit(){
  if (actx){
    if (actx.state === 'suspended' && actx.resume) actx.resume();
    return;
  }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { actx = new AC(); } catch (e){ actx = null; }
}
function beep(freq, dur, type, vol, when, slide){
  if (!actx) return;
  if (actx.state === 'suspended' && actx.resume) actx.resume();
  var t0 = actx.currentTime + (when || 0);
  var o = actx.createOscillator();
  var g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(actx.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.04);
}
function playSfx(kind, lane){
  if (!actx) return;
  var b = 520 + lane * 70;
  if (kind === 'PERFECT'){ beep(b * 2, 0.12, 'triangle', 0.09); beep(b * 3, 0.08, 'sine', 0.04, 0.02); }
  else if (kind === 'GREAT'){ beep(b * 1.5, 0.12, 'triangle', 0.075); }
  else if (kind === 'MISS'){ beep(170, 0.22, 'sawtooth', 0.07, 0, 70); }
  else if (kind === 'GOLD'){ beep(1320, 0.1, 'square', 0.05); beep(1760, 0.14, 'square', 0.05, 0.06); }
  else if (kind === 'FEVER'){ beep(523, 0.15, 'square', 0.06, 0); beep(659, 0.15, 'square', 0.06, 0.1); beep(784, 0.3, 'square', 0.06, 0.2); }
  else if (kind === 'END'){ beep(523, 0.2, 'triangle', 0.08, 0); beep(392, 0.2, 'triangle', 0.08, 0.18); beep(261, 0.5, 'triangle', 0.08, 0.36); }
}

/* ===== 譜面生成 ===== */
function laneFree(list, lane, t, tol){
  for (var i = 0; i < list.length; i++){
    var n = list[i];
    if (n.lane !== lane) continue;
    if (Math.abs(n.t - t) < tol) return false;
    if (n.type === 'hold' && t > n.t - tol && t < n.t + n.dur + tol) return false;
  }
  return true;
}
function pickLane(prev){
  var l = Math.floor(Math.random() * 4);
  if (l === prev) l = (l + 1 + Math.floor(Math.random() * 3)) % 4;
  return l;
}
function pickPattern(prog){
  var d = TUNE.density.v, pool;
  if (prog < 0.25) pool = ['a', 'a', 'b'];
  else if (prog < 0.5) pool = (d > 1.2) ? ['b', 'c'] : ['a', 'b', 'b', 'c'];
  else if (prog < 0.75) pool = (d > 1.2) ? ['c', 'd', 'e'] : ['b', 'c', 'c', 'd'];
  else pool = (d > 1.2) ? ['d', 'e', 'e'] : ['c', 'd', 'd', 'e'];
  return PATTERNS[pool[Math.floor(Math.random() * pool.length)]];
}
function makeChart(){
  var songLen = TUNE.songLen.v;
  var endT = songLen - 1.5;
  var list = [];
  var t = 1.6;
  var lastLane = -1;
  var guard = 0;
  while (t < endT && guard++ < 400){
    var prog = Math.min(1, t / songLen);
    var bpm = TUNE.bpmStart.v + (TUNE.bpmEnd.v - TUNE.bpmStart.v) * prog;
    var beat = 60 / bpm;
    var pat = pickPattern(prog);
    for (var i = 0; i < pat.length; i++){
      var nt = t + pat[i] * beat;
      if (nt > endT) continue;
      var lane = pickLane(lastLane);
      if (!laneFree(list, lane, nt, beat * 0.3)) continue;
      lastLane = lane;
      var n = { lane: lane, t: nt, type: 'tap', gold: false, hit: false, judged: false, dur: 0, gain: 0 };
      var r = Math.random();
      if (r < 0.06){ n.gold = true; }
      else if (r < 0.11 + prog * 0.07){
        var hb = (prog > 0.5 && Math.random() < 0.45) ? 3 : 2;
        var dur = beat * hb;
        if (laneFree(list, lane, nt + dur, beat * 0.3)){ n.type = 'hold'; n.dur = dur; }
      }
      list.push(n);
      var sc = Math.max(0, prog - 0.28) * 0.5 * TUNE.density.v;
      if (n.type === 'tap' && Math.random() < sc){
        var l2 = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
        if (laneFree(list, l2, nt, beat * 0.3)){
          list.push({ lane: l2, t: nt, type: 'tap', gold: Math.random() < 0.04, hit: false, judged: false, dur: 0, gain: 0 });
        }
      }
    }
    t += beat * 4;
  }
  list.sort(function(a, b){ return a.t - b.t; });
  return list;
}

/* ===== 初期化 ===== */
function init(){
  notes = makeChart();
  time = 0; score = 0; combo = 0; maxCombo = 0;
  life = TUNE.lifeMax.v; fever = 0; feverT = 0;
  perfect = 0; great = 0; missCount = 0; judgedTotal = 0;
  particles = [];
  fingers = {}; laneFingers = [0, 0, 0, 0]; laneFlash = [0, 0, 0, 0];
  shake = 0; judgeText = ''; judgeCol = '#ffffff'; judgeT = 0;
  state = 'play'; resultT = 4.0; ended = false; failed = false; rank = 'C';
  lastHudRem = -1;
  Game.score(0);
  Game.hud('⏱ ' + Math.ceil(TUNE.songLen.v));
  audioInit();
}

/* ===== 入力 ===== */
function laneAt(x){
  if (x < LM) return -1;
  var i = Math.floor((x - LM) / LANE_W);
  if (i < 0 || i > 3) return -1;
  return i;
}
function onDown(x, y, id){
  audioInit();
  if (state !== 'play') return;
  if (y < LTOP) return;
  var lane = laneAt(x);
  if (lane < 0) return;
  var key = (id === undefined || id === null) ? ('k' + lane) : ('' + id);
  if (fingers[key] !== undefined) return;
  fingers[key] = lane;
  laneFingers[lane]++;
  laneFlash[lane] = 1;
  judgeTap(lane);
}
function onUp(x, y, id){
  if (id === undefined || id === null){
    for (var k in fingers) if (fingers.hasOwnProperty(k)) delete fingers[k];
    laneFingers = [0, 0, 0, 0];
    return;
  }
  var key = '' + id;
  var lane = fingers[key];
  if (lane === undefined) return;
  delete fingers[key];
  if (laneFingers[lane] > 0) laneFingers[lane]--;
}
function onMove(x, y, id){ }

/* ===== 判定・スコア ===== */
function comboMult(){ return 1 + Math.min(combo, 60) * 0.02; }

function judgeTap(lane){
  var best = null, bestD = 999;
  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.lane !== lane) continue;
    if (n.hit || n.judged) continue;
    var d = time - n.t;
    if (d < -W_HIT) break;
    if (d > W_HIT) continue;
    var ad = Math.abs(d);
    if (ad < bestD){ bestD = ad; best = n; }
  }
  if (!best) return;
  var dd = Math.abs(time - best.t);
  if (dd <= W_PERFECT) registerHit('PERFECT', best);
  else if (dd <= W_GREAT) registerHit('GREAT', best);
  else {
    best.judged = true; best.hit = true;
    missNote(best);
  }
}

function registerHit(res, n){
  if (n.type === 'hold'){ n.hit = true; n.gain = 0; }
  else n.judged = true;
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  judgedTotal++;
  if (res === 'PERFECT') perfect++; else great++;
  var mult = comboMult() * (feverT > 0 ? 2 : 1);
  var base = res === 'PERFECT' ? (n.gold ? 300 : 100) : (n.gold ? 150 : 50);
  var pts = Math.round(base * mult);
  score += pts;
  Game.score(score);
  if (res === 'PERFECT') feverAdd(TUNE.feverGain.v * (n.gold ? 1.5 : 1));
  else feverAdd(TUNE.feverGain.v * 0.45);
  judgeText = res;
  judgeCol = res === 'PERFECT' ? '#7dfaff' : '#a5f3a0';
  judgeT = 0.45;
  burst(laneX(n.lane), JUDGE_Y, n.lane, res === 'PERFECT' ? 7 : 4);
  playSfx(res, n.lane);
  if (n.gold){ playSfx('GOLD', n.lane); Game.float(laneX(n.lane), JUDGE_Y - 70, 'GOLD +' + pts, '#ffd75e'); }
  if (combo > 0 && combo % 50 === 0){
    Game.toast(combo + ' COMBO!');
    shake = 0.22;
  }
}

function missNote(n){
  n.judged = true; n.hit = true;
  missCount++; judgedTotal++;
  combo = 0;
  life -= TUNE.missDamage.v;
  shake = 0.28;
  judgeText = 'MISS';
  judgeCol = '#f87171';
  judgeT = 0.5;
  playSfx('MISS', n.lane);
  if (life <= 0){ life = 0; finish(true); }
}

function feverAdd(v){
  if (feverT > 0) return;
  fever += v;
  if (fever >= 1){
    fever = 1;
    feverT = 10;
    Game.toast('🔥 フィーバー！ スコア2倍');
    playSfx('FEVER', 0);
    shake = 0.3;
  }
}

function burst(x, y, lane, count){
  for (var i = 0; i < count; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = 70 + Math.random() * 170;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
      life: 0.45 + Math.random() * 0.3, max: 0.75,
      e: (i % 2 === 0) ? '✨' : '⭐'
    });
  }
  if (particles.length > 200) particles.splice(0, particles.length - 200);
}

function calcRank(){
  var acc = judgedTotal > 0 ? (perfect + great * 0.6) / judgedTotal : 0;
  var full = (missCount === 0 && judgedTotal > 0);
  var r = 'C';
  if (acc >= 0.88) r = 'S';
  else if (acc >= 0.75) r = 'A';
  else if (acc >= 0.6) r = 'B';
  if (full && acc >= 0.93) r = 'S';
  if (failed && (r === 'S' || r === 'A')) r = 'B';
  return r;
}

function finish(dead){
  if (state !== 'play') return;
  state = 'result';
  failed = !!dead;
  resultT = 4.0;
  rank = calcRank();
  playSfx('END', 0);
}

/* ===== 更新 ===== */
function updateFx(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 430 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (judgeT > 0) judgeT = Math.max(0, judgeT - dt);
  for (var j = 0; j < 4; j++) laneFlash[j] = Math.max(0, laneFlash[j] - dt * 3.5);
}

function update(dt){
  if (state === 'result'){
    resultT -= dt;
    updateFx(dt);
    if (resultT <= 0 && !ended){ ended = true; Game.over(score); }
    return;
  }
  time += dt;
  var songLen = TUNE.songLen.v;

  if (feverT > 0){
    feverT -= dt;
    if (feverT <= 0){ feverT = 0; fever = 0; }
  } else if (fever > 0){
    fever = Math.max(0, fever - dt * 0.02);
  }

  var rem = Math.max(0, Math.ceil(songLen - time));
  if (rem !== lastHudRem){
    lastHudRem = rem;
    Game.hud('⏱ ' + rem);
  }

  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.judged) continue;
    if (!n.hit){
      if (time - n.t > W_HIT){ missNote(n); if (state !== 'play') break; }
      continue;
    }
    if (n.type === 'hold'){
      var end = n.t + n.dur;
      var m = comboMult() * (feverT > 0 ? 2 : 1);
      if (time >= end){
        n.judged = true;
        score += Math.round(140 * m);
        Game.score(score);
        burst(laneX(n.lane), JUDGE_Y, n.lane, 5);
        Game.float(laneX(n.lane), JUDGE_Y - 70, 'HOLD!', '#ffd166');
      } else if (laneFingers[n.lane] > 0){
        n.gain += dt;
        while (n.gain >= 0.12){
          n.gain -= 0.12;
          score += Math.round(10 * m);
          Game.score(score);
          beep(700 + n.lane * 60, 0.05, 'sine', 0.02);
        }
      } else if (time < end - 0.12){
        n.judged = true;
        combo = 0;
      }
    }
  }

  if (time >= songLen + 1.0) finish(false);
  updateFx(dt);
}

/* ===== 描画 ===== */
function draw(){
  var hue = (228 + Math.floor(combo / 50) * 48) % 360;
  var sh = shake > 0 ? (Math.random() * 2 - 1) * 5 : 0;

  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, 'hsl(' + hue + ',42%,11%)');
  bg.addColorStop(1, 'hsl(' + ((hue + 60) % 360) + ',55%,4%)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (feverT > 0){
    ctx.fillStyle = 'rgba(255,200,60,' + (0.05 + 0.03 * Math.sin(time * 14)) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.save();
  ctx.translate(sh, 0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  var i;
  for (i = 0; i < 4; i++){
    var lx = LM + i * LANE_W;
    var lg = ctx.createLinearGradient(0, LTOP, 0, JUDGE_Y);
    lg.addColorStop(0, 'rgba(255,255,255,0.02)');
    lg.addColorStop(1, rgba(i, 0.15 + laneFlash[i] * 0.28));
    ctx.fillStyle = lg;
    ctx.fillRect(lx + 2, LTOP, LANE_W - 4, JUDGE_Y - LTOP + 12);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  for (i = 0; i <= 4; i++) ctx.fillRect(LM + i * LANE_W - 0.75, LTOP, 1.5, JUDGE_Y - LTOP + 12);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, LTOP, W, PAD_BOT - LTOP);
  ctx.clip();
  var pv = pxPerSec();
  for (i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.judged) continue;
    var hy, endY;
    if (n.type === 'hold' && n.hit){
      hy = JUDGE_Y;
      endY = JUDGE_Y - (n.t + n.dur - time) * pv;
      if (endY > hy) endY = hy;
    } else {
      hy = JUDGE_Y - (n.t - time) * pv;
      endY = hy - n.dur * pv;
    }
    if (hy < LTOP - 90 || hy > PAD_BOT + 40) continue;
    var al = 1;
    if (hy < LTOP + 60) al = Math.max(0, (hy - (LTOP - 60)) / 120);
    ctx.globalAlpha = Math.min(1, al);
    var cx = laneX(n.lane);
    var col = rgbStr(n.lane);

    if (n.type === 'hold'){
      ctx.lineCap = 'round';
      ctx.strokeStyle = rgba(n.lane, n.hit ? 0.75 : 0.32);
      ctx.lineWidth = 24;
      ctx.beginPath(); ctx.moveTo(cx, hy); ctx.lineTo(cx, endY); ctx.stroke();
      ctx.strokeStyle = rgba(n.lane, 0.95);
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(cx, hy); ctx.lineTo(cx, endY); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, endY, 12, 0, Math.PI * 2);
      ctx.fillStyle = rgbStr(n.lane);
      ctx.fill();
    }

    var rad = n.gold ? 26 : 22;
    ctx.save();
    ctx.shadowColor = n.gold ? '#ffd75e' : col;
    ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(cx, hy, rad, 0, Math.PI * 2);
    ctx.fillStyle = n.gold ? '#ffd75e' : col;
    ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, hy, rad * 0.58, 0, Math.PI * 2);
    ctx.fillStyle = n.gold ? '#fff8dc' : 'rgba(10,14,26,0.85)';
    ctx.fill();
    emoji(20);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(n.gold ? '⭐' : '🎵', cx, hy + 1);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.save();
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 14;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(LM, JUDGE_Y); ctx.lineTo(W - LM, JUDGE_Y); ctx.stroke();
  ctx.restore();
  for (i = 0; i < 4; i++){
    ctx.beginPath(); ctx.arc(laneX(i), JUDGE_Y, 28, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(i, 0.30 + laneFlash[i] * 0.65);
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  for (i = 0; i < 4; i++){
    var px = LM + i * LANE_W + 5, pw = LANE_W - 10, f = laneFlash[i];
    ctx.save();
    if (f > 0){ ctx.shadowColor = rgbStr(i); ctx.shadowBlur = 22 * f; }
    rr(px, PAD_TOP, pw, PAD_BOT - PAD_TOP, 16);
    ctx.fillStyle = rgba(i, 0.12 + f * 0.45);
    ctx.fill();
    ctx.lineWidth = 2 + f * 2;
    ctx.strokeStyle = rgba(i, 0.45 + f * 0.55);
    ctx.stroke();
    ctx.restore();
    emoji(30);
    ctx.globalAlpha = 0.85;
    ctx.fillText(PAD_EMO[i], px + pw / 2, PAD_TOP + (PAD_BOT - PAD_TOP) / 2);
    ctx.globalAlpha = 1;
  }

  emoji(18);
  ctx.fillText('❤️', 26, 575);
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  rr(44, 569, 420, 12, 6); ctx.fill();
  var lr = Math.max(0, life / TUNE.lifeMax.v);
  if (lr > 0.001){
    ctx.fillStyle = lr > 0.5 ? '#34d399' : (lr > 0.25 ? '#fbbf24' : '#f87171');
    rr(44, 569, 420 * lr, 12, 6); ctx.fill();
  }
  emoji(18);
  ctx.fillText('⚡', 26, 593);
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  rr(44, 587, 420, 12, 6); ctx.fill();
  var fv = feverT > 0 ? (feverT / 10) : fever;
  if (fv > 0.001){
    ctx.fillStyle = feverT > 0 ? '#ffd75e' : '#c084fc';
    rr(44, 587, 420 * fv, 12, 6); ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(LM, 704, W - LM * 2, 4);
  var prog = Math.min(1, time / TUNE.songLen.v);
  ctx.fillStyle = 'rgba(160,220,255,0.45)';
  ctx.fillRect(LM, 704, (W - LM * 2) * prog, 4);

  if (combo >= 2){
    var tier = Math.min(5, Math.floor(combo / 50));
    var cc = ['#e2e8f0', '#7dfaff', '#6ee7a0', '#a5b4fc', '#ffd75e', '#ff8fd0'][tier];
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.shadowColor = cc;
    ctx.shadowBlur = 18;
    ctx.font = 'bold 58px system-ui,-apple-system,sans-serif';
    ctx.fillStyle = cc;
    ctx.fillText('' + combo, 240, 250);
    ctx.shadowBlur = 0;
    lbl(15, 'bold');
    ctx.fillStyle = 'rgba(226,232,240,0.55)';
    ctx.fillText('COMBO', 240, 292);
    ctx.restore();
  }

  if (judgeT > 0){
    var k = judgeT / 0.45;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 1.7);
    ctx.shadowColor = judgeCol;
    ctx.shadowBlur = 16;
    ctx.font = 'bold ' + Math.round(26 + 8 * k) + 'px system-ui,-apple-system,sans-serif';
    ctx.fillStyle = judgeCol;
    ctx.fillText(judgeText, 240, 462);
    ctx.restore();
  }

  emoji(18);
  for (i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillText(p.e, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  if (state === 'result') drawResult();
}

function drawResult(){
  ctx.save();
  ctx.fillStyle = 'rgba(5,7,16,0.88)';
  ctx.fillRect(0, 0, W, H);

  var bx = 44, by = 150, bw = 392, bh = 400;
  ctx.shadowColor = failed ? '#f87171' : '#22d3ee';
  ctx.shadowBlur = 26;
  rr(bx, by, bw, bh, 20);
  ctx.fillStyle = 'rgba(12,18,34,0.96)';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = failed ? '#f87171' : '#22d3ee';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lbl(20, 'bold');
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(failed ? 'ライフが尽きた…' : 'リザルト', W / 2, by + 36);

  var rc = rank === 'S' ? '#ffd75e' : (rank === 'A' ? '#22d3ee' : (rank === 'B' ? '#6ee7a0' : '#94a3b8'));
  ctx.save();
  ctx.shadowColor = rc;
  ctx.shadowBlur = 30;
  ctx.font = 'bold 84px system-ui,-apple-system,sans-serif';
  ctx.fillStyle = rc;
  ctx.fillText(rank, W / 2, by + 118);
  ctx.restore();
  lbl(14, 'bold');
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('RANK', W / 2, by + 172);

  var rows = [['PERFECT', perfect, '#7dfaff'], ['GREAT', great, '#6ee7a0'], ['MISS', missCount, '#f87171'], ['MAX COMBO', maxCombo, '#ffd75e']];
  for (var i = 0; i < rows.length; i++){
    var ry = by + 210 + i * 42;
    ctx.textAlign = 'left';
    lbl(18, 'bold');
    ctx.fillStyle = rows[i][2];
    ctx.fillText(rows[i][0], bx + 40, ry);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('' + rows[i][1], bx + bw - 40, ry);
  }
  ctx.textAlign = 'center';
}

</script>
