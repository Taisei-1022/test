<style>

/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  scrollSpeed:  { v: 400, label: '落下速度', min: 180, max: 700, step: 20 },
  noteDensity:  { v: 0.9, label: 'ノーツ密度', min: 0.3, max: 1.5, step: 0.05 },
  lifeLoss:     { v: 7, label: 'ミス時のライフ減', min: 2, max: 20, step: 1 },
  feverGain:    { v: 0.035, label: 'フィーバー上昇', min: 0.01, max: 0.1, step: 0.005 },
  comboMultMax: { v: 3, label: 'コンボ倍率上限', min: 1, max: 6, step: 0.5 },
  songLen:      { v: 45, label: '曲の長さ(秒)', min: 20, max: 90, step: 5 },
  tempoUp:      { v: 1.4, label: '後半テンポ倍率', min: 1, max: 2, step: 0.05 },
  goldRate:     { v: 0.08, label: '金ノーツ率', min: 0, max: 0.3, step: 0.02 }
};

var fieldX = 16, laneW = 112, judgeY = 600, topY = 56, botY = 712;
var LANE_COLORS = ['#22d3ee', '#f472b6', '#a78bfa', '#4ade80'];
var LANE_RGB = ['34,211,238', '244,114,182', '167,139,250', '74,222,128'];

var notes, lanes, laneGrads, songT, combo, maxCombo, score, life, fever, feverGauge;
var jP, jG, jM, particles, pops, shake, state, resultT, rank, hudHearts, bgHue, bgGrad, audioCtx;

function init(){
  notes = [];
  particles = []; pops = [];
  lanes = [];
  for (var i = 0; i < 4; i++) lanes.push({ down: false, id: null, flash: 0, hold: null });
  songT = 0; combo = 0; maxCombo = 0; score = 0; life = 100;
  fever = 0; feverGauge = 0;
  jP = 0; jG = 0; jM = 0;
  shake = 0; state = 'play'; resultT = 0; rank = 'C';
  hudHearts = -1; bgHue = -1; bgGrad = null;
  laneGrads = null;
  buildChart();
  updateHud();
  Game.score(0);
}

/* ---------------- 譜面の自動生成 ---------------- */
function buildChart(){
  var len = TUNE.songLen.v;
  var half = len * 0.5;
  var t = 1.8;
  var lastLane = [-9, -9, -9, -9];
  var den = TUNE.noteDensity.v;
  while (t < len - 1.2){
    var bd = (t > half) ? 0.6 / TUNE.tempoUp.v : 0.6;
    var prog = t / len;
    var dens = (0.30 + 0.55 * prog) * den;
    if (dens > 0.92) dens = 0.92;
    if (Math.random() < dens) addNote(t, prog, lastLane);
    var offP = (0.05 + 0.42 * prog) * den;
    if (Math.random() < offP && t + bd * 0.5 < len - 1.2) addNote(t + bd * 0.5, prog, lastLane);
    t += bd;
  }
  notes.sort(function(a, b){ return a.t - b.t; });
}

function addNote(time, prog, lastLane){
  var lane = -1;
  for (var a = 0; a < 8; a++){
    var c = Math.floor(Math.random() * 4);
    if (time - lastLane[c] >= 0.20){ lane = c; break; }
  }
  if (lane < 0) return;
  lastLane[lane] = time;
  var gold = (Math.random() < TUNE.goldRate.v) && prog > 0.30;
  var hold = (!gold) && (Math.random() < 0.08 + 0.16 * prog) && time > 3;
  var dur = 0;
  if (hold) dur = (Math.random() < 0.5 ? 0.8 : 1.2);
  notes.push({ t: time, lane: lane, type: hold ? 'hold' : 'tap', dur: dur, endT: time + dur,
               hit: false, done: false, holding: false, tick: 0, gold: gold });
  lastLane[lane] = time + dur + 0.15;
  if (!hold && prog > 0.5 && Math.random() < 0.10 + 0.18 * prog){
    for (var b = 0; b < 8; b++){
      var cc = Math.floor(Math.random() * 4);
      if (cc !== lane && time - lastLane[cc] >= 0.20){
        notes.push({ t: time, lane: cc, type: 'tap', dur: 0, endT: time,
                     hit: false, done: false, holding: false, tick: 0,
                     gold: Math.random() < TUNE.goldRate.v });
        lastLane[cc] = time + 0.15;
        break;
      }
    }
  }
}

/* ---------------- 音（WebAudio） ---------------- */
function audioInit(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended'){ try { audioCtx.resume(); } catch (e) {} }
}
function beep(freq, dur, type, vol){
  if (!audioCtx) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

/* ---------------- 状態ヘルパ ---------------- */
function updateHud(){
  var n = Math.max(0, Math.ceil(life / 20));
  if (n !== hudHearts){
    hudHearts = n;
    Game.hud(n > 0 ? '❤️'.repeat(n) : '💀');
  }
}
function pop(text, x, y, col){
  pops.push({ text: text, x: x, y: y, col: col, life: 0.65, max: 0.65 });
}
function burst(x, y, n){
  for (var i = 0; i < n; i++){
    particles.push({ x: x, y: y, vx: (Math.random() * 2 - 1) * 190, vy: -Math.random() * 260 - 60, life: 0.6 });
  }
}
function addScore(base){
  var m = 1 + Math.min(combo, 150) / 150 * (TUNE.comboMultMax.v - 1);
  if (fever > 0) m *= 2;
  score += Math.round(base * m);
  Game.score(score);
}
function checkFever(){
  if (feverGauge >= 1 && fever <= 0){
    feverGauge = 1; fever = 10;
    Game.toast('FEVER! スコア2倍');
    beep(1760, 0.25, 'square', 0.07);
  }
}

/* ---------------- 判定 ---------------- */
function hitLane(i){
  if (state !== 'play') return;
  var best = null, bd = 0.101;
  for (var k = 0; k < notes.length; k++){
    var n = notes[k];
    if (n.done || n.hit || n.lane !== i) continue;
    var d = Math.abs(n.t - songT);
    if (d < bd){ bd = d; best = n; }
  }
  if (!best) return;
  best.hit = true;
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  var cx = fieldX + laneW * (i + 0.5);
  if (bd <= 0.05){
    jP++;
    feverGauge += TUNE.feverGain.v;
    pop('PERFECT', cx, judgeY - 48, '#67e8f9');
    addScore(best.gold ? 200 : 100);
    burst(cx, judgeY, 6);
    beep(best.gold ? 1568 : 1318, 0.09, 'triangle', 0.10);
  } else {
    jG++;
    feverGauge += TUNE.feverGain.v * 0.4;
    pop('GREAT', cx, judgeY - 48, '#a3e635');
    addScore(best.gold ? 100 : 50);
    beep(880, 0.08, 'triangle', 0.08);
  }
  if (best.type === 'hold'){
    best.holding = true; best.tick = 0;
    lanes[i].hold = best;
  } else {
    best.done = true;
  }
  checkFever();
}

function missNote(n){
  if (n.done) return;
  n.done = true; n.holding = false;
  if (lanes[n.lane].hold === n) lanes[n.lane].hold = null;
  jM++;
  combo = 0;
  life -= TUNE.lifeLoss.v;
  if (life < 0) life = 0;
  if (feverGauge > 0) feverGauge = Math.max(0, feverGauge - 0.06);
  shake = 0.28;
  pop('MISS', fieldX + laneW * (n.lane + 0.5), judgeY - 48, '#f87171');
  beep(110, 0.16, 'sawtooth', 0.09);
  updateHud();
  if (life <= 0) endSong();
}

function completeHold(n){
  if (n.done) return;
  n.done = true; n.holding = false;
  if (lanes[n.lane].hold === n) lanes[n.lane].hold = null;
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  var cx = fieldX + laneW * (n.lane + 0.5);
  addScore(150);
  pop('HOLD!', cx, judgeY - 48, '#fbbf24');
  burst(cx, judgeY, 4);
  beep(1046, 0.12, 'triangle', 0.09);
}

/* ---------------- 更新 ---------------- */
function update(dt){
  if (state === 'over') return;
  if (state === 'result'){
    resultT += dt;
    if (resultT > 7) finish();
    return;
  }
  songT += dt;
  if (fever > 0){
    fever -= dt;
    if (fever <= 0){ fever = 0; feverGauge = 0; }
    else feverGauge = fever / 10;
  }

  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.done) continue;
    if (n.hit){
      if (n.type === 'hold'){
        if (n.holding && songT < n.endT){
          n.tick += dt;
          while (n.tick >= 0.12){ n.tick -= 0.12; addScore(12); }
        }
        if (songT >= n.endT){
          if (n.holding) completeHold(n);
          else n.done = true;
        }
      }
      continue;
    }
    if (songT > n.t + 0.10){
      missNote(n);
      if (state !== 'play') return;
    }
  }

  for (var p = particles.length - 1; p >= 0; p--){
    var q = particles[p];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vy += 900 * dt; q.life -= dt;
    if (q.life <= 0) particles.splice(p, 1);
  }
  for (var o = pops.length - 1; o >= 0; o--){
    var s = pops[o];
    s.life -= dt; s.y -= 40 * dt;
    if (s.life <= 0) pops.splice(o, 1);
  }
  if (shake > 0) shake -= dt;
  for (var L = 0; L < 4; L++){ if (lanes[L].flash > 0) lanes[L].flash -= dt; }

  if (songT >= TUNE.songLen.v) endSong();
}

function endSong(){
  if (state !== 'play') return;
  state = 'result';
  resultT = 0;
  var total = jP + jG + jM;
  if (total < 1) total = 1;
  var pr = jP / total;
  rank = (pr >= 0.80 && jM <= 2) ? 'S' : (pr >= 0.65 ? 'A' : (pr >= 0.45 ? 'B' : 'C'));
  if (songT < TUNE.songLen.v - 2){
    rank = (rank === 'S') ? 'A' : (rank === 'A') ? 'B' : 'C';
  }
  beep(660, 0.3, 'triangle', 0.09);
  setTimeout(function(){ beep(990, 0.4, 'triangle', 0.08); }, 130);
}

function finish(){
  if (state === 'over') return;
  state = 'over';
  Game.over(Math.round(score));
}

/* ---------------- 描画 ---------------- */
function roundRect(x, y, w, h, r){
  if (h < 0){ y += h; h = -h; }
  if (w < 0){ x += w; w = -w; }
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function draw(){
  var tier = Math.floor(combo / 50);
  var hue = (205 + tier * 57) % 360;
  ctx.fillStyle = '#070a14';
  ctx.fillRect(0, 0, W, H);
  if (hue !== bgHue || !bgGrad){
    bgHue = hue;
    bgGrad = ctx.createLinearGradient(0, topY, 0, H);
    bgGrad.addColorStop(0, 'hsl(' + hue + ',60%,7%)');
    bgGrad.addColorStop(0.55, 'hsl(' + hue + ',65%,13%)');
    bgGrad.addColorStop(1, 'hsl(' + hue + ',70%,9%)');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, topY, W, H - topY);

  if (!laneGrads){
    laneGrads = [];
    for (var gi = 0; gi < 4; gi++){
      var gg = ctx.createLinearGradient(0, judgeY - 60, 0, botY);
      gg.addColorStop(0, 'rgba(' + LANE_RGB[gi] + ',0.05)');
      gg.addColorStop(1, 'rgba(' + LANE_RGB[gi] + ',0.30)');
      laneGrads.push(gg);
    }
  }

  var ox = 0, oy = 0;
  if (shake > 0){
    var k = shake / 0.28;
    ox = (Math.random() * 2 - 1) * 8 * k;
    oy = (Math.random() * 2 - 1) * 6 * k;
  }

  ctx.save();
  ctx.translate(ox, oy);
  ctx.beginPath();
  ctx.rect(0, topY, W, botY - topY);
  ctx.clip();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (var i = 0; i < 4; i++){
    var lx = fieldX + i * laneW;
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    ctx.fillRect(lx + 3, topY, laneW - 6, botY - topY);
    ctx.fillStyle = laneGrads[i];
    ctx.fillRect(lx + 3, judgeY - 60, laneW - 6, botY - judgeY + 60);
    ctx.fillStyle = 'rgba(' + LANE_RGB[i] + ',' + (0.16 + Math.max(0, lanes[i].flash) * 3) + ')';
    roundRect(lx + 10, 626, laneW - 20, 46, 12);
    ctx.fill();
    if (lanes[i].flash > 0){
      ctx.fillStyle = 'rgba(' + LANE_RGB[i] + ',' + (lanes[i].flash / 0.18 * 0.22) + ')';
      ctx.fillRect(lx + 3, topY, laneW - 6, botY - topY);
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  for (var v = 0; v <= 4; v++){
    var vx = fieldX + v * laneW;
    ctx.beginPath(); ctx.moveTo(vx + 0.5, topY); ctx.lineTo(vx + 0.5, botY); ctx.stroke();
  }

  ctx.fillStyle = (fever > 0) ? '#fbbf24' : '#e2e8f0';
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 16;
  ctx.fillRect(fieldX, judgeY - 2, W - fieldX * 2, 4);
  ctx.shadowBlur = 0;

  var spd = TUNE.scrollSpeed.v;
  var nw = laneW * 0.74;
  for (var a = 0; a < notes.length; a++){
    var n = notes[a];
    if (n.done) continue;
    var cx = fieldX + laneW * (n.lane + 0.5);
    var headY, tailY;
    if (n.hit && n.type === 'hold'){
      headY = judgeY;
      tailY = judgeY - (n.endT - songT) * spd;
    } else {
      headY = judgeY - (n.t - songT) * spd;
      tailY = (n.type === 'hold') ? judgeY - (n.endT - songT) * spd : headY;
    }
    if (headY < 40 || tailY > 730) continue;
    var col = n.gold ? '#fbbf24' : LANE_COLORS[n.lane];
    if (n.type === 'hold'){
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = col;
      roundRect(cx - nw * 0.36, tailY, nw * 0.72, Math.max(4, headY - tailY), 8);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 12;
    roundRect(cx - nw / 2, headY - 11, nw, 22, 11);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    roundRect(cx - nw / 2 + 7, headY - 4, nw - 14, 8, 4);
    ctx.fill();
    if (n.gold){
      ctx.font = "18px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('⭐', cx, headY);
    }
  }

  ctx.font = "16px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (var pi = 0; pi < particles.length; pi++){
    var pt = particles[pi];
    ctx.globalAlpha = Math.max(0, pt.life / 0.6);
    ctx.fillText('⭐', pt.x, pt.y);
  }
  ctx.globalAlpha = 1;

  if (combo >= 3){
    ctx.font = 'bold 58px sans-serif';
    ctx.fillStyle = (fever > 0) ? 'rgba(251,191,36,0.60)' : 'rgba(255,255,255,0.35)';
    ctx.fillText(combo, W / 2, 296);
    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText('COMBO', W / 2, 332);
  }

  for (var oi = 0; oi < pops.length; oi++){
    var pp = pops[oi];
    ctx.globalAlpha = Math.max(0, pp.life / pp.max);
    ctx.fillStyle = pp.col;
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText(pp.text, pp.x, pp.y);
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(fieldX, 58, W - fieldX * 2, 4);
  ctx.fillStyle = 'hsl(' + hue + ',90%,65%)';
  ctx.fillRect(fieldX, 58, (W - fieldX * 2) * Math.min(1, songT / TUNE.songLen.v), 4);

  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  roundRect(fieldX, 682, W - fieldX * 2, 12, 6);
  ctx.fill();
  var fw = (W - fieldX * 2) * Math.max(0, Math.min(1, feverGauge));
  if (fw > 4){
    var fg = ctx.createLinearGradient(fieldX, 0, fieldX + W - fieldX * 2, 0);
    fg.addColorStop(0, '#22d3ee');
    fg.addColorStop(1, '#fbbf24');
    ctx.fillStyle = fg;
    roundRect(fieldX, 682, fw, 12, 6);
    ctx.fill();
  }
  if (fever > 0){
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('FEVER ×2  ' + Math.ceil(fever) + 's', W / 2, 666);
  }

  ctx.restore();

  if (state === 'result' || state === 'over') drawResult();
}

function drawResult(){
  ctx.fillStyle = 'rgba(5,8,18,0.88)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var px = 44, pw = W - 88, py = 150, ph = 400;
  var rc = rank === 'S' ? '#fbbf24' : rank === 'A' ? '#22d3ee' : rank === 'B' ? '#a78bfa' : '#94a3b8';
  ctx.fillStyle = 'rgba(14,19,38,0.95)';
  roundRect(px, py, pw, ph, 20);
  ctx.fill();
  ctx.strokeStyle = rc;
  ctx.lineWidth = 3;
  ctx.shadowColor = rc;
  ctx.shadowBlur = 18;
  roundRect(px, py, pw, ph, 20);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#cbd5e1';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('RESULT', W / 2, py + 40);
  ctx.fillStyle = rc;
  ctx.font = 'bold 100px sans-serif';
  ctx.shadowColor = rc;
  ctx.shadowBlur = 26;
  ctx.fillText(rank, W / 2, py + 140);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#67e8f9';
  ctx.fillText('PERFECT   ' + jP, W / 2, py + 215);
  ctx.fillStyle = '#a3e635';
  ctx.fillText('GREAT     ' + jG, W / 2, py + 250);
  ctx.fillStyle = '#f87171';
  ctx.fillText('MISS      ' + jM, W / 2, py + 285);
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('MAX COMBO  ' + maxCombo, W / 2, py + 330);
  ctx.fillStyle = 'rgba(226,232,240,' + (0.35 + 0.45 * Math.abs(Math.sin(resultT * 4))) + ')';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('タップで終了', W / 2, py + ph + 62);
}

/* ---------------- 入力 ---------------- */
function onDown(x, y, id){
  audioInit();
  if (state === 'result'){ finish(); return; }
  if (state !== 'play') return;
  var i = Math.floor((x - fieldX) / laneW);
  if (i < 0) i = 0;
  if (i > 3) i = 3;
  if (lanes[i].down) return;
  lanes[i].down = true;
  lanes[i].id = id;
  lanes[i].flash = 0.18;
  hitLane(i);
}

function onUp(x, y, id){
  for (var i = 0; i < 4; i++){
    if (lanes[i].down && lanes[i].id === id){
      lanes[i].down = false;
      lanes[i].id = null;
      var hn = lanes[i].hold;
      if (hn && hn.holding){
        lanes[i].hold = null;
        if (songT < hn.endT - 0.14) missNote(hn);
        else completeHold(hn);
      }
    }
  }
}
