<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.vp-hud span{background:rgba(8,12,26,.55);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px 12px}
.vp-hud span:empty{display:none}
.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}
.vp-ov h1{font-size:28px}
.vp-ov p{color:#b9c1de;font-size:14.5px;line-height:1.8;max-width:340px;white-space:pre-line}
.vp-ov .vp-big{font-size:44px;font-weight:900;color:#ffd166}
.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
[hidden]{display:none!important}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  bulletSpeed: { v: 130, label: '敵弾の速さ', min: 70, max: 260, step: 10 },
  playerDamage: { v: 6, label: '自機弾の威力', min: 2, max: 20, step: 1 },
  fireInterval: { v: 0.1, label: '連射間隔', min: 0.04, max: 0.3, step: 0.01 },
  bossHpMul: { v: 1, label: 'ボスHP倍率', min: 0.3, max: 2.5, step: 0.1 },
  lives: { v: 3, label: 'ライフ数', min: 1, max: 9, step: 1 },
  bombs: { v: 3, label: 'ボム数', min: 0, max: 9, step: 1 },
  loopSpeedMul: { v: 1.5, label: '2周目の弾速倍率', min: 1, max: 2.5, step: 0.1 }
};
var TOP = 56, BOT = 712;
var BOSSDEF = [
  { e: '🐙', name: 'オクトパス', hp: 700 },
  { e: '🦂', name: 'スコルピオン', hp: 1000 },
  { e: '🐲', name: 'ドラゴン', hp: 1350 },
  { e: '👁️', name: 'オールシーイング', hp: 1750 }
];
var bgGrad = null;
var stars, player, pshots, ebullets, zakos, drops, parts;
var boss, bossIndex, loopNum, state, lives, bombs, score, power, weapon;
var fireT, shake, flash, timeScale, slowT, warnT, warnDur, clearT, zakoT, zakoLeft, deathT, gameTime, lastTapT, tapX, tapY, dragId, perfect;

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

function hudText(){
  var s = '';
  for (var i = 0; i < lives; i++) s += '❤️';
  var b = '';
  for (var j = 0; j < bombs; j++) b += '💣';
  return s + b;
}

function init(){
  bgGrad = null;
  stars = [];
  for (var i = 0; i < 64; i++){
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: 0.4 + Math.random() * 1.8, r: 0.6 + Math.random() * 1.6 });
  }
  player = { x: W / 2, y: BOT - 100, r: 5, inv: 1.5 };
  pshots = []; ebullets = []; zakos = []; drops = []; parts = [];
  boss = null; bossIndex = 0; loopNum = 1; state = 'warning';
  lives = TUNE.lives.v; bombs = TUNE.bombs.v;
  score = 0; power = 0; weapon = 1;
  fireT = 0; shake = 0; flash = 0; timeScale = 1; slowT = 0;
  warnDur = 1.9; warnT = warnDur; clearT = 0; zakoT = 0; zakoLeft = 0; deathT = 0;
  gameTime = 0; lastTapT = -10; tapX = 0; tapY = 0; dragId = -1; perfect = true;
  Game.score(0);
  Game.hud(hudText());
  spawnBoss();
}

function loopSpd(){ return loopNum > 1 ? Math.pow(TUNE.loopSpeedMul.v, loopNum - 1) : 1; }

function spawnBoss(){
  var def = BOSSDEF[bossIndex % 4];
  var hp = Math.round(def.hp * TUNE.bossHpMul.v * Math.pow(1.8, loopNum - 1));
  boss = {
    x: W / 2, y: -80, ty: 150, r: 44, e: def.e, name: def.name, type: bossIndex % 4,
    hp: hp, max: hp, form: 1, t: 0, pt: 1.0, burst: 0, burstT: 0,
    spiralT: 0.6, ang: -1.5708, mode: 0, hitFlash: 0
  };
  perfect = true;
  ebullets.length = 0;
  state = 'warning';
  warnT = warnDur;
}

function startZako(){
  state = 'zako';
  zakos = [];
  zakoLeft = 6 + loopNum * 2;
  zakoT = 0.4;
}

function spawnZako(){
  zakoLeft--;
  zakos.push({
    x: 50 + Math.random() * (W - 100), y: -30,
    vy: 70 + Math.random() * 50, hp: 12, t: 0,
    ft: 1.0 + Math.random(), ph: Math.random() * 6.283
  });
}

function firePlayer(){
  var cols = weapon === 1 ? 1 : (weapon === 2 ? 3 : 5);
  var spread = weapon === 1 ? 0 : (weapon === 2 ? 20 : 38);
  for (var i = 0; i < cols; i++){
    var off = cols === 1 ? 0 : (-spread + (2 * spread) * i / (cols - 1));
    pshots.push({ x: player.x + off, y: player.y - 16, vy: -680, dm: TUNE.playerDamage.v, r: 4 });
  }
}

function eb(x, y, ang, sp, r, c){
  if (ebullets.length > 400) return;
  ebullets.push({ x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: r, c: c, gz: false });
}

function update(dt){
  var i;
  for (i = 0; i < stars.length; i++){
    var s = stars[i];
    s.y += s.s * 55 * dt;
    if (s.y > H){ s.y = -4; s.x = Math.random() * W; }
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 2.2);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  if (slowT > 0){ slowT -= dt; timeScale = 0.3; } else { timeScale = 1; }
  updateParts(dt);
  gameTime += dt;

  if (state === 'dead'){
    deathT -= dt;
    if (deathT <= 0 && deathT > -900){ deathT = -1000; Game.over(score); }
    return;
  }

  var d = dt * timeScale;

  if (player.inv > 0) player.inv -= dt;
  player.x = clamp(player.x, 22, W - 22);
  player.y = clamp(player.y, TOP + 20, BOT - 12);

  fireT -= d;
  if (fireT <= 0){ fireT = TUNE.fireInterval.v; firePlayer(); }

  updateShots(d);
  updateEnemyBullets(d);
  updateZakos(d);
  updateDrops(d);
  updateBoss(d);

  if (state === 'warning'){
    warnT -= dt;
    if (warnT <= 0) state = 'boss';
  } else if (state === 'clear'){
    clearT -= dt;
    if (clearT <= 0){ boss = null; startZako(); }
  } else if (state === 'zako'){
    if (zakoLeft > 0){
      zakoT -= d;
      if (zakoT <= 0){
        spawnZako();
        zakoT = Math.max(0.35, 0.85 - loopNum * 0.1) + Math.random() * 0.4;
      }
    } else if (zakos.length === 0){
      state = 'zakoend'; clearT = 0.8;
    }
  } else if (state === 'zakoend'){
    clearT -= dt;
    if (clearT <= 0){
      bossIndex++;
      if (bossIndex % 4 === 0){ loopNum++; Game.toast('2周目！ 敵弾が速くなる'); }
      spawnBoss();
    }
  }
}

function updateParts(dt){
  for (var i = parts.length - 1; i >= 0; i--){
    var p = parts[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
}

function updateShots(d){
  for (var i = pshots.length - 1; i >= 0; i--){
    var p = pshots[i];
    p.y += p.vy * d;
    if (p.y < TOP - 20 || p.x < -20 || p.x > W + 20){ pshots.splice(i, 1); continue; }
    var hit = false;
    if (boss){
      var dx = p.x - boss.x, dy = p.y - boss.y;
      if (dx * dx + dy * dy < boss.r * boss.r * 0.85){
        damageBoss(p.dm);
        parts.push({ x: p.x, y: p.y - 6, vx: 0, vy: -50, life: 0.18, max: 0.18, c: '#a5f3fc', s: 3 });
        hit = true;
      }
    }
    if (!hit){
      for (var j = zakos.length - 1; j >= 0; j--){
        var z = zakos[j];
        var ax = p.x - z.x, ay = p.y - z.y;
        if (ax * ax + ay * ay < 576){
          z.hp -= p.dm;
          hit = true;
          if (z.hp <= 0) killZako(j);
          break;
        }
      }
    }
    if (hit) pshots.splice(i, 1);
  }
}

function killZako(j){
  var z = zakos[j];
  zakos.splice(j, 1);
  score += 20;
  Game.score(score);
  for (var i = 0; i < 8; i++){
    var a = Math.random() * 6.283, sp = 40 + Math.random() * 120;
    parts.push({ x: z.x, y: z.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.3 + Math.random() * 0.3, max: 0.6, c: '#a3e635', s: 3 });
  }
  if (Math.random() < 0.7 && drops.length < 6) drops.push({ x: z.x, y: z.y, vy: 95, t: 0 });
}

function updateEnemyBullets(d){
  for (var i = ebullets.length - 1; i >= 0; i--){
    var b = ebullets[i];
    b.x += b.vx * d;
    b.y += b.vy * d;
    if (b.x < -50 || b.x > W + 50 || b.y < TOP - 90 || b.y > H + 50){ ebullets.splice(i, 1); continue; }
    var dx = b.x - player.x, dy = b.y - player.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (player.inv <= 0 && state !== 'dead' && dist < b.r * 0.6 + player.r){
      playerHit();
      return;
    }
    if (!b.gz && dist < 28){
      b.gz = true;
      score += 5;
      Game.score(score);
      parts.push({ x: b.x, y: b.y, vx: dx * 1.5, vy: dy * 1.5, life: 0.22, max: 0.22, c: '#fef9c3', s: 2 });
    }
  }
}

function updateZakos(d){
  for (var i = zakos.length - 1; i >= 0; i--){
    var z = zakos[i];
    z.t += d;
    z.y += z.vy * d;
    z.x += Math.sin(z.t * 2.5 + z.ph) * 60 * d;
    z.x = clamp(z.x, 24, W - 24);
    z.ft -= d;
    if (z.ft <= 0 && z.y > TOP + 40 && z.y < 520){
      z.ft = 1.7;
      var a = Math.atan2(player.y - z.y, player.x - z.x);
      eb(z.x, z.y, a, TUNE.bulletSpeed.v * 0.75 * loopSpd(), 7, '#a3e635');
    }
    if (z.y > BOT + 40) zakos.splice(i, 1);
  }
}

function updateDrops(d){
  for (var i = drops.length - 1; i >= 0; i--){
    var dr = drops[i];
    dr.y += dr.vy * d;
    dr.t += d;
    var dx = dr.x - player.x, dy = dr.y - player.y;
    if (dx * dx + dy * dy < 900){ drops.splice(i, 1); collect(); continue; }
    if (dr.y > BOT + 30) drops.splice(i, 1);
  }
}

function collect(){
  if (weapon >= 3){
    score += 100;
    Game.score(score);
    Game.float(player.x, player.y - 30, '+100', '#fde047');
    return;
  }
  power++;
  if (power >= 3){
    power = 0;
    weapon++;
    flash = 0.3;
    Game.float(player.x, player.y - 36, 'POWER UP!', '#67e8f9');
  } else {
    Game.float(player.x, player.y - 30, '🔸' + power + '/3', '#67e8f9');
  }
}

function updateBoss(d){
  if (!boss) return;
  boss.t += d;
  if (boss.hitFlash > 0) boss.hitFlash -= d;

  if (boss.y < boss.ty){
    boss.y = Math.min(boss.ty, boss.y + 95 * d);
    boss.x = W / 2;
    return;
  }
  var tx = W / 2 + Math.sin(boss.t * 0.8) * (W / 2 - 100);
  boss.x += (tx - boss.x) * Math.min(1, d * 2.4);
  boss.y = boss.ty + Math.sin(boss.t * 1.5) * 10;

  if (state !== 'boss') return;

  var f2 = boss.form === 2;
  var base = TUNE.bulletSpeed.v * loopSpd() * (f2 ? 1.35 : 1);
  var i, n, ang, sp, k, a;

  if (boss.type === 0){
    boss.pt -= d;
    if (boss.pt <= 0){
      boss.pt = f2 ? 0.85 : 1.2;
      n = f2 ? 20 : 14;
      sp = base * (f2 ? 1.05 : 0.95);
      ang = Math.random() * 6.283;
      for (i = 0; i < n; i++) eb(boss.x, boss.y, ang + i * 6.283 / n, sp, 7, '#c084fc');
    }
  } else if (boss.type === 1){
    if (boss.burst > 0){
      boss.burstT -= d;
      if (boss.burstT <= 0){
        boss.burstT = 0.11;
        boss.burst--;
        a = Math.atan2(player.y - boss.y, player.x - boss.x);
        k = f2 ? 5 : 3;
        for (i = 0; i < k; i++) eb(boss.x, boss.y, a + (i - (k - 1) / 2) * 0.13, base * 1.5, 7, '#fb923c');
      }
    } else {
      boss.pt -= d;
      if (boss.pt <= 0){ boss.pt = f2 ? 0.9 : 1.35; boss.burst = f2 ? 5 : 3; boss.burstT = 0; }
    }
  } else if (boss.type === 2){
    boss.spiralT -= d;
    if (boss.spiralT <= 0){
      boss.spiralT = f2 ? 0.075 : 0.1;
      boss.ang += f2 ? 0.42 : 0.3;
      k = f2 ? 3 : 2;
      for (i = 0; i < k; i++) eb(boss.x, boss.y, boss.ang + i * 6.283 / k, base * 1.15, 7, '#34d399');
    }
  } else {
    boss.spiralT -= d;
    if (boss.spiralT <= 0){
      boss.spiralT = f2 ? 0.09 : 0.13;
      boss.ang += f2 ? 0.5 : 0.35;
      eb(boss.x, boss.y, boss.ang, base, 7, '#f472b6');
      eb(boss.x, boss.y, boss.ang + 3.1416, base, 7, '#f472b6');
    }
    boss.pt -= d;
    if (boss.pt <= 0){
      boss.pt = f2 ? 1.2 : 1.8;
      boss.mode = (boss.mode + 1) % 2;
      if (boss.mode === 0){
        n = f2 ? 18 : 12;
        ang = Math.random() * 6.283;
        for (i = 0; i < n; i++) eb(boss.x, boss.y, ang + i * 6.283 / n, base * 0.9, 7, '#a78bfa');
      } else {
        a = Math.atan2(player.y - boss.y, player.x - boss.x);
        k = f2 ? 5 : 3;
        for (i = 0; i < k; i++) eb(boss.x, boss.y, a + (i - (k - 1) / 2) * 0.16, base * 1.4, 7, '#f9a8d4');
      }
    }
  }
}

function damageBoss(dmg){
  if (!boss) return;
  boss.hp -= dmg;
  boss.hitFlash = 0.12;
  score += Math.round(dmg);
  Game.score(score);
  if (boss.hp <= 0){ boss.hp = 0; defeatBoss(); return; }
  if (boss.form === 1 && boss.hp <= boss.max * 0.5){
    boss.form = 2;
    flash = 0.45; shake = 0.6;
    Game.float(boss.x, boss.y - 56, '第2形態!', '#f87171');
    Game.toast('第2形態！ 弾が速くなる');
  }
}

function defeatBoss(){
  var bx = boss.x, by = boss.y;
  score += 300;
  Game.float(bx, by - 20, '+300', '#fde047');
  if (perfect){
    score += 500;
    Game.float(bx, by + 24, 'PERFECT +500', '#fbbf24');
  } else {
    Game.float(bx, by + 24, '被弾あり…', '#94a3b8');
  }
  Game.score(score);
  flash = 1.0; slowT = 1.1; shake = 1.0;
  var cols = ['#fde047', '#f87171', '#67e8f9', '#ffffff'];
  for (var i = 0; i < 48; i++){
    var a = Math.random() * 6.283, sp = 60 + Math.random() * 260;
    parts.push({ x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.6 + Math.random() * 0.9, max: 1.5, c: cols[i % 4], s: 3 + Math.random() * 5 });
  }
  boss = null;
  perfect = true;
  state = 'clear';
  clearT = 1.4;
}

function playerHit(){
  if (player.inv > 0 || state === 'dead') return;
  lives--;
  perfect = false;
  player.inv = 2.2;
  shake = 0.9; flash = 0.4;
  ebullets.length = 0;
  for (var i = 0; i < 20; i++){
    var a = Math.random() * 6.283, sp = 60 + Math.random() * 200;
    parts.push({ x: player.x, y: player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.5, max: 0.9, c: '#f87171', s: 3 + Math.random() * 4 });
  }
  Game.hud(hudText());
  Game.float(player.x, player.y - 40, '💥', '#f87171');
  if (lives <= 0){ state = 'dead'; deathT = 1.3; }
}

function useBomb(){
  if (bombs <= 0 || state === 'dead') return;
  bombs--;
  Game.hud(hudText());
  flash = 0.7; shake = 1.0;
  ebullets.length = 0;
  for (var i = 0; i < 30; i++){
    var a = Math.random() * 6.283, sp = 100 + Math.random() * 220;
    parts.push({ x: player.x, y: player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.5, max: 0.9, c: '#67e8f9', s: 3 + Math.random() * 4 });
  }
  Game.float(player.x, player.y - 44, '💣 BOMB!', '#67e8f9');
  if (boss && boss.hp > 0) damageBoss(boss.max * 0.16);
}

function movePlayer(x, y){
  player.x = clamp(x, 22, W - 22);
  player.y = clamp(y - 58, TOP + 20, BOT - 12);
}

function onDown(x, y, id){
  if (state === 'dead') return;
  dragId = id;
  movePlayer(x, y);
  if (gameTime - lastTapT < 0.34 && Math.abs(x - tapX) < 90 && Math.abs(y - tapY) < 120){
    useBomb();
    lastTapT = -10;
  } else {
    lastTapT = gameTime;
    tapX = x; tapY = y;
  }
}
function onMove(x, y, id){ if (id === dragId) movePlayer(x, y); }
function onUp(x, y, id){ if (id === dragId) dragId = -1; }

function draw(){
  if (!bgGrad){
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#05060f');
    bgGrad.addColorStop(0.55, '#0b1024');
    bgGrad.addColorStop(1, '#161c38');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  var i;
  for (i = 0; i < stars.length; i++){
    var s = stars[i];
    ctx.globalAlpha = 0.2 + s.s * 0.4;
    ctx.fillStyle = s.s > 1.4 ? '#bae6fd' : '#e2e8f0';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  var ox = shake > 0 ? (Math.random() - 0.5) * 14 * shake : 0;
  var oy = shake > 0 ? (Math.random() - 0.5) * 14 * shake : 0;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (i = 0; i < drops.length; i++){
    var dr = drops[i];
    ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(dr.t * 8));
    ctx.fillText('🔸', dr.x, dr.y);
  }
  ctx.globalAlpha = 1;

  ctx.font = "38px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (i = 0; i < zakos.length; i++) ctx.fillText('👾', zakos[i].x, zakos[i].y);

  if (boss){
    var rr = boss.r * 1.6;
    var rg = ctx.createRadialGradient(boss.x, boss.y, 4, boss.x, boss.y, rr);
    rg.addColorStop(0, boss.form === 2 ? 'rgba(255,70,90,0.42)' : 'rgba(120,170,255,0.30)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(boss.x, boss.y, rr, 0, 6.283); ctx.fill();
    ctx.font = "92px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    if (boss.hitFlash <= 0 || Math.floor(gameTime * 30) % 2 === 0){
      ctx.fillText(boss.e, boss.x, boss.y);
    } else {
      ctx.globalAlpha = 0.6;
      ctx.fillText(boss.e, boss.x, boss.y);
      ctx.globalAlpha = 1;
    }
  }

  for (i = 0; i < ebullets.length; i++){
    var b = ebullets[i];
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.0, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
  }

  for (i = 0; i < pshots.length; i++){
    var p = pshots[i];
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#a5f3fc';
    ctx.fillRect(p.x - 4, p.y - 13, 8, 20);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#67e8f9';
    ctx.fillRect(p.x - 2, p.y - 10, 4, 15);
  }
  ctx.globalAlpha = 1;

  if (state !== 'dead'){
    if (player.inv <= 0 || Math.floor(gameTime * 14) % 2 === 0){
      ctx.font = "42px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('✈️', player.x, player.y);
    }
    ctx.strokeStyle = 'rgba(103,232,249,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(player.x, player.y, 9, 0, 6.283); ctx.stroke();
    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath(); ctx.arc(player.x, player.y, 3.2, 0, 6.283); ctx.fill();
  } else {
    ctx.font = "64px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('💥', player.x, player.y);
  }

  for (i = 0; i < parts.length; i++){
    var pt = parts[i];
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = pt.c;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.s, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHp();
  if (state === 'warning') drawWarning();

  if (flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.85, flash) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawHp(){
  if (!boss) return;
  var bx = 46, bw = W - 92, by = 66, bh = 10;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(bx, by, bw, bh);
  var frac = Math.max(0, Math.min(1, boss.hp / boss.max));
  ctx.fillStyle = boss.form === 2 ? '#fb7185' : '#4ade80';
  ctx.fillRect(bx, by, bw * frac, bh);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillRect(bx + bw / 2 - 0.5, by, 1, bh);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '14px sans-serif';
  ctx.fillText((bossIndex % 4 + 1) + '/4  ' + boss.name + (loopNum > 1 ? '  周回' + loopNum : ''), bx, by + 24);
  ctx.textAlign = 'center';
}

function drawWarning(){
  var bh = 40;
  var t = (warnDur - warnT) * 60;
  stripeBand(TOP, bh, t);
  stripeBand(BOT - bh, bh, t);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 24px sans-serif';
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#111827';
  ctx.strokeText('WARNING', W / 2, TOP + bh / 2);
  ctx.strokeText('WARNING', W / 2, BOT - bh / 2);
  ctx.fillStyle = '#fde047';
  ctx.fillText('WARNING', W / 2, TOP + bh / 2);
  ctx.fillText('WARNING', W / 2, BOT - bh / 2);
}

function stripeBand(y0, bh, t){
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, y0, W, bh);
  ctx.clip();
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, y0, W, bh);
  ctx.fillStyle = '#fde047';
  var shift = t % 40;
  for (var x = -100; x < W + 100; x += 40){
    ctx.beginPath();
    ctx.moveTo(x + shift, y0 - 2);
    ctx.lineTo(x + shift + 18, y0 - 2);
    ctx.lineTo(x + shift + 18 - bh, y0 + bh + 2);
    ctx.lineTo(x + shift - bh, y0 + bh + 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/*__VAPPA_JS_END__*/
</script>
