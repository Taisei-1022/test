<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="人";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>

var grid, pieces, tray, trayN, slotW, sel, fx, parts, score, elapsed, remain, over, nextId;

function emojiFont(px){ return px + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; }
function cellX(c){ return GX + c*CELL; }
function cellY(r){ return GY + r*CELL; }

function isRoomKind(k){
  return k === 'room' || k === 'penthouse' || k === 'pet' || k === 'cafe' || k === 'musician' || k === 'family';
}
function pieceIcon(p){
  if (p.kind === 'penthouse') return '👑';
  if (p.kind === 'pet') return '🐶';
  if (p.kind === 'cafe') return '☕';
  if (p.kind === 'musician') return '🎸';
  if (p.kind === 'family') return '👪';
  return '🧑';
}
function isTopRow(p){
  for (var k=0;k<p.cells.length;k++){ if (p.r + p.cells[k][1] !== 0) return false; }
  return true;
}

function roundRect(x,y,w,h,r){
  if (r > w/2) r = w/2;
  if (r > h/2) r = h/2;
  if (r < 0) r = 0;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function bbox(cells){
  var mx = 0, my = 0;
  for (var i=0;i<cells.length;i++){
    if (cells[i][0] > mx) mx = cells[i][0];
    if (cells[i][1] > my) my = cells[i][1];
  }
  return [mx+1, my+1];
}

function cloneCells(cs){
  var o = [];
  for (var i=0;i<cs.length;i++) o.push([cs[i][0], cs[i][1]]);
  return o;
}

function rotCells(cells){
  var out = [], i, mnx = 999, mny = 999;
  for (i=0;i<cells.length;i++){
    var nx = cells[i][1], ny = -cells[i][0];
    out.push([nx, ny]);
    if (nx < mnx) mnx = nx;
    if (ny < mny) mny = ny;
  }
  for (i=0;i<out.length;i++){ out[i][0] -= mnx; out[i][1] -= mny; }
  return out;
}

function pieceHue(p){

  if (p.kind === 'elevator') return 180;
  if (p.kind === 'penthouse') return 48;
  if (p.kind === 'pet') return 22;
  if (p.kind === 'cafe') return 352;
  if (p.kind === 'musician') return 286;
  if (p.kind === 'family') return 200;
  var n = p.cells.length;
  if (n <= 1) return 32;
  if (n === 2) return 340;
  return 268;
}

function buildSky(){
  skyGrad = ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0, '#161b3d');
  skyGrad.addColorStop(0.42, '#3d2a5e');
  skyGrad.addColorStop(0.68, '#8b4763');
  skyGrad.addColorStop(0.86, '#d47a45');
  skyGrad.addColorStop(1, '#f2a962');
  sun = { x: 84, y: 566 };
  sunGrad = ctx.createRadialGradient(sun.x, sun.y, 6, sun.x, sun.y, 150);
  sunGrad.addColorStop(0, 'rgba(255,216,150,0.9)');
  sunGrad.addColorStop(1, 'rgba(255,140,90,0)');
  city = [];
  var x = -14;
  while (x < W + 14){
    var bw = 26 + Math.random()*38;
    var bh = 190 + Math.random()*250;
    var b = { x: x, w: bw, h: bh, win: [] };
    for (var wy = 14; wy < bh - 22; wy += 17){
      for (var wx = 6; wx < bw - 12; wx += 14){
        if (Math.random() < 0.42) b.win.push([wx, wy]);
      }
    }
    city.push(b);
    x += bw + 3 + Math.random()*10;
  }
}

function init(){
  grid = [];
  var r, c;
  for (r=0;r<ROWS;r++){ grid[r] = []; for (c=0;c<COLS;c++) grid[r][c] = null; }
  pieces = []; fx = []; parts = []; sel = -1; score = 0; elapsed = 0; over = false;
  nextId = 1; flashSlot = -1; flashT = 0; shake = 0;
  lux = 0; rushActive = false; fullSet = {}; noiseSet = {};
  remain = TUNE.gameTime.v;
  trayN = Math.max(1, Math.min(5, Math.round(TUNE.traySize.v)));
  slotW = (480 - TRAY_PAD*2 - TRAY_GAP*(trayN-1)) / trayN;
  tray = [];
  for (var i=0;i<trayN;i++) tray.push(null);
  var ent = { id: nextId++, kind:'entrance', cells:[[0,0]], r:ENTR, c:ENTC, connected:true, prevConn:true, flash:0 };
  grid[ENTR][ENTC] = ent;
  pieces.push(ent);
  refillTray();
  recompute();
  Game.score(0);
  Game.hud('⏱' + Math.ceil(remain));
  buildSky();
}

function makePiece(){
  var t = elapsed / TUNE.gameTime.v;
  if (t > 1) t = 1;
  if (t < 0) t = 0;
  var i, d, w, total = 0, pool = [];
  for (i=0;i<PIECE_DEFS.length;i++){
    d = PIECE_DEFS[i];
    if (d.from === 'big' && elapsed < TUNE.bigFrom.v) continue;
    if (d.from === 'awk' && elapsed < TUNE.awkwardFrom.v) continue;
    w = d.w + (d.wEnd - d.w) * t;
    if (d.kind === 'corridor') w *= TUNE.corridorRate.v / 2.6;
    if (d.kind === 'elevator') w *= TUNE.elevatorRate.v / 1.1;
    if (w <= 0.001) continue;
    pool.push({ d: d, w: w });
    total += w;
  }
  if (pool.length === 0){ pool.push({ d: PIECE_DEFS[0], w: 1 }); total = 1; }
  var x = Math.random() * total, acc = 0, pick = pool[0].d;
  for (i=0;i<pool.length;i++){ acc += pool[i].w; if (x <= acc){ pick = pool[i].d; break; } }
  return { id: nextId++, kind: pick.kind, cells: cloneCells(pick.cells), connected:false, prevConn:false, flash:0, moveInMul:1 };
}

function makeHammer(){
  return { id: nextId++, kind:'hammer', cells:[[0,0]], connected:false, prevConn:false, flash:0, moveInMul:1 };
}

function refillTray(){
  for (var i=0;i<tray.length;i++){
    if (tray[i]) continue;
    if (Math.random() < TUNE.hammerRate.v) tray[i] = makeHammer();
    else tray[i] = makePiece();
  }
}

function canFit(cells, r0, c0, self){
  for (var i=0;i<cells.length;i++){
    var rr = r0 + cells[i][1], cc = c0 + cells[i][0];
    if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) return false;
    var g = grid[rr][cc];
    if (g && g !== self) return false;
  }
  return true;
}

function canPlaceAnywhere(p){
  var cs = p.cells;
  for (var rot=0; rot<4; rot++){
    for (var r=0;r<ROWS;r++){
      for (var c=0;c<COLS;c++){
        if (canFit(cs, r, c, null)) return true;
      }
    }
    cs = rotCells(cs);
  }
  return false;
}

function anyDemolishTarget(){
  for (var i=0;i<pieces.length;i++){ if (pieces[i].kind !== 'entrance') return true; }
  return false;
}

function pieceUsable(p){
  if (p.kind === 'hammer') return anyDemolishTarget();
  return canPlaceAnywhere(p);
}

function anyPlaceableInTray(){
  for (var i=0;i<tray.length;i++){
    if (tray[i] && pieceUsable(tray[i])) return true;
  }
  return false;
}

function badFlash(slot){
  flashSlot = slot;
  flashT = 0.6;
}

function emitBurst(x, y, n, hue){
  for (var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2;
    var sp = 50 + Math.random()*150;
    parts.push({
      x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40,
      t: 0.8 + Math.random()*0.6, max: 1.4,
      col: 'hsl(' + Math.round(hue + Math.random()*70) + ',95%,' + Math.round(58 + Math.random()*22) + '%)',
      r: 2 + Math.random()*2.5
    });
  }
  if (parts.length > 260) parts.splice(0, parts.length - 260);
}

function tryPlace(slot, r0, c0){
  var p = tray[slot];
  if (!p || p.kind === 'hammer') return;
  var cs = p.cells, i;
  for (i=0;i<cs.length;i++){
    var rr = r0 + cs[i][1], cc = c0 + cs[i][0];
    if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || grid[rr][cc]){ badFlash(slot); return; }
  }
  var np = { id: nextId++, kind: p.kind, cells: cloneCells(cs), r: r0, c: c0, connected:false, prevConn:false, flash:0, moveInMul: rushActive ? 2 : 1 };
  for (i=0;i<cs.length;i++) grid[r0 + cs[i][1]][c0 + cs[i][0]] = np;
  pieces.push(np);
  tray[slot] = null;
  sel = -1;
  shake = 0.18;
  recompute();
  afterPlacement();
}

function tryDemolish(slot, r0, c0){
  var target = grid[r0][c0];
  if (!target || target.kind === 'entrance'){ badFlash(slot); return; }
  var i, k;
  for (k=0;k<target.cells.length;k++){
    var rr = target.r + target.cells[k][1], cc = target.c + target.cells[k][0];
    if (grid[rr] && grid[rr][cc] === target) grid[rr][cc] = null;
  }
  for (i=0;i<pieces.length;i++){ if (pieces[i] === target){ pieces.splice(i,1); break; } }
  tray[slot] = null;
  sel = -1;
  shake = 0.25;
  Game.float(cellX(target.c) + CELL/2, Math.max(74, cellY(target.r) - 8), '🔨 解体', '#ff9aa2');
  emitBurst(cellX(target.c) + CELL/2, cellY(target.r) + CELL/2, 12, 10);
  recompute();
  afterPlacement();
}

function tryRotate(p){
  var nc = rotCells(p.cells);
  var ob = bbox(p.cells), nb = bbox(nc);
  var cands = [];
  cands.push([ p.r + Math.floor((ob[1] - nb[1]) / 2), p.c + Math.floor((ob[0] - nb[0]) / 2) ]);
  cands.push([ p.r, p.c ]);
  for (var k=0;k<cands.length;k++){
    if (canFit(nc, cands[k][0], cands[k][1], p)){
      var i;
      for (i=0;i<p.cells.length;i++){
        var rr = p.r + p.cells[i][1], cc = p.c + p.cells[i][0];
        if (grid[rr] && grid[rr][cc] === p) grid[rr][cc] = null;
      }
      p.cells = nc;
      p.r = cands[k][0];
      p.c = cands[k][1];
      for (i=0;i<nc.length;i++) grid[p.r + nc[i][1]][p.c + nc[i][0]] = p;
      recompute();
      return true;
    }
  }
  p.flash = 0.55;
  return false;
}

function recompute(){
  var r, c, i, k;
  var reach = [];
  for (r=0;r<ROWS;r++){ reach[r] = []; for (c=0;c<COLS;c++) reach[r][c] = false; }
  var q = [[ENTR, ENTC]];
  reach[ENTR][ENTC] = true;
  while (q.length){
    var cur = q.pop(); r = cur[0]; c = cur[1];
    var pc = grid[r][c];
    if (pc && pc.kind === 'elevator'){
      var rr, r2, c2;
      for (rr=0; rr<ROWS; rr++){
        if (!reach[rr][c]){ reach[rr][c] = true; q.push([rr, c]); }
      }
      for (r2=0; r2<ROWS; r2++){
        for (c2=0; c2<COLS; c2++){
          var e = grid[r2][c2];
          if (e && e.kind === 'elevator' && !reach[r2][c2]){ reach[r2][c2] = true; q.push([r2, c2]); }
        }
      }
    }
    if (pc && isRoomKind(pc.kind)) continue;
    for (i=0;i<4;i++){
      var nr = r + DIRS[i][0], nc = c + DIRS[i][1];
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      if (reach[nr][nc]) continue;
      var np = grid[nr][nc];
      if (np && (np.kind === 'corridor' || np.kind === 'elevator')){ reach[nr][nc] = true; q.push([nr, nc]); }
    }
  }

  for (i=0;i<pieces.length;i++){ pieces[i].prevConn = pieces[i].connected; pieces[i].connected = false; }
  for (r=0;r<ROWS;r++){
    for (c=0;c<COLS;c++){
      if (!reach[r][c]) continue;
      var own = grid[r][c];
      if (own && isRoomKind(own.kind)) own.connected = true;
      for (i=0;i<4;i++){
        var nr2 = r + DIRS[i][0], nc2 = c + DIRS[i][1];
        if (nr2 < 0 || nr2 >= ROWS || nc2 < 0 || nc2 >= COLS) continue;
        var pp = grid[nr2][nc2];
        if (pp && isRoomKind(pp.kind)) pp.connected = true;
      }
    }
  }
  for (i=0;i<pieces.length;i++){
    var pc2 = pieces[i];
    if (pc2.kind !== 'corridor' && pc2.kind !== 'elevator') continue;
    for (k=0;k<pc2.cells.length;k++){
      var rr3 = pc2.r + pc2.cells[k][1], cc3 = pc2.c + pc2.cells[k][0];
      if (reach[rr3][cc3]){ pc2.connected = true; break; }
    }
  }

  var total = 0;
  var bonusMap = {};

  for (i=0;i<pieces.length;i++){
    var p = pieces[i];
    if (!p.connected || !isRoomKind(p.kind)) continue;
    var mul = p.moveInMul || 1;
    total += p.cells.length * mul;
    var extra = 0;
    var tag = '🧑';
    if (p.kind === 'penthouse' && isTopRow(p)){ extra = 5 * mul; tag = '👑'; }
    total += extra;
    if (!p.prevConn){
      var cx = cellX(p.c) + CELL/2;
      var cy = Math.max(74, cellY(p.r) - 8);
      for (k=0;k<p.cells.length;k++){
        fx.push({ x: cellX(p.c + p.cells[k][0]) + CELL/2, y: cellY(p.r + p.cells[k][1]) + CELL/2, t: 0.95, max: 0.95, type:'wave' });
      }
      Game.float(cx, cy, '+' + (p.cells.length*mul + extra) + tag, '#ffe9a8');
    }
  }

  for (i=0;i<pieces.length;i++){
    var pe = pieces[i];
    if (pe.kind !== 'pet' || !pe.connected) continue;
    var seen = {};
    var cnt = 0;
    for (k=0;k<4;k++){
      var ar = pe.r + DIRS[k][0], ac = pe.c + DIRS[k][1];
      if (ar < 0 || ar >= ROWS || ac < 0 || ac >= COLS) continue;
      var nb = grid[ar][ac];
      if (nb && nb !== pe && isRoomKind(nb.kind) && !seen[nb.id]){
        seen[nb.id] = true;
        bonusMap[nb.id] = (bonusMap[nb.id] || 0) + 1;
        cnt++;
      }
    }
    if (!pe.prevConn && cnt > 0) Game.float(cellX(pe.c) + CELL/2, Math.max(74, cellY(pe.r)-8), '🐶 +' + cnt, '#ffd0a0');
  }

  for (i=0;i<pieces.length;i++){
    var cf = pieces[i];
    if (cf.kind !== 'cafe' || !cf.connected) continue;
    var seen2 = {};
    var cnt2 = 0;
    for (c=0;c<COLS;c++){
      var nb2 = grid[cf.r][c];
      if (nb2 && nb2 !== cf && isRoomKind(nb2.kind) && !seen2[nb2.id]){
        seen2[nb2.id] = true;
        bonusMap[nb2.id] = (bonusMap[nb2.id] || 0) + 1;
        cnt2++;
      }
    }
    if (!cf.prevConn && cnt2 > 0) Game.float(cellX(cf.c) + CELL/2, Math.max(74, cellY(cf.r)-8), '☕ +' + cnt2, '#ffc9b0');
  }

  for (var key in bonusMap){ total += bonusMap[key]; }

  for (i=0;i<pieces.length;i++){
    var mu = pieces[i];
    if (mu.kind !== 'musician' || !mu.connected) continue;
    var seenF = {};
    for (k=0;k<4;k++){
      var fr = mu.r + DIRS[k][0], fc = mu.c + DIRS[k][1];
      if (fr < 0 || fr >= ROWS || fc < 0 || fc >= COLS) continue;
      var fam = grid[fr][fc];
      if (fam && fam.kind === 'family' && fam.connected && !seenF[fam.id]){
        seenF[fam.id] = true;
        total -= 2;
        var nkey = mu.id + '_' + fam.id;
        if (!noiseSet[nkey]){
          noiseSet[nkey] = true;
          Game.float(cellX(mu.c) + CELL/2, Math.max(74, cellY(mu.r)-8), '😡苦情 -2', '#ff8f8f');
          shake = 0.3;
        }
      }
    }
  }

  for (r=0;r<ROWS;r++){
    var full = true;
    for (c=0;c<COLS;c++){ if (!grid[r][c]){ full = false; break; } }
    if (full){
      total += 10;
      if (!fullSet[r]){
        fullSet[r] = true;
        var ry = cellY(r) + CELL/2;
        Game.float(W/2, Math.max(74, ry - 22), '満室ボーナス +10', '#ffd166');
        emitBurst(110, ry, 22, 40);
        emitBurst(240, ry, 22, 300);
        emitBurst(370, ry, 22, 10);
        shake = 0.35;
      }
    } else if (fullSet[r]) {
      delete fullSet[r];
    }
  }

  if (total < 0) total = 0;
  score = total;
  Game.score(score);
}

function afterPlacement(){
  var i, removed = false;
  for (i=0;i<tray.length;i++){
    if (tray[i] && !pieceUsable(tray[i])){
      tray[i] = null;
      if (sel === i) sel = -1;
      removed = true;
    }
  }
  if (removed) Game.toast('置けないピースは没収！');
  var any = false;
  for (i=0;i<tray.length;i++) if (tray[i]) any = true;
  if (!any){ refillTray(); Game.toast('新しいピースが届いた！'); }
  if (!anyPlaceableInTray()){
    Game.toast('敷地がいっぱい！');
    endGame();
  }
}

function endGame(){
  if (over) return;
  over = true;
  Game.over(score);
}

function update(dt){
  if (over) return;
  elapsed += dt;
  remain -= dt;
  var i;
  var cycle = TUNE.rushCycle.v;
  var dur = cycle * 0.5;
  var was = rushActive;
  rushActive = (elapsed >= cycle) && ((elapsed % cycle) < dur);
  if (rushActive && !was){
    Game.toast('入居ラッシュ！ 住人2倍');
    for (i=0;i<6;i++) emitBurst(70 + Math.random()*340, GY + 40 + Math.random()*(ROWS*CELL - 90), 8, 40);
    shake = 0.25;
  }
  if (remain <= 0){
    remain = 0;
    Game.hud('⏱0');
    endGame();
    return;
  }
  Game.hud('⏱' + Math.ceil(remain) + (rushActive ? ' ⚡×2' : ''));
  for (i=fx.length-1;i>=0;i--){ fx[i].t -= dt; if (fx[i].t <= 0) fx.splice(i,1); }
  for (i=parts.length-1;i>=0;i--){
    var pa = parts[i];
    pa.t -= dt;
    if (pa.t <= 0){ parts.splice(i,1); continue; }
    pa.x += pa.vx*dt; pa.y += pa.vy*dt; pa.vy += 190*dt;
  }
  for (i=0;i<pieces.length;i++){ if (pieces[i].flash > 0) pieces[i].flash -= dt; }
  if (flashT > 0) flashT -= dt;
  if (shake > 0) shake -= dt;
}

function drawCity(){
  ctx.fillStyle = sunGrad;
  ctx.beginPath(); ctx.arc(sun.x, sun.y, 150, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffd9a0';
  ctx.beginPath(); ctx.arc(sun.x, sun.y, 36, 0, Math.PI*2); ctx.fill();
  for (var i=0;i<city.length;i++){
    var b = city[i];
    var top = H - b.h;
    ctx.fillStyle = '#241a3c';
    ctx.fillRect(b.x, top, b.w, b.h);
    ctx.fillStyle = 'rgba(255,214,120,' + (0.30 + 0.70*lux) + ')';
    for (var k=0;k<b.win.length;k++) ctx.fillRect(b.x + b.win[k][0], top + b.win[k][1], 4, 6);
  }
}

function drawExteriorLights(){
  var n = 13;
  var lit = Math.round(n * lux);
  for (var i=0;i<n;i++){
    var y = 80 + i*37;
    var on = i < lit;
    var pulse = 0.85 + 0.15*Math.sin(elapsed*4 + i);
    var xL = 20, xR = W - 20;
    if (on){
      ctx.fillStyle = 'rgba(255,214,120,0.16)';
      ctx.beginPath(); ctx.arc(xL, y, 11, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(xR, y, 11, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = on ? 'rgba(255,214,120,' + (0.85*pulse) + ')' : 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.arc(xL, y, on ? 5 : 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(xR, y, on ? 5 : 3, 0, Math.PI*2); ctx.fill();
  }
}

function drawShafts(){
  for (var i=0;i<pieces.length;i++){
    var p = pieces[i];
    if (p.kind !== 'elevator') continue;
    for (var k=0;k<p.cells.length;k++){
      var x = cellX(p.c + p.cells[k][0]);
      ctx.fillStyle = 'rgba(120,240,230,' + (p.connected ? 0.16 : 0.07) + ')';
      ctx.fillRect(x + CELL*0.5 - 9, GY, 18, ROWS*CELL);
    }
  }
}

function drawPlot(){
  ctx.fillStyle = 'rgba(10,14,26,' + (0.45 - 0.15*lux) + ')';
  roundRect(GX-6, GY-6, COLS*CELL+12, ROWS*CELL+12, 14); ctx.fill();
  if (rushActive){
    ctx.fillStyle = 'rgba(255,196,90,' + (0.07 + 0.05*Math.sin(elapsed*9)) + ')';
    roundRect(GX-6, GY-6, COLS*CELL+12, ROWS*CELL+12, 14); ctx.fill();
  }
  ctx.strokeStyle = 'hsla(' + Math.round(30 + 25*lux) + ',92%,' + Math.round(60 + 16*lux) + '%,' + (0.35 + 0.5*lux) + ')';
  ctx.lineWidth = 2 + 2*lux;
  roundRect(GX-6, GY-6, COLS*CELL+12, ROWS*CELL+12, 14); ctx.stroke();
  if (lux > 0.05){
    ctx.strokeStyle = 'rgba(255,220,140,' + (0.18 + 0.25*lux) + ')';
    ctx.lineWidth = 3 + 5*lux;
    roundRect(GX-4, GY-4, COLS*CELL+8, ROWS*CELL+8, 16); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var c=0;c<=COLS;c++){ var x = GX + c*CELL; ctx.moveTo(x, GY); ctx.lineTo(x, GY + ROWS*CELL); }
  for (var r=0;r<=ROWS;r++){ var y = GY + r*CELL; ctx.moveTo(GX, y); ctx.lineTo(GX + COLS*CELL, y); }
  ctx.stroke();
  drawShafts();
  drawExteriorLights();
}

function drawCell(x, y, s, p){
  var pad = 3, iw = s - pad*2;
  if (p.kind === 'entrance'){
    ctx.fillStyle = '#e8b53c';
    roundRect(x+pad, y+pad, iw, iw, 10); ctx.fill();
    ctx.fillStyle = 'rgba(90,60,10,0.30)';
    roundRect(x+pad+8, y+pad+8, iw-16, iw-16, 8); ctx.fill();
    ctx.font = emojiFont(Math.round(s*0.5));
    ctx.fillText('🚪', x+s/2, y+s/2+1);
    return;
  }
  var hue = pieceHue(p);
  if (isRoomKind(p.kind)){
    if (p.connected){
      ctx.fillStyle = 'hsl(' + hue + ',62%,50%)';
      roundRect(x+pad, y+pad, iw, iw, 10); ctx.fill();
      ctx.fillStyle = '#ffe6ad';
      roundRect(x+pad+11, y+pad+11, iw-22, iw-22, 6); ctx.fill();
    } else {
      ctx.fillStyle = 'hsl(' + hue + ',10%,36%)';
      roundRect(x+pad, y+pad, iw, iw, 10); ctx.fill();
      ctx.fillStyle = 'rgba(170,180,200,0.16)';
      roundRect(x+pad+11, y+pad+11, iw-22, iw-22, 6); ctx.fill();
    }
    ctx.globalAlpha = p.connected ? 1 : 0.35;
    ctx.font = emojiFont(Math.round(s*0.46));
    ctx.fillText(pieceIcon(p), x+s/2, y+s/2+1);
    ctx.globalAlpha = 1;
  } else if (p.kind === 'corridor'){
    ctx.fillStyle = p.connected ? 'hsl(212,32%,58%)' : 'hsl(212,10%,40%)';
    roundRect(x+pad, y+pad, iw, iw, 10); ctx.fill();
    ctx.fillStyle = p.connected ? 'rgba(255,255,255,0.42)' : 'rgba(255,255,255,0.12)';
    ctx.fillRect(x + s*0.20, y + s*0.45, s*0.60, s*0.10);
  } else {
    ctx.fillStyle = p.connected ? 'hsl(180,52%,50%)' : 'hsl(180,12%,40%)';
    roundRect(x+pad, y+pad, iw, iw, 10); ctx.fill();
    ctx.globalAlpha = p.connected ? 1 : 0.4;
    ctx.font = emojiFont(Math.round(s*0.42));
    ctx.fillText('🛗', x+s/2, y+s/2+1);
    ctx.globalAlpha = 1;
  }
  if (p.flash > 0){
    ctx.globalAlpha = 0.30 + 0.40*Math.abs(Math.sin(p.flash*22));
    ctx.fillStyle = '#ff3b30';
    roundRect(x+pad, y+pad, iw, iw, 10); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawPieces(){
  for (var r=0;r<ROWS;r++){
    for (var c=0;c<COLS;c++){
      var p = grid[r][c];
      if (!p) continue;
      drawCell(cellX(c), cellY(r), CELL, p);
    }
  }
}

function drawGhost(){
  if (sel < 0 || !tray[sel]) return;
  var sp = tray[sel];
  var r, c;
  if (sp.kind === 'hammer'){
    var a = 0.20 + 0.25*Math.abs(Math.sin(elapsed*6));
    for (r=0;r<ROWS;r++){
      for (c=0;c<COLS;c++){
        var g = grid[r][c];
        if (!g || g.kind === 'entrance') continue;
        ctx.fillStyle = 'rgba(255,70,70,' + a + ')';
        roundRect(cellX(c)+4, cellY(r)+4, CELL-8, CELL-8, 8); ctx.fill();
      }
    }
    return;
  }
  var cs = sp.cells;
  for (r=0;r<ROWS;r++){
    for (c=0;c<COLS;c++){
      if (!canFit(cs, r, c, null)) continue;
      ctx.fillStyle = 'rgba(255,228,150,0.55)';
      ctx.beginPath(); ctx.arc(cellX(c)+CELL/2, cellY(r)+CELL/2, 4, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawFx(){
  for (var i=0;i<fx.length;i++){
    var f = fx[i];
    var k = 1 - f.t / f.max;
    ctx.globalAlpha = Math.max(0, 1 - k);
    ctx.font = emojiFont(26);
    ctx.fillText('👋', f.x, f.y - k*30);
    ctx.globalAlpha = 1;
  }
}

function drawParts(){
  for (var i=0;i<parts.length;i++){
    var p = parts[i];
    ctx.globalAlpha = Math.max(0, p.t / p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMini(x, y, s, p){
  var col;
  if (p.kind === 'hammer') col = 'hsl(12,52%,46%)';
  else if (p.kind === 'corridor') col = 'hsl(212,32%,58%)';
  else if (p.kind === 'elevator') col = 'hsl(180,52%,50%)';
  else col = 'hsl(' + pieceHue(p) + ',62%,54%)';
  ctx.fillStyle = col;
  roundRect(x+1, y+1, s-2, s-2, Math.max(3, s*0.22)); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  roundRect(x+4, y+4, s-8, s-8, Math.max(2, s*0.16)); ctx.fill();
  var ic;
  if (p.kind === 'hammer') ic = '🔨';
  else if (p.kind === 'corridor') ic = '🚶';
  else if (p.kind === 'elevator') ic = '🛗';
  else ic = pieceIcon(p);
  ctx.font = emojiFont(Math.max(11, Math.round(s*0.52)));
  ctx.fillText(ic, x+s/2, y+s/2+1);
}

function drawTray(){
  for (var i=0;i<trayN;i++){
    var sx = TRAY_PAD + i*(slotW + TRAY_GAP);
    var active = (sel === i);
    var bad = (flashSlot === i && flashT > 0 && Math.sin(flashT*40) > 0);
    ctx.fillStyle = active ? 'rgba(255,214,120,0.18)' : 'rgba(14,18,34,0.74)';
    roundRect(sx, TRAY_Y, slotW, TRAY_H, 12); ctx.fill();
    ctx.lineWidth = active ? 3 : 2;
    ctx.strokeStyle = bad ? '#ff3b30' : (active ? '#ffd166' : 'rgba(255,255,255,0.16)');
    roundRect(sx, TRAY_Y, slotW, TRAY_H, 12); ctx.stroke();
    var p = tray[i];
    if (!p) continue;
    var cs = p.cells, bb = bbox(cs);
    var ts = Math.min(30, Math.floor((slotW - 30) / bb[0]), Math.floor((TRAY_H - 30) / bb[1]));
    if (ts < 8) ts = 8;
    var ox = sx + (slotW - bb[0]*ts) / 2;
    var oy = TRAY_Y + (TRAY_H - bb[1]*ts) / 2;
    for (var k=0;k<cs.length;k++) drawMini(ox + cs[k][0]*ts, oy + cs[k][1]*ts, ts, p);
  }
}

function draw(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  lux = Math.min(1, score / 140);
  drawCity();
  var ox = 0;
  if (shake > 0){ var m = shake / 0.18; if (m > 1) m = 1; ox = (Math.random()*2 - 1) * 5 * m; }
  ctx.save();
  ctx.translate(ox, 0);
  drawPlot();
  drawPieces();
  drawGhost();
  drawFx();
  drawParts();
  ctx.restore();
  drawTray();
}

function onDown(x, y, id){
  if (over) return;
  var i;
  if (y >= TRAY_Y - 6){
    for (i=0;i<trayN;i++){
      var sx = TRAY_PAD + i*(slotW + TRAY_GAP);
      if (x >= sx && x <= sx + slotW){
        if (!tray[i]) return;
        if (sel === i){ tray[i].cells = rotCells(tray[i].cells); return; }
        sel = i;
        return;
      }
    }
    return;
  }
  if (x < GX || y < GY) return;
  var c = Math.floor((x - GX) / CELL);
  var r = Math.floor((y - GY) / CELL);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
  var p = grid[r][c];
  if (sel >= 0 && tray[sel]){
    if (tray[sel].kind === 'hammer') tryDemolish(sel, r, c);
    else tryPlace(sel, r, c);
  } else if (p && p.kind !== 'entrance'){
    tryRotate(p);
  }
}
