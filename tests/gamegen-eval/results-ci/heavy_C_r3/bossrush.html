<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.vp-hud span{background:rgba(8,12,26,.55);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px 12px}
.vp-hud span:empty{display:none}
.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}
.vp-ov h1{font-size:28px}
.vp-ov p{color:#b9c1de;font-size:14.5px;line-height:1.8;max-width:340px;white-space:pre-line}
.vp-ov .vp-big{font-size:44px;font-weight:900;color:#ffd166}
.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
[hidden]{display:none!important}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  follow:      { v: 0.5,  label: '自機の追従',       min: 0.1,  max: 1,   step: 0.05 },
  fireRate:    { v: 0.1,  label: '連射間隔(秒)',     min: 0.04, max: 0.4, step: 0.01 },
  bulletSpeed: { v: 150,  label: '敵弾の速さ',       min: 60,   max: 320, step: 10 },
  bossHp:      { v: 1,    label: 'ボスHP倍率',       min: 0.4,  max: 3,   step: 0.1 },
  grazeDist:   { v: 22,   label: 'グレイズ範囲',     min: 10,   max: 60,  step: 2 },
  loopSpeed:   { v: 1.5,  label: '周回ごとの弾速倍率', min: 1,  max: 2.5, step: 0.1 },
  lives:       { v: 3,    label: 'ライフ',           min: 1,    max: 9,   step: 1 },
  bombMax:     { v: 3,    label: 'ボムの数',         min: 0,    max: 9,   step: 1 }
};

var GLOWC = ['#67e8f9', '#f472b6', '#a3e635', '#facc15', '#c084fc', '#a5f3fc'];

/* ボス定義テーブル：撃ち方がそれぞれ違う */
var BOSSES = [
  { emoji: '🐙', name: 'オクトパス',   hp: 380, atk: 1.15, move: 70,  y: 172, phase: ['ring'] },
  { emoji: '🦂', name: 'スコルピオン', hp: 520, atk: 1.05, move: 95,  y: 176, phase: ['aimed'] },
  { emoji: '🐲', name: 'ドラゴン',     hp: 700, atk: 0.92, move: 112, y: 180, phase: ['spiral'] },
  { emoji: '👁️', name: 'アイ',         hp: 900, atk: 0.82, move: 130, y: 168, phase: ['aimed', 'ring', 'spiral', 'spread'] }
];

var player, target, bullets, pbullets, particles, stars, boss, bossIdx, loopN;
var zakoList, powers;
var score, lives, bombs, powerLv, powerCount, state, warnT, interT, zakoT;
var t, shake, flash, whiteFlash, slowmo, invT, fireT, perfect;
var lastTapT, pointer, dragging, bgGrad, glows;

function makeGlow(col){
  var c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  var g = c.getContext('2d');
  var rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(255,255,255,0.95)');
  rg.addColorStop(0.26, col);
  rg.addColorStop(0.58, col);
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.beginPath(); g.arc(32, 32, 32, 0, Math.PI * 2); g.fill();
  return c;
}

function hudText(){
  var s = '';
  var i;
  for (i = 0; i < lives; i++) s += '❤️';
  for (i = 0; i < bombs; i++) s += '💣';
  for (i = 0; i < powerLv; i++) s += '🔸';
  return s;
}

function init(){
  player = { x: W / 2, y: 600, r: 4 };
  target = { x: W / 2, y: 600 };
  bullets = []; pbullets = []; particles = []; stars = [];
  zakoList = []; powers = [];
  boss = null; bossIdx = 0; loopN = 1;
  score = 0; lives = TUNE.lives.v; bombs = TUNE.bombMax.v;
  powerLv = 1; powerCount = 0;
  state = 'warning'; warnT = 2.0; interT = 0; zakoT = 0;
  t = 0; shake = 0; flash = 0; whiteFlash = 0; slowmo = 0;
  invT = 1.6; fireT = 0; perfect = true;
  lastTapT = -9; pointer = -1; dragging = false;
  for (var i = 0; i < 80; i++){
    stars.push({ x: Math.random() * W, y: 56 + Math.random() * (H - 56), z: 0.5 + Math.random() * 1.8, sp: 18 + Math.random() * 85 });
  }
  if (!bgGrad){
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#070b1c');
    bgGrad.addColorStop(0.55, '#0a1030');
    bgGrad.addColorStop(1, '#150a2a');
  }
  if (!glows){
    glows = [];
    for (var g = 0; g < GLOWC.length; g++) glows.push(makeGlow(GLOWC[g]));
  }
  Game.score(0);
  Game.hud(hudText());
}

function setTarget(x, y){
  target.x = Math.max(22, Math.min(W - 22, x));
  target.y = Math.max(92, Math.min(H - 30, y - 52));
}

function onDown(x, y, id){
  if (state === 'over') return;
  if (t - lastTapT < 0.32){ useBomb(); lastTapT = -9; }
  else { lastTapT = t; }
  pointer = id; dragging = true;
  setTarget(x, y);
}
function onMove(x, y, id){
  if (state === 'over') return;
  if (id === pointer) setTarget(x, y);
}
function onUp(x, y, id){
  if (id === pointer) dragging = false;
}

function shoot(x, y, vx, vy, ci){
  if (bullets.length > 320) return;
  bullets.push({ x: x, y: y, vx: vx, vy: vy, r: 5, c: ci, gz: false });
}

/* 弾幕パターン表 */
var PATTERNS = {
  /* 🐙：全方位の円形弾 */
  ring: function(b, sp, n){
    var c = 16 + n * 4;
    for (var i = 0; i < c; i++){
      var a = i / c * Math.PI * 2 + b.t * 0.9;
      shoot(b.x, b.y, Math.cos(a) * sp, Math.sin(a) * sp, b.ci);
    }
  },
  /* 🦂：自機狙いの3連射 */
  aimed: function(b, sp, n){
    var a0 = Math.atan2(player.y - b.y, player.x - b.x);
    for (var i = 0; i < 3; i++){
      var v = sp * (0.82 + i * 0.2);
      shoot(b.x, b.y, Math.cos(a0) * v, Math.sin(a0) * v, (b.ci + 1) % 5);
    }
  },
  /* 🐲：回転する渦巻き弾 */
  spiral: function(b, sp, n){
    b.sa += 0.85;
    var c = 3 + n;
    for (var i = 0; i < c; i++){
      var a = b.sa + i * Math.PI * 2 / c;
      shoot(b.x, b.y, Math.cos(a) * sp * 0.9, Math.sin(a) * sp * 0.9, (b.ci + 2) % 5);
    }
  },
  spread: function(b, sp, n){
    var a0 = Math.atan2(player.y - b.y, player.x - b.x);
    var c = 5 + n * 2;
    for (var i = 0; i < c; i++){
      var a = a0 + (i - (c - 1) / 2) * 0.17;
      shoot(b.x, b.y, Math.cos(a) * sp, Math.sin(a) * sp, b.ci);
    }
  }
};

function updateStars(dt){
  for (var i = 0; i < stars.length; i++){
    var s = stars[i];
    s.y += s.sp * dt;
    if (s.y > H + 6){ s.y = 50; s.x = Math.random() * W; }
  }
}

function emit(x, y, col, n, spd){
  var base = spd || 200;
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var v = base * (0.3 + Math.random());
    particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + Math.random() * 0.45, max: 0.8, col: col, r: 2 + Math.random() * 3 });
  }
  while (particles.length > 300) particles.shift();
}

function updateParticles(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updatePlayer(dt){
  var k = 1 - Math.pow(1 - TUNE.follow.v, dt * 60);
  player.x += (target.x - player.x) * k;
  player.y += (target.y - player.y) * k;
  player.x = Math.max(20, Math.min(W - 20, player.x));
  player.y = Math.max(90, Math.min(H - 30, player.y));
  if (invT > 0) invT -= dt;
  fireT -= dt;
  if (fireT <= 0){
    fireT = TUNE.fireRate.v;
    var offs;
    if (powerLv === 1) offs = [0];
    else if (powerLv === 2) offs = [-14, 0, 14];
    else offs = [-28, -14, 0, 14, 28];
    for (var i = 0; i < offs.length; i++){
      pbullets.push({ x: player.x + offs[i], y: player.y - 14, vx: 0, vy: -780, dmg: 5 });
    }
  }
}

function updatePlayerBullets(dt){
  for (var i = pbullets.length - 1; i >= 0; i--){
    var pb = pbullets[i];
    pb.x += pb.vx * dt; pb.y += pb.vy * dt;
    if (pb.y < 40 || pb.x < -20 || pb.x > W + 20){ pbullets.splice(i, 1); continue; }
    if (boss && state === 'battle'){
      var dx = pb.x - boss.x, dy = pb.y - boss.y;
      if (dx * dx + dy * dy < 56 * 56){
        pbullets.splice(i, 1);
        damageBoss(pb.dmg, pb.x, pb.y);
        if (state === 'over') return;
        continue;
      }
    }
    var hitZ = false;
    for (var j = zakoList.length - 1; j >= 0; j--){
      var z = zakoList[j];
      var zx = pb.x - z.x, zy = pb.y - z.y;
      if (zx * zx + zy * zy < z.r * z.r){
        z.hp -= pb.dmg;
        z.hitF = 0.12;
        pbullets.splice(i, 1);
        emit(pb.x, pb.y, '#c084fc', 3, 130);
        if (z.hp <= 0) killZako(j);
        hitZ = true;
        break;
      }
    }
    if (hitZ) continue;
  }
}

function killZako(idx){
  var z = zakoList[idx];
  zakoList.splice(idx, 1);
  score += 50;
  Game.score(score);
  emit(z.x, z.y, '#a3e635', 14, 230);
  emit(z.x, z.y, '#ffffff', 6, 160);
  powers.push({ x: z.x, y: z.y, spin: Math.random() * 6 });
}

function updateZako(dt){
  for (var i = zakoList.length - 1; i >= 0; i--){
    var z = zakoList[i];
    z.sway += dt * 2.4;
    z.y += z.vy * dt;
    z.x += Math.sin(z.sway) * 46 * dt;
    z.x = Math.max(26, Math.min(W - 26, z.x));
    if (z.hitF > 0) z.hitF = Math.max(0, z.hitF - dt);
    if (z.y > H + 40) zakoList.splice(i, 1);
  }
}

function spawnZako(){
  zakoList.push({
    x: 70 + Math.random() * (W - 140),
    y: 78,
    vy: 95 + Math.random() * 70,
    sway: Math.random() * Math.PI * 2,
    hp: 15, r: 22, hitF: 0
  });
}

function updatePowers(dt){
  for (var i = powers.length - 1; i >= 0; i--){
    var p = powers[i];
    var dx = player.x - p.x, dy = player.y - p.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 0.001) d = 0.001;
    if (d < 120){
      p.x += dx / d * 300 * dt;
      p.y += dy / d * 300 * dt;
    } else {
      p.y += 70 * dt;
    }
    if (d < 26){ powers.splice(i, 1); collectPower(); continue; }
    if (p.y > H + 40) powers.splice(i, 1);
  }
}

function collectPower(){
  powerCount++;
  score += 20;
  Game.score(score);
  Game.float(player.x, player.y - 42, '+20', '#fde047');
  emit(player.x, player.y, '#fde047', 8, 150);
  if (powerCount % 3 === 0 && powerLv < 3){
    powerLv++;
    Game.toast('パワーアップ！ ' + (powerLv === 2 ? '3列' : '5列') + 'ショット');
    Game.float(player.x, player.y - 64, 'POWER UP!', '#f472b6');
    emit(player.x, player.y, '#f472b6', 20, 240);
    Game.hud(hudText());
  }
}

function damageBoss(dmg, x, y){
  if (!boss) return;
  boss.hp -= dmg;
  boss.hitFlash = 0.12;
  score += dmg;
  Game.score(score);
  emit(x, y, '#ffffff', 3, 130);
  if (boss.hp <= 0) defeatBoss();
}

function defeatBoss(){
  var bonus = 800 * (bossIdx + 1) * loopN;
  score += bonus;
  Game.float(boss.x, boss.y - 20, '+' + bonus, '#facc15');
  if (perfect){
    score += 500;
    Game.float(boss.x, boss.y + 26, 'パーフェクト +500', '#67e8f9');
    Game.toast('ノーダメージ！ パーフェクト +500');
  }
  Game.score(score);
  emit(boss.x, boss.y, GLOWC[boss.ci], 50, 380);
  emit(boss.x, boss.y, '#ffffff', 30, 250);
  emit(boss.x, boss.y, '#fde047', 24, 180);
  bullets.length = 0;
  shake = 1.2; flash = 0.8; whiteFlash = 1.0; slowmo = 1.1;
  boss = null;
  bossIdx++;
  if (bossIdx >= BOSSES.length){
    bossIdx = 0;
    loopN++;
    Game.toast('ボス全滅！ ' + loopN + '周目 弾速アップ');
  }
  state = 'inter';
  interT = 5.0;
  zakoT = 1.3;
}

function startBoss(){
  var def = BOSSES[bossIdx];
  var hp = def.hp * TUNE.bossHp.v * (1 + (loopN - 1) * 0.5);
  boss = { x: W / 2, y: def.y, def: def, ci: bossIdx % 5, hp: hp, maxHp: hp, t: 0, atkT: 1.1, ai: 0, sa: 0, hitFlash: 0, form2: false, spMul: 1 };
  perfect = true;
  state = 'battle';
  Game.toast(def.emoji + ' ' + def.name + ' 出現！');
}

function updateBoss(dt){
  boss.t += dt;
  if (boss.hitFlash > 0) boss.hitFlash = Math.max(0, boss.hitFlash - dt);
  boss.x = W / 2 + Math.sin(boss.t * 0.7) * boss.def.move;
  boss.y = boss.def.y + Math.sin(boss.t * 1.3) * 14;

  /* HP半分で第2形態 */
  if (!boss.form2 && boss.hp <= boss.maxHp * 0.5){
    boss.form2 = true;
    boss.spMul = 1.45;
    boss.ci = (boss.ci + 2) % 5;
    flash = Math.max(flash, 0.55);
    shake = Math.max(shake, 0.5);
    emit(boss.x, boss.y, GLOWC[boss.ci], 30, 280);
    emit(boss.x, boss.y, '#ffffff', 14, 200);
    Game.toast('第2形態！ 弾が速くなる');
  }

  boss.atkT -= dt;
  if (boss.atkT <= 0){
    var ph = boss.def.phase;
    var key = ph[boss.ai % ph.length];
    boss.ai++;
    var sp = TUNE.bulletSpeed.v * Math.pow(TUNE.loopSpeed.v, loopN - 1) * boss.spMul;
    PATTERNS[key](boss, sp, loopN - 1 + (boss.form2 ? 1 : 0));
    boss.atkT = boss.def.atk * (boss.form2 ? 0.78 : 1);
  }
}

function graze(x, y){
  score += 5;
  Game.score(score);
  emit(x, y, '#a5f3fc', 3, 100);
}

function hitPlayer(){
  if (invT > 0 || state === 'over') return;
  perfect = false;
  lives--;
  Game.hud(hudText());
  shake = 1; flash = 0.7;
  emit(player.x, player.y, '#ff5c7a', 26, 260);
  bullets.length = 0;
  if (lives <= 0){
    state = 'over';
    Game.over(score);
    return;
  }
  invT = 2.2;
  Game.toast('被弾！ 残りライフ ' + lives);
}

function updateEnemyBullets(dt){
  for (var i = bullets.length - 1; i >= 0; i--){
    var b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -24 || b.x > W + 24 || b.y < 20 || b.y > H + 24){ bullets.splice(i, 1); continue; }
    if (state === 'over' || invT > 0) continue;
    var dx = b.x - player.x, dy = b.y - player.y;
    var d2 = dx * dx + dy * dy;
    var hr = b.r + player.r;
    if (d2 < hr * hr){ hitPlayer(); return; }
    if (!b.gz && d2 < TUNE.grazeDist.v * TUNE.grazeDist.v){
      b.gz = true;
      graze(b.x, b.y);
    }
  }
}

function useBomb(){
  if (state === 'over' || bombs <= 0) return;
  bombs--;
  Game.hud(hudText());
  score += bullets.length * 2;
  Game.score(score);
  bullets.length = 0;
  flash = 1; whiteFlash = 0.75; shake = 0.8;
  invT = Math.max(invT, 1.4);
  emit(player.x, player.y, '#a5f3fc', 44, 340);
  Game.float(player.x, player.y - 44, 'ボム！', '#a5f3fc');
  if (boss) damageBoss(160, boss.x, boss.y);
}

function update(dt){
  var scale = 1;
  if (slowmo > 0){ slowmo -= dt; scale = 0.3; }
  var sdt = dt * scale;
  t += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 2.2);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
  if (whiteFlash > 0) whiteFlash = Math.max(0, whiteFlash - dt * 1.6);
  updateStars(dt);
  updateParticles(sdt);
  if (state === 'over') return;
  updatePlayer(sdt);
  updatePlayerBullets(sdt);
  if (state === 'over') return;
  updateEnemyBullets(sdt);
  if (state === 'over') return;
  updateZako(sdt);
  updatePowers(sdt);
  if (state === 'warning'){
    warnT -= dt;
    if (warnT <= 0) startBoss();
    return;
  }
  if (state === 'inter'){
    interT -= dt;
    if (interT > 0.8){
      zakoT -= dt;
      if (zakoT <= 0){ spawnZako(); zakoT = 0.55; }
    }
    if (interT <= 0){ state = 'warning'; warnT = 1.6; }
    return;
  }
  if (state === 'battle' && boss) updateBoss(sdt);
}

function drawBand(y0, h){
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y0, W, h); ctx.clip();
  ctx.fillStyle = '#facc15';
  ctx.fillRect(0, y0, W, h);
  ctx.fillStyle = '#111827';
  var sw = 24;
  for (var x = -h; x < W + h; x += sw * 2){
    ctx.beginPath();
    ctx.moveTo(x, y0 + h);
    ctx.lineTo(x + h, y0);
    ctx.lineTo(x + h + sw, y0);
    ctx.lineTo(x + sw, y0 + h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px sans-serif';
  var tw = ctx.measureText('WARNING').width + 28;
  var cy = y0 + h / 2;
  ctx.fillStyle = 'rgba(5,8,20,0.92)';
  ctx.fillRect(W / 2 - tw / 2, cy - 15, tw, 30);
  ctx.fillStyle = '#facc15';
  ctx.fillText('WARNING', W / 2, cy);
}

function draw(){
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 56, W, H - 56); ctx.clip();
  ctx.fillStyle = '#cfe0ff';
  for (var i = 0; i < stars.length; i++){
    var s = stars[i];
    ctx.globalAlpha = 0.22 + s.z * 0.32;
    ctx.fillRect(s.x, s.y, s.z * 1.7, s.z * 2.8);
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  var ox = 0, oy = 0;
  if (shake > 0){
    ox = (Math.random() * 2 - 1) * 9 * shake;
    oy = (Math.random() * 2 - 1) * 9 * shake;
  }
  ctx.save();
  ctx.translate(ox, oy);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /* パワーアップ 🔸 */
  for (i = 0; i < powers.length; i++){
    var pw = powers[i];
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(pw.x, pw.y, 10 + Math.sin(t * 9 + pw.spin) * 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = "20px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('🔸', pw.x, pw.y);
  }

  /* ザコ 👾 */
  ctx.font = "34px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (i = 0; i < zakoList.length; i++){
    var z = zakoList[i];
    if (z.hitF > 0){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.min(1, z.hitF * 5);
      ctx.drawImage(glows[3], z.x - 36, z.y - 36, 72, 72);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.fillText('👾', z.x, z.y);
  }

  /* パーティクル */
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < particles.length; i++){
    var p = particles[i];
    var a = p.life / p.max;
    if (a < 0) a = 0;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a + 0.7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 弾 */
  for (i = 0; i < bullets.length; i++){
    var b = bullets[i];
    var sz = b.r * 4.4;
    ctx.drawImage(glows[b.c], b.x - sz / 2, b.y - sz / 2, sz, sz);
  }
  for (i = 0; i < pbullets.length; i++){
    var pb = pbullets[i];
    ctx.drawImage(glows[5], pb.x - 11, pb.y - 16, 22, 30);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  /* ボス */
  if (boss && state === 'battle'){
    if (boss.form2){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.3 + 0.18 * Math.sin(boss.t * 8);
      ctx.drawImage(glows[boss.ci], boss.x - 74, boss.y - 74, 148, 148);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    if (boss.hitFlash > 0){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.min(1, boss.hitFlash * 5);
      ctx.drawImage(glows[boss.ci], boss.x - 74, boss.y - 74, 148, 148);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = (84 + Math.sin(boss.t * 3) * 2 + (boss.form2 ? 6 : 0)) + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(boss.def.emoji, boss.x, boss.y);
  }

  /* 自機 */
  if (state !== 'over'){
    var vis = 1;
    if (invT > 0 && Math.floor(t * 14) % 2 === 0) vis = 0.3;
    ctx.globalAlpha = vis;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = "36px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('✈️', player.x, player.y);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glows[5], player.x - 13, player.y - 13, 26, 26);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(player.x, player.y, 2.6, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();

  /* 白フラッシュ（撃破演出） */
  if (whiteFlash > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,255,255,' + (whiteFlash * 0.8) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (flash > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(130,205,255,' + (flash * 0.5) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  if (state === 'warning'){
    var pulse = 0.6 + 0.4 * Math.sin(t * 14);
    ctx.globalAlpha = pulse;
    drawBand(56, 42);
    drawBand(670, 42);
    ctx.globalAlpha = 1;
  }

  if (boss && state === 'battle'){
    var bw = 400, bx = 40, byy = 64, bh = 14;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, byy, bw, bh);
    var pr = Math.max(0, Math.min(1, boss.hp / boss.maxHp));
    ctx.fillStyle = GLOWC[boss.ci];
    ctx.fillRect(bx + 2, byy + 2, (bw - 4) * pr, bh - 4);
    if (boss.form2){
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(bx + 2, byy + 2, (bw - 4) * pr, 4);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, byy + 0.5, bw - 1, bh - 1);
    ctx.fillStyle = boss.form2 ? '#fca5a5' : '#e2e8ff';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(boss.def.emoji + ' ' + boss.def.name + (boss.form2 ? ' 【第2形態】' : ''), W / 2, byy + bh + 16);
  }
}

/*__VAPPA_JS_END__*/
</script>
