<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}

.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}

.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  startSpeed: { v: 280, label: '開始スピード', min: 150, max: 500, step: 10 },
  speedGain:  { v: 0.3, label: '加速ペース', min: 0, max: 1.5, step: 0.05 },
  jumpPower:  { v: 820, label: 'ジャンプ力', min: 500, max: 1200, step: 20 },
  gravity:    { v: 2200, label: '重力', min: 800, max: 4000, step: 100 },
  glideFall:  { v: 120, label: '滑空の落下速度', min: 40, max: 400, step: 10 },
  gapMin:     { v: 70, label: '穴の最小幅', min: 40, max: 160, step: 5 },
  gapGrow:    { v: 0.25, label: '穴の広がり', min: 0, max: 1, step: 0.05 },
  obsRate:    { v: 0.5, label: '障害物の出現率', min: 0, max: 1, step: 0.05 },
  shurikenGap:{ v: 2.6, label: '手裏剣の間隔(秒)', min: 0.6, max: 6, step: 0.1 },
  scrollRate: { v: 0.35, label: '巻物の出現率', min: 0, max: 1, step: 0.05 }
};

/* ---- 定数 ---- */
var PLAYER_SX = 130;
var GROUND_Y = 550;
var PX_PER_M = 30;
var GAP_MAX_LIMIT = 260;
var MAX_JUMPS = 2;
var NIGHT_SPAN = 500;
var BOSS_SPAN = 1000;
var BOSS_TIME = 10;
var BOSS_START_DIST = 300;
var BOSS_CLOSE = 30;
var BOSS_CATCH = 56;
var COIN_PUSH = 26;
var CLONE_TIME = 5;

var WALLS = [
  { emoji: '🪨', w: 42, h: 30 },
  { emoji: '🧱', w: 40, h: 44 }
];
var CLOUDS = [
  { x: 40,  y: 140, s: 1.0 },
  { x: 260, y: 92,  s: 0.7 },
  { x: 430, y: 205, s: 1.2 }
];
var BAMBOO_H = [250, 320, 220, 300];

/* ---- 状態 ---- */
var camX, nextX, segs, obs, items, shots, parts;
var py, vy, jumps, onGround, holding, ptrCount, gliding, prevY;
var dead, shake, bonus, coins, lastScore, speed, t, dustT, shurikenT;
var lastBoss, bossOn, bossT, bossDist;
var cloneT, invuln, coinCombo, comboT, kiteRide;
var nightAmt, nightPhase, biome, skyGrad;

function init(){
  camX = 0; nextX = 0;
  segs = []; obs = []; items = []; shots = []; parts = [];
  py = GROUND_Y; vy = 0; jumps = 0; onGround = true; prevY = GROUND_Y;
  holding = false; ptrCount = 0; gliding = false;
  dead = false; shake = 0; bonus = 0; coins = 0; lastScore = -1;
  speed = TUNE.startSpeed.v; t = 0; dustT = 0; shurikenT = 2.6;
  lastBoss = 0; bossOn = false; bossT = 0; bossDist = BOSS_START_DIST;
  cloneT = 0; invuln = 0; coinCombo = 0; comboT = 0; kiteRide = 0;
  nightAmt = 0; nightPhase = 0; biome = 0; skyGrad = null;
  segs.push({ x1: -420, x2: 900 });
  nextX = 900;
  fillAhead();
  Game.score(0);
  Game.hud('🪙 0');
}

/* ---- 地形生成 ---- */
function fillAhead(){
  var guard = 0;
  var dist = camX / PX_PER_M;
  while (nextX < camX + W + 700 && guard < 30){
    guard++;
    var w = 110 + Math.random() * 130;
    var s = { x1: nextX, x2: nextX + w };
    segs.push(s);

    var inside = Math.max(14, w - 150);

    /* 瓦の山／岩 */
    if (w > 120 && Math.random() < TUNE.obsRate.v){
      var wl = WALLS[(Math.random() * WALLS.length) | 0];
      obs.push({ kind: 'wall', x: s.x1 + 70 + Math.random() * inside, w: wl.w, h: wl.h, emoji: wl.emoji });
    }
    /* 見張りの侍 */
    if (w > 130 && dist > 60 && Math.random() < 0.32){
      obs.push({ kind: 'samurai', x: s.x1 + 70 + Math.random() * inside, w: 30, h: 44, emoji: '👺' });
    }
    /* 小判 */
    if (Math.random() < 0.62){
      var n = 3 + ((Math.random() * 3) | 0);
      var baseY = GROUND_Y - 55 - Math.random() * 50;
      for (var k = 0; k < n; k++){
        items.push({ kind: 'coin', x: s.x1 + 40 + k * 32, y: baseY, emoji: '🪙' });
      }
    }
    /* 巻物 */
    if (Math.random() < TUNE.scrollRate.v){
      items.push({ kind: 'scroll', x: s.x1 + w * 0.5, y: GROUND_Y - 58, emoji: '📜' });
    }
    /* 凧 */
    if (w > 130 && Math.random() < 0.11){
      items.push({ kind: 'kite', x: s.x1 + w * 0.55, y: GROUND_Y - 118, emoji: '🪁', ph: Math.random() * 6.28 });
    }

    var gapMax = Math.min(GAP_MAX_LIMIT, TUNE.gapMin.v + dist * TUNE.gapGrow.v, speed * 0.6);
    if (gapMax < TUNE.gapMin.v) gapMax = TUNE.gapMin.v;
    nextX = s.x2 + TUNE.gapMin.v + Math.random() * (gapMax - TUNE.gapMin.v);
  }
}

function supLoose(wx){
  for (var i = 0; i < segs.length; i++){
    var s = segs[i];
    if (wx > s.x1 - 8 && wx < s.x2 + 8) return true;
  }
  return false;
}
function supStrict(wx){
  for (var i = 0; i < segs.length; i++){
    var s = segs[i];
    if (wx > s.x1 + 5 && wx < s.x2 - 5) return true;
  }
  return false;
}

function gameOver(){
  if (dead) return;
  dead = true;
  shake = 0.5;
  var s = Math.floor(camX / PX_PER_M) + bonus;
  lastScore = s;
  Game.score(s);
  Game.over(s);
}

function fallDeath(){
  if (dead) return;
  if (cloneT > 0){
    var wx = camX + PLAYER_SX;
    var target = null;
    for (var i = 0; i < segs.length; i++){
      if (segs[i].x1 > wx + 10){ target = segs[i]; break; }
    }
    if (!target){ gameOver(); return; }
    cloneT = 0;
    camX = target.x1 + 60 - PLAYER_SX;
    py = GROUND_Y - 170; vy = 0; prevY = py;
    onGround = false; jumps = 1; gliding = false;
    invuln = 1.1; shake = 0.3;
    spawnSmoke(PLAYER_SX, py + 20);
    Game.toast('📜 影分身！ 落ちても1回復活');
    if (bossOn) bossDist = Math.min(BOSS_START_DIST, bossDist + 40);
    return;
  }
  gameOver();
}

/* ---- パーティクル ---- */
function spawnDust(x, y, n){
  for (var i = 0; i < n; i++){
    parts.push({
      x: x + (Math.random() * 2 - 1) * 10,
      y: y - Math.random() * 6,
      vx: (Math.random() * 2 - 1) * 90 - 40,
      vy: -Math.random() * 70 - 10,
      r: 3 + Math.random() * 5,
      life: 0.38, max: 0.38, c: '255,205,150', g: 180
    });
  }
}
function spawnSmoke(x, y){
  for (var i = 0; i < 12; i++){
    var a = (i / 12) * 6.2832 + Math.random() * 0.5;
    var sp = 50 + Math.random() * 110;
    parts.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp * 0.8,
      r: 6 + Math.random() * 8,
      life: 0.5, max: 0.5, c: '232,234,244'
    });
  }
}
function spawnSpark(x, y, n){
  for (var i = 0; i < n; i++){
    var a = Math.random() * 6.2832;
    var sp = 40 + Math.random() * 110;
    parts.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      r: 3 + Math.random() * 3,
      life: 0.4, max: 0.4, c: '255,215,120'
    });
  }
}
function updateParts(dt, scroll){
  var f = Math.max(0, 1 - 3 * dt);
  for (var i = parts.length - 1; i >= 0; i--){
    var p = parts[i];
    p.life -= dt;
    if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx * dt - scroll;
    p.y += p.vy * dt;
    p.vx *= f; p.vy *= f;
    if (p.g) p.vy += p.g * dt;
  }
}

/* ---- ボス ---- */
function updateBoss(dt, dist){
  if (!bossOn){
    var idx = Math.floor(dist / BOSS_SPAN);
    if (idx > lastBoss){
      lastBoss = idx;
      bossOn = true;
      bossT = BOSS_TIME;
      bossDist = BOSS_START_DIST;
      shake = 0.4;
      Game.toast('👹 大天狗が追ってくる！10秒逃げ切れ！');
    }
    return;
  }
  bossT -= dt;
  bossDist -= BOSS_CLOSE * dt;
  if (bossDist < BOSS_CATCH){ gameOver(); return; }
  if (bossT <= 0){
    bossOn = false;
    bonus += 300;
    Game.hud('🪙 ' + coins);
    Game.float(PLAYER_SX, 250, '逃げ切った！ +300', '#fca5a5');
    spawnSpark(PLAYER_SX, py - 26, 22);
    shake = 0.3;
    return;
  }
  Game.hud('👹 ' + bossT.toFixed(1) + '秒');
}

/* ---- 更新 ---- */
function update(dt){
  t += dt;
  if (shake > 0) shake = Math.max(0, shake - dt);

  if (dead){ updateParts(dt, 0); return; }

  var dist = camX / PX_PER_M;
  speed = Math.min(TUNE.startSpeed.v * 1.8, TUNE.startSpeed.v + dist * TUNE.speedGain.v);

  /* 昼夜 */
  var np = (Math.floor(dist / NIGHT_SPAN) % 2 === 1) ? 1 : 0;
  if (np !== nightPhase){
    nightPhase = np;
    if (t > 1.5) Game.toast(np ? '🌙 夜になった…提灯の明かりだけが頼り' : '☀️ 夜が明けた');
  }
  nightAmt += ((nightPhase ? 1 : 0) - nightAmt) * Math.min(1, dt * 1.4);

  /* 背景の町並み */
  var nb = dist < 500 ? 0 : (dist < 1000 ? 1 : 2);
  if (nb !== biome){ biome = nb; skyGrad = null; }

  if (invuln > 0) invuln -= dt;
  if (cloneT > 0) cloneT -= dt;
  if (comboT > 0){ comboT -= dt; if (comboT <= 0) coinCombo = 0; }

  updateBoss(dt, dist);
  if (dead){ updateParts(dt, 0); return; }

  /* 手裏剣の生成と移動 */
  shurikenT -= dt;
  if (shurikenT <= 0){
    if (dist > 40){
      var gapS = Math.max(0.85, TUNE.shurikenGap.v - dist * 0.0011);
      shurikenT = gapS * (0.75 + Math.random() * 0.6);
      shots.push({ x: camX + W + 40, y: GROUND_Y - 36 - Math.random() * 14, vx: 100, spin: Math.random() * 6.28 });
    } else {
      shurikenT = 1.0;
    }
  }
  for (var s2 = shots.length - 1; s2 >= 0; s2--){
    var sh2 = shots[s2];
    sh2.x -= sh2.vx * dt;
    if (sh2.x - camX < -90) shots.splice(s2, 1);
  }

  var scroll = 0;

  if (kiteRide > 0){
    /* 凧に乗って長距離移動 */
    kiteRide -= dt;
    scroll = (speed + 620) * dt;
    camX += scroll;
    var ty = GROUND_Y - 180;
    py += (ty - py) * Math.min(1, dt * 5);
    vy = 0; onGround = false; gliding = false; jumps = 1;
    if (kiteRide <= 0) vy = -140;
  } else {
    prevY = py;
    vy += TUNE.gravity.v * dt;
    gliding = (holding && !onGround && vy > 0);
    if (gliding && vy > TUNE.glideFall.v) vy = TUNE.glideFall.v;
    py += vy * dt;
    scroll = speed * dt;
    camX += scroll;

    var wx = camX + PLAYER_SX;
    if (vy >= 0 && py >= GROUND_Y && prevY <= GROUND_Y + 6 && supLoose(wx)){
      if (!onGround) spawnDust(PLAYER_SX, GROUND_Y, 6);
      py = GROUND_Y; vy = 0; onGround = true; jumps = 0;
    } else {
      onGround = false;
      if (py > GROUND_Y + 16 && supStrict(wx)){ fallDeath(); if (dead) return; }
      else if (py > H + 60){ fallDeath(); if (dead) return; }
    }
  }

  fillAhead();

  var wx2 = camX + PLAYER_SX;

  /* 障害物 */
  if (invuln <= 0 && kiteRide <= 0){
    for (var oi = obs.length - 1; oi >= 0; oi--){
      var o = obs[oi];
      if (Math.abs(wx2 - o.x) > o.w * 0.5 + 13) continue;
      if (o.kind === 'samurai'){
        var top = GROUND_Y - o.h;
        if (vy > 0 && prevY <= top + 14 && py >= top - 60 && py <= top + 34){
          obs.splice(oi, 1);
          bonus += 20;
          vy = -TUNE.jumpPower.v * 0.72;
          onGround = false; jumps = 1;
          shake = Math.max(shake, 0.14);
          spawnSpark(o.x - camX, top + 8, 12);
          Game.float(PLAYER_SX, top - 26, '踏み +20', '#ffd166');
          continue;
        }
        gameOver(); return;
      } else if (py > GROUND_Y - o.h + 8){
        gameOver(); return;
      }
    }
  }

  /* 手裏剣の当たり判定 */
  if (invuln <= 0 && kiteRide <= 0){
    for (var si = shots.length - 1; si >= 0; si--){
      var sh3 = shots[si];
      var sx3 = sh3.x - camX;
      if (Math.abs(sx3 - PLAYER_SX) < 28 && Math.abs(sh3.y - (py - 26)) < 32){
        gameOver(); return;
      }
    }
  }

  /* アイテム */
  var pcy = py - 26;
  for (var j = items.length - 1; j >= 0; j--){
    var it = items[j];
    var ix = it.x - camX;
    if (ix < -90){ items.splice(j, 1); continue; }
    var iy = it.y;
    if (it.kind === 'kite') iy = it.y + Math.sin(t * 2.2 + it.ph) * 10;
    else if (it.kind === 'scroll') iy = it.y + Math.sin(t * 3 + it.x * 0.03) * 4;
    var rad = (it.kind === 'coin') ? 38 : 42;
    var dx = ix - PLAYER_SX, dy = iy - pcy;
    if (dx * dx + dy * dy > rad * rad) continue;
    items.splice(j, 1);

    if (it.kind === 'coin'){
      coinCombo++;
      comboT = 2.5;
      var pts = 5 + (coinCombo - 1);
      bonus += pts;
      coins++;
      if (!bossOn) Game.hud('🪙 ' + coins);
      Game.float(PLAYER_SX, iy - 14, '+' + pts, '#ffd166');
      spawnSpark(PLAYER_SX, iy, 6);
      if (bossOn) bossDist = Math.min(BOSS_START_DIST, bossDist + COIN_PUSH);
    } else if (it.kind === 'scroll'){
      cloneT = CLONE_TIME;
      spawnSmoke(PLAYER_SX, iy);
      Game.toast('📜 影分身！ 穴に落ちても1回復活');
      Game.float(PLAYER_SX, iy - 24, '影分身', '#a78bfa');
    } else if (it.kind === 'kite'){
      kiteRide = 1.7;
      shake = 0.28;
      spawnSpark(PLAYER_SX, iy, 14);
      Game.float(PLAYER_SX, iy - 26, '🪁 凧乗り！', '#7dd3fc');
      if (bossOn) bossDist = Math.min(BOSS_START_DIST, bossDist + 60);
    }
  }

  /* 走りの砂ぼこり */
  if (onGround){
    dustT -= dt;
    if (dustT <= 0){
      dustT = 0.14;
      parts.push({
        x: PLAYER_SX - 14, y: GROUND_Y - 2,
        vx: -60 - Math.random() * 60,
        vy: -20 - Math.random() * 40,
        r: 3 + Math.random() * 3,
        life: 0.32, max: 0.32, c: '255,205,150', g: 220
      });
    }
  }

  while (segs.length > 1 && segs[0].x2 < camX - 300) segs.shift();
  for (var k = obs.length - 1; k >= 0; k--){ if (obs[k].x - camX < -140) obs.splice(k, 1); }

  updateParts(dt, scroll);

  var sc = Math.floor(camX / PX_PER_M) + bonus;
  if (sc !== lastScore){ lastScore = sc; Game.score(sc); }
}

/* ---- 描画ヘルパー ---- */
function drawCircle(x, y, r){
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 6.2832);
  ctx.fill();
}
function drawOval(x, y, rx, ry){
  if (rx < 0.5 || ry < 0.5) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(rx, ry);
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, 6.2832);
  ctx.restore();
  ctx.fill();
}
function hillLayer(off, amp, period, color, baseY){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-24, baseY);
  for (var x = -24; x <= W + 24; x += 16){
    var tx = x + off;
    var y = baseY - (Math.sin(tx / period) * 0.5 + 0.5) * amp
                  - (Math.sin(tx / (period * 0.41)) * 0.5 + 0.5) * amp * 0.42;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 24, baseY);
  ctx.lineTo(W + 24, GROUND_Y + 30);
  ctx.lineTo(-24, GROUND_Y + 30);
  ctx.closePath();
  ctx.fill();
}

function makeSky(){
  var g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  if (biome === 0){
    g.addColorStop(0, '#1c1233');
    g.addColorStop(0.34, '#5a2760');
    g.addColorStop(0.6, '#b8434f');
    g.addColorStop(0.8, '#ec7a3c');
    g.addColorStop(1, '#ffc271');
  } else if (biome === 1){
    g.addColorStop(0, '#0a2430');
    g.addColorStop(0.4, '#13503f');
    g.addColorStop(0.72, '#3f9a6a');
    g.addColorStop(1, '#a9e8b0');
  } else {
    g.addColorStop(0, '#1a0f33');
    g.addColorStop(0.4, '#3d1a56');
    g.addColorStop(0.7, '#7c3470');
    g.addColorStop(1, '#e8a0b8');
  }
  return g;
}

/* 城下町 */
function drawTown(){
  var off = (camX * 0.22) % 200;
  var baseY = GROUND_Y - 18;
  for (var i = -1; i < 5; i++){
    var bx = i * 200 - off;
    var seed = ((i % 3) + 3) % 3;
    var hh = 62 + seed * 24;
    ctx.fillStyle = 'rgba(24,12,30,0.9)';
    ctx.fillRect(bx + 18, baseY - hh, 62, hh);
    ctx.beginPath();
    ctx.moveTo(bx + 6, baseY - hh);
    ctx.lineTo(bx + 49, baseY - hh - 30);
    ctx.lineTo(bx + 92, baseY - hh);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,180,90,0.55)';
    ctx.fillRect(bx + 44, baseY - hh + 14, 6, 10);
    ctx.fillStyle = 'rgba(255,180,90,0.3)';
    ctx.fillRect(bx + 30, baseY - hh + 44, 6, 10);
  }
}

/* 竹林 */
function drawBamboo(){
  var off = (camX * 0.3) % 100;
  for (var i = -1; i < 7; i++){
    var bx = i * 100 - off + 30;
    var hi = ((i % 4) + 4) % 4;
    var hh = BAMBOO_H[hi];
    ctx.fillStyle = 'rgba(14,52,36,0.95)';
    ctx.fillRect(bx, GROUND_Y - 22 - hh, 13, hh + 22);
    ctx.fillStyle = 'rgba(70,150,96,0.32)';
    ctx.fillRect(bx + 2, GROUND_Y - 22 - hh, 3, hh + 22);
    ctx.fillStyle = 'rgba(8,32,22,0.9)';
    for (var n = 0; n < 5; n++){
      ctx.fillRect(bx - 2, GROUND_Y - 22 - hh + 44 + n * 56, 17, 4);
    }
  }
}

/* 城 */
function drawCastle(){
  var off = (camX * 0.16) % 760;
  for (var i = -1; i < 3; i++){
    drawTenshu(i * 760 - off + 190);
  }
}
function drawTenshu(cx){
  var baseY = GROUND_Y - 14;
  ctx.fillStyle = 'rgba(26,13,36,0.94)';
  ctx.beginPath();
  ctx.moveTo(cx - 92, baseY);
  ctx.lineTo(cx + 92, baseY);
  ctx.lineTo(cx + 64, baseY - 44);
  ctx.lineTo(cx - 64, baseY - 44);
  ctx.closePath();
  ctx.fill();
  var y = baseY - 44;
  var ws = [58, 46, 34];
  for (var L = 0; L < 3; L++){
    var w = ws[L];
    ctx.fillRect(cx - w, y - 32, w * 2, 32);
    ctx.beginPath();
    ctx.moveTo(cx - w - 15, y - 32);
    ctx.lineTo(cx, y - 50);
    ctx.lineTo(cx + w + 15, y - 32);
    ctx.closePath();
    ctx.fill();
    y -= 50;
  }
}

/* ---- 描画 ---- */
function draw(){
  var sh = shake > 0 ? shake * 18 : 0;
  if (bossOn && bossDist < 140) sh += (140 - bossDist) * 0.16;
  ctx.save();
  if (sh > 0) ctx.translate((Math.random() * 2 - 1) * sh, (Math.random() * 2 - 1) * sh * 0.6);

  if (!skyGrad) skyGrad = makeSky();
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, GROUND_Y + 2);

  /* 太陽・月 */
  ctx.globalAlpha = 1 - 0.82 * nightAmt;
  ctx.fillStyle = 'rgba(255,170,90,0.10)';
  drawCircle(352, 424, 132);
  ctx.fillStyle = 'rgba(255,205,125,0.18)';
  drawCircle(352, 424, 84);
  ctx.fillStyle = nightAmt > 0.5 ? '#e8eefc' : '#ffe2a6';
  drawCircle(352, 424, 54);
  ctx.globalAlpha = 1;

  /* 雲 */
  var co = (camX * 0.02) % 660;
  for (var ci = 0; ci < CLOUDS.length; ci++){
    var c = CLOUDS[ci];
    var cxp = c.x - co;
    if (cxp < -160) cxp += 660;
    if (cxp > 520) cxp -= 660;
    ctx.fillStyle = 'rgba(255,190,150,0.15)';
    drawOval(cxp, c.y, 60 * c.s, 13 * c.s);
    drawOval(cxp - 36 * c.s, c.y + 5 * c.s, 40 * c.s, 10 * c.s);
    drawOval(cxp + 42 * c.s, c.y + 3 * c.s, 44 * c.s, 11 * c.s);
  }

  /* 丘 */
  var hillA = '#3a2247', hillB = '#281733';
  if (biome === 1){ hillA = '#1c4a3a'; hillB = '#123328'; }
  else if (biome === 2){ hillA = '#3a1a48'; hillB = '#241031'; }
  hillLayer(camX * 0.04, 95, 150, hillA, GROUND_Y - 22);
  hillLayer(camX * 0.09, 62, 92, hillB, GROUND_Y - 6);

  /* 町並み */
  if (biome === 0) drawTown();
  else if (biome === 1) drawBamboo();
  else drawCastle();

  /* 夜の暗さ（背景のみ） */
  if (nightAmt > 0.01){
    ctx.fillStyle = 'rgba(8,12,34,' + (0.5 * nightAmt).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, GROUND_Y + 2);
  }

  /* 谷 */
  var vg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  vg.addColorStop(0, '#1b1026');
  vg.addColorStop(1, '#08060e');
  ctx.fillStyle = vg;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  /* 瓦屋根 */
  var roofBody = '#231829', roofTop = '#3b2b49';
  if (biome === 1){ roofBody = '#182a24'; roofTop = '#28463a'; }
  else if (biome === 2){ roofBody = '#241a2e'; roofTop = '#3d2b52'; }
  for (var i = 0; i < segs.length; i++){
    var s = segs[i];
    var sx1 = s.x1 - camX;
    var sx2 = s.x2 - camX;
    if (sx2 < -30 || sx1 > W + 30) continue;
    var w = sx2 - sx1;

    ctx.fillStyle = roofBody;
    ctx.fillRect(sx1, GROUND_Y, w, H - GROUND_Y);

    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    var tx0 = Math.ceil(sx1 / 24) * 24;
    for (var tx = tx0; tx < sx2; tx += 24){
      ctx.moveTo(tx, GROUND_Y + 14);
      ctx.lineTo(tx, H);
    }
    ctx.stroke();

    ctx.fillStyle = roofTop;
    ctx.fillRect(sx1, GROUND_Y, w, 11);
    ctx.fillStyle = 'rgba(255,168,88,0.75)';
    ctx.fillRect(sx1, GROUND_Y, w, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(sx1, GROUND_Y + 11, w, 7);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /* アイテム */
  for (var ii = 0; ii < items.length; ii++){
    var it = items[ii];
    var ix = it.x - camX;
    if (ix < -30 || ix > W + 30) continue;
    var iy = it.y;
    if (it.kind === 'kite'){
      iy = it.y + Math.sin(t * 2.2 + it.ph) * 10;
      ctx.font = "34px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('🪁', ix, iy);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(ix, iy + 16);
      ctx.lineTo(ix + 6, iy + 42);
      ctx.stroke();
    } else if (it.kind === 'scroll'){
      ctx.font = "30px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('📜', ix, it.y + Math.sin(t * 3 + it.x * 0.03) * 4);
    } else {
      ctx.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('🪙', ix, it.y + Math.sin(t * 4 + it.x * 0.05) * 3);
    }
  }

  /* 障害物 */
  for (var oi = 0; oi < obs.length; oi++){
    var o = obs[oi];
    var ox = o.x - camX;
    if (ox < -60 || ox > W + 60) continue;
    if (o.kind === 'samurai'){
      ctx.font = "44px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('👺', ox, GROUND_Y - 22 + Math.sin(t * 7 + o.x) * 2);
    } else {
      ctx.font = "36px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText(o.emoji, ox, GROUND_Y - o.h * 0.5);
    }
  }

  /* 手裏剣 */
  ctx.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  for (var si = 0; si < shots.length; si++){
    var sh4 = shots[si];
    var sx4 = sh4.x - camX;
    if (sx4 < -40 || sx4 > W + 40) continue;
    ctx.save();
    ctx.translate(sx4, sh4.y);
    ctx.rotate(t * 14 + sh4.spin);
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#bfe0ff';
    drawCircle(0, 0, 15);
    ctx.globalAlpha = 1;
    ctx.fillText('✴️', 0, 0);
    ctx.restore();
  }

  /* 影 */
  var overRoof = supLoose(camX + PLAYER_SX);
  if (overRoof && py < GROUND_Y + 10){
    var k2 = Math.max(0, 1 - (GROUND_Y - py) / 240);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.3 * k2) + ')';
    drawOval(PLAYER_SX, GROUND_Y + 7, 22 * k2 + 4, 6 * k2 + 1);
  }

  /* 滑空の風 */
  if (gliding){
    ctx.strokeStyle = 'rgba(200,230,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var g = 0; g < 3; g++){
      var gy = py - 20 - g * 14 + Math.sin(t * 12 + g) * 3;
      ctx.moveTo(PLAYER_SX - 18, gy);
      ctx.lineTo(PLAYER_SX - 44 - g * 8, gy);
    }
    ctx.stroke();
  }

  /* ボス */
  if (bossOn){
    var bx = PLAYER_SX - bossDist;
    var byy = GROUND_Y - 82 + Math.sin(t * 7) * 7;
    var ag = ctx.createRadialGradient(bx, byy, 6, bx, byy, 95);
    ag.addColorStop(0, 'rgba(255,60,60,0.5)');
    ag.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.arc(bx, byy, 95, 0, 6.2832);
    ctx.fill();
    ctx.font = "78px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('👹', bx, byy);
  }

  /* 忍者 */
  var bob = onGround ? Math.sin(t * 18) * 2 : 0;
  var ppx = PLAYER_SX, ppy = py - 26 + bob;

  if (cloneT > 0){
    ctx.globalAlpha = 0.3 + 0.2 * Math.sin(t * 10);
    ctx.font = "48px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('🥷', ppx - 36, ppy + 2);
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(ppx, ppy);
  var ang = 0;
  if (!onGround) ang = Math.max(-0.3, Math.min(0.35, vy / 2400));
  if (gliding) ang -= 0.12;
  if (kiteRide > 0) ang = -0.16;
  ctx.rotate(ang);
  ctx.font = "48px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  if (invuln > 0 && Math.floor(t * 14) % 2 === 0) ctx.globalAlpha = 0.35;
  ctx.fillText('🥷', 0, 0);
  ctx.globalAlpha = 1;
  ctx.restore();

  /* 凧につかまっている演出 */
  if (kiteRide > 0){
    ctx.font = "40px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('🪁', ppx + 6, ppy - 62 + Math.sin(t * 8) * 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ppx + 4, ppy - 44);
    ctx.lineTo(ppx, ppy - 20);
    ctx.stroke();
  }

  /* パーティクル */
  for (var pi = 0; pi < parts.length; pi++){
    var p = parts[pi];
    var a = p.life / p.max;
    ctx.fillStyle = 'rgba(' + p.c + ',' + (a * 0.8).toFixed(2) + ')';
    drawCircle(p.x, p.y, p.r * (1.6 - a * 0.6));
  }

  /* スピード線 */
  if (speed > 380 && !dead){
    ctx.strokeStyle = 'rgba(255,225,190,0.10)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var sl = 0; sl < 6; sl++){
      var ly = 80 + sl * 78;
      var lx = W - ((camX * (1.2 + sl * 0.15)) % (W + 160));
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + 46, ly);
    }
    ctx.stroke();
  }

  /* 夜の闇と提灯 */
  if (nightAmt > 0.01){
    var lx2 = PLAYER_SX, ly2 = py - 34;
    var g2 = ctx.createRadialGradient(lx2, ly2, 60, lx2, ly2, 330);
    g2.addColorStop(0, 'rgba(4,8,22,' + (0.05 * nightAmt).toFixed(3) + ')');
    g2.addColorStop(0.55, 'rgba(4,8,22,' + (0.55 * nightAmt).toFixed(3) + ')');
    g2.addColorStop(1, 'rgba(3,5,16,' + (0.9 * nightAmt).toFixed(3) + ')');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    var lg = ctx.createRadialGradient(lx2, ly2, 4, lx2, ly2, 160);
    lg.addColorStop(0, 'rgba(255,190,110,' + (0.34 * nightAmt).toFixed(3) + ')');
    lg.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(lx2, ly2, 160, 0, 6.2832);
    ctx.fill();

    ctx.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.globalAlpha = nightAmt;
    ctx.fillText('🏮', PLAYER_SX - 26, py - 62);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* ---- 入力 ---- */
function onDown(x, y, id){
  ptrCount++;
  holding = true;
  if (dead) return;
  if (kiteRide > 0) return;
  if (onGround || jumps === 0){
    vy = -TUNE.jumpPower.v;
    onGround = false;
    jumps = 1;
    spawnDust(PLAYER_SX, GROUND_Y, 5);
  } else if (jumps < MAX_JUMPS){
    vy = -TUNE.jumpPower.v * 0.86;
    jumps = 2;
    spawnSmoke(PLAYER_SX, py - 24);
  }
}
function onUp(x, y, id){
  ptrCount = Math.max(0, ptrCount - 1);
  if (ptrCount === 0) holding = false;
}
function onMove(x, y, id){}
/*__VAPPA_JS_END__*/
</script>
