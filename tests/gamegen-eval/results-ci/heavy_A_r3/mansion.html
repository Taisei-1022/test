<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="人";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  timeLimit:   { v: 60,   label: '制限時間(秒)',        min: 30, max: 120, step: 5 },
  rushEvery:   { v: 10,   label: '入居ラッシュ間隔(秒)', min: 5,  max: 25,  step: 1 },
  rushLen:     { v: 5,    label: 'ラッシュの長さ(秒)',   min: 2,  max: 10,  step: 1 },
  rushMult:    { v: 2,    label: 'ラッシュ倍率',        min: 2,  max: 3,   step: 1 },
  elevRate:    { v: 0.14, label: 'エレベーターの率',    min: 0,  max: 0.4, step: 0.02 },
  specialRate: { v: 0.25, label: '特別な部屋の率',      min: 0,  max: 0.6, step: 0.05 },
  demoRate:    { v: 0.08, label: '解体の率',            min: 0,  max: 0.3, step: 0.02 },
  bigRoom:     { v: 0.55, label: '大きい部屋の増え方',  min: 0,  max: 1,   step: 0.05 }
};

var COLS = 7, ROWS = 8, CELL = 58, GX = 37, GY = 66;
var GW = COLS * CELL, GH = ROWS * CELL;
var HINT_Y = 546;
var TRAY_Y = 560, TRAY_W = 136, TRAY_H = 126, TRAY_X = [24, 172, 320];
var ENTR_R = 7, ENTR_C = 3;
var PEOPLE = ['🧑','👩','👨','🧒','👵','🧔'];
var VICON = { pent: '👑', pet: '🐶', cafe: '☕', mus: '🎸', fam: '👪' };
var VNAME = { normal: '部屋', pent: 'ペントハウス', pet: 'ペット可', cafe: 'カフェ', mus: '音楽家', fam: 'ファミリー' };
var VSUB = { normal: '', pent: '最上階で+5', pet: '隣の部屋+1', cafe: '同じ階+1', mus: '👪隣で-2', fam: '住人2人' };
var FCOL = ['#ffd166', '#ff6b9d', '#7bdff2', '#b9f18d', '#ffa552'];

var SHAPES = {
  one:  [[0,0]],
  h2:   [[0,0],[0,1]],
  v2:   [[0,0],[1,0]],
  h3:   [[0,0],[0,1],[0,2]],
  v3:   [[0,0],[1,0],[2,0]],
  l3a:  [[0,0],[1,0],[1,1]],
  l3b:  [[0,0],[0,1],[1,1]]
};

var grid, pieces, tray, trayOk, sel, drag, pendingTap, nextId;
var elapsed, timeLeft, lastShown, score, floorBonus, floorDone;
var rushActive, rushT, rushLeft;
var particles, shake, invalidFlash, gameEnded, t0, skyCanvas;

function emojiFont(s){ return s + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; }

function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function rotShape(shape){
  var h = 0, i;
  for (i = 0; i < shape.length; i++){ if (shape[i][0] + 1 > h) h = shape[i][0] + 1; }
  var out = [];
  for (i = 0; i < shape.length; i++) out.push([shape[i][1], h - 1 - shape[i][0]]);
  return out;
}
function cellsOf(shape, ar, ac){
  var out = [];
  for (var i = 0; i < shape.length; i++) out.push({ r: ar + shape[i][0], c: ac + shape[i][1] });
  return out;
}

function init(){
  var r, c, i;
  grid = [];
  for (r = 0; r < ROWS; r++){ var row = []; for (c = 0; c < COLS; c++) row.push(null); grid.push(row); }
  pieces = [];
  grid[ENTR_R][ENTR_C] = { id: 0, kind: 'entrance', variant: 'entrance', shape: SHAPES.one, ar: ENTR_R, ac: ENTR_C, cells: [{ r: ENTR_R, c: ENTR_C }] };
  nextId = 1;
  elapsed = 0; timeLeft = TUNE.timeLimit.v; lastShown = -1;
  score = 0; floorBonus = 0; floorDone = [];
  for (r = 0; r < ROWS; r++) floorDone.push(false);
  rushActive = false; rushT = TUNE.rushEvery.v; rushLeft = 0;
  sel = -1; drag = null; pendingTap = null;
  particles = []; shake = 0; invalidFlash = null; gameEnded = false; t0 = 0;
  tray = [ { kind: 'corr', variant: 'corr', shape: SHAPES.h2 },
           { kind: 'room', variant: 'normal', shape: SHAPES.v2 },
           { kind: 'elev', variant: 'elev', shape: SHAPES.one } ];
  trayOk = [true, true, true];
  if (!skyCanvas) buildSky();
  recalc();
  Game.hud('⏱ ' + Math.ceil(timeLeft) + '秒');
  Game.score(0);
}

function buildSky(){
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var g = c.getContext('2d');
  var lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, '#131a36');
  lg.addColorStop(0.40, '#3a2b56');
  lg.addColorStop(0.62, '#8f4a68');
  lg.addColorStop(0.78, '#e07a55');
  lg.addColorStop(1, '#f7b06a');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  for (var i = 0; i < 46; i++){
    g.fillStyle = 'rgba(255,255,255,' + (0.25 + Math.random() * 0.55) + ')';
    g.fillRect(Math.random() * W, 60 + Math.random() * 250, 2, 2);
  }
  g.fillStyle = 'rgba(255,180,100,0.22)';
  g.beginPath(); g.arc(360, 470, 78, 0, 6.2832); g.fill();
  g.fillStyle = 'rgba(255,206,128,0.9)';
  g.beginPath(); g.arc(360, 470, 46, 0, 6.2832); g.fill();
  var x = -10;
  while (x < W + 40){
    var bw = 40 + Math.random() * 52;
    var bh = 90 + Math.random() * 170;
    g.fillStyle = '#221a3a';
    g.fillRect(x, 720 - bh, bw, bh);
    g.fillStyle = 'rgba(255,214,140,0.30)';
    for (var wy = 720 - bh + 12; wy < 700; wy += 20){
      for (var wx = x + 7; wx < x + bw - 10; wx += 17){
        if (((wx * 7 + wy * 13) % 5) < 2) g.fillRect(wx, wy, 6, 9);
      }
    }
    x += bw + 6 + Math.random() * 16;
  }
  skyCanvas = c;
}

function computeVisited(){
  var vis = [], r, c;
  for (r = 0; r < ROWS; r++){ var row = []; for (c = 0; c < COLS; c++) row.push(false); vis.push(row); }
  var q = [[ENTR_R, ENTR_C]];
  vis[ENTR_R][ENTR_C] = true;
  var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while (q.length > 0){
    var cur = q.shift();
    var a = grid[cur[0]][cur[1]];
    for (var d = 0; d < 4; d++){
      var nr = cur[0] + dirs[d][0], nc = cur[1] + dirs[d][1];
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      if (vis[nr][nc]) continue;
      var b = grid[nr][nc];
      if (!b) continue;
      var ok = (a === b) ? true : (isLink(a) || isLink(b));
      if (ok){ vis[nr][nc] = true; q.push([nr, nc]); }
    }
  }
  return vis;
}
function isLink(p){ return p.kind === 'corr' || p.kind === 'elev' || p.kind === 'entrance'; }

function adjRooms(p, vis){
  var out = [], dirs = [[1,0],[-1,0],[0,1],[0,-1]], i, d;
  for (i = 0; i < p.cells.length; i++){
    for (d = 0; d < 4; d++){
      var nr = p.cells[i].r + dirs[d][0], nc = p.cells[i].c + dirs[d][1];
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      var q = grid[nr][nc];
      if (q && q !== p && q.kind === 'room' && vis[nr][nc] && out.indexOf(q) < 0) out.push(q);
    }
  }
  return out;
}
function adjVariant(p, variant, vis){
  var all = adjRooms(p, vis), out = [], i;
  for (i = 0; i < all.length; i++) if (all[i].variant === variant) out.push(all[i]);
  return out;
}
function sameRowRooms(p){
  var out = [], i, j, k;
  for (i = 0; i < pieces.length; i++){
    var q = pieces[i];
    if (q === p || q.kind !== 'room' || !q.connected) continue;
    var same = false;
    for (j = 0; j < p.cells.length && !same; j++){
      for (k = 0; k < q.cells.length; k++){ if (p.cells[j].r === q.cells[k].r){ same = true; break; } }
    }
    if (same) out.push(q);
  }
  return out;
}
function onTopRow(p){
  for (var i = 0; i < p.cells.length; i++) if (p.cells[i].r === 0) return true;
  return false;
}
function roomValue(p, vis){
  var v = p.cells.length;
  if (p.variant === 'fam') v = 2;
  if (p.variant === 'pent' && onTopRow(p)) v += 5;
  if (p.variant === 'pet') v += adjRooms(p, vis).length;
  if (p.variant === 'cafe') v += sameRowRooms(p).length;
  return v * (p.rushMul || 1);
}

function canPlace(shape, ar, ac){
  for (var i = 0; i < shape.length; i++){
    var r = ar + shape[i][0], c = ac + shape[i][1];
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
    if (grid[r][c]) return false;
  }
  return true;
}
function canPlaceAnywhere(tp){
  if (tp.kind === 'demo') return pieces.length > 0;
  var sh = tp.shape;
  for (var k = 0; k < 4; k++){
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (canPlace(sh, r, c)) return true;
    sh = rotShape(sh);
  }
  return false;
}

function sparkle(x, y, col, n){
  for (var i = 0; i < n; i++){
    var a = Math.random() * 6.2832, sp = 40 + Math.random() * 90;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0.6, max: 0.6, col: col, r: 2 + Math.random() * 2, grav: 120 });
  }
}
function boom(x, y){
  for (var i = 0; i < 30; i++){
    var a = Math.random() * 6.2832, sp = 70 + Math.random() * 170;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.0, max: 1.0, col: FCOL[i % FCOL.length], r: 2 + Math.random() * 2.5, grav: 150 });
  }
  shake = 0.7;
}

function recalc(){
  var vis = computeVisited();
  var i, j, p;
  for (i = 0; i < pieces.length; i++){
    p = pieces[i];
    if (p.kind !== 'room') continue;
    var conn = false;
    for (j = 0; j < p.cells.length; j++){ if (vis[p.cells[j].r][p.cells[j].c]){ conn = true; break; } }
    p.connected = conn;
    if (conn && !p.movedIn){
      p.movedIn = true;
      p.rushMul = rushActive ? TUNE.rushMult.v : 1;
      p.wave = 1.4;
      var v = roomValue(p, vis);
      var fx = GX + (p.cells[0].c + 0.5) * CELL;
      var fy = GY + (p.cells[0].r + 0.5) * CELL;
      Game.float(fx, fy - 14, '入居 +' + v, '#ffd166');
      sparkle(fx, fy, '#ffe08a', 8);
    }
  }
  var total = 0;
  for (i = 0; i < pieces.length; i++){
    p = pieces[i];
    if (p.kind === 'room' && p.connected) total += roomValue(p, vis);
  }
  for (i = 0; i < pieces.length; i++){
    p = pieces[i];
    if (p.kind === 'room' && p.variant === 'mus' && p.connected){
      var fams = adjVariant(p, 'fam', vis);
      if (fams.length > 0){
        total -= 2 * fams.length;
        if (!p.complained){
          p.complained = true;
          Game.float(GX + (p.cells[0].c + 0.5) * CELL, GY + (p.cells[0].r + 0.5) * CELL - 16, '💢 苦情 -' + (2 * fams.length), '#ff8a8a');
        }
      } else p.complained = false;
    }
  }
  for (var r = 0; r < ROWS; r++){
    if (floorDone[r]) continue;
    var full = true;
    for (var c = 0; c < COLS; c++){ if (!grid[r][c]){ full = false; break; } }
    if (full){
      floorDone[r] = true;
      floorBonus += 10;
      boom(GX + GW / 2, GY + (r + 0.5) * CELL);
      Game.toast('満室ボーナス +10人！');
    }
  }
  if (total < 0) total = 0;
  score = total + floorBonus;
  Game.score(score);
  for (i = 0; i < 3; i++) trayOk[i] = canPlaceAnywhere(tray[i]);
}

function pickCorrShape(){
  var r = Math.random();
  if (r < 0.5) return SHAPES.one;
  if (r < 0.8) return Math.random() < 0.5 ? SHAPES.h2 : SHAPES.v2;
  return Math.random() < 0.5 ? SHAPES.h3 : SHAPES.v3;
}
function pickRoomShape(q){
  var w1 = 0.42 - 0.30 * q;
  var w2 = 0.34;
  var r = Math.random();
  if (r < w1) return SHAPES.one;
  r -= w1;
  if (r < w2) return Math.random() < 0.5 ? SHAPES.h2 : SHAPES.v2;
  if (Math.random() < 0.5) return Math.random() < 0.5 ? SHAPES.l3a : SHAPES.l3b;
  return Math.random() < 0.5 ? SHAPES.h3 : SHAPES.v3;
}
function newTrayPiece(){
  var q = Math.min(1, elapsed / TUNE.timeLimit.v) * TUNE.bigRoom.v;
  var r = Math.random();
  if (r < TUNE.demoRate.v) return { kind: 'demo', variant: 'demo', shape: SHAPES.one };
  r -= TUNE.demoRate.v;
  if (r < TUNE.elevRate.v) return { kind: 'elev', variant: 'elev', shape: SHAPES.one };
  r -= TUNE.elevRate.v;
  if (r < 0.18) return { kind: 'corr', variant: 'corr', shape: pickCorrShape() };
  r -= 0.18;
  if (r < TUNE.specialRate.v){
    var vs = ['pent', 'pet', 'cafe', 'mus', 'fam'];
    return { kind: 'room', variant: vs[Math.floor(Math.random() * vs.length)], shape: SHAPES.one };
  }
  return { kind: 'room', variant: 'normal', shape: pickRoomShape(q) };
}

function removePiece(p){
  for (var i = 0; i < p.cells.length; i++) grid[p.cells[i].r][p.cells[i].c] = null;
  var k = pieces.indexOf(p);
  if (k >= 0) pieces.splice(k, 1);
}

function doPlace(slot, ar, ac){
  var tp = tray[slot];
  if (tp.kind === 'demo'){
    var t = grid[ar][ac];
    if (!t || t.kind === 'entrance') return false;
    removePiece(t);
    Game.float(GX + (ac + 0.5) * CELL, GY + (ar + 0.5) * CELL, '🔨', '#ffd166');
  } else {
    if (!canPlace(tp.shape, ar, ac)) return false;
    var p = { id: nextId++, kind: tp.kind, variant: tp.variant, shape: tp.shape, ar: ar, ac: ac,
              cells: cellsOf(tp.shape, ar, ac), movedIn: false, rushMul: 1, bob: Math.random() * 6, complained: false, wave: 0 };
    for (var i = 0; i < p.cells.length; i++) grid[p.cells[i].r][p.cells[i].c] = p;
    pieces.push(p);
  }
  tray[slot] = newTrayPiece();
  sel = -1;
  recalc();
  return true;
}

function rotateAt(r, c){
  var p = grid[r][c];
  if (!p || p.kind === 'entrance') return;
  var ns = rotShape(p.shape);
  var nc = cellsOf(ns, p.ar, p.ac);
  var i, q;
  for (i = 0; i < nc.length; i++){
    if (nc[i].r < 0 || nc[i].r >= ROWS || nc[i].c < 0 || nc[i].c >= COLS){ failAct(p); return; }
    q = grid[nc[i].r][nc[i].c];
    if (q && q !== p){ failAct(p); return; }
  }
  for (i = 0; i < p.cells.length; i++) grid[p.cells[i].r][p.cells[i].c] = null;
  p.shape = ns; p.cells = nc;
  for (i = 0; i < nc.length; i++) grid[nc[i].r][nc[i].c] = p;
  Game.float(GX + (nc[0].c + 0.5) * CELL, GY + (nc[0].r + 0.5) * CELL, '🔄', '#8fd3ff');
  recalc();
}
function failAct(p){
  invalidFlash = { cells: p.cells, t: 0.55 };
  shake = 0.4;
  Game.float(GX + (p.cells[0].c + 0.5) * CELL, GY + (p.cells[0].r + 0.5) * CELL, '✕', '#ff8a8a');
}

function cellAt(x, y){
  var c = Math.floor((x - GX) / CELL), r = Math.floor((y - GY) / CELL);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  return { r: r, c: c };
}
function trayAt(x, y){
  if (y < TRAY_Y || y > TRAY_Y + TRAY_H) return -1;
  for (var i = 0; i < 3; i++){ if (x >= TRAY_X[i] && x <= TRAY_X[i] + TRAY_W) return i; }
  return -1;
}

function onDown(x, y, id){
  if (gameEnded) return;
  var t = trayAt(x, y);
  if (t >= 0){
    if (sel === t){
      var tp = tray[t];
      if (tp.shape.length > 1){ tp.shape = rotShape(tp.shape); Game.float(TRAY_X[t] + TRAY_W / 2, TRAY_Y - 12, '🔄回転', '#8fd3ff'); }
    } else { sel = t; }
    drag = null; pendingTap = null;
    return;
  }
  var cell = cellAt(x, y);
  if (!cell) return;
  var p = grid[cell.r][cell.c];
  if (p){
    if (sel >= 0 && tray[sel].kind === 'demo') pendingTap = { type: 'demo', r: cell.r, c: cell.c };
    else pendingTap = { type: 'rot', r: cell.r, c: cell.c };
  } else if (sel >= 0){
    drag = { slot: sel, r: cell.r, c: cell.c };
  }
}
function onMove(x, y, id){
  if (!drag) return;
  var c = Math.floor((x - GX) / CELL), r = Math.floor((y - GY) / CELL);
  drag.c = Math.max(0, Math.min(COLS - 1, c));
  drag.r = Math.max(0, Math.min(ROWS - 1, r));
}
function onUp(x, y, id){
  if (gameEnded) return;
  if (drag){
    var cell = cellAt(x, y);
    if (cell){ drag.r = cell.r; drag.c = cell.c; }
    var ok = doPlace(drag.slot, drag.r, drag.c);
    if (!ok){
      var sh = tray[drag.slot].shape;
      invalidFlash = { cells: cellsOf(sh, drag.r, drag.c), t: 0.6 };
      shake = 0.5;
    }
    drag = null;
    checkDeadlock();
    return;
  }
  if (pendingTap){
    var a = pendingTap; pendingTap = null;
    var c2 = cellAt(x, y);
    if (c2 && c2.r === a.r && c2.c === a.c){
      if (a.type === 'rot') rotateAt(a.r, a.c);
      else { if (doPlace(sel, a.r, a.c)) { sel = -1; } else { invalidFlash = { cells: [{ r: a.r, c: a.c }], t: 0.5 }; shake = 0.4; } }
      checkDeadlock();
    }
  }
}

function checkDeadlock(){
  if (gameEnded) return;
  var i;
  for (i = 0; i < 3; i++){ if (trayOk[i]) return; }
  endGame();
}
function endGame(){
  if (gameEnded) return;
  gameEnded = true;
  drag = null; sel = -1; pendingTap = null;
  Game.over(score);
}

function updateFX(dt){
  var i;
  for (i = particles.length - 1; i >= 0; i--){
    var q = particles[i];
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.grav || 150) * dt; q.life -= dt;
    if (q.life <= 0) particles.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 2.2);
  if (invalidFlash){ invalidFlash.t -= dt; if (invalidFlash.t <= 0) invalidFlash = null; }
}

function update(dt){
  t0 += dt;
  updateFX(dt);
  if (gameEnded) return;
  elapsed += dt;
  timeLeft -= dt;
  if (timeLeft <= 0){ timeLeft = 0; Game.hud('⏱ 0秒'); endGame(); return; }
  var s = Math.ceil(timeLeft);
  if (s !== lastShown){ lastShown = s; Game.hud('⏱ ' + s + '秒'); }
  if (rushActive){
    rushLeft -= dt;
    if (rushLeft <= 0) rushActive = false;
  } else {
    rushT -= dt;
    if (rushT <= 0){
      rushActive = true; rushLeft = TUNE.rushLen.v; rushT = TUNE.rushEvery.v;
      Game.toast('🏃 入居ラッシュ！ 住人 x' + TUNE.rushMult.v);
    }
  }
  for (var i = 0; i < pieces.length; i++){ if (pieces[i].wave > 0) pieces[i].wave -= dt; }
}

function colorFor(p){
  if (p.kind === 'corr') return '#3d4a63';
  if (p.kind === 'elev') return '#7a5bd6';
  if (p.kind === 'entrance') return '#38b48b';
  if (!p.connected) return '#4b5163';
  if (p.variant === 'pent') return '#e0a52a';
  if (p.variant === 'pet') return '#5fa845';
  if (p.variant === 'cafe') return '#d1567f';
  if (p.variant === 'mus') return '#3f88c5';
  if (p.variant === 'fam') return '#c9723c';
  return '#a97c50';
}
function pieceColor(tp){
  if (tp.kind === 'demo') return '#8a8a9a';
  if (tp.kind === 'elev') return '#7a5bd6';
  if (tp.kind === 'corr') return '#3d4a63';
  if (tp.variant === 'pent') return '#e0a52a';
  if (tp.variant === 'pet') return '#5fa845';
  if (tp.variant === 'cafe') return '#d1567f';
  if (tp.variant === 'mus') return '#3f88c5';
  if (tp.variant === 'fam') return '#c9723c';
  return '#a97c50';
}
function pieceIcon(tp){
  if (tp.kind === 'demo') return '🔨';
  if (tp.kind === 'elev') return '🛗';
  if (tp.kind === 'corr') return '';
  return VICON[tp.variant] || '';
}
function trayLabel(tp){
  if (tp.kind === 'demo') return ['解体🔨', 'ピースを消す'];
  if (tp.kind === 'elev') return ['エレベーター', '上下をつなぐ'];
  if (tp.kind === 'corr') return ['廊下', '部屋をつなぐ'];
  if (tp.variant === 'normal') return ['部屋', '住人' + tp.shape.length + '人'];
  return [VNAME[tp.variant], VSUB[tp.variant]];
}

function drawSite(){
  ctx.fillStyle = 'rgba(10,14,30,0.62)';
  rrect(GX - 8, GY - 8, GW + 16, GH + 16, 14); ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = score > 80 ? 'rgba(255,209,102,0.85)' : 'rgba(255,255,255,0.20)';
  rrect(GX - 8, GY - 8, GW + 16, GH + 16, 14); ctx.stroke();
  for (var r = 0; r < ROWS; r++){
    for (var c = 0; c < COLS; c++){
      if (grid[r][c]) continue;
      var x = GX + c * CELL, y = GY + r * CELL;
      ctx.fillStyle = (r === ROWS - 1) ? 'rgba(120,200,255,0.07)' : 'rgba(255,255,255,0.045)';
      rrect(x + 2, y + 2, CELL - 4, CELL - 4, 7); ctx.fill();
    }
  }
}

function drawPieces(){
  var i, j, p, r, c, x, y;
  for (i = 0; i < pieces.length; i++){
    p = pieces[i];
    var col = colorFor(p);
    for (j = 0; j < p.cells.length; j++){
      r = p.cells[j].r; c = p.cells[j].c;
      x = GX + c * CELL; y = GY + r * CELL;
      ctx.fillStyle = col;
      rrect(x + 2, y + 2, CELL - 4, CELL - 4, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      rrect(x + 7, y + 7, CELL - 14, CELL - 14, 5); ctx.fill();
      if (p.kind === 'room' && p.connected){
        ctx.fillStyle = 'rgba(255,235,170,0.72)';
        ctx.fillRect(x + CELL * 0.58, y + CELL * 0.16, CELL * 0.24, CELL * 0.19);
      }
    }
  }
  for (i = 0; i < pieces.length; i++){
    p = pieces[i];
    var f = p.cells[0];
    x = GX + (f.c + 0.5) * CELL; y = GY + (f.r + 0.5) * CELL;
    if (p.kind === 'elev'){
      ctx.font = emojiFont(30);
      ctx.fillText('🛗', x, y);
    } else if (p.kind === 'room'){
      if (p.connected){
        var bob = Math.sin(t0 * 2.4 + p.bob) * 2;
        var who = (p.wave > 0) ? '🙋' : PEOPLE[p.id % PEOPLE.length];
        ctx.font = emojiFont(CELL * 0.56);
        ctx.fillText(who, x, y + bob);
        var ic = VICON[p.variant];
        if (ic){ ctx.font = emojiFont(20); ctx.fillText(ic, x - CELL * 0.26, y - CELL * 0.26); }
      } else {
        ctx.font = emojiFont(22);
        ctx.fillText('💤', x, y);
      }
    }
  }
  ctx.font = emojiFont(30);
  ctx.fillText('🚪', GX + (ENTR_C + 0.5) * CELL, GY + (ENTR_R + 0.5) * CELL);
}

function dragValid(){
  if (!drag) return false;
  var tp = tray[drag.slot];
  if (tp.kind === 'demo'){ var t = grid[drag.r][drag.c]; return !!(t && t.kind !== 'entrance'); }
  return canPlace(tp.shape, drag.r, drag.c);
}

function drawGhost(){
  if (!drag) return;
  var tp = tray[drag.slot];
  var ok = dragValid();
  var cells = (tp.kind === 'demo') ? [{ r: drag.r, c: drag.c }] : cellsOf(tp.shape, drag.r, drag.c);
  ctx.save();
  ctx.globalAlpha = 0.7;
  for (var i = 0; i < cells.length; i++){
    var r = cells[i].r, c = cells[i].c;
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
    var x = GX + c * CELL, y = GY + r * CELL;
    ctx.fillStyle = ok ? 'rgba(90,240,150,0.55)' : 'rgba(255,80,80,0.55)';
    rrect(x + 2, y + 2, CELL - 4, CELL - 4, 7); ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = ok ? '#8dffb8' : '#ff8a8a';
    ctx.stroke();
  }
  ctx.restore();
}

function drawFx(){
  var i;
  if (invalidFlash && invalidFlash.t > 0){
    ctx.save();
    ctx.globalAlpha = Math.abs(Math.sin(invalidFlash.t * 16)) * 0.6 + 0.25;
    ctx.fillStyle = '#ff3b3b';
    for (i = 0; i < invalidFlash.cells.length; i++){
      var r = invalidFlash.cells[i].r, c = invalidFlash.cells[i].c;
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
      rrect(GX + c * CELL + 2, GY + r * CELL + 2, CELL - 4, CELL - 4, 7); ctx.fill();
    }
    ctx.restore();
  }
  for (i = 0; i < particles.length; i++){
    var q = particles[i];
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.col;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTray(){
  for (var i = 0; i < 3; i++){
    var x = TRAY_X[i], y = TRAY_Y, tp = tray[i];
    var isSel = (sel === i);
    ctx.fillStyle = isSel ? 'rgba(255,214,102,0.16)' : 'rgba(255,255,255,0.07)';
    rrect(x, y, TRAY_W, TRAY_H, 12); ctx.fill();
    ctx.lineWidth = isSel ? 3 : 2;
    ctx.strokeStyle = isSel ? '#ffd666' : 'rgba(255,255,255,0.20)';
    rrect(x, y, TRAY_W, TRAY_H, 12); ctx.stroke();
    var sh = tp.shape, mr = 0, mc = 0, j;
    for (j = 0; j < sh.length; j++){
      if (sh[j][0] + 1 > mr) mr = sh[j][0] + 1;
      if (sh[j][1] + 1 > mc) mc = sh[j][1] + 1;
    }
    var cs = 18;
    var bx = x + TRAY_W / 2 - mc * cs / 2;
    var by = y + 14 + (50 - mr * cs) / 2;
    var col = pieceColor(tp);
    for (j = 0; j < sh.length; j++){
      var px = bx + sh[j][1] * cs, py = by + sh[j][0] * cs;
      ctx.fillStyle = col;
      rrect(px + 1, py + 1, cs - 2, cs - 2, 4); ctx.fill();
    }
    var ic = pieceIcon(tp);
    if (ic){
      ctx.font = emojiFont(16);
      ctx.fillText(ic, bx + mc * cs / 2, by + mr * cs / 2);
    }
    var lb = trayLabel(tp);
    ctx.fillStyle = isSel ? '#ffe9a8' : '#eaeef8';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(lb[0], x + TRAY_W / 2, y + 82);
    ctx.fillStyle = 'rgba(220,228,245,0.65)';
    ctx.font = '12px sans-serif';
    ctx.fillText(lb[1], x + TRAY_W / 2, y + 104);
    if (!trayOk[i]){
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      rrect(x, y, TRAY_W, TRAY_H, 12); ctx.fill();
      ctx.fillStyle = '#ff8a8a';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('置けない', x + TRAY_W / 2, y + TRAY_H / 2);
    }
  }
}

function drawHint(){
  if (rushActive){
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t0 * 9);
    ctx.fillStyle = '#ffb347';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText('🏃 入居ラッシュ！ 住人 x' + TUNE.rushMult.v, W / 2, HINT_Y);
    ctx.restore();
    return;
  }
  ctx.fillStyle = 'rgba(220,228,245,0.62)';
  ctx.font = '13px sans-serif';
  ctx.fillText('ピースを選ぶ → マスをタップで設置／置いたピースをタップで回転', W / 2, HINT_Y);
}

function draw(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (skyCanvas) ctx.drawImage(skyCanvas, 0, 0);
  else { ctx.fillStyle = '#1a1430'; ctx.fillRect(0, 0, W, H); }
  var ox = 0, oy = 0;
  if (shake > 0.02){ ox = (Math.random() - 0.5) * 14 * shake; oy = (Math.random() - 0.5) * 14 * shake; }
  ctx.save();
  ctx.translate(ox, oy);
  drawSite();
  drawPieces();
  drawGhost();
  drawFx();
  ctx.restore();
  drawTray();
  drawHint();
}
