<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.vp-hud span{background:rgba(8,12,26,.55);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px 12px}
.vp-hud span:empty{display:none}
.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}
.vp-ov h1{font-size:28px}

.vp-ov .vp-big{font-size:44px;font-weight:900;color:#ffd166}
.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  bpmBase:     { v: 96,   label: '前半のテンポ(BPM)',   min: 70,  max: 140, step: 2 },
  bpmMax:      { v: 168,  label: '後半のテンポ(BPM)',   min: 100, max: 220, step: 2 },
  noteDensity: { v: 1,    label: 'ノーツの密度',        min: 0.5, max: 1.6, step: 0.05 },
  fallTime:    { v: 1.4,  label: 'ノーツ落下時間(秒)',  min: 0.7, max: 2.4, step: 0.1 },
  perfectWin:  { v: 0.05, label: 'PERFECT判定(秒)',     min: 0.02, max: 0.12, step: 0.005 },
  greatWin:    { v: 0.1,  label: 'GREAT判定(秒)',       min: 0.05, max: 0.2, step: 0.005 },
  lifePenalty: { v: 8,    label: 'MISSのライフ減',      min: 2, max: 20, step: 1 },
  feverSec:    { v: 10,   label: 'フィーバー秒数',      min: 4, max: 20, step: 1 }
};

var SONG_LEN = 45;
var LANE_W = 120;
var JUDGE = 580;
var TOP = 56;
var LANE_HUE = [190, 325, 55, 275];
var SPEED = 380;
var AC = null;

var notes = [], beatTimes = [], beatIdx = 0, songTime = 0, score = 0, combo = 0, maxCombo = 0;
var life = 100, fever = 0, feverT = 0;
var counts = { PERFECT: 0, GREAT: 0, MISS: 0 };
var particles = [], judgeFx = [], laneFlash = [0, 0, 0, 0];
var activeIds = {}, laneCount = [0, 0, 0, 0];
var shake = 0, state = 'play', endT = 0, rank = 'C', endReason = '';

function ensureAudio(){
  try {
    if (!AC){
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      AC = new Ctor();
      while (beatIdx < beatTimes.length && beatTimes[beatIdx] < songTime) beatIdx++;
    }
    if (AC.state === 'suspended' && AC.resume) AC.resume();
  } catch(e){ AC = null; }
}

function beep(freq, dur, vol, type){
  if (!AC) return;
  try {
    var t0 = AC.currentTime;
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(AC.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  } catch(e){}
}

function playBeat(i){
  if (i % 8 === 0) beep(72, 0.17, 0.17, 'sine');
  else if (i % 8 === 4) beep(230, 0.08, 0.05, 'triangle');
  else if (i % 2 === 0) beep(1500, 0.025, 0.028, 'square');
}

function mkNote(t, lane, type, hold){
  return { t: t, lane: lane, type: type, hold: hold, endT: t + hold, dead: false, holding: false, tick: 0 };
}

function buildChart(){
  notes = [];
  beatTimes = [];
  var t = 1.8;
  var last = [-9, -9, -9, -9];
  var guard = 0;
  while (t < SONG_LEN - 1.6 && guard < 4000){
    guard++;
    beatTimes.push(t);
    var prog = t / SONG_LEN;
    var bpm = TUNE.bpmBase.v + (TUNE.bpmMax.v - TUNE.bpmBase.v) * prog;
    var spb = 60 / bpm;
    var dens = (0.26 + 0.34 * prog) * TUNE.noteDensity.v;
    if (dens > 0.92) dens = 0.92;
    if (Math.random() < dens){
      var lane = Math.floor(Math.random() * 4);
      if (lane > 3) lane = 3;
      if (t - last[lane] > spb * 0.8){
        var r = Math.random();
        var type = 'tap';
        var hold = 0;
        if (r < 0.1 + 0.06 * prog){ type = 'hold'; hold = spb * (1 + Math.floor(Math.random() * 3)); }
        else if (r > 0.9 - 0.07 * prog){ type = 'gold'; }
        notes.push(mkNote(t, lane, type, hold));
        last[lane] = t + hold;
        if (type !== 'hold' && Math.random() < 0.04 + 0.22 * prog){
          var l2 = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
          if (t - last[l2] > spb * 0.8){
            notes.push(mkNote(t, l2, Math.random() < 0.25 ? 'gold' : 'tap', 0));
            last[l2] = t;
          }
        }
      }
    }
    t += spb / 2;
  }
}

function init(){
  SPEED = (JUDGE - TOP) / TUNE.fallTime.v;
  buildChart();
  beatIdx = 0; songTime = 0; score = 0; combo = 0; maxCombo = 0;
  life = 100; fever = 0; feverT = 0;
  counts = { PERFECT: 0, GREAT: 0, MISS: 0 };
  particles = []; judgeFx = []; laneFlash = [0, 0, 0, 0];
  activeIds = {}; laneCount = [0, 0, 0, 0];
  shake = 0; state = 'play'; endT = 0; rank = 'C'; endReason = '';
  Game.score(0);
  updateHud();
}

function laneX(i){ return i * LANE_W + LANE_W / 2; }
function comboMult(){ return 1 + Math.min(combo, 50) * 0.02; }
function feverMult(){ return feverT > 0 ? 2 : 1; }

function addScore(v){
  score += Math.round(v * comboMult() * feverMult());
  Game.score(score);
}

function hearts(){
  var n = Math.max(0, Math.ceil(life / 20));
  var s = '';
  for (var i = 0; i < n; i++) s += '❤️';
  return s === '' ? '💀' : s;
}

function updateHud(){ Game.hud(hearts()); }

function addFever(v){
  if (feverT > 0) return;
  fever += v;
  if (fever >= 1){
    fever = 1;
    feverT = TUNE.feverSec.v;
    Game.toast('フィーバー！ スコア2倍');
    beep(1320, 0.3, 0.16, 'triangle');
  }
}

function showJudge(text, color){
  judgeFx.length = 0;
  judgeFx.push({ text: text, color: color, life: 0.45, max: 0.45 });
}

function spawnStars(lane, n){
  var cx = laneX(lane);
  for (var i = 0; i < n; i++){
    particles.push({
      x: cx + (Math.random() * 44 - 22),
      y: JUDGE + (Math.random() * 20 - 10),
      vx: Math.random() * 170 - 85,
      vy: -130 - Math.random() * 170,
      life: 0.6, max: 0.6,
      size: 14 + Math.random() * 10,
      ch: Math.random() < 0.5 ? '⭐' : '✨'
    });
  }
  if (particles.length > 90) particles.splice(0, particles.length - 90);
}

function addHit(res, n, mult, stat){
  var base = res === 'PERFECT' ? 100 : 50;
  if (n && n.type === 'gold') base *= 3;
  if (mult) base *= mult;
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  if (stat !== false){
    if (res === 'PERFECT'){ counts.PERFECT++; addFever(0.035); }
    else { counts.GREAT++; addFever(0.012); }
  }
  addScore(base);
  if (res === 'PERFECT'){
    spawnStars(n ? n.lane : 0, 6);
    showJudge('PERFECT', '#7dfcff');
    beep(1175, 0.1, 0.16, 'triangle');
  } else {
    showJudge('GREAT', '#ffd24a');
    beep(880, 0.08, 0.12, 'triangle');
  }
  updateHud();
}

function noteMiss(n){
  combo = 0;
  counts.MISS++;
  life -= TUNE.lifePenalty.v;
  if (life < 0) life = 0;
  shake = 0.35;
  showJudge('MISS', '#ff5d7a');
  beep(165, 0.16, 0.14, 'sawtooth');
  Game.float(laneX(n.lane), JUDGE + 30, 'MISS', '#ff8fa3');
  updateHud();
  if (life <= 0) endGame('LIFE ZERO...');
}

function tryHit(lane){
  laneFlash[lane] = 1;
  var best = null, bestAbs = 999;
  var win = TUNE.greatWin.v;
  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.dead || n.holding || n.lane !== lane) continue;
    var d = songTime - n.t;
    if (d < -win || d > win) continue;
    var a = d < 0 ? -d : d;
    if (a < bestAbs){ bestAbs = a; best = n; }
  }
  if (!best){ emptyTap(lane); return; }
  var res = bestAbs <= TUNE.perfectWin.v ? 'PERFECT' : 'GREAT';
  if (best.type === 'hold'){
    best.holding = true;
    best.tick = 0.1;
    if (best.endT < songTime + 0.1) best.endT = songTime + 0.1;
    addHit(res, best, 0, true);
  } else {
    best.dead = true;
    addHit(res, best, 0, true);
  }
}

function emptyTap(lane){
  combo = 0;
  beep(180, 0.05, 0.05, 'square');
  Game.float(laneX(lane), JUDGE + 30, '✕', '#8fa3c0');
}

function breakHold(lane){
  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.dead || !n.holding || n.lane !== lane) continue;
    n.holding = false;
    n.dead = true;
    if (songTime < n.endT - 0.15) noteMiss(n);
    else addHit('PERFECT', n, 2, false);
    return;
  }
}

function endGame(reason){
  if (state !== 'play') return;
  state = 'result';
  endT = 2.8;
  endReason = reason;
  var total = counts.PERFECT + counts.GREAT + counts.MISS;
  var acc = total > 0 ? (counts.PERFECT + counts.GREAT * 0.5) / total : 0;
  rank = 'C';
  if (total > 0 && acc >= 0.95) rank = 'S';
  else if (acc >= 0.85) rank = 'A';
  else if (acc >= 0.65) rank = 'B';
  beep(660, 0.2, 0.15, 'sine');
  setTimeout(function(){ beep(990, 0.3, 0.14, 'sine'); }, 170);
}

function update(dt){
  var i, n;
  for (i = 0; i < 4; i++){ if (laneFlash[i] > 0) laneFlash[i] = Math.max(0, laneFlash[i] - dt * 3.5); }
  for (i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 420 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (i = judgeFx.length - 1; i >= 0; i--){
    judgeFx[i].life -= dt;
    if (judgeFx[i].life <= 0) judgeFx.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 2.2);

  if (state === 'result'){
    endT -= dt;
    if (endT <= 0){ state = 'over'; Game.over(score); }
    return;
  }
  if (state !== 'play') return;

  songTime += dt;

  while (beatIdx < beatTimes.length && beatTimes[beatIdx] <= songTime){
    if (AC) playBeat(beatIdx);
    beatIdx++;
  }

  if (feverT > 0){
    feverT -= dt;
    if (feverT <= 0){ feverT = 0; fever = 0; }
  }

  var missWin = TUNE.greatWin.v;
  for (i = 0; i < notes.length; i++){
    n = notes[i];
    if (n.dead) continue;
    if (n.holding){
      if (songTime >= n.endT){
        n.dead = true;
        n.holding = false;
        addHit('PERFECT', n, 2, false);
        laneFlash[n.lane] = 1;
      } else {
        n.tick -= dt;
        var cnt = 0;
        while (n.tick <= 0 && cnt < 8){ n.tick += 0.1; addScore(12); cnt++; }
      }
      continue;
    }
    if (songTime - n.t > missWin){
      n.dead = true;
      noteMiss(n);
      if (state !== 'play') return;
    }
  }

  if (songTime >= SONG_LEN) endGame('FINISH!');
}

function onDown(x, y, id){
  ensureAudio();
  if (state !== 'play') return;
  var lane = Math.floor(x / LANE_W);
  if (lane < 0) lane = 0;
  if (lane > 3) lane = 3;
  if (activeIds[id] !== undefined) return;
  activeIds[id] = lane;
  laneCount[lane]++;
  tryHit(lane);
}

function onMove(x, y, id){
  if (state !== 'play') return;
  if (activeIds[id] === undefined) return;
  var lane = Math.floor(x / LANE_W);
  if (lane < 0) lane = 0;
  if (lane > 3) lane = 3;
  if (lane === activeIds[id]) return;
  var old = activeIds[id];
  laneCount[old]--;
  if (laneCount[old] <= 0){ laneCount[old] = 0; breakHold(old); }
  activeIds[id] = lane;
  laneCount[lane]++;
  if (state === 'play') tryHit(lane);
}

function onUp(x, y, id){
  var lane = activeIds[id];
  if (lane === undefined) return;
  delete activeIds[id];
  laneCount[lane]--;
  if (laneCount[lane] <= 0){
    laneCount[lane] = 0;
    breakHold(lane);
  }
}

function roundRect(x, y, w, h, r){
  if (w <= 0 || h <= 0) return;
  if (h < 2 * r) r = h / 2;
  if (w < 2 * r) r = w / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawLanes(){
  var i;
  for (i = 0; i < 4; i++){
    var x = i * LANE_W;
    var hue = LANE_HUE[i];
    var g = ctx.createLinearGradient(0, TOP, 0, H);
    g.addColorStop(0, 'hsla(' + hue + ',80%,55%,0.02)');
    g.addColorStop(0.68, 'hsla(' + hue + ',80%,55%,0.08)');
    g.addColorStop(1, 'hsla(' + hue + ',85%,62%,0.22)');
    ctx.fillStyle = g;
    ctx.fillRect(x, TOP, LANE_W, H - TOP);
    if (laneFlash[i] > 0){
      ctx.fillStyle = 'hsla(' + hue + ',95%,68%,' + (laneFlash[i] * 0.28) + ')';
      ctx.fillRect(x, TOP, LANE_W, H - TOP);
    }
  }
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'hsla(200,70%,75%,0.16)';
  for (i = 0; i <= 4; i++){
    var lx = i * LANE_W;
    ctx.beginPath();
    ctx.moveTo(lx, TOP);
    ctx.lineTo(lx, H);
    ctx.stroke();
  }
  for (i = 0; i < 4; i++){
    var px = i * LANE_W + 10;
    var hue2 = LANE_HUE[i];
    var fl = laneFlash[i] > 0 ? laneFlash[i] : 0;
    ctx.fillStyle = 'hsla(' + hue2 + ',90%,60%,' + (0.08 + fl * 0.35) + ')';
    roundRect(px, JUDGE + 26, LANE_W - 20, 74, 14);
    ctx.fill();
    ctx.strokeStyle = 'hsla(' + hue2 + ',95%,72%,' + (0.35 + fl * 0.6) + ')';
    ctx.lineWidth = 2;
    roundRect(px, JUDGE + 26, LANE_W - 20, 74, 14);
    ctx.stroke();
    ctx.fillStyle = 'hsla(' + hue2 + ',100%,' + (55 + fl * 35) + '%,0.9)';
    ctx.beginPath();
    ctx.arc(px + (LANE_W - 20) / 2, JUDGE + 63, 12, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawJudgeLine(){
  ctx.strokeStyle = 'rgba(120,220,255,0.22)';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(6, JUDGE);
  ctx.lineTo(W - 6, JUDGE);
  ctx.stroke();
  ctx.save();
  ctx.shadowColor = 'rgba(150,245,255,0.95)';
  ctx.shadowBlur = 16;
  ctx.strokeStyle = 'rgba(200,250,255,0.95)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(6, JUDGE);
  ctx.lineTo(W - 6, JUDGE);
  ctx.stroke();
  ctx.restore();
}

function drawHead(x, y, hue){
  ctx.save();
  ctx.shadowColor = 'hsla(' + hue + ',100%,65%,1)';
  ctx.shadowBlur = 16;
  ctx.fillStyle = 'hsl(' + hue + ',95%,62%)';
  ctx.beginPath();
  ctx.arc(x, y, 19, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'hsla(' + hue + ',100%,95%,0.85)';
  ctx.beginPath();
  ctx.arc(x, y, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawNotes(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.dead) continue;
    var x = laneX(n.lane);
    var hue = LANE_HUE[n.lane];
    var hy = JUDGE - (n.t - songTime) * SPEED;
    if (n.holding && hy > JUDGE) hy = JUDGE;
    if (n.type === 'hold'){
      if (hy < TOP - 140) continue;
      var ey = JUDGE - (n.endT - songTime) * SPEED;
      var bh = hy - ey;
      if (bh < 4) bh = 4;
      ctx.fillStyle = 'hsla(' + hue + ',85%,60%,0.30)';
      roundRect(x - 15, ey, 30, bh, 15);
      ctx.fill();
      ctx.strokeStyle = 'hsla(' + hue + ',95%,74%,0.85)';
      ctx.lineWidth = 3;
      roundRect(x - 15, ey, 30, bh, 15);
      ctx.stroke();
      drawHead(x, hy, hue);
    } else if (n.type === 'gold'){
      if (hy < TOP - 60 || hy > H + 80) continue;
      ctx.save();
      ctx.shadowColor = '#ffd24a';
      ctx.shadowBlur = 18;
      ctx.font = "30px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('⭐', x, hy);
      ctx.restore();
    } else {
      if (hy < TOP - 60 || hy > H + 80) continue;
      drawHead(x, hy, hue);
    }
  }
}

function drawParticles(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max));
    ctx.font = p.size + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(p.ch, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawJudgeFx(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < judgeFx.length; i++){
    var f = judgeFx[i];
    var a = Math.max(0, f.life / f.max);
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + Math.round(20 + 12 * a) + 'px sans-serif';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, W / 2, 466 - (1 - a) * 22);
  }
  ctx.globalAlpha = 1;
}

function drawCombo(){
  if (combo < 2) return;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.save();
  ctx.globalAlpha = 0.72;
  ctx.shadowColor = 'rgba(120,235,255,0.95)';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#eaffff';
  ctx.font = 'bold 64px sans-serif';
  ctx.fillText(combo + '', W / 2, 248);
  ctx.restore();
  ctx.fillStyle = 'rgba(150,230,255,0.8)';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('COMBO x' + comboMult().toFixed(1), W / 2, 300);
}

function drawFever(){
  var x = 40, y = 58, w = W - 80, h = 12;
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  roundRect(x, y, w, h, 6);
  ctx.fill();
  var v = feverT > 0 ? (feverT / TUNE.feverSec.v) : fever;
  if (v > 0){
    var on = feverT > 0;
    var hue = on ? Math.floor((songTime * 220) % 360) : 190;
    ctx.save();
    ctx.shadowColor = 'hsl(' + hue + ',100%,60%)';
    ctx.shadowBlur = on ? 16 : 6;
    ctx.fillStyle = 'hsl(' + hue + ',92%,' + (on ? 62 : 52) + '%)';
    roundRect(x, y, Math.max(6, w * v), h, 6);
    ctx.fill();
    ctx.restore();
  }
  if (feverT > 0){
    var hue2 = Math.floor((songTime * 220) % 360);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'hsl(' + hue2 + ',100%,70%)';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('FEVER ×2', W / 2, 92);
  }
}

function drawResult(){
  ctx.fillStyle = 'rgba(6,10,22,0.84)';
  ctx.fillRect(0, TOP, W, H - TOP);
  var px = 46, py = 140, pw = W - 92, ph = 460;
  ctx.fillStyle = 'rgba(18,26,48,0.96)';
  roundRect(px, py, pw, ph, 20);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,220,255,0.6)';
  ctx.lineWidth = 3;
  roundRect(px, py, pw, ph, 20);
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#9fe8ff';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText('RESULT', W / 2, py + 44);
  ctx.fillStyle = '#ff5d7a';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText(endReason, W / 2, py + 76);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 46px sans-serif';
  ctx.fillText(score + '', W / 2, py + 130);
  ctx.fillStyle = '#7dd3fc';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('SCORE', W / 2, py + 164);

  var rows = [['PERFECT', counts.PERFECT, '#7dfcff'], ['GREAT', counts.GREAT, '#ffd24a'], ['MISS', counts.MISS, '#ff5d7a']];
  for (var i = 0; i < 3; i++){
    var ry = py + 200 + i * 34;
    ctx.textAlign = 'left';
    ctx.fillStyle = rows[i][2];
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(rows[i][0], px + 32, ry);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(rows[i][1] + '', px + pw - 32, ry);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#c7d2fe';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('MAX COMBO  ' + maxCombo, W / 2, py + 328);

  ctx.fillStyle = 'rgba(200,220,255,0.7)';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('RANK', W / 2, py + 358);

  var rc = '#ff9db3';
  if (rank === 'S') rc = '#ffd24a';
  else if (rank === 'A') rc = '#7dfcff';
  else if (rank === 'B') rc = '#8ef58e';
  ctx.save();
  ctx.shadowColor = rc;
  ctx.shadowBlur = 22;
  ctx.fillStyle = rc;
  ctx.font = 'bold 84px sans-serif';
  ctx.fillText(rank, W / 2, py + 406);
  ctx.restore();
}

function draw(){
  var step = Math.floor(combo / 50);
  var hue = (222 + step * 40) % 360;
  ctx.fillStyle = 'hsl(' + hue + ',42%,7%)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random() * 2 - 1) * shake * 12, (Math.random() * 2 - 1) * shake * 12);
  }
  drawLanes();
  drawJudgeLine();
  drawNotes();
  drawParticles();
  drawJudgeFx();
  drawCombo();
  ctx.restore();

  drawFever();
  if (state === 'result') drawResult();
}

function onResize(){}

/*__VAPPA_JS_END__*/
</script>
