<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  fallInterval: { v: 0.70, label: '落下の間隔(秒)',   min: 0.1, max: 1.5,  step: 0.05 },
  garbageStart: { v: 25,   label: '焦げの開始(秒)',   min: 5,   max: 60,   step: 1 },
  garbageEvery: { v: 22,   label: '焦げの間隔(秒)',   min: 8,   max: 45,   step: 1 },
  noriRate:     { v: 0.10, label: 'のりの出現率',     min: 0,   max: 0.35, step: 0.01 },
  levelScore:   { v: 1200, label: 'レベルアップ点数', min: 400, max: 3000, step: 100 },
  startColors:  { v: 3,    label: '初期の具の種類',   min: 2,   max: 5,    step: 1 },
  colorsMax:    { v: 5,    label: '最大の具の種類',   min: 3,   max: 5,    step: 1 }
};

var COLS = 6, ROWS = 12, cell = 46;
var boardX = 10, boardY = 100, boardW = 276, boardH = 552;
var panelX = 296, panelY = 100, panelW = 174;
var NORI = 6, BURNT = 7;
var ING = [null,
  { e: '🔴', c: '#d8483f' },
  { e: '🟠', c: '#e08a35' },
  { e: '🟤', c: '#8a5a34' },
  { e: '⚪', c: '#d8d1bd' },
  { e: '🟫', c: '#6b4a2c' },
  { e: '🟩', c: '#2f8a52' },
  { e: '⬛', c: '#3a3844' }];

var grid, cur, nextQ, fallT, chainCount, rs, score, level, colors;
var garbageT, slowT, shake, particles, chainText, state, gameTime, pts;
var bgCanvas = null;

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function buildBG(){
  if (bgCanvas) return;
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W;
  bgCanvas.height = H;
  var b = bgCanvas.getContext('2d');
  var g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#161c34');
  g.addColorStop(1, '#0a0d1a');
  b.fillStyle = g;
  b.fillRect(0, 0, W, H);
  var R = 54;
  b.lineWidth = 2;
  for (var row = -1; row * R * 0.5 < H + R; row++){
    for (var col = -1; col * R < W + R; col++){
      var cx = col * R + (((row % 2) !== 0) ? R * 0.5 : 0);
      var cy = row * R * 0.5;
      b.strokeStyle = 'rgba(120,160,230,0.075)';
      b.beginPath(); b.arc(cx, cy, R * 0.62, 0, 6.2832); b.stroke();
      b.beginPath(); b.arc(cx, cy, R * 0.40, 0, 6.2832); b.stroke();
      b.beginPath(); b.arc(cx, cy, R * 0.18, 0, 6.2832); b.stroke();
    }
  }
  var vg = b.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  b.fillStyle = vg;
  b.fillRect(0, 0, W, H);
}

function makePair(){
  var n = Math.max(2, Math.min(colors, TUNE.colorsMax.v));
  var a = 1 + Math.floor(Math.random() * n);
  var b = 1 + Math.floor(Math.random() * n);
  if (Math.random() < TUNE.noriRate.v){
    if (Math.random() < 0.5) a = NORI; else b = NORI;
  }
  return { a: a, b: b, c: 2, r: 1, o: 0 };
}

function pieceCells(p){
  var c2 = p.c, r2 = p.r;
  if (p.o === 0) r2 = p.r - 1;
  else if (p.o === 1) c2 = p.c + 1;
  else if (p.o === 2) r2 = p.r + 1;
  else c2 = p.c - 1;
  return [[p.c, p.r, p.a], [c2, r2, p.b]];
}

function validPos(p){
  var cs = pieceCells(p);
  for (var i = 0; i < 2; i++){
    var c = cs[i][0], r = cs[i][1];
    if (c < 0 || c >= COLS) return false;
    if (r >= ROWS) return false;
    if (r >= 0 && grid[r][c] !== 0) return false;
  }
  return true;
}

function fallInterval(){
  var iv = TUNE.fallInterval.v * Math.pow(0.88, level - 1);
  if (iv < 0.09) iv = 0.09;
  return iv;
}

function applyGravity(){
  for (var c = 0; c < COLS; c++){
    var w = ROWS - 1;
    for (var r = ROWS - 1; r >= 0; r--){
      if (grid[r][c] !== 0){
        var v = grid[r][c];
        grid[r][c] = 0;
        grid[w][c] = v;
        w--;
      }
    }
  }
}

function findGroups(){
  var seen = [];
  for (var r = 0; r < ROWS; r++){
    var rw = [];
    for (var c = 0; c < COLS; c++) rw.push(false);
    seen.push(rw);
  }
  var out = [];
  for (var r2 = 0; r2 < ROWS; r2++){
    for (var c2 = 0; c2 < COLS; c2++){
      var v = grid[r2][c2];
      if (v < 1 || v > 5 || seen[r2][c2]) continue;
      var stack = [[r2, c2]];
      var cells = [];
      seen[r2][c2] = true;
      while (stack.length){
        var p = stack.pop();
        cells.push(p);
        var nb = [[p[0] - 1, p[1]], [p[0] + 1, p[1]], [p[0], p[1] - 1], [p[0], p[1] + 1]];
        for (var k = 0; k < 4; k++){
          var nr = nb[k][0], nc = nb[k][1];
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
          if (seen[nr][nc]) continue;
          if (grid[nr][nc] !== v) continue;
          seen[nr][nc] = true;
          stack.push([nr, nc]);
        }
      }
      if (cells.length >= 3){
        for (var j = 0; j < cells.length; j++) out.push({ r: cells[j][0], c: cells[j][1], v: v });
      }
    }
  }
  return out;
}

function addBurnt(cells){
  var mark = {};
  for (var i = 0; i < cells.length; i++) mark[cells[i].r * COLS + cells[i].c] = true;
  var extra = [];
  for (var r = 0; r < ROWS; r++){
    for (var c = 0; c < COLS; c++){
      if (grid[r][c] !== BURNT) continue;
      var nb = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
      for (var k = 0; k < 4; k++){
        var nr = nb[k][0], nc = nb[k][1];
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
        if (mark[nr * COLS + nc]){ extra.push({ r: r, c: c, v: BURNT }); break; }
      }
    }
  }
  return extra;
}

function makeParticles(cells){
  if (particles.length > 260) return;
  for (var i = 0; i < cells.length; i++){
    var x = boardX + cells[i].c * cell + cell / 2;
    var y = boardY + cells[i].r * cell + cell / 2;
    for (var k = 0; k < 3; k++){
      var t = (k === 0) ? 0 : 1;
      var life = 0.55 + Math.random() * 0.45;
      particles.push({
        x: x + (Math.random() - 0.5) * 24,
        y: y + (Math.random() - 0.5) * 24,
        vx: (Math.random() - 0.5) * 46,
        vy: (t === 0) ? (-40 - Math.random() * 50) : (30 + Math.random() * 70),
        life: life, max: life, type: t, sz: 5 + Math.random() * 7
      });
    }
  }
}

function updateParticles(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.type === 0) p.vy -= 26 * dt; else p.vy += 120 * dt;
  }
}

function spawnPiece(){
  if (state !== 'play') return;
  cur = nextQ.shift();
  nextQ.push(makePair());
  cur.c = 2; cur.r = 1; cur.o = 0;
  fallT = 0;
  if (!validPos(cur)){ cur = null; gameOver(); return; }
}

function lockPiece(){
  if (!cur) return;
  var cs = pieceCells(cur);
  var noriColor = 0;
  if (cur.a === NORI) noriColor = cur.b;
  else if (cur.b === NORI) noriColor = cur.a;
  var placed = [];
  for (var i = 0; i < 2; i++){
    var c = cs[i][0], r = cs[i][1], v = cs[i][2];
    if (c < 0 || c >= COLS) continue;
    if (r < 0){ r = 0; if (grid[0][c] !== 0) continue; }
    if (r >= ROWS) continue;
    grid[r][c] = v;
    placed.push({ r: r, c: c, v: v });
  }
  var extra = [];
  if (noriColor){
    for (var j = 0; j < placed.length; j++){
      if (placed[j].v !== NORI) continue;
      var cc = placed[j].c;
      for (var rw = 0; rw < ROWS; rw++){
        if (grid[rw][cc] === noriColor) extra.push({ r: rw, c: cc, v: noriColor });
      }
      extra.push({ r: placed[j].r, c: cc, v: NORI });
    }
  }
  cur = null;
  startResolve(extra);
}

function startResolve(extra){
  var cells = findGroups();
  cells = cells.concat(addBurnt(cells));
  if (extra && extra.length) cells = cells.concat(extra);
  var seen = {}, out = [];
  for (var i = 0; i < cells.length; i++){
    var k = cells[i].r * COLS + cells[i].c;
    if (!seen[k]){ seen[k] = 1; out.push(cells[i]); }
  }
  if (out.length === 0){
    chainCount = 0;
    rs = null;
    spawnPiece();
    return;
  }
  chainCount++;
  var mult = Math.pow(2, Math.min(chainCount - 1, 10));
  var gain = Math.floor(out.length * mult);
  score += gain;
  Game.score(score);
  var mk = {}, mx = 0, my = 0;
  for (var j = 0; j < out.length; j++){
    mk[out[j].r * COLS + out[j].c] = 1;
    mx += boardX + out[j].c * cell + cell / 2;
    my += boardY + out[j].r * cell + cell / 2;
  }
  mx /= out.length;
  my /= out.length;
  makeParticles(out);
  Game.float(mx, my, '+' + gain, chainCount >= 2 ? '#ffd76a' : '#9ef7c4');
  if (chainCount >= 2) chainText = { n: chainCount, t: 0.9 };
  if (chainCount >= 10 && slowT <= 0){
    slowT = 3.0;
    shake = 0.6;
    Game.toast('職人の握り！');
  }
  shake = Math.max(shake, 0.18);
  rs = { phase: 'flash', t: 0.30, cells: out, mark: mk };
}

function moveHoriz(d){
  if (!cur || rs || state !== 'play') return;
  var old = cur.c;
  cur.c += d;
  if (!validPos(cur)) cur.c = old;
}

function rotatePiece(){
  if (!cur || rs || state !== 'play') return;
  var old = cur.o;
  cur.o = (cur.o + 1) % 4;
  if (validPos(cur)) return;
  var kicks = [1, -1, 2, -2];
  for (var i = 0; i < 4; i++){
    cur.c += kicks[i];
    if (validPos(cur)) return;
    cur.c -= kicks[i];
  }
  cur.r -= 1;
  if (validPos(cur)) return;
  cur.r += 1;
  cur.o = old;
}

function hardDrop(){
  if (!cur || rs || state !== 'play') return;
  var guard = 0;
  while (guard++ < ROWS + 3){
    cur.r++;
    if (!validPos(cur)){ cur.r--; break; }
  }
  shake = Math.max(shake, 0.14);
  lockPiece();
}

function riseGarbage(){
  if (cur && cur.r < 2) return false;
  for (var c = 0; c < COLS; c++){
    if (grid[0][c] !== 0){ gameOver(); return true; }
  }
  var row = [], cnt = 0;
  for (var c2 = 0; c2 < COLS; c2++){
    var b = (Math.random() < 0.72) ? BURNT : 0;
    if (b) cnt++;
    row.push(b);
  }
  for (var f = 0; f < COLS && cnt < 2; f++){
    if (!row[f]){ row[f] = BURNT; cnt++; }
  }
  for (var r = 0; r < ROWS - 1; r++) grid[r] = grid[r + 1];
  grid[ROWS - 1] = row;
  shake = Math.max(shake, 0.45);
  Game.toast('焦げごはんがせり上がった！');
  if (cur && !validPos(cur)){ gameOver(); return true; }
  return true;
}

function gameOver(){
  if (state === 'over') return;
  state = 'over';
  Game.over(score);
}

function init(){
  COLS = 6; ROWS = 12; cell = 46;
  boardX = 10; boardY = 100;
  boardW = COLS * cell;
  boardH = ROWS * cell;
  grid = [];
  for (var r = 0; r < ROWS; r++){
    var row = [];
    for (var c = 0; c < COLS; c++) row.push(0);
    grid.push(row);
  }
  score = 0;
  level = 1;
  colors = Math.min(TUNE.startColors.v, TUNE.colorsMax.v);
  chainCount = 0;
  rs = null;
  fallT = 0;
  particles = [];
  shake = 0;
  slowT = 0;
  gameTime = 0;
  chainText = null;
  garbageT = TUNE.garbageStart.v;
  state = 'play';
  pts = {};
  cur = null;
  nextQ = [];
  nextQ.push(makePair());
  nextQ.push(makePair());
  Game.score(0);
  Game.hud('Lv.' + level);
  buildBG();
  spawnPiece();
}

function update(dt){
  var rdt = dt;
  if (slowT > 0){ slowT -= rdt; dt *= 0.30; }
  gameTime += rdt;
  if (shake > 0) shake -= rdt * 2;
  if (chainText){ chainText.t -= rdt; if (chainText.t <= 0) chainText = null; }
  updateParticles(rdt);
  if (state !== 'play') return;

  if (rs){
    rs.t -= dt;
    if (rs.t <= 0){
      for (var i = 0; i < rs.cells.length; i++){
        var q = rs.cells[i];
        if (q.r >= 0 && q.r < ROWS && q.c >= 0 && q.c < COLS) grid[q.r][q.c] = 0;
      }
      applyGravity();
      rs = null;
      startResolve(null);
    }
    return;
  }

  var nl = 1 + Math.floor(score / TUNE.levelScore.v);
  if (nl > level){
    level = nl;
    colors = Math.min(TUNE.startColors.v + (level - 1), TUNE.colorsMax.v);
    Game.hud('Lv.' + level);
    Game.toast('レベル' + level + '！ はやくなる');
    shake = Math.max(shake, 0.35);
  }

  garbageT -= dt;
  if (garbageT <= 0){
    var ok = riseGarbage();
    if (state !== 'play') return;
    garbageT = ok ? Math.max(6, TUNE.garbageEvery.v - (level - 1) * 1.2) : 1.0;
  }

  if (cur){
    var iv = fallInterval();
    fallT += dt;
    var guard = 0;
    while (fallT >= iv && cur && guard++ < 24){
      fallT -= iv;
      cur.r++;
      if (!validPos(cur)){ cur.r--; lockPiece(); }
    }
  }
}

function drawPieceAt(v, x, y, size, alpha, scale){
  if (v < 1 || v > 7) return;
  var info = ING[v];
  if (!info) return;
  var rad = size * 0.45 * scale;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(x, y, rad, 0, 6.2832);
  ctx.fillStyle = info.c;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,0,0,0.38)';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x - rad * 0.30, y - rad * 0.32, rad * 0.26, 0, 6.2832);
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.fill();
  ctx.font = Math.round(size * 0.62) + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(info.e, x, y + 1);
  ctx.globalAlpha = 1;
}

function drawParticles(){
  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    var a = p.life / p.max;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    if (p.type === 0){
      ctx.globalAlpha = a * 0.55;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.sz * (1.6 - a * 0.5), 0, 6.2832);
      ctx.fillStyle = '#eef2ff';
      ctx.fill();
    } else {
      ctx.globalAlpha = a;
      ctx.font = Math.round(p.sz * 1.7) + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✨', p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

function drawNext(){
  rr(panelX, panelY, panelW, 210, 12);
  ctx.fillStyle = 'rgba(20,26,48,0.92)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(214,178,86,0.5)';
  ctx.stroke();
  ctx.fillStyle = '#e6cf8a';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('つぎの具', panelX + panelW / 2, panelY + 24);
  for (var i = 0; i < 2; i++){
    var p = nextQ[i];
    if (!p) continue;
    var cy = panelY + 76 + i * 88;
    drawPieceAt(p.b, panelX + panelW / 2, cy - 24, 44, 1, 1);
    drawPieceAt(p.a, panelX + panelW / 2, cy + 22, 44, 1, 1);
  }
}

function drawLegend(){
  rr(panelX, 326, panelW, 256, 12);
  ctx.fillStyle = 'rgba(20,26,48,0.72)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(214,178,86,0.28)';
  ctx.stroke();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e6cf8a';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('具のなかま', panelX + 12, 348);
  var names = ['梅', '鮭', '昆布', 'ツナ', 'おかか', 'のり(列消し)', '焦げ(おじゃま)'];
  for (var i = 0; i < 7; i++){
    var y = 384 + i * 28;
    var info = ING[i + 1];
    ctx.font = "19px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(info.e, panelX + 22, y);
    ctx.textAlign = 'left';
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#c3cde6';
    ctx.fillText(names[i], panelX + 42, y);
  }
}

function draw(){
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);
  else { ctx.fillStyle = '#0f1322'; ctx.fillRect(0, 0, W, H); }

  ctx.save();
  if (shake > 0){
    var sm = Math.min(1, shake * 3) * 11;
    ctx.translate((Math.random() - 0.5) * sm, (Math.random() - 0.5) * sm);
  }

  rr(boardX - 5, boardY - 5, boardW + 10, boardH + 10, 16);
  ctx.fillStyle = 'rgba(6,8,16,0.9)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(214,178,86,0.85)';
  ctx.stroke();

  ctx.save();
  rr(boardX, boardY, boardW, boardH, 10);
  ctx.fillStyle = '#151a30';
  ctx.fill();
  ctx.clip();

  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.055)';
  for (var c = 1; c < COLS; c++){
    ctx.beginPath();
    ctx.moveTo(boardX + c * cell, boardY);
    ctx.lineTo(boardX + c * cell, boardY + boardH);
    ctx.stroke();
  }
  for (var r = 1; r < ROWS; r++){
    ctx.beginPath();
    ctx.moveTo(boardX, boardY + r * cell);
    ctx.lineTo(boardX + boardW, boardY + r * cell);
    ctx.stroke();
  }

  var fk = 0;
  if (rs && rs.phase === 'flash') fk = 1 - Math.max(0, rs.t) / 0.30;

  for (var r2 = 0; r2 < ROWS; r2++){
    for (var c2 = 0; c2 < COLS; c2++){
      var v = grid[r2][c2];
      if (!v) continue;
      var px = boardX + c2 * cell + cell / 2;
      var py = boardY + r2 * cell + cell / 2;
      if (rs && rs.mark && rs.mark[r2 * COLS + c2]){
        drawPieceAt(v, px, py, cell, 1 - fk * 0.5, 1 + 0.28 * Math.sin(fk * 3.1416));
      } else {
        drawPieceAt(v, px, py, cell, 1, 1);
      }
    }
  }

  if (cur && state === 'play'){
    var g = { c: cur.c, r: cur.r, o: cur.o, a: cur.a, b: cur.b };
    var gg = 0;
    while (gg++ < ROWS + 3){
      g.r++;
      if (!validPos(g)){ g.r--; break; }
    }
    var gcs = pieceCells(g);
    for (var i = 0; i < 2; i++){
      if (gcs[i][1] < 0 || gcs[i][1] >= ROWS) continue;
      drawPieceAt(gcs[i][2], boardX + gcs[i][0] * cell + cell / 2, boardY + gcs[i][1] * cell + cell / 2, cell, 0.22, 0.88);
    }
    var ccs = pieceCells(cur);
    for (var j = 0; j < 2; j++){
      if (ccs[j][1] < 0 || ccs[j][1] >= ROWS) continue;
      drawPieceAt(ccs[j][2], boardX + ccs[j][0] * cell + cell / 2, boardY + ccs[j][1] * cell + cell / 2, cell, 1, 1);
    }
  }
  ctx.restore();

  drawParticles();

  if (garbageT < 1.6 && state === 'play' && !rs){
    var wa = 0.5 + 0.5 * Math.sin(gameTime * 20);
    ctx.globalAlpha = 0.18 + 0.30 * wa;
    ctx.fillStyle = '#ff4d4d';
    ctx.fillRect(boardX, boardY + boardH - 14, boardW, 14);
    ctx.globalAlpha = 1;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,140,140,' + (0.55 + 0.45 * wa) + ')';
    ctx.fillText('焦げごはん注意！', boardX + boardW / 2, boardY + boardH - 32);
  }

  if (chainText){
    var k = chainText.t / 0.9;
    var sc = 1 + (1 - k) * 0.5;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 2.5);
    ctx.font = 'bold ' + Math.round(30 * sc) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var tx = boardX + boardW / 2;
    var ty = boardY + boardH * 0.40;
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(20,8,0,0.92)';
    ctx.strokeText(chainText.n + 'れんさ！', tx, ty);
    ctx.fillStyle = '#ffd76a';
    ctx.fillText(chainText.n + 'れんさ！', tx, ty);
    ctx.restore();
  }

  ctx.restore();

  drawNext();
  drawLegend();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#7d8bb5';
  ctx.font = '14px sans-serif';
  ctx.fillText('左右タップで移動 ／ 下スワイプで落下', W / 2, 674);
  ctx.fillText('2本指タップで回転', W / 2, 698);
}

function onDown(x, y, id){
  var n = 0, k;
  for (k in pts){ if (pts[k]) n++; }
  if (n >= 1){
    rotatePiece();
    for (k in pts) pts[k] = null;
  }
  pts[id] = { x0: x, y0: y, lx: x, moved: false, dropped: false, rot: false, consumed: (n >= 1), t0: gameTime };
}

function onMove(x, y, id){
  var p = pts[id];
  if (!p || p.consumed) return;
  if (state !== 'play' || !cur || rs) return;
  var dx = x - p.x0, dy = y - p.y0;
  if (!p.dropped && dy > 44 && Math.abs(dy) > Math.abs(dx) * 1.3){
    p.dropped = true;
    p.consumed = true;
    hardDrop();
    return;
  }
  if (!p.rot && dy < -44 && Math.abs(dy) > Math.abs(dx) * 1.3){
    p.rot = true;
    p.consumed = true;
    rotatePiece();
    return;
  }
  if (Math.abs(dx) > 16) p.moved = true;
  if (x - p.lx > 30){ moveHoriz(1); p.lx = x; }
  else if (p.lx - x > 30){ moveHoriz(-1); p.lx = x; }
}

function onUp(x, y, id){
  var p = pts[id];
  if (!p) return;
  delete pts[id];
  if (p.consumed || p.dropped || p.rot) return;
  if (state !== 'play' || !cur || rs) return;
  var dx = Math.abs(x - p.x0), dy = Math.abs(y - p.y0);
  if (dx < 20 && dy < 20 && (gameTime - p.t0) < 0.40){
    if (x < W / 2) moveHoriz(-1); else moveHoriz(1);
  }
}
