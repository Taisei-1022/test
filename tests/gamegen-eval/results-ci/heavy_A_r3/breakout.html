<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.vp-hud span{background:rgba(8,12,26,.55);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px 12px}
.vp-hud span:empty{display:none}
.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}
.vp-ov h1{font-size:28px}
.vp-ov p{color:#b9c1de;font-size:14.5px;line-height:1.8;max-width:340px;white-space:pre-line}
.vp-ov .vp-big{font-size:44px;font-weight:900;color:#ffd166}
.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
[hidden]{display:none!important}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  ballSpeed:   { v: 260,  label: 'ボール速度',       min: 150, max: 420, step: 10 },
  speedPerStage:{ v: 25,  label: 'ステージ毎の加速', min: 0,   max: 60,  step: 5 },
  paddleW:     { v: 100,  label: 'パドル幅',         min: 60,  max: 160, step: 5 },
  lives:       { v: 3,    label: 'ライフ数',         min: 1,   max: 5,   step: 1 },
  itemRate:    { v: 0.15, label: 'アイテム落下率',   min: 0,   max: 0.5, step: 0.05 },
  bossHp:      { v: 30,   label: 'ボスHP',           min: 10,  max: 60,  step: 5 },
  comboWindow: { v: 1.6,  label: 'コンボ継続(秒)',   min: 0.5, max: 3,   step: 0.1 }
};

var COLS = 8, BW = 52, BH = 24, GAPX = 4, GAPY = 6, LEFT = 18, TOPY = 96;
var PADDLE_Y = 662, PADDLE_H = 14, TOP_WALL = 60;

var LAYOUTS = [
  [
    '.111111.',
    '11111111',
    '11222211',
    '11111111',
    '.111111.'
  ],
  [
    '...11...',
    '..1221..',
    '.112211.',
    '112BB211',
    '11111111'
  ],
  [
    '.11..11.',
    '12222221',
    '122PP221',
    '11222211',
    '.111111.',
    '..1111..',
    '...11...'
  ],
  [
    '.1I11I1.',
    '11111111',
    '1.2..2.1',
    '.111111.',
    '11I22I11',
    '.1.11.1.',
    '..1..1..'
  ]
];

var ITEMS = [
  { t:'multi',  e:'🔵', c:'#4aa3ff' },
  { t:'wide',   e:'🟢', c:'#3ddc84' },
  { t:'laser',  e:'⚡', c:'#ffd166' },
  { t:'pierce', e:'🔥', c:'#ff7a45' },
  { t:'slow',   e:'❄️', c:'#6fe3ff' },
  { t:'life',   e:'❤️', c:'#ff5d8f' },
  { t:'shrink', e:'🟥', c:'#ff4d4d' },
  { t:'fast',   e:'🔴', c:'#ff4d4d' }
];
var ITEMW = [18, 14, 14, 12, 12, 8, 11, 11];

var blocks, balls, items, beams, parts, paddle, powers, boss;
var score, lives, stage, combo, comboT, shake, phase, clearT, winFlag, beamT, bossT, tNow;
var dragging;

function init(){
  score = 0; lives = TUNE.lives.v; stage = 1;
  blocks = []; balls = []; items = []; beams = []; parts = [];
  powers = { slow:0, laser:0, pierce:0, fast:0, wideT:0 };
  paddle = { x: W/2, w: TUNE.paddleW.v, dragId: null, off: 0, hitT: 0 };
  boss = null;
  combo = 0; comboT = 0; shake = 0; phase = 'play'; clearT = 0; winFlag = false;
  beamT = 0; bossT = 0; tNow = 0; dragging = false;
  Game.score(0);
  loadStage(1);
  updateHud();
  Game.toast('STAGE 1');
}

function updateHud(){
  Game.hud('❤️'.repeat(Math.max(0, lives)) + ' ST' + stage);
}

function loadStage(n){
  blocks = []; items = []; beams = []; parts = []; boss = null;
  paddle.w = TUNE.paddleW.v; powers.wideT = 0;
  if (n === 5){
    boss = { x: (W-150)/2, y: 160, w: 150, h: 76, hp: TUNE.bossHp.v, max: TUNE.bossHp.v, vx: 110, flash: 0, cd: 0, dead: false };
    bossT = 0;
    resetBall();
    return;
  }
  var L = LAYOUTS[n-1];
  for (var r = 0; r < L.length; r++){
    for (var c = 0; c < COLS; c++){
      var ch = L[r].charAt(c);
      if (ch === '.') continue;
      var b = { x: LEFT + c*(BW+GAPX), y: TOPY + r*(BH+GAPY), w: BW, h: BH,
                flash: 0, cd: 0, dead: false, hue: (r*45 + c*20) % 360 };
      if (ch === '1'){ b.hp = 1; b.max = 1; b.kind = 'n'; }
      else if (ch === '2'){ b.hp = 2; b.max = 2; b.kind = 'h'; }
      else if (ch === '3'){ b.hp = 3; b.max = 3; b.kind = 'h'; }
      else if (ch === 'I'){ b.hp = 999; b.max = 999; b.kind = 'i'; }
      else if (ch === 'B'){ b.hp = 1; b.max = 1; b.kind = 'b'; b.hue = 10; }
      else { b.hp = 1; b.max = 1; b.kind = 'p'; b.hue = 285; }
      blocks.push(b);
    }
  }
  resetBall();
}

function resetBall(){
  balls = [{ x: paddle.x, y: PADDLE_Y - 10, vx: 0, vy: 0, r: 8, stuck: true }];
  powers.laser = 0; powers.pierce = 0; powers.slow = 0; powers.fast = 0;
  beams = [];
}

function launch(){
  for (var i = 0; i < balls.length; i++){
    var b = balls[i];
    if (!b.stuck) continue;
    var sp = ballSpeed();
    var ang = -Math.PI/2 + (Math.random()-0.5)*0.8;
    b.vx = Math.cos(ang)*sp; b.vy = Math.sin(ang)*sp;
    b.stuck = false;
  }
}

function ballSpeed(){
  var s = TUNE.ballSpeed.v + (stage-1)*TUNE.speedPerStage.v;
  if (powers.slow > 0) s *= 0.62;
  if (powers.fast > 0) s *= 1.35;
  return s;
}

function onDown(x, y, id){
  launch();
  if (dragging) return;
  dragging = true; paddle.dragId = id; paddle.off = paddle.x - x;
}

function onMove(x, y, id){
  if (!dragging) return;
  if (id !== undefined && paddle.dragId !== undefined && id !== paddle.dragId) return;
  movePaddleTo(x + paddle.off);
}

function onUp(x, y, id){
  dragging = false;
}

function movePaddleTo(px){
  var hw = paddle.w/2;
  if (px < hw) px = hw;
  if (px > W - hw) px = W - hw;
  paddle.x = px;
}

function update(dt){
  tNow += dt;
  if (phase === 'over') return;
  if (shake > 0) shake = Math.max(0, shake - dt*3);
  if (comboT > 0){ comboT -= dt; if (comboT <= 0) combo = 0; }
  if (paddle.hitT > 0) paddle.hitT -= dt;
  if (powers.slow > 0) powers.slow -= dt;
  if (powers.laser > 0) powers.laser -= dt;
  if (powers.pierce > 0) powers.pierce -= dt;
  if (powers.fast > 0) powers.fast -= dt;
  if (powers.wideT > 0){ powers.wideT -= dt; if (powers.wideT <= 0) paddle.w = TUNE.paddleW.v; }

  for (var i = 0; i < blocks.length; i++){
    if (blocks[i].flash > 0) blocks[i].flash -= dt;
    if (blocks[i].cd > 0) blocks[i].cd -= dt;
  }
  if (boss && boss.flash > 0) boss.flash -= dt;
  if (boss && boss.cd > 0) boss.cd -= dt;

  updateParts(dt);

  if (phase === 'clear'){
    clearT -= dt;
    if (clearT <= 0){
      if (winFlag){ phase = 'over'; Game.over(score); return; }
      stage++;
      loadStage(stage);
      updateHud();
      Game.toast('STAGE ' + stage);
      phase = 'play';
    }
    return;
  }

  if (powers.laser > 0){
    beamT -= dt;
    if (beamT <= 0){
      beamT = 0.32;
      beams.push({ x: paddle.x - paddle.w/2 + 8, y: PADDLE_Y - 4 });
      beams.push({ x: paddle.x + paddle.w/2 - 8, y: PADDLE_Y - 4 });
    }
  }
  updateBeams(dt);

  if (boss && !boss.dead){
    bossT += dt;
    boss.x += boss.vx*dt;
    if (boss.x < 16){ boss.x = 16; boss.vx = Math.abs(boss.vx); }
    if (boss.x + boss.w > W-16){ boss.x = W-16-boss.w; boss.vx = -Math.abs(boss.vx); }
    boss.y = 156 + Math.sin(bossT*1.3)*34;
  }

  normalizeBalls();

  var steps = Math.ceil(dt/0.008);
  if (steps > 6) steps = 6;
  if (steps < 1) steps = 1;
  var sdt = dt/steps;
  for (var s = 0; s < steps; s++) stepBalls(sdt);

  updateItems(dt);

  if (balls.length === 0){ loseLife(); return; }

  if (phase === 'play' && !boss && blocks.length === 0) stageClear();
}

function normalizeBalls(){
  var sp = ballSpeed();
  for (var i = 0; i < balls.length; i++){
    var b = balls[i];
    if (b.stuck) continue;
    var m = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
    if (m < 1){ b.vx = 0; b.vy = -sp; continue; }
    b.vx = b.vx/m*sp; b.vy = b.vy/m*sp;
    if (Math.abs(b.vy) < sp*0.3){
      b.vy = (b.vy < 0 ? -1 : 1)*sp*0.3;
      var nx = Math.sqrt(Math.max(1, sp*sp - b.vy*b.vy));
      b.vx = (b.vx < 0 ? -1 : 1)*nx;
    }
  }
}

function rectHit(b, rx, ry, rw, rh){
  var nx = Math.max(rx, Math.min(b.x, rx+rw));
  var ny = Math.max(ry, Math.min(b.y, ry+rh));
  var dx = b.x - nx, dy = b.y - ny;
  if (dx*dx + dy*dy > b.r*b.r) return 0;
  var bcx = rx + rw/2, bcy = ry + rh/2;
  var ox = (b.r + rw/2) - Math.abs(b.x - bcx);
  var oy = (b.r + rh/2) - Math.abs(b.y - bcy);
  return ox < oy ? 1 : 2;
}

function stepBalls(dt){
  for (var i = balls.length-1; i >= 0; i--){
    var b = balls[i];
    if (b.stuck){ b.x = paddle.x; b.y = PADDLE_Y - b.r - 2; continue; }
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.x - b.r < 4){ b.x = 4 + b.r; b.vx = Math.abs(b.vx); }
    else if (b.x + b.r > W-4){ b.x = W-4-b.r; b.vx = -Math.abs(b.vx); }
    if (b.y - b.r < TOP_WALL){ b.y = TOP_WALL + b.r; b.vy = Math.abs(b.vy); }
    hitPaddle(b);
    hitBlocks(b);
    if (boss && !boss.dead) hitBoss(b);
    if (b.y - b.r > H + 10){
      burst(b.x, H-26, '#5ee7ff', 7);
      balls.splice(i, 1);
    }
  }
}

function hitPaddle(b){
  if (b.vy <= 0) return;
  var hw = paddle.w/2;
  if (b.y + b.r < PADDLE_Y) return;
  if (b.y - b.r > PADDLE_Y + PADDLE_H + 6) return;
  if (b.x < paddle.x - hw - b.r || b.x > paddle.x + hw + b.r) return;
  b.y = PADDLE_Y - b.r;
  var off = (b.x - paddle.x)/hw;
  if (off > 1) off = 1;
  if (off < -1) off = -1;
  var ang = off*1.0;
  var sp = ballSpeed();
  b.vx = Math.sin(ang)*sp;
  b.vy = -Math.cos(ang)*sp;
  paddle.hitT = 0.12;
}

function hitBlocks(b){
  for (var i = blocks.length-1; i >= 0; i--){
    var bl = blocks[i];
    if (bl.dead) continue;
    var axis = rectHit(b, bl.x, bl.y, bl.w, bl.h);
    if (axis === 0) continue;
    if (powers.pierce <= 0){
      if (axis === 1){
        var s1 = b.x < bl.x + bl.w/2 ? -1 : 1;
        b.x = s1 < 0 ? bl.x - b.r : bl.x + bl.w + b.r;
        b.vx = Math.abs(b.vx)*s1;
      } else {
        var s2 = b.y < bl.y + bl.h/2 ? -1 : 1;
        b.y = s2 < 0 ? bl.y - b.r : bl.y + bl.h + b.r;
        b.vy = Math.abs(b.vy)*s2;
      }
    }
    if (bl.cd <= 0){ bl.cd = 0.05; hitBlock(bl, 0); }
    break;
  }
}

function hitBoss(b){
  var axis = rectHit(b, boss.x, boss.y, boss.w, boss.h);
  if (axis === 0) return;
  if (powers.pierce <= 0){
    if (axis === 1){
      var s1 = b.x < boss.x + boss.w/2 ? -1 : 1;
      b.x = s1 < 0 ? boss.x - b.r : boss.x + boss.w + b.r;
      b.vx = Math.abs(b.vx)*s1;
    } else {
      var s2 = b.y < boss.y + boss.h/2 ? -1 : 1;
      b.y = s2 < 0 ? boss.y - b.r : boss.y + boss.h + b.r;
      b.vy = Math.abs(b.vy)*s2;
    }
  }
  if (boss.cd <= 0){ boss.cd = 0.08; damageBoss(1); }
}

function colOf(b){
  if (b.kind === 'i') return '#9aa6c0';
  if (b.kind === 'b') return '#ff7a35';
  if (b.kind === 'p') return '#c77dff';
  return 'hsl(' + b.hue + ',80%,60%)';
}

function hitBlock(bl, depth){
  if (bl.dead) return;
  if (bl.kind === 'i'){
    bl.flash = 0.2;
    shake = Math.max(shake, 0.08);
    return;
  }
  bl.hp--;
  bl.flash = 0.3;
  if (bl.hp > 0){
    burst(bl.x + bl.w/2, bl.y + bl.h/2, colOf(bl), 4);
    return;
  }
  bl.dead = true;
  var idx = blocks.indexOf(bl);
  if (idx >= 0) blocks.splice(idx, 1);
  addScore(bl);
  burst(bl.x + bl.w/2, bl.y + bl.h/2, colOf(bl), 12);
  shake = Math.max(shake, 0.14);
  if (bl.kind === 'b' && depth < 3){
    explode(bl.x + bl.w/2, bl.y + bl.h/2, 80, depth+1);
  }
  if (bl.kind === 'p') dropItem(bl.x + bl.w/2, bl.y + bl.h/2);
  else if (Math.random() < TUNE.itemRate.v) dropItem(bl.x + bl.w/2, bl.y + bl.h/2);
}

function explode(x, y, rad, depth){
  var snap = blocks.slice();
  for (var i = 0; i < snap.length; i++){
    var b = snap[i];
    if (b.dead) continue;
    var cx = b.x + b.w/2, cy = b.y + b.h/2;
    if (Math.abs(cx - x) <= rad && Math.abs(cy - y) <= rad) hitBlock(b, depth);
  }
  burst(x, y, '#ffb347', 16);
}

function addScore(bl){
  combo++;
  comboT = TUNE.comboWindow.v;
  var base = bl.kind === 'h' ? 20 : (bl.kind === 'b' ? 30 : (bl.kind === 'p' ? 15 : 10));
  var pts = base + (combo-1)*5;
  var cap = base*4;
  if (pts > cap) pts = cap;
  score += pts;
  Game.score(score);
  if (combo > 1) Game.float(bl.x + bl.w/2, bl.y + bl.h/2, combo + 'COMBO +' + pts, '#ffd166');
  else Game.float(bl.x + bl.w/2, bl.y + bl.h/2, '+' + pts, '#9fe8ff');
}

function damageBoss(d){
  if (!boss || boss.dead) return;
  boss.hp -= d;
  boss.flash = 0.3;
  shake = Math.max(shake, 0.25);
  burst(boss.x + Math.random()*boss.w, boss.y + Math.random()*boss.h, '#ff6bd6', 5);
  combo++;
  comboT = TUNE.comboWindow.v;
  var pts = 50 + (combo-1)*5;
  score += pts;
  Game.score(score);
  Game.float(boss.x + boss.w/2, boss.y - 8, '+' + pts, '#ffb3f0');
  if (boss.hp <= 0){
    boss.hp = 0;
    boss.dead = true;
    burst(boss.x + boss.w/2, boss.y + boss.h/2, '#ffd166', 40);
    burst(boss.x + boss.w/2, boss.y + boss.h/2, '#ff5d8f', 30);
    shake = 1.0;
    winGame();
  }
}

function pickItem(){
  var tot = 0, i;
  for (i = 0; i < ITEMW.length; i++) tot += ITEMW[i];
  var r = Math.random()*tot;
  for (i = 0; i < ITEMW.length; i++){
    r -= ITEMW[i];
    if (r <= 0) return ITEMS[i];
  }
  return ITEMS[0];
}

function dropItem(x, y){
  var it = pickItem();
  items.push({ x: x, y: y, vy: 118 + Math.random()*40, t: it.t, e: it.e, c: it.c });
}

function updateItems(dt){
  for (var i = items.length-1; i >= 0; i--){
    var it = items[i];
    it.y += it.vy*dt;
    if (it.y > PADDLE_Y - 18 && it.y < PADDLE_Y + 30 && Math.abs(it.x - paddle.x) < paddle.w/2 + 16){
      applyItem(it);
      items.splice(i, 1);
      continue;
    }
    if (it.y > H + 24) items.splice(i, 1);
  }
}

function applyItem(it){
  var t = it.t;
  if (t === 'multi'){
    var add = [];
    var sp = ballSpeed();
    for (var i = 0; i < balls.length; i++){
      var b = balls[i];
      if (b.stuck) continue;
      var a = Math.atan2(b.vy, b.vx);
      for (var k = -1; k <= 1; k += 2){
        if (balls.length + add.length >= 9) break;
        var na = a + k*0.55;
        add.push({ x: b.x, y: b.y, vx: Math.cos(na)*sp, vy: Math.sin(na)*sp, r: 8, stuck: false });
      }
      if (balls.length + add.length >= 9) break;
    }
    for (var j = 0; j < add.length; j++) balls.push(add[j]);
    Game.float(paddle.x, PADDLE_Y-36, 'マルチボール!', '#4aa3ff');
  }
  else if (t === 'wide'){ paddle.w = Math.min(190, TUNE.paddleW.v*1.7); powers.wideT = 12; Game.float(paddle.x, PADDLE_Y-36, 'パドル拡大!', '#3ddc84'); }
  else if (t === 'shrink'){ paddle.w = Math.max(52, TUNE.paddleW.v*0.62); powers.wideT = 10; Game.float(paddle.x, PADDLE_Y-36, 'パドル縮小…', '#ff4d4d'); }
  else if (t === 'laser'){ powers.laser = 10; beamT = 0; Game.float(paddle.x, PADDLE_Y-36, 'レーザー!', '#ffd166'); }
  else if (t === 'pierce'){ powers.pierce = 8; Game.float(paddle.x, PADDLE_Y-36, 'ボール貫通!', '#ff7a45'); }
  else if (t === 'slow'){ powers.slow = 8; Game.float(paddle.x, PADDLE_Y-36, 'スロー!', '#6fe3ff'); }
  else if (t === 'fast'){ powers.fast = 8; shake = Math.max(shake, 0.3); Game.float(paddle.x, PADDLE_Y-36, 'ボール加速!', '#ff4d4d'); }
  else if (t === 'life'){ if (lives < 5) lives++; updateHud(); Game.float(paddle.x, PADDLE_Y-36, '1UP!', '#ff5d8f'); }
}

function updateBeams(dt){
  for (var i = beams.length-1; i >= 0; i--){
    var bm = beams[i];
    bm.y -= 900*dt;
    var hit = false;
    for (var j = 0; j < blocks.length; j++){
      var bl = blocks[j];
      if (bm.x > bl.x && bm.x < bl.x + bl.w && bm.y < bl.y + bl.h && bm.y + 18 > bl.y){
        hitBlock(bl, 0);
        hit = true;
        break;
      }
    }
    if (!hit && boss && !boss.dead && bm.x > boss.x && bm.x < boss.x + boss.w && bm.y < boss.y + boss.h && bm.y + 18 > boss.y){
      damageBoss(1);
      hit = true;
    }
    if (hit || bm.y < TOP_WALL - 10) beams.splice(i, 1);
  }
}

function burst(x, y, color, n){
  for (var i = 0; i < n; i++){
    if (parts.length > 220) break;
    var a = Math.random()*Math.PI*2;
    var sp = 40 + Math.random()*190;
    parts.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 50,
                 life: 0.45 + Math.random()*0.45, max: 0.9, c: color, s: 2 + Math.random()*4 });
  }
}

function updateParts(dt){
  for (var i = parts.length-1; i >= 0; i--){
    var p = parts[i];
    p.life -= dt;
    if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.vy += 760*dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    if (p.x < 2 || p.x > W-2) p.vx *= -0.6;
  }
}

function loseLife(){
  lives--;
  shake = 0.6;
  updateHud();
  if (lives <= 0){ phase = 'over'; Game.over(score); return; }
  Game.float(paddle.x, PADDLE_Y - 44, 'ライフ-1', '#ff6b6b');
  resetBall();
}

function stageClear(){
  phase = 'clear';
  clearT = 1.8;
  winFlag = false;
  var bonus = 500*stage;
  score += bonus;
  Game.score(score);
  Game.toast('STAGE ' + stage + ' CLEAR!  +' + bonus);
  burst(W/2, 300, '#ffd166', 30);
  shake = 0.4;
}

function winGame(){
  phase = 'clear';
  clearT = 2.4;
  winFlag = true;
  score += 3000;
  Game.score(score);
  Game.toast('🏆 全ステージクリア! +3000');
}

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r);
  ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h);
  ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r);
  ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function drawBg(){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070a1c');
  g.addColorStop(0.6, '#101538');
  g.addColorStop(1, '#1a1040');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(120,90,255,0.16)';
  ctx.lineWidth = 1;
  for (var i = 0; i <= 12; i++){
    var x = i*40;
    ctx.beginPath(); ctx.moveTo(x, 56); ctx.lineTo(x, H); ctx.stroke();
  }
  for (var j = 0; j < 10; j++){
    var y = 56 + j*j*7 + 30;
    if (y > H) break;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(94,231,255,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(3, 56); ctx.lineTo(3, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-3, 56); ctx.lineTo(W-3, H); ctx.stroke();
}

function drawBlocks(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < blocks.length; i++){
    var b = blocks[i];
    var x = b.x, y = b.y, w = b.w, h = b.h;
    var base;
    if (b.kind === 'i') base = 'hsl(220,14%,44%)';
    else if (b.kind === 'b') base = 'hsl(10,88%,54%)';
    else if (b.kind === 'p') base = 'hsl(285,80%,60%)';
    else base = 'hsl(' + b.hue + ',78%,' + (b.kind === 'h' ? 46 : 58) + '%)';
    ctx.fillStyle = base;
    rr(x, y, w, h, 6); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    rr(x+2, y+h*0.64, w-4, h*0.32, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    rr(x+4, y+3, w-8, h*0.26, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.5;
    rr(x+0.8, y+0.8, w-1.6, h-1.6, 6); ctx.stroke();
    if (b.kind === 'h' && b.hp < b.max){
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x+w*0.3, y+4); ctx.lineTo(x+w*0.42, y+h*0.5); ctx.lineTo(x+w*0.28, y+h-4);
      ctx.stroke();
      if (b.hp < b.max - 1){
        ctx.beginPath();
        ctx.moveTo(x+w*0.7, y+3); ctx.lineTo(x+w*0.6, y+h*0.55); ctx.lineTo(x+w*0.75, y+h-3);
        ctx.stroke();
      }
    }
    if (b.kind === 'i'){
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 2;
      for (var k = 0; k < 3; k++){
        ctx.beginPath();
        ctx.moveTo(x+6+k*14, y+3);
        ctx.lineTo(x+14+k*14, y+h-3);
        ctx.stroke();
      }
    }
    if (b.kind === 'b'){
      ctx.font = "17px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('💥', x+w/2, y+h/2+1);
    }
    if (b.kind === 'p'){
      ctx.font = "17px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('🎁', x+w/2, y+h/2+1);
    }
    if (b.flash > 0){
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.8, b.flash*2.4) + ')';
      rr(x, y, w, h, 6); ctx.fill();
    }
  }
}

function drawBoss(){
  if (!boss || boss.dead) return;
  var bx = boss.x, by = boss.y, bw = boss.w, bh = boss.h;
  var p = Math.max(0, boss.hp/boss.max);
  var hue = 300 - 60*(1-p);
  ctx.save();
  ctx.shadowColor = '#ff3ea5';
  ctx.shadowBlur = 18;
  var g = ctx.createLinearGradient(0, by, 0, by+bh);
  g.addColorStop(0, 'hsl(' + hue + ',85%,66%)');
  g.addColorStop(1, 'hsl(' + hue + ',85%,30%)');
  ctx.fillStyle = g;
  rr(bx, by, bw, bh, 12); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  rr(bx+6, by+5, bw-12, bh*0.32, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  rr(bx+1, by+1, bw-2, bh-2, 12); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = "44px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  ctx.fillText('👾', bx+bw/2, by+bh/2);
  if (boss.flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.8, boss.flash*2.4) + ')';
    rr(bx, by, bw, bh, 12); ctx.fill();
  }
}

function drawBossBar(){
  if (!boss || boss.dead) return;
  var bw = 360, bx = (W-bw)/2, by = 62;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  rr(bx, by, bw, 14, 7); ctx.fill();
  var p = Math.max(0, boss.hp/boss.max);
  if (p > 0){
    ctx.fillStyle = p > 0.5 ? '#4ade80' : (p > 0.25 ? '#facc15' : '#f87171');
    rr(bx+2, by+2, (bw-4)*p, 10, 5); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  rr(bx, by, bw, 14, 7); ctx.stroke();
}

function drawItems(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < items.length; i++){
    var it = items[i];
    ctx.save();
    ctx.shadowColor = it.c;
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(10,14,30,0.85)';
    ctx.beginPath(); ctx.arc(it.x, it.y, 14, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = it.c;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
    ctx.font = "17px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(it.e, it.x, it.y+1);
  }
}

function drawBeams(){
  for (var i = 0; i < beams.length; i++){
    var bm = beams[i];
    ctx.save();
    ctx.shadowColor = '#7df9ff';
    ctx.shadowBlur = 10;
    var g = ctx.createLinearGradient(0, bm.y, 0, bm.y+20);
    g.addColorStop(0, 'rgba(180,255,255,0.15)');
    g.addColorStop(1, 'rgba(130,245,255,1)');
    ctx.fillStyle = g;
    ctx.fillRect(bm.x-3, bm.y, 6, 20);
    ctx.restore();
  }
}

function drawPaddle(){
  var pw = paddle.w, ph = PADDLE_H;
  var x = paddle.x - pw/2, y = PADDLE_Y;
  var sq = paddle.hitT > 0 ? 4 : 0;
  ctx.save();
  ctx.shadowColor = '#5ee7ff';
  ctx.shadowBlur = 14;
  var g = ctx.createLinearGradient(0, y, 0, y+ph);
  g.addColorStop(0, '#eafcff');
  g.addColorStop(0.5, '#4fd3ff');
  g.addColorStop(1, '#1b6fe0');
  ctx.fillStyle = g;
  rr(x, y + sq/2, pw, ph - sq, 7); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  rr(x+5, y + 2 + sq/2, pw-10, 3, 2); ctx.fill();
}

function drawBalls(){
  for (var i = 0; i < balls.length; i++){
    var b = balls[i];
    var c1 = '#bff6ff', c2 = '#1f7bff';
    if (powers.fast > 0){ c1 = '#ffb3b3'; c2 = '#c81e1e'; }
    else if (powers.pierce > 0){ c1 = '#ffd9a0'; c2 = '#ff5722'; }
    else if (powers.laser > 0){ c1 = '#fff3b0'; c2 = '#e8a000'; }
    ctx.save();
    ctx.shadowColor = c1;
    ctx.shadowBlur = 12;
    var g = ctx.createRadialGradient(b.x-3, b.y-3, 1, b.x, b.y, b.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.45, c1);
    g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawParts(){
  for (var i = 0; i < parts.length; i++){
    var p = parts[i];
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
}

function draw(){
  drawBg();
  var ox = 0, oy = 0;
  if (shake > 0){
    ox = (Math.random()-0.5)*10*shake;
    oy = (Math.random()-0.5)*10*shake;
  }
  ctx.save();
  ctx.translate(ox, oy);
  drawBlocks();
  drawBoss();
  drawItems();
  drawBeams();
  drawPaddle();
  drawBalls();
  drawParts();
  ctx.restore();
  drawBossBar();

  if (phase === 'play'){
    var stuck = false;
    for (var i = 0; i < balls.length; i++) if (balls[i].stuck) stuck = true;
    if (stuck){
      ctx.globalAlpha = 0.45 + 0.45*Math.sin(tNow*5);
      ctx.fillStyle = '#bff6ff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('タップで発射!', W/2, 600);
      ctx.globalAlpha = 1;
    }
  }
  if (powers.laser > 0 || powers.pierce > 0 || powers.fast > 0 || powers.slow > 0){
    var txt = '';
    if (powers.laser > 0) txt += '⚡';
    if (powers.pierce > 0) txt += '🔥';
    if (powers.fast > 0) txt += '🔴';
    if (powers.slow > 0) txt += '❄️';
    ctx.font = "20px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, W/2, 700);
  }
}
/*__VAPPA_JS_END__*/
</script>
