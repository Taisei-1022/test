<style>

/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  ballSpeed:     { v: 300, label: 'ボール初速',      min: 150, max: 600,  step: 20 },
  speedPerStage: { v: 55,  label: 'ステージ毎の加速', min: 0,   max: 150,  step: 5 },
  lives:         { v: 3,   label: 'ライフ数',        min: 1,   max: 5,    step: 1 },
  paddleW:       { v: 92,  label: 'パドルの幅',      min: 60,  max: 160,  step: 4 },
  blockPoint:    { v: 10,  label: 'ブロックの点数',   min: 1,   max: 50,   step: 1 },
  comboBonus:    { v: 5,   label: 'コンボ加点',      min: 0,   max: 20,   step: 1 },
  stageBonus:    { v: 500, label: 'クリアボーナス',   min: 0,   max: 2000, step: 100 },
  maxStage:      { v: 5,   label: '最終ステージ',     min: 1,   max: 10,   step: 1 }
};

/* ---- レイアウト定数（480x720 固定） ---- */
var COLS = 7, MAXROWS = 6;
var MARGIN = 16, GAP = 6, BLOCK_H = 24, BLOCK_TOP = 96;
var FIELD_TOP = 56, PADDLE_Y = 660, PADDLE_H = 14, BALL_R = 7;
var SLOW_F = 0.62, FAST_F = 1.35;

var ROW_STYLE = [
  { light:'#ff9ab4', base:'#ff2e63', dark:'#a3123c' },
  { light:'#ffd39b', base:'#ff9f1c', dark:'#a35c06' },
  { light:'#fff3b0', base:'#ffe066', dark:'#a8912a' },
  { light:'#a6f2c6', base:'#3ddc84', dark:'#137a45' },
  { light:'#b3ecfa', base:'#4cc9f0', dark:'#0f6f96' }
];

var KIND_STYLE = {
  hard: { light:'#e4edf8', base:'#93a7c0', dark:'#42536b' },
  iron: { light:'#aab5c6', base:'#5b6675', dark:'#262c38' },
  bomb: { light:'#ffb1a3', base:'#e63946', dark:'#6d1018' },
  item: { light:'#ffe9a3', base:'#ffc300', dark:'#8a6100' }
};

/* 1=普通 2=硬い(2回) 4=硬い(3回) 3=鉄(壊れない) b=爆弾 i=アイテム 0=空 */
var LAYOUTS = {
  normal: [
    [ '1111111',
      '1222221',
      '1111111',
      '1b111b1',
      '1111111' ],
    [ '0111110',
      '1122211',
      '11i1b11',
      '0111110',
      '0011100' ],
    [ '000b000',
      '0011100',
      '01i1110',
      '1111111',
      '1422221' ],
    [ '1313131',
      '1b141b1',
      '3131313',
      '1i111i1',
      '1313131' ]
  ],
  boss: [
    [ '3141113',
      '0000000',
      '0000000',
      '0000000',
      '3000003' ]
  ]
};

var ITEM_RULES = { dropChance:0.18, fallSpeed:130, expandSec:12, shrinkSec:9, slowSec:8, fastSec:9, laserSec:10, pierceSec:8 };
var ITEM_DEFS = [
  { id:'multi',  emoji:'✨', label:'マルチボール', color:'#ffd166', weight:3, bad:false },
  { id:'expand', emoji:'🔵', label:'パドル拡大',   color:'#4cc9f0', weight:3, bad:false },
  { id:'laser',  emoji:'🔫', label:'レーザー',     color:'#ff8fab', weight:2, bad:false },
  { id:'pierce', emoji:'💠', label:'ボール貫通',   color:'#c77dff', weight:2, bad:false },
  { id:'slow',   emoji:'🐢', label:'スローボール', color:'#3ddc84', weight:2, bad:false },
  { id:'oneup',  emoji:'❤️', label:'1UP',          color:'#ff5d73', weight:1, bad:false },
  { id:'shrink', emoji:'🔴', label:'パドル縮小',   color:'#f87171', weight:2, bad:true },
  { id:'fast',   emoji:'⚡', label:'ボール加速',   color:'#ff3b30', weight:2, bad:true }
];
var LASER = { speed:760, interval:0.20 };
var BOSS = { hp:26, speed:95, points:2000 };

/* ---- 状態 ---- */
var state, stage, lives, score, combo;
var blocks, balls, items, parts, beams, paddle, gradCache, boss;
var shake, clearT, banner, bannerT, time;
var wideT, narrowT, slowT, fastT, laserT, laserCd, pierceT, slowOn, fastOn, curFactor;

function init(){
  stage = 1;
  lives = TUNE.lives.v;
  score = 0;
  combo = 0;
  blocks = []; balls = []; items = []; parts = []; beams = [];
  boss = null;
  paddle = { x: W/2, tx: W/2, w: TUNE.paddleW.v, h: PADDLE_H, y: PADDLE_Y };
  shake = 0; clearT = 0; banner = 'STAGE 1'; bannerT = 1.6; time = 0;
  wideT = 0; narrowT = 0; slowT = 0; fastT = 0; laserT = 0; laserCd = 0; pierceT = 0;
  slowOn = false; fastOn = false; curFactor = 1;
  state = 'ready';
  buildGrads();
  buildStage();
  spawnBall();
  Game.score(0);
  Game.hud(hudText());
}

function hudText(){
  var n = Math.min(6, Math.max(0, lives));
  return '❤️'.repeat(n) + ' ST' + stage;
}

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

function stageSpeed(){ return TUNE.ballSpeed.v + (stage - 1) * TUNE.speedPerStage.v; }
function speedFactor(){ return (slowOn ? SLOW_F : 1) * (fastOn ? FAST_F : 1); }
function ballSpeedNow(){ return stageSpeed() * speedFactor(); }

/* ---- 生成 ---- */
function buildGrads(){
  gradCache = {};
  var kinds = ['normal','hard','iron','bomb','item'];
  for (var k = 0; k < kinds.length; k++){
    var arr = [];
    for (var r = 0; r < MAXROWS; r++){
      var y = BLOCK_TOP + r * (BLOCK_H + GAP);
      var st = (kinds[k] === 'normal') ? ROW_STYLE[r % ROW_STYLE.length] : KIND_STYLE[kinds[k]];
      var g = ctx.createLinearGradient(0, y, 0, y + BLOCK_H);
      g.addColorStop(0, st.light);
      g.addColorStop(0.5, st.base);
      g.addColorStop(1, st.dark);
      arr.push(g);
    }
    gradCache[kinds[k]] = arr;
  }
}

function makeBlock(ch, x, y, w, r){
  var kind = 'normal', hp = 1;
  if (ch === '2'){ kind = 'hard'; hp = 2; }
  else if (ch === '4'){ kind = 'hard'; hp = 3; }
  else if (ch === '3'){ kind = 'iron'; hp = 99; }
  else if (ch === 'b'){ kind = 'bomb'; hp = 1; }
  else if (ch === 'i'){ kind = 'item'; hp = 1; }
  return { kind:kind, hp:hp, maxHp:hp, x:x, y:y, w:w, h:BLOCK_H, row:r, alive:true, cd:0 };
}

function buildStage(){
  blocks = [];
  boss = null;
  var bw = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
  var isBoss = (stage >= TUNE.maxStage.v);
  var list = isBoss ? LAYOUTS.boss : LAYOUTS.normal;
  var lay = list[(stage - 1) % list.length];
  for (var r = 0; r < lay.length && r < MAXROWS; r++){
    var y = BLOCK_TOP + r * (BLOCK_H + GAP);
    for (var c = 0; c < COLS; c++){
      var ch = lay[r].charAt(c);
      if (ch === '0' || ch === '.') continue;
      blocks.push(makeBlock(ch, MARGIN + c * (bw + GAP), y, bw, r));
    }
  }
  if (isBoss){
    var bwd = bw * 3 + GAP * 2;
    boss = { kind:'boss', row:2, x:(W - bwd) / 2, y:BLOCK_TOP + 2 * (BLOCK_H + GAP) + 6,
             w:bwd, h:BLOCK_H * 1.6, hp:BOSS.hp, maxHp:BOSS.hp, vx:BOSS.speed,
             alive:true, cd:0, hitT:0 };
    blocks.push(boss);
  }
}

function makeBall(x, y, vx, vy){
  return { x:x, y:y, vx:vx, vy:vy, r:BALL_R, tr:[], dead:false, stuck:(vx === 0 && vy === 0) };
}

function spawnBall(){
  balls = [ makeBall(paddle.x, paddle.y - BALL_R - 2, 0, 0) ];
}

function launch(){
  state = 'play';
  for (var i = 0; i < balls.length; i++){
    var b = balls[i];
    if (!b.stuck) continue;
    b.stuck = false;
    var a = Math.random() * 0.7 - 0.35;
    var s = ballSpeedNow();
    b.vx = Math.sin(a) * s;
    b.vy = -Math.cos(a) * s;
  }
}

/* ---- パワーアップ ---- */
function applyFactor(){
  var f = speedFactor();
  if (f === curFactor) return;
  var r = f / curFactor;
  curFactor = f;
  for (var i = 0; i < balls.length; i++){ balls[i].vx *= r; balls[i].vy *= r; }
}

function applyPaddleWidth(){
  var w = TUNE.paddleW.v;
  if (narrowT > 0) w *= 0.62;
  else if (wideT > 0) w *= 1.62;
  paddle.w = Math.min(W * 0.62, w);
  paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);
  paddle.tx = clamp(paddle.tx, paddle.w / 2, W - paddle.w / 2);
}

function clearPowerups(){
  wideT = 0; narrowT = 0; slowT = 0; fastT = 0; laserT = 0; laserCd = 0; pierceT = 0;
  slowOn = false; fastOn = false;
  applyFactor();
  applyPaddleWidth();
}

function addMulti(){
  if (state !== 'play' || balls.length === 0 || balls.length > 4) return;
  var src = balls[0];
  var sp = Math.sqrt(src.vx * src.vx + src.vy * src.vy) || ballSpeedNow();
  var base = Math.atan2(src.vy, src.vx);
  for (var k = 0; k < 2; k++){
    var a = base + (k === 0 ? 0.6 : -0.6);
    balls.push(makeBall(src.x, src.y, Math.cos(a) * sp, Math.sin(a) * sp));
  }
  Game.float(src.x, src.y - 22, '3ボール!', '#ffd166');
}

function fireLaser(){
  if (beams.length > 12) return;
  var y = paddle.y - 6;
  beams.push({ x: paddle.x - paddle.w / 2 + 6, y: y });
  beams.push({ x: paddle.x + paddle.w / 2 - 6, y: y });
}

/* ---- 更新 ---- */
function update(dt){
  time += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 2.5);
  if (bannerT > 0) bannerT -= dt;
  updateParts(dt);
  updateBeams(dt);
  updateBoss(dt);
  for (var q = 0; q < blocks.length; q++){ if (blocks[q].cd > 0) blocks[q].cd -= dt; }

  paddle.x += (paddle.tx - paddle.x) * Math.min(1, dt * 28);
  paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);

  if (wideT > 0){ wideT -= dt; if (wideT <= 0){ wideT = 0; applyPaddleWidth(); } }
  if (narrowT > 0){ narrowT -= dt; if (narrowT <= 0){ narrowT = 0; applyPaddleWidth(); } }
  if (slowT > 0){ slowT -= dt; if (slowT <= 0){ slowT = 0; slowOn = false; applyFactor(); } }
  if (fastT > 0){ fastT -= dt; if (fastT <= 0){ fastT = 0; fastOn = false; applyFactor(); } }
  if (pierceT > 0){ pierceT -= dt; if (pierceT < 0) pierceT = 0; }

  if (laserT > 0){
    laserT -= dt;
    if (laserT <= 0){ laserT = 0; }
    else {
      laserCd -= dt;
      if (laserCd <= 0 && state === 'play'){ fireLaser(); laserCd = LASER.interval; }
    }
  }

  if (state === 'over') return;

  updateItems(dt);

  if (state === 'ready'){
    for (var i = 0; i < balls.length; i++){
      var b = balls[i];
      if (b.stuck){ b.x = paddle.x; b.y = paddle.y - b.r - 2; }
    }
    return;
  }

  if (state === 'clear'){
    clearT -= dt;
    if (clearT <= 0) advanceStage();
    return;
  }

  for (var m = 0; m < balls.length; m++){
    if (state !== 'play') break;
    moveBall(balls[m], dt);
    if (!balls[m].dead && !balls[m].stuck){ pushTrail(balls[m]); fixAngle(balls[m]); }
  }
  for (var j = balls.length - 1; j >= 0; j--){
    if (balls[j].dead) balls.splice(j, 1);
  }
  if (state === 'play' && balls.length === 0) loseLife();
}

function updateBoss(dt){
  if (!boss || !boss.alive) return;
  var hpF = 1 + (1 - boss.hp / boss.maxHp) * 0.9;
  boss.x += boss.vx * hpF * dt;
  if (boss.x < MARGIN){ boss.x = MARGIN; boss.vx = Math.abs(boss.vx); }
  if (boss.x + boss.w > W - MARGIN){ boss.x = W - MARGIN - boss.w; boss.vx = -Math.abs(boss.vx); }
  if (boss.hitT > 0) boss.hitT -= dt;
}

function updateBeams(dt){
  for (var i = beams.length - 1; i >= 0; i--){
    if (i >= beams.length) return;
    var bm = beams[i];
    bm.y -= LASER.speed * dt;
    if (bm.y < FIELD_TOP - 12){ beams.splice(i, 1); continue; }
    var found = null;
    for (var j = 0; j < blocks.length; j++){
      var bl = blocks[j];
      if (!bl.alive) continue;
      if (bm.x >= bl.x && bm.x <= bl.x + bl.w && bm.y >= bl.y && bm.y <= bl.y + bl.h){ found = bl; break; }
    }
    if (found){
      beams.splice(i, 1);
      damageBlock(found);
      spawnParts(bm.x, bm.y, 4, '#ff8fab', 150);
      if (state !== 'play') return;
    }
  }
}

function pushTrail(b){
  b.tr.push({ x:b.x, y:b.y });
  if (b.tr.length > 6) b.tr.shift();
}

function fixAngle(b){
  var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
  if (sp < 1) return;
  var minvy = sp * 0.22;
  if (Math.abs(b.vy) < minvy){
    var sy = b.vy >= 0 ? 1 : -1;
    b.vy = sy * minvy;
    var nvx = Math.sqrt(Math.max(0, sp * sp - b.vy * b.vy));
    b.vx = (b.vx >= 0 ? 1 : -1) * nvx;
  }
}

function moveBall(b, dt){
  var dist = Math.sqrt(b.vx * b.vx + b.vy * b.vy) * dt;
  var steps = Math.ceil(dist / 6);
  if (steps < 1) steps = 1;
  if (steps > 16) steps = 16;
  var sdt = dt / steps;
  for (var s = 0; s < steps; s++){
    b.x += b.vx * sdt;
    b.y += b.vy * sdt;

    if (b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); }
    else if (b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y < FIELD_TOP + b.r){ b.y = FIELD_TOP + b.r; b.vy = Math.abs(b.vy); }

    if (b.vy > 0 && b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
        b.x >= paddle.x - paddle.w / 2 - b.r && b.x <= paddle.x + paddle.w / 2 + b.r){
      hitPaddle(b);
    }

    hitBlocks(b);
    if (b.dead) return;

    if (b.y - b.r > H){ b.dead = true; return; }
  }
}

function hitPaddle(b){
  b.y = paddle.y - b.r;
  var off = clamp((b.x - paddle.x) / (paddle.w / 2), -1, 1);
  var ang = off * 1.15;
  var s = ballSpeedNow();
  b.vx = Math.sin(ang) * s;
  b.vy = -Math.cos(ang) * s;
  combo = 0;
  spawnParts(b.x, paddle.y, 4, '#9be7ff', 120);
}

function hitBlocks(b){
  var pierce = pierceT > 0;
  for (var i = 0; i < blocks.length; i++){
    var bl = blocks[i];
    if (!bl.alive) continue;
    if (bl.cd > 0) continue;
    var cx = clamp(b.x, bl.x, bl.x + bl.w);
    var cy = clamp(b.y, bl.y, bl.y + bl.h);
    var dx = b.x - cx, dy = b.y - cy;
    if (dx * dx + dy * dy > b.r * b.r) continue;

    if (pierce && bl.kind !== 'iron' && bl.kind !== 'boss'){
      bl.cd = 0.08;
      damageBlock(bl);
      if (state !== 'play') return;
      continue;
    }

    var ox = (b.r + bl.w / 2) - Math.abs(b.x - (bl.x + bl.w / 2));
    var oy = (b.r + bl.h / 2) - Math.abs(b.y - (bl.y + bl.h / 2));
    if (ox < oy){
      if (b.x < bl.x + bl.w / 2){ b.vx = -Math.abs(b.vx); b.x -= ox; }
      else { b.vx = Math.abs(b.vx); b.x += ox; }
    } else {
      if (b.y < bl.y + bl.h / 2){ b.vy = -Math.abs(b.vy); b.y -= oy; }
      else { b.vy = Math.abs(b.vy); b.y += oy; }
    }
    damageBlock(bl);
    return;
  }
}

function kindColor(bl){
  if (bl.kind === 'hard') return KIND_STYLE.hard.base;
  if (bl.kind === 'iron') return KIND_STYLE.iron.base;
  if (bl.kind === 'bomb') return KIND_STYLE.bomb.base;
  if (bl.kind === 'item') return KIND_STYLE.item.base;
  return ROW_STYLE[bl.row % ROW_STYLE.length].base;
}

function damageBlock(bl){
  if (!bl.alive) return;
  if (bl.kind === 'iron'){
    spawnParts(bl.x + bl.w / 2, bl.y + bl.h / 2, 3, '#c9d6e6', 90);
    return;
  }
  if (bl.kind === 'boss'){
    bl.hp--;
    bl.hitT = 0.14;
    combo++;
    var bpts = TUNE.blockPoint.v * 2 + Math.min(combo, 12) * TUNE.comboBonus.v;
    score += bpts;
    Game.score(score);
    spawnParts(bl.x + bl.w / 2, bl.y + bl.h / 2, 8, '#ffd166', 220);
    shake = Math.max(shake, 0.3);
    if (bl.hp <= 0) defeatBoss(bl);
    return;
  }

  bl.hp--;
  if (bl.hp > 0){
    spawnParts(bl.x + bl.w / 2, bl.y + bl.h / 2, 4, kindColor(bl), 120);
    return;
  }

  bl.alive = false;
  combo++;
  var pts = TUNE.blockPoint.v + Math.min(combo, 12) * TUNE.comboBonus.v;
  score += pts;
  Game.score(score);
  var col = kindColor(bl);
  spawnParts(bl.x + bl.w / 2, bl.y + bl.h / 2, 12, col, 230);
  spawnParts(bl.x + bl.w / 2, bl.y + bl.h / 2, 4, '#ffffff', 140);
  if (combo > 1) Game.float(bl.x + bl.w / 2, bl.y + bl.h / 2, combo + 'COMBO +' + pts, '#ffd166');
  else Game.float(bl.x + bl.w / 2, bl.y + bl.h / 2, '+' + pts, '#ffffff');

  if (bl.kind === 'bomb') explodeBomb(bl);
  else if (bl.kind === 'item') dropItemAt(bl.x + bl.w / 2, bl.y + bl.h / 2, true);
  else dropItemAt(bl.x + bl.w / 2, bl.y + bl.h / 2, false);

  if (state === 'play' && blocksLeft() === 0) stageClear();
}

function explodeBomb(bl){
  var cx = bl.x + bl.w / 2, cy = bl.y + bl.h / 2;
  var rad = bl.w * 1.45;
  shake = Math.max(shake, 0.55);
  spawnParts(cx, cy, 22, '#ffb703', 330);
  for (var i = 0; i < blocks.length; i++){
    var o = blocks[i];
    if (!o.alive || o === bl) continue;
    if (o.kind === 'iron') continue;
    var ox = o.x + o.w / 2, oy = o.y + o.h / 2;
    var dx = ox - cx, dy = oy - cy;
    if (dx * dx + dy * dy <= rad * rad){
      damageBlock(o);
      if (state !== 'play') return;
    }
  }
}

function defeatBoss(bl){
  bl.alive = false;
  combo++;
  score += BOSS.points;
  Game.score(score);
  Game.float(bl.x + bl.w / 2, bl.y + bl.h / 2, 'BOSS DOWN +' + BOSS.points, '#ffd166');
  spawnParts(bl.x + bl.w / 2, bl.y + bl.h / 2, 30, '#ff9ad5', 340);
  spawnParts(bl.x + bl.w / 2, bl.y + bl.h / 2, 18, '#ffd166', 260);
  shake = 0.9;
  boss = null;
  if (blocksLeft() === 0) stageClear();
}

function blocksLeft(){
  var n = 0;
  for (var i = 0; i < blocks.length; i++){
    var b = blocks[i];
    if (b.alive && b.kind !== 'iron') n++;
  }
  return n;
}

function stageClear(){
  if (state === 'clear' || state === 'over') return;
  var bonus = TUNE.stageBonus.v * stage;
  score += bonus;
  Game.score(score);
  Game.float(W / 2, 320, 'STAGE CLEAR +' + bonus, '#ffd166');
  spawnParts(W / 2, 360, 18, '#ffd166', 260);
  if (stage >= TUNE.maxStage.v){
    state = 'over';
    Game.over(score);
    return;
  }
  state = 'clear';
  clearT = 1.6;
  balls = [];
  items = [];
  beams = [];
  boss = null;
}

function advanceStage(){
  stage++;
  combo = 0;
  buildStage();
  banner = 'STAGE ' + stage;
  bannerT = 1.5;
  clearPowerups();
  state = 'ready';
  spawnBall();
  Game.hud(hudText());
}

function loseLife(){
  lives--;
  Game.hud(hudText());
  shake = 0.7;
  combo = 0;
  spawnParts(W / 2, H - 60, 14, '#ff5d73', 220);
  Game.float(W / 2, H - 130, 'MISS', '#ff5d73');
  if (lives <= 0){
    state = 'over';
    Game.over(score);
    return;
  }
  items = [];
  beams = [];
  state = 'ready';
  spawnBall();
}

/* ---- アイテム ---- */
function updateItems(dt){
  for (var i = items.length - 1; i >= 0; i--){
    var it = items[i];
    it.y += ITEM_RULES.fallSpeed * dt;
    if (it.y + 12 >= paddle.y && it.y - 12 <= paddle.y + paddle.h &&
        Math.abs(it.x - paddle.x) < paddle.w / 2 + 14){
      pickItem(it);
      items.splice(i, 1);
      continue;
    }
    if (it.y > H + 30) items.splice(i, 1);
  }
}

function dropItemAt(x, y, force){
  if (!force && Math.random() > ITEM_RULES.dropChance) return;
  var total = 0, i;
  for (i = 0; i < ITEM_DEFS.length; i++) total += ITEM_DEFS[i].weight;
  var pick = Math.random() * total;
  for (i = 0; i < ITEM_DEFS.length; i++){
    pick -= ITEM_DEFS[i].weight;
    if (pick <= 0){
      items.push({ x:x, y:y, id:ITEM_DEFS[i].id, emoji:ITEM_DEFS[i].emoji,
                   label:ITEM_DEFS[i].label, color:ITEM_DEFS[i].color, bad:ITEM_DEFS[i].bad });
      return;
    }
  }
}

function pickItem(it){
  Game.float(it.x, it.y - 20, it.label, it.color);
  spawnParts(it.x, it.y, 8, it.color, 170);
  if (it.id === 'expand'){ narrowT = 0; wideT = ITEM_RULES.expandSec; applyPaddleWidth(); }
  else if (it.id === 'shrink'){ wideT = 0; narrowT = ITEM_RULES.shrinkSec; applyPaddleWidth(); }
  else if (it.id === 'slow'){ slowOn = true; slowT = ITEM_RULES.slowSec; applyFactor(); }
  else if (it.id === 'fast'){ fastOn = true; fastT = ITEM_RULES.fastSec; applyFactor(); }
  else if (it.id === 'multi'){ addMulti(); }
  else if (it.id === 'laser'){ laserT = ITEM_RULES.laserSec; laserCd = 0; }
  else if (it.id === 'pierce'){ pierceT = ITEM_RULES.pierceSec; }
  else if (it.id === 'oneup'){ lives++; Game.hud(hudText()); }
}

/* ---- パーティクル ---- */
function spawnParts(x, y, n, color, spd){
  for (var i = 0; i < n; i++){
    if (parts.length > 300) return;
    var a = Math.random() * Math.PI * 2;
    var s = spd * (0.3 + Math.random() * 0.9);
    parts.push({ x:x, y:y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 40,
                 t:0, life:0.45 + Math.random() * 0.5, c:color, s:2 + Math.random() * 3 });
  }
}

function updateParts(dt){
  for (var i = parts.length - 1; i >= 0; i--){
    var p = parts[i];
    p.t += dt;
    if (p.t >= p.life){ parts.splice(i, 1); continue; }
    p.vy += 430 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

/* ---- 描画 ---- */
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBG(){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b0f22');
  g.addColorStop(0.55, '#141c3a');
  g.addColorStop(1, '#080a16');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(96,150,255,0.09)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = 0; x <= W; x += 48){ ctx.moveTo(x, FIELD_TOP); ctx.lineTo(x, H); }
  for (var y = FIELD_TOP; y <= H; y += 48){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.fillStyle = 'rgba(120,180,255,0.30)';
  ctx.fillRect(0, FIELD_TOP, W, 2);
  ctx.fillStyle = 'rgba(120,180,255,0.10)';
  ctx.fillRect(0, FIELD_TOP + 2, W, 8);
}

function drawCracks(bl){
  var n = bl.maxHp - bl.hp;
  var cx = bl.x + bl.w / 2, cy = bl.y + bl.h / 2;
  ctx.strokeStyle = 'rgba(20,24,36,0.72)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  if (n >= 1){
    ctx.moveTo(cx - bl.w * 0.30, cy - bl.h * 0.30);
    ctx.lineTo(cx - bl.w * 0.05, cy + bl.h * 0.02);
    ctx.lineTo(cx - bl.w * 0.22, cy + bl.h * 0.36);
  }
  if (n >= 2){
    ctx.moveTo(cx + bl.w * 0.32, cy - bl.h * 0.34);
    ctx.lineTo(cx + bl.w * 0.06, cy);
    ctx.lineTo(cx + bl.w * 0.26, cy + bl.h * 0.38);
  }
  ctx.stroke();
}

function drawBlock(bl){
  var rad = 6;
  rr(bl.x, bl.y, bl.w, bl.h, rad);
  var arr = gradCache[bl.kind] || gradCache.normal;
  ctx.fillStyle = arr[bl.row % MAXROWS] || '#4cc9f0';
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(bl.x, bl.y, bl.w, bl.h * 0.40);
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillRect(bl.x, bl.y, bl.w, bl.h * 0.14);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(bl.x, bl.y + bl.h * 0.82, bl.w, bl.h * 0.18);
  ctx.restore();
  rr(bl.x + 0.5, bl.y + 0.5, bl.w - 1, bl.h - 1, rad - 0.5);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 1;
  ctx.stroke();

  if (bl.kind === 'iron'){
    ctx.fillStyle = 'rgba(18,22,34,0.8)';
    ctx.beginPath(); ctx.arc(bl.x + 7, bl.y + bl.h / 2, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bl.x + bl.w - 7, bl.y + bl.h / 2, 2.4, 0, Math.PI * 2); ctx.fill();
  } else if (bl.kind === 'bomb'){
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "16px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('💥', bl.x + bl.w / 2, bl.y + bl.h / 2 + 1);
  } else if (bl.kind === 'item'){
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "16px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText('🎁', bl.x + bl.w / 2, bl.y + bl.h / 2 + 1);
  } else if (bl.kind === 'hard' && bl.hp < bl.maxHp){
    drawCracks(bl);
  }
}

function drawBoss(bl){
  var flash = bl.hitT > 0;
  rr(bl.x, bl.y, bl.w, bl.h, 10);
  var g = ctx.createLinearGradient(0, bl.y, 0, bl.y + bl.h);
  g.addColorStop(0, flash ? '#ffffff' : '#e2a8ff');
  g.addColorStop(0.45, flash ? '#ffd9ff' : '#8b2fc9');
  g.addColorStop(1, '#3b0a5c');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,255,0.85)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  ctx.fillText('👾', bl.x + bl.w / 2, bl.y + bl.h / 2 + 2);
}

function drawBlocks(){
  for (var i = 0; i < blocks.length; i++){
    var bl = blocks[i];
    if (!bl.alive) continue;
    if (bl.kind === 'boss'){ drawBoss(bl); continue; }
    drawBlock(bl);
  }
}

function drawParts(){
  for (var i = 0; i < parts.length; i++){
    var p = parts[i];
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
}

function drawItems(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < items.length; i++){
    var it = items[i];
    ctx.beginPath();
    ctx.arc(it.x, it.y, 16, 0, Math.PI * 2);
    ctx.fillStyle = it.bad ? 'rgba(255,80,80,0.22)' : 'rgba(255,255,255,0.12)';
    ctx.fill();
    ctx.strokeStyle = it.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = "20px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(it.emoji, it.x, it.y + 1);
  }
}

function drawBeams(){
  ctx.globalAlpha = 0.85;
  for (var i = 0; i < beams.length; i++){
    var bm = beams[i];
    ctx.strokeStyle = '#ff8fab';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bm.x, bm.y); ctx.lineTo(bm.x, bm.y + 18); ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(bm.x, bm.y); ctx.lineTo(bm.x, bm.y + 18); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBalls(){
  var core = '#eaf6ff', glow = 'rgba(150,215,255,0.25)';
  if (pierceT > 0){ core = '#e6ccff'; glow = 'rgba(190,130,255,0.32)'; }
  else if (fastOn){ core = '#ffdede'; glow = 'rgba(255,70,70,0.35)'; }
  else if (slowOn){ core = '#d6ffe6'; glow = 'rgba(90,240,150,0.30)'; }
  for (var i = 0; i < balls.length; i++){
    var b = balls[i];
    var k;
    for (k = 0; k < b.tr.length; k++){
      var t = b.tr[k];
      var a = (k + 1) / b.tr.length;
      ctx.globalAlpha = a * 0.30;
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.r * (0.35 + 0.6 * a), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 4, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = core;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x - 2, b.y - 2, b.r * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    if (pierceT > 0){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2);
      ctx.strokeStyle = '#c77dff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function drawPaddle(){
  var x = paddle.x - paddle.w / 2, y = paddle.y;
  var g = ctx.createLinearGradient(0, y, 0, y + paddle.h);
  if (narrowT > 0){
    g.addColorStop(0, '#ffd0d0'); g.addColorStop(0.45, '#f87171'); g.addColorStop(1, '#7a1a1a');
  } else {
    g.addColorStop(0, '#c8f4ff'); g.addColorStop(0.45, '#4cc9f0'); g.addColorStop(1, '#0b5f8a');
  }
  rr(x, y, paddle.w, paddle.h, 7);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(230,250,255,0.9)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (wideT > 0){
    ctx.globalAlpha = 0.45 + 0.35 * Math.sin(time * 12);
    rr(x - 3, y - 3, paddle.w + 6, paddle.h + 6, 9);
    ctx.strokeStyle = '#7ef0ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (laserT > 0){
    ctx.fillStyle = '#ff8fab';
    ctx.fillRect(x + 4, y - 6, 5, 6);
    ctx.fillRect(x + paddle.w - 9, y - 6, 5, 6);
  }
}

function drawBossBar(){
  if (!boss || !boss.alive) return;
  var bw2 = 320, bx = (W - bw2) / 2, by = 60, bh = 16;
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  rr(bx, by, bw2, bh, 8);
  ctx.fill();
  var f = Math.max(0, boss.hp / boss.maxHp);
  ctx.fillStyle = '#ff5d73';
  rr(bx, by, Math.max(6, bw2 * f), bh, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  rr(bx, by, bw2, bh, 8);
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('BOSS', W / 2, by + bh / 2 + 1);
}

function drawStatus(){
  var icons = [];
  if (narrowT > 0) icons.push('🔴');
  else if (wideT > 0) icons.push('🔵');
  if (laserT > 0) icons.push('🔫');
  if (pierceT > 0) icons.push('💠');
  if (slowOn) icons.push('🐢');
  if (fastOn) icons.push('⚡');
  if (icons.length > 0){
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "16px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    for (var i = 0; i < icons.length && i < 6; i++){
      ctx.fillText(icons[i], 22 + i * 26, 86);
    }
  }
  if (combo >= 2){
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('コンボ x' + combo, W - 16, 86);
  }
}

function drawOverlay(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (state === 'ready'){
    ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(time * 3));
    ctx.fillStyle = '#dbeafe';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('タップで発射', W / 2, 606);
    ctx.globalAlpha = 1;
  } else if (state === 'clear'){
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 30px sans-serif';
    ctx.fillText('STAGE CLEAR!', W / 2, 380);
    ctx.fillStyle = '#dbeafe';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('ボーナス +' + (TUNE.stageBonus.v * stage), W / 2, 418);
  }
  if (bannerT > 0 && banner){
    ctx.globalAlpha = Math.min(1, bannerT / 0.6);
    ctx.fillStyle = '#8ee7ff';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText(banner, W / 2, 400);
    ctx.globalAlpha = 1;
  }
}

function draw(){
  drawBG();
  var ox = 0, oy = 0;
  if (shake > 0){
    ox = (Math.random() * 2 - 1) * 7 * shake;
    oy = (Math.random() * 2 - 1) * 7 * shake;
  }
  ctx.save();
  ctx.translate(ox, oy);
  drawBlocks();
  drawItems();
  drawBeams();
  drawParts();
  drawBalls();
  drawPaddle();
  ctx.restore();
  drawBossBar();
  drawStatus();
  drawOverlay();
}

/* ---- 入力 ---- */
function onDown(x, y){
  paddle.tx = clamp(x, paddle.w / 2, W - paddle.w / 2);
  if (state === 'ready') launch();
}

function onMove(x, y){
  paddle.tx = clamp(x, paddle.w / 2, W - paddle.w / 2);
}

function onUp(x, y){
}

/*__VAPPA_JS_END__*/
</script>
