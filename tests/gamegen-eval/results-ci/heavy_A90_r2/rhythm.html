<style>

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  approach:  { v: 1.3,  label: 'ノーツ落下時間', min: 0.8, max: 2.2, step: 0.1 },
  bpmStart:  { v: 96,   label: '前半のBPM',    min: 60,  max: 160, step: 4 },
  bpmEnd:    { v: 150,  label: '後半のBPM',    min: 80,  max: 220, step: 5 },
  density:   { v: 1.0,  label: 'ノーツ密度',    min: 0.4, max: 2.0, step: 0.1 },
  goldRate:  { v: 0.10, label: '金ノーツ率',    min: 0,   max: 0.3, step: 0.02 },
  lifeLoss:  { v: 10,   label: 'MISSのライフ減', min: 2,  max: 30,  step: 1 },
  feverGain: { v: 5,    label: 'フィーバー増加', min: 1,   max: 20,  step: 1 },
  songLen:   { v: 45,   label: '曲の長さ(秒)',  min: 20,  max: 90,  step: 5 }
};

var LANES = 4;
var LW = W / LANES;
var JUDGE_Y = 590;
var TOP_Y = 56;
var PAD_Y = 642;
var LANE_COL = ['#ff3d81', '#38bdf8', '#a78bfa', '#34d399'];
var LANE_EMO = ['💗', '💙', '💜', '💚'];

var notes, songTime, score, combo, maxCombo, life, fever, feverT, counts;
var laneHeld, laneFlash, laneJudge, ptrLane, ptrStart, ptrFlicked;
var particles, state, resultT, failed, rank, acc, shake, now, nextBeat, beatCount, speed, actx;

function init(){
  notes = buildChart();
  songTime = 0; score = 0; combo = 0; maxCombo = 0;
  life = 100; fever = 0; feverT = 0;
  counts = { perfect: 0, great: 0, miss: 0 };
  laneHeld = [-1, -1, -1, -1];
  laneFlash = [0, 0, 0, 0];
  laneJudge = [null, null, null, null];
  ptrLane = {}; ptrStart = {}; ptrFlicked = {};
  particles = [];
  state = 'play'; resultT = 0; failed = false; rank = ''; acc = 0;
  shake = 0; now = 0; nextBeat = 0; beatCount = 0;
  speed = (JUDGE_Y - TOP_Y) / TUNE.approach.v;
  Game.score(0);
  updateHud();
}

function bpmAt(t, len){
  var half = len * 0.5;
  if (t <= half) return TUNE.bpmStart.v;
  var p = (t - half) / (len - half);
  if (p > 1) p = 1;
  return TUNE.bpmStart.v + (TUNE.bpmEnd.v - TUNE.bpmStart.v) * p;
}

function pickLane(busy, t, avoid){
  var cand = [];
  var i;
  for (i = 0; i < LANES; i++){ if (busy[i] <= t && i !== avoid) cand.push(i); }
  if (cand.length === 0){ for (i = 0; i < LANES; i++){ if (busy[i] <= t) cand.push(i); } }
  if (cand.length === 0) return -1;
  return cand[Math.floor(Math.random() * cand.length)];
}

function mkNote(lane, t, type, dur){
  return { lane: lane, t: t, type: type, dur: dur, done: false, holding: false, holdId: -1, tickT: 0 };
}

function mkChart(){
  var len = TUNE.songLen.v;
  var arr = [];
  var busy = [0, 0, 0, 0];
  var t = 2.6;
  var k = 0;
  var lastLane = -1;
  while (t < len - 0.8){
    var bpm = bpmAt(t, len);
    var step = 30 / bpm;
    var prog = t / len;
    var p = (0.20 + prog * 0.45) * TUNE.density.v;
    if (k % 2 === 0) p *= 1.30;
    if (k % 8 === 0) p *= 1.10;
    if (p > 0.92) p = 0.92;
    var lane = pickLane(busy, t, lastLane);
    if (lane >= 0 && Math.random() < p){
      var r = Math.random();
      var gP = TUNE.goldRate.v * (prog > 0.12 ? 1 : 0.35);
      var type = 'normal';
      var dur = 0;
      if (r < gP){ type = 'gold'; }
      else if (r < gP + 0.13 && prog > 0.22 && k % 2 === 0){ type = 'hold'; dur = step * (Math.random() < 0.5 ? 2 : 3); }
      arr.push(mkNote(lane, t, type, dur));
      busy[lane] = t + (dur > 0 ? dur + 0.28 : 0.22);
      lastLane = lane;
      if (prog > 0.40 && Math.random() < 0.08 + prog * 0.16){
        var l2 = pickLane(busy, t, lane);
        if (l2 >= 0){
          arr.push(mkNote(l2, t, 'normal', 0));
          busy[l2] = t + 0.22;
        }
      }
    }
    t += step;
    k++;
  }
  return arr;
}

function buildChart(){
  var c = mkChart();
  var guard = 0;
  while (c.length < 12 && guard < 8){ c = mkChart(); guard++; }
  return c;
}

/* ---------- audio ---------- */
function audioInit(){
  if (!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC){ try { actx = new AC(); } catch(e){ actx = null; } }
  }
  if (actx && actx.state === 'suspended' && actx.resume) actx.resume();
}

function beep(freq, dur, type, vol){
  if (!actx) return;
  var t0 = actx.currentTime;
  var o = actx.createOscillator();
  var g = actx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(actx.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.03);
}

function beatTick(){
  var bpm = bpmAt(songTime, TUNE.songLen.v);
  var spb = 60 / bpm;
  if (songTime < nextBeat) return;
  if (songTime - nextBeat > spb * 2) nextBeat = songTime;
  if (beatCount % 4 === 0) beep(80, 0.13, 'sine', 0.16);
  else beep(1500, 0.025, 'square', 0.025);
  if (beatCount % 2 === 0){
    var bass = [110, 110, 146.83, 130.81];
    beep(bass[Math.floor(beatCount / 2) % 4], 0.22, 'triangle', 0.05);
  }
  beatCount++;
  nextBeat += spb;
}

/* ---------- game logic ---------- */
function comboMul(){ return 1 + Math.min(combo, 50) * 0.02; }

function addPoints(base){
  var p = Math.round(base * comboMul() * (feverT > 0 ? 2 : 1));
  score += p;
  Game.score(score);
  return p;
}

function updateHud(){
  var k = Math.floor(life / 20);
  if (k < 0) k = 0;
  if (k > 5) k = 5;
  var s = '';
  for (var i = 0; i < 5; i++) s += (i < k ? '❤️' : '🖤');
  Game.hud(s);
}

function addFever(a){
  if (feverT > 0) return;
  fever += a;
  if (fever >= 100){
    fever = 100;
    feverT = 10;
    Game.toast('🔥 FEVER!! スコア2倍');
    beep(1046, 0.12, 'square', 0.11);
    beep(1568, 0.20, 'square', 0.09);
  }
}

function spawnStars(lane, count){
  var cx = lane * LW + LW / 2;
  for (var i = 0; i < count; i++){
    particles.push({
      x: cx + (Math.random() * 44 - 22),
      y: JUDGE_Y - 8 - Math.random() * 26,
      vx: (Math.random() - 0.5) * 280,
      vy: -110 - Math.random() * 230,
      life: 0.5 + Math.random() * 0.45,
      ch: Math.random() < 0.5 ? '⭐' : '✨',
      sz: 15 + Math.random() * 11
    });
  }
}

function onTapLane(lane, id){
  var best = null;
  var bd = 9;
  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.done || n.holding || n.lane !== lane) continue;
    var d = songTime - n.t;
    if (d < -0.18 || d > 0.18) continue;
    var ad = d < 0 ? -d : d;
    if (ad < bd){ bd = ad; best = n; }
  }
  if (!best){ beep(420, 0.035, 'triangle', 0.035); return; }
  if (bd > 0.105) return;
  var judge = bd <= 0.05 ? 'PERFECT' : 'GREAT';
  if (best.type === 'hold'){ startHold(best, judge, id); return; }
  resolve(best, judge);
}

function flickJudge(lane){
  var best = null;
  var bd = 9;
  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.done || n.holding || n.lane !== lane) continue;
    var d = songTime - n.t;
    if (d < -0.15 || d > 0.15) continue;
    var ad = d < 0 ? -d : d;
    if (ad < bd){ bd = ad; best = n; }
  }
  if (!best) return;
  resolve(best, bd <= 0.06 ? 'PERFECT' : 'GREAT');
}

function resolve(n, judge){
  n.done = true;
  if (judge === 'PERFECT'){
    counts.perfect++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    addFever(TUNE.feverGain.v);
    spawnStars(n.lane, n.type === 'gold' ? 8 : 5);
    beep(1320, 0.09, 'square', 0.11);
    laneJudge[n.lane] = { text: 'PERFECT', col: '#67e8f9', t: 0.42 };
  } else {
    counts.great++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    spawnStars(n.lane, 2);
    beep(880, 0.08, 'square', 0.09);
    laneJudge[n.lane] = { text: 'GREAT', col: '#a3e635', t: 0.42 };
  }
  var base = (judge === 'PERFECT' ? 100 : 50) * (n.type === 'gold' ? 3 : 1);
  addPoints(base);
  laneFlash[n.lane] = 1;
}

function startHold(n, judge, id){
  n.holding = true;
  n.holdId = id;
  n.tickT = 0.12;
  if (judge === 'PERFECT'){
    counts.perfect++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    addFever(TUNE.feverGain.v);
    spawnStars(n.lane, 4);
    beep(1320, 0.09, 'square', 0.11);
    laneJudge[n.lane] = { text: 'PERFECT', col: '#67e8f9', t: 0.42 };
  } else {
    counts.great++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    beep(880, 0.08, 'square', 0.09);
    laneJudge[n.lane] = { text: 'GREAT', col: '#a3e635', t: 0.42 };
  }
  addPoints((judge === 'PERFECT' ? 100 : 50) * 2);
  laneFlash[n.lane] = 1;
}

function completeHold(n){
  n.done = true;
  n.holding = false;
  addPoints(80);
  spawnStars(n.lane, 5);
  laneJudge[n.lane] = { text: 'HOLD!', col: '#67e8f9', t: 0.4 };
  laneFlash[n.lane] = 1;
  beep(1568, 0.10, 'triangle', 0.09);
}

function breakHold(n){
  if (state !== 'play') return;
  n.done = true;
  n.holding = false;
  combo = 0;
  counts.miss++;
  life -= TUNE.lifeLoss.v * 0.5;
  shake = 0.2;
  laneJudge[n.lane] = { text: 'BREAK', col: '#fbbf24', t: 0.5 };
  laneFlash[n.lane] = 1;
  beep(220, 0.14, 'sawtooth', 0.08);
  if (life <= 0){ life = 0; updateHud(); endGame(true); return; }
  updateHud();
}

function missNote(n){
  if (state !== 'play') return;
  n.done = true;
  counts.miss++;
  combo = 0;
  life -= TUNE.lifeLoss.v;
  shake = 0.28;
  laneJudge[n.lane] = { text: 'MISS', col: '#f87171', t: 0.45 };
  laneFlash[n.lane] = 1;
  beep(150, 0.16, 'sawtooth', 0.09);
  if (life <= 0){ life = 0; updateHud(); endGame(true); return; }
  updateHud();
}

function endGame(isFailed){
  if (state !== 'play') return;
  state = 'result';
  failed = !!isFailed;
  resultT = 4.6;
  var total = counts.perfect + counts.great + counts.miss;
  if (total < 1) total = 1;
  acc = (counts.perfect + counts.great * 0.5) / total;
  if (acc >= 0.93) rank = 'S';
  else if (acc >= 0.82) rank = 'A';
  else if (acc >= 0.66) rank = 'B';
  else rank = 'C';
  if (failed && rank !== 'C') rank = 'B';
  updateHud();
  beep(failed ? 220 : 880, 0.3, 'triangle', 0.10);
}

function finishNow(){
  if (state !== 'result') return;
  state = 'done';
  Game.over(score);
}

/* ---------- update ---------- */
function update(dt){
  now += dt;
  if (shake > 0) shake -= dt;
  var f;
  for (f = 0; f < LANES; f++){
    if (laneFlash[f] > 0) laneFlash[f] = Math.max(0, laneFlash[f] - dt * 3.2);
    if (laneJudge[f]){ laneJudge[f].t -= dt; if (laneJudge[f].t <= 0) laneJudge[f] = null; }
  }
  for (f = particles.length - 1; f >= 0; f--){
    var pa = particles[f];
    pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vy += 430 * dt; pa.life -= dt;
    if (pa.life <= 0) particles.splice(f, 1);
  }

  if (state === 'result'){
    resultT -= dt;
    if (resultT <= 0) finishNow();
    return;
  }
  if (state !== 'play') return;

  songTime += dt;
  beatTick();

  if (feverT > 0){
    feverT -= dt;
    if (feverT <= 0){ feverT = 0; fever = 0; }
  }

  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.done) continue;
    if (n.holding){
      if (laneHeld[n.lane] !== n.holdId){ breakHold(n); if (state !== 'play') break; continue; }
      n.tickT -= dt;
      if (n.tickT <= 0){ n.tickT += 0.12; addPoints(9); }
      if (songTime >= n.t + n.dur - 0.05) completeHold(n);
      continue;
    }
    if (n.t - songTime < -0.13){ missNote(n); if (state !== 'play') break; }
  }

  if (songTime > TUNE.songLen.v + 1.1) endGame(false);
}

/* ---------- input ---------- */
function onDown(x, y, id){
  audioInit();
  if (state === 'result'){ finishNow(); return; }
  if (state !== 'play') return;
  if (y < TOP_Y) return;
  var lane = Math.floor(x / LW);
  if (lane < 0) lane = 0;
  if (lane > LANES - 1) lane = LANES - 1;
  ptrLane[id] = lane;
  ptrStart[id] = x;
  ptrFlicked[id] = false;
  laneHeld[lane] = id;
  laneFlash[lane] = 1;
  onTapLane(lane, id);
}

function onMove(x, y, id){
  if (state !== 'play') return;
  var lane = ptrLane[id];
  if (lane === undefined) return;
  var st = ptrStart[id];
  if (st === undefined) return;
  var dx = x - st;
  if (dx < 0) dx = -dx;
  if (!ptrFlicked[id] && dx > 30){
    ptrFlicked[id] = true;
    flickJudge(lane);
  }
}

function onUp(x, y, id){
  var lane = ptrLane[id];
  if (lane === undefined) return;
  if (laneHeld[lane] === id) laneHeld[lane] = -1;
  delete ptrLane[id];
  delete ptrStart[id];
  delete ptrFlicked[id];
}

/* ---------- draw ---------- */
function rr(x, y, w, h, r){
  if (w < r * 2) r = w / 2;
  if (h < r * 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawResults(){
  ctx.fillStyle = 'rgba(4,6,16,0.90)';
  ctx.fillRect(0, TOP_Y, W, H - TOP_Y);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var cy = 118;
  ctx.font = '800 19px system-ui,sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(failed ? 'ライフが尽きた…' : 'SONG CLEAR!', W / 2, cy);
  cy += 68;
  var rc = rank === 'S' ? '#ffd54a' : rank === 'A' ? '#67e8f9' : rank === 'B' ? '#a3e635' : '#f87171';
  ctx.save();
  ctx.shadowColor = rc;
  ctx.shadowBlur = 30;
  ctx.fillStyle = rc;
  ctx.font = '900 100px system-ui,sans-serif';
  ctx.fillText(rank, W / 2, cy);
  ctx.restore();
  cy += 74;
  ctx.font = '700 16px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('ACCURACY ' + Math.round(acc * 100) + '%', W / 2, cy);
  cy += 48;
  var rows = [['PERFECT', counts.perfect, '#67e8f9'], ['GREAT', counts.great, '#a3e635'], ['MISS', counts.miss, '#f87171']];
  ctx.font = '700 18px system-ui,sans-serif';
  for (var i = 0; i < rows.length; i++){
    ctx.textAlign = 'left';
    ctx.fillStyle = rows[i][2];
    ctx.fillText(rows[i][0], 86, cy + i * 34);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(String(rows[i][1]), 394, cy + i * 34);
  }
  cy += 3 * 34 + 24;
  ctx.textAlign = 'center';
  ctx.font = '700 18px system-ui,sans-serif';
  ctx.fillStyle = '#c7d2fe';
  ctx.fillText('MAX COMBO  ' + maxCombo, W / 2, cy);
  cy += 62;
  ctx.font = '600 15px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('タップで終了', W / 2, cy);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function draw(){
  var stage = Math.floor(maxCombo / 50) + (feverT > 0 ? 1 : 0);
  var hue = (205 + stage * 44) % 360;
  if (feverT > 0) hue = (hue + Math.sin(now * 12) * 22 + 360) % 360;

  ctx.fillStyle = '#05070f';
  ctx.fillRect(0, 0, W, H);
  var g = ctx.createLinearGradient(0, TOP_Y, 0, H);
  g.addColorStop(0, 'hsl(' + hue + ',45%,9%)');
  g.addColorStop(0.6, 'hsl(' + ((hue + 30) % 360) + ',50%,13%)');
  g.addColorStop(1, 'hsl(' + ((hue + 60) % 360) + ',60%,19%)');
  ctx.fillStyle = g;
  ctx.fillRect(0, TOP_Y, W, H - TOP_Y);

  var ox = shake > 0 ? (Math.random() * 8 - 4) : 0;
  ctx.save();
  ctx.translate(ox, 0);

  var i;
  for (i = 0; i < LANES; i++){
    ctx.globalAlpha = 0.09 + laneFlash[i] * 0.30;
    ctx.fillStyle = LANE_COL[i];
    ctx.fillRect(i * LW + 2, TOP_Y, LW - 4, JUDGE_Y - TOP_Y + 24);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 2;
  for (i = 1; i < LANES; i++){
    ctx.beginPath();
    ctx.moveTo(i * LW, TOP_Y);
    ctx.lineTo(i * LW, H);
    ctx.stroke();
  }

  if (combo >= 2){
    var cs = Math.round(44 + Math.min(combo, 60) * 0.55);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.92;
    ctx.shadowColor = feverT > 0 ? '#ffd54a' : LANE_COL[0];
    ctx.shadowBlur = 24;
    ctx.fillStyle = feverT > 0 ? '#fff3c4' : '#ffffff';
    ctx.font = '900 ' + cs + 'px system-ui,sans-serif';
    ctx.fillText(String(combo), W / 2, 205);
    ctx.shadowBlur = 0;
    ctx.font = '700 16px system-ui,sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.70)';
    ctx.fillText('COMBO', W / 2, 205 + cs * 0.60);
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, TOP_Y, W, H - TOP_Y);
  ctx.clip();

  for (i = 0; i < notes.length; i++){
    var n = notes[i];
    if (n.done) continue;
    var cx = n.lane * LW + LW / 2;
    var col = LANE_COL[n.lane];
    var yh = JUDGE_Y - (n.t - songTime) * speed;
    if (n.holding) yh = JUDGE_Y;
    if (n.type === 'hold' && n.dur > 0){
      var yt = JUDGE_Y - (n.t + n.dur - songTime) * speed;
      if (yt > JUDGE_Y) yt = JUDGE_Y;
      var y0 = yt < TOP_Y ? TOP_Y : yt;
      var y1 = yh > H ? H : yh;
      if (y1 > y0){
        ctx.globalAlpha = n.holding ? 0.9 : 0.55;
        ctx.fillStyle = col;
        ctx.fillRect(cx - 11, y0, 22, y1 - y0);
        ctx.globalAlpha = 1;
      }
    }
    if (yh < TOP_Y - 26 || yh > H + 26) continue;
    if (n.type === 'gold'){
      ctx.save();
      ctx.shadowColor = '#ffd54a';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#ffd54a';
      ctx.beginPath();
      ctx.arc(cx, yh, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = "20px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('✨', cx, yh);
    } else {
      var hh = n.type === 'hold' ? 24 : 20;
      var hw = LW - 22;
      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur = 14;
      ctx.fillStyle = col;
      rr(cx - hw / 2, yh - hh / 2, hw, hh, 10);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.80)';
      rr(cx - hw / 2 + 6, yh - hh / 2 + 5, hw - 12, hh - 10, 6);
      ctx.fill();
      if (n.type === 'hold'){
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = "14px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
        ctx.fillText('🎵', cx, yh);
      }
    }
  }

  for (i = 0; i < particles.length; i++){
    var pa = particles[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, pa.life));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = pa.sz + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(pa.ch, pa.x, pa.y);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.save();
  ctx.shadowColor = feverT > 0 ? '#ffd54a' : '#ffffff';
  ctx.shadowBlur = 16;
  ctx.strokeStyle = feverT > 0 ? 'rgba(255,213,74,0.95)' : 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, JUDGE_Y);
  ctx.lineTo(W, JUDGE_Y);
  ctx.stroke();
  ctx.restore();

  for (i = 0; i < LANES; i++){
    var px = i * LW;
    var fl = laneFlash[i];
    ctx.globalAlpha = 0.10 + fl * 0.55;
    ctx.fillStyle = LANE_COL[i];
    rr(px + 6, PAD_Y + 6, LW - 12, 58, 12);
    ctx.fill();
    ctx.globalAlpha = 0.45 + fl * 0.55;
    ctx.strokeStyle = LANE_COL[i];
    ctx.lineWidth = 2;
    rr(px + 6, PAD_Y + 6, LW - 12, 58, 12);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "22px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(LANE_EMO[i], px + LW / 2, PAD_Y + 35);
  }

  for (i = 0; i < LANES; i++){
    var lj = laneJudge[i];
    if (!lj) continue;
    ctx.globalAlpha = Math.max(0, Math.min(1, lj.t * 3.5));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 19px system-ui,sans-serif';
    ctx.fillStyle = lj.col;
    ctx.fillText(lj.text, i * LW + LW / 2, JUDGE_Y - 56);
    ctx.globalAlpha = 1;
  }

  var fx = 26, fy = 610, fw = W - 52, fh = 12;
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  rr(fx, fy, fw, fh, 6);
  ctx.fill();
  var fv = feverT > 0 ? feverT / 10 : fever / 100;
  if (fv > 0.005){
    var fg = ctx.createLinearGradient(fx, 0, fx + fw, 0);
    if (feverT > 0){ fg.addColorStop(0, '#ffd54a'); fg.addColorStop(1, '#ff7a00'); }
    else { fg.addColorStop(0, '#38bdf8'); fg.addColorStop(1, '#a78bfa'); }
    ctx.fillStyle = fg;
    ctx.save();
    if (feverT > 0){ ctx.shadowColor = '#ffd54a'; ctx.shadowBlur = 14; }
    rr(fx, fy, Math.max(8, fw * fv), fh, 6);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();

  if (state === 'result') drawResults();
}

/*__VAPPA_JS_END__*/
</script>
