<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="円";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  dayLength:   { v: 90,   label: '1日の長さ(秒)',     min: 45,   max: 150,  step: 5 },
  beltSpeed:   { v: 100,  label: 'レーンの速さ',       min: 40,   max: 180,  step: 5 },
  patience:    { v: 14,   label: '基本の待ち時間(秒)', min: 6,    max: 30,   step: 1 },
  spawnBase:   { v: 4.0,  label: '来店ペース(秒)',     min: 1.5,  max: 8,    step: 0.2 },
  restockCost: { v: 300,  label: '仕入れ費用(円)',     min: 0,    max: 1000, step: 50 },
  restockQty:  { v: 4,    label: '仕入れ数(各ネタ)',   min: 1,    max: 10,   step: 1 },
  repGain:     { v: 0.18, label: '評価アップ量',       min: 0.05, max: 0.5,  step: 0.01 },
  repLoss:     { v: 0.6,  label: '評価ダウン量',       min: 0.2,  max: 1.5,  step: 0.1 }
};

var NETA = [
  { name: 'マグロ',   emo: '🐟', price: 160 },
  { name: 'サーモン', emo: '🐠', price: 130 },
  { name: 'エビ',     emo: '🦐', price: 110 },
  { name: 'たまご',   emo: '🥚', price: 90  },
  { name: 'イカ',     emo: '🦑', price: 120 },
  { name: 'ウニ',     emo: '🦔', price: 420 },
  { name: '大トロ',   emo: '🥩', price: 520 }
];
var UNLOCK_REP = [0, 0, 0, 0, 0, 4.0, 4.5];
var TYPE = {
  normal: { emo: '👨', pat: 1.0,  pay: 1.0,  need: 1 },
  salary: { emo: '👔', pat: 0.55, pay: 1.15, need: 1 },
  sumo:   { emo: '🥋', pat: 1.5,  pay: 1.0,  need: 3 },
  vip:    { emo: '🎩', pat: 1.15, pay: 2.0,  need: 1 }
};
var NORM_EMO = ['👨', '👩', '👴', '👵', '🧒'];
var DELIV_TIME = 5, TEA_CD = 6, VIP_TIP = 200;
var BUBBLE_Y = 86, BAR_Y = 140, CUST_Y = 172;
var COUNTER_Y = 200, BELT_Y = 236, BELT_H = 104, SUSHI_Y = 290;
var INFO_Y = 348, BTN_Y = 442, BTN_H = 76;

var seats, belt, stock, unlockedMax, wallet, sales, rep, elapsed, discards;
var spawnT, teaCD, delivT, delivOn, parts, shake, ended, endT, rushOn, lastHud, netaRects;

function efont(s){ return s + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; }
function bfont(s){ return 'bold ' + s + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif"; }

function rrect(x, y, w, h, r){
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function layout(){
  netaRects = [];
  var m = 12, gap = 7, n = 7;
  var cw = (480 - m * 2 - gap * (n - 1)) / n;
  for (var i = 0; i < n; i++){
    netaRects.push({ x: m + i * (cw + gap), y: 560, w: cw, h: 136 });
  }
}

function init(){
  seats = [null, null, null, null, null];
  belt = [];
  stock = [4, 4, 4, 4, 4, 0, 0];
  unlockedMax = 5;
  wallet = 1200;
  sales = 0;
  rep = 3.0;
  elapsed = 0;
  discards = 0;
  spawnT = 0.4;
  teaCD = 0;
  delivT = 0;
  delivOn = false;
  parts = [];
  shake = 0;
  ended = false;
  endT = 0;
  rushOn = false;
  lastHud = '';
  layout();
  Game.score(0);
  Game.hud('⭐3.0 ⏱' + TUNE.dayLength.v);
}

function onResize(){ layout(); }

function countFree(){ var n = 0; for (var i = 0; i < 5; i++){ if (!seats[i]) n++; } return n; }
function countCust(){ return 5 - countFree(); }
function seatX(i){ return 48 + i * 96; }

function addPart(x, y, emo, size, life, vy){
  parts.push({ x: x, y: y, vx: (Math.random() - 0.5) * 30, vy: vy, life: life, max: life, emo: emo, size: size });
}

function stepParts(dt){
  for (var i = parts.length - 1; i >= 0; i--){
    var p = parts[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy *= 0.96;
    if (p.life <= 0) parts.splice(i, 1);
  }
}

function updateHud(){
  var t = Math.max(0, Math.ceil(TUNE.dayLength.v - elapsed));
  var s = '⭐' + rep.toFixed(1) + ' ⏱' + t;
  if (s !== lastHud){ lastHud = s; Game.hud(s); }
}

function spawnInterval(){
  var D = TUNE.dayLength.v;
  var p = elapsed / D;
  var iv = TUNE.spawnBase.v * (1 - 0.45 * p);
  if (countCust() < 2) iv *= 0.45;
  if (rushOn) iv *= 0.35;
  return iv * (0.8 + Math.random() * 0.4);
}

function trySpawn(){
  var free = [];
  for (var i = 0; i < 5; i++){ if (!seats[i]) free.push(i); }
  if (free.length === 0) return;
  var seat = free[Math.floor(Math.random() * free.length)];
  var p = elapsed / TUNE.dayLength.v;
  var roll = Math.random();
  var type = 'normal';
  if (unlockedMax >= 6 && roll < 0.10) type = 'vip';
  else if (p > 0.15 && roll < 0.38) type = 'salary';
  else if (p > 0.10 && roll < 0.56) type = 'sumo';
  var t = TYPE[type];
  var want;
  if (type === 'vip'){
    var pool = [];
    for (var k = 5; k < unlockedMax; k++) pool.push(k);
    want = pool[Math.floor(Math.random() * pool.length)];
  } else {
    want = Math.floor(Math.random() * unlockedMax);
  }
  var pat = TUNE.patience.v * t.pat * (1 - 0.25 * p) * (0.85 + Math.random() * 0.3);
  if (pat < 3) pat = 3;
  var emo = t.emo;
  if (type === 'normal') emo = NORM_EMO[Math.floor(Math.random() * NORM_EMO.length)];
  seats[seat] = { type: type, emo: emo, want: want, need: t.need, eaten: 0, patience: pat, maxP: pat, state: 'wait', joyT: 0 };
  addPart(seatX(seat), 200, '✨', 22, 0.5, -50);
}

function leaveAngry(s){
  var c = seats[s];
  if (!c) return;
  var x = seatX(s);
  seats[s] = null;
  rep -= TUNE.repLoss.v;
  if (rep < 0) rep = 0;
  shake = 0.5;
  addPart(x, 170, '💨', 30, 0.8, -55);
  Game.float(x, 152, '😡', '#f87171');
  updateHud();
  if (rep <= 0) endDay('評価0で閉店… ');
}

function eatCheck(){
  for (var i = belt.length - 1; i >= 0; i--){
    var it = belt[i];
    for (var s = 0; s < 5; s++){
      var c = seats[s];
      if (!c || c.state !== 'wait') continue;
      if (c.want !== it.neta) continue;
      var sx = seatX(s);
      if (Math.abs(it.x - sx) > 26) continue;
      belt.splice(i, 1);
      var pay = Math.round(NETA[it.neta].price * TYPE[c.type].pay);
      sales += pay;
      wallet += pay;
      Game.score(Math.floor(sales));
      Game.float(sx, 208, '+' + pay, '#fcd34d');
      addPart(sx, 166, '❤️', 22, 0.7, -60);
      c.eaten++;
      if (c.eaten >= c.need){
        rep = Math.min(5, rep + TUNE.repGain.v);
        if (c.type === 'vip'){
          sales += VIP_TIP;
          wallet += VIP_TIP;
          Game.score(Math.floor(sales));
          Game.float(sx, 232, 'チップ+' + VIP_TIP, '#fbbf24');
        }
        c.state = 'joy';
        c.joyT = 0.7;
        addPart(sx, 172, '💖', 28, 0.9, -70);
        updateHud();
      }
      break;
    }
  }
}

function endDay(reason){
  if (ended) return;
  ended = true;
  endT = 1.3;
  Game.score(Math.floor(sales));
  Game.toast(reason + '本日の売上 ¥' + Math.floor(sales) + ' ／ 廃棄' + discards + '皿 ／ 評価⭐' + rep.toFixed(1));
}

function update(dt){
  if (ended){
    stepParts(dt);
    if (shake > 0) shake -= dt * 2;
    if (endT > 0){
      endT -= dt;
      if (endT <= 0){ endT = 0; Game.over(Math.floor(sales)); }
    }
    return;
  }

  var D = TUNE.dayLength.v;
  elapsed += dt;
  if (elapsed >= D){ elapsed = D; endDay('閉店！ '); return; }

  rushOn = (elapsed >= D * 0.22 && elapsed < D * 0.44) || (elapsed >= D * 0.55 && elapsed < D * 0.78);

  if (teaCD > 0) teaCD -= dt;

  if (delivOn){
    delivT -= dt;
    if (delivT <= 0){
      delivOn = false;
      delivT = 0;
      for (var i = 0; i < unlockedMax; i++) stock[i] += TUNE.restockQty.v;
      Game.toast('🚚 仕入れ完了！');
    }
  }

  spawnT -= dt;
  if (spawnT <= 0){
    if (countFree() > 0){ trySpawn(); spawnT = spawnInterval(); }
    else spawnT = 1.0;
  }

  for (var s = 0; s < 5; s++){
    var c = seats[s];
    if (!c) continue;
    if (c.state === 'joy'){
      c.joyT -= dt;
      if (c.joyT <= 0) seats[s] = null;
      continue;
    }
    c.patience -= dt;
    if (c.patience <= 0){ leaveAngry(s); if (ended) return; }
  }

  var sp = TUNE.beltSpeed.v;
  for (var b = belt.length - 1; b >= 0; b--){
    var it = belt[b];
    it.x += sp * dt;
    if (it.x > 500){
      if (!it.wrap){ it.x -= 520; it.wrap = true; }
      else { belt.splice(b, 1); discards++; }
    }
  }

  eatCheck();
  if (ended) return;

  if (unlockedMax === 5 && rep >= UNLOCK_REP[5]){
    unlockedMax = 6;
    stock[5] += 3;
    Game.toast('新ネタ「ウニ」解禁！⭐4.0');
    addPart(240, 210, '✨', 36, 1.0, -60);
  } else if (unlockedMax === 6 && rep >= UNLOCK_REP[6]){
    unlockedMax = 7;
    stock[6] += 3;
    Game.toast('新ネタ「大トロ」解禁！⭐4.5');
    addPart(240, 210, '✨', 36, 1.0, -60);
  }

  stepParts(dt);
  if (shake > 0) shake -= dt * 2;
  updateHud();
}

function drawNoren(){
  ctx.fillStyle = '#9f1239';
  ctx.fillRect(0, 56, W, 32);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  for (var i = 1; i < 6; i++) ctx.fillRect(i * 80 - 1, 56, 3, 32);
  ctx.fillStyle = '#fff1f2';
  ctx.font = bfont(18);
  ctx.fillText('🏮 回転ずし 匠 🏮', 240, 73);
}

function drawCounter(){
  var g = ctx.createLinearGradient(0, COUNTER_Y, 0, COUNTER_Y + 34);
  g.addColorStop(0, '#c98a4b');
  g.addColorStop(1, '#8b5a2b');
  ctx.fillStyle = g;
  ctx.fillRect(0, COUNTER_Y, W, 34);
  ctx.fillStyle = '#5c3a1a';
  ctx.fillRect(0, COUNTER_Y + 30, W, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(0, COUNTER_Y, W, 3);
}

function drawBelt(){
  ctx.fillStyle = '#3a3a42';
  ctx.fillRect(0, BELT_Y, W, BELT_H);
  var off = (elapsed * TUNE.beltSpeed.v * 0.7) % 60;
  ctx.fillStyle = rushOn ? 'rgba(249,115,22,0.35)' : 'rgba(255,255,255,0.07)';
  for (var x = -80 + off; x < W + 80; x += 60){
    ctx.beginPath();
    ctx.moveTo(x, BELT_Y);
    ctx.lineTo(x + 22, BELT_Y);
    ctx.lineTo(x + 4, BELT_Y + BELT_H);
    ctx.lineTo(x - 18, BELT_Y + BELT_H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#52525b';
  ctx.fillRect(0, BELT_Y, W, 6);
  ctx.fillStyle = '#27272a';
  ctx.fillRect(0, BELT_Y + BELT_H - 6, W, 6);
}

function drawCustomers(){
  for (var s = 0; s < 5; s++){
    var c = seats[s];
    if (!c) continue;
    var x = seatX(s);

    if (c.state === 'wait'){
      ctx.fillStyle = 'rgba(255,252,245,0.95)';
      rrect(x - 27, BUBBLE_Y, 54, 42, 10);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - 7, BUBBLE_Y + 40);
      ctx.lineTo(x + 7, BUBBLE_Y + 40);
      ctx.lineTo(x, BUBBLE_Y + 52);
      ctx.closePath();
      ctx.fill();

      ctx.font = efont(26);
      ctx.fillText(NETA[c.want].emo, x, BUBBLE_Y + 21);

      if (c.need > 1){
        ctx.fillStyle = '#dc2626';
        ctx.font = bfont(13);
        ctx.fillText('×' + c.need, x + 20, BUBBLE_Y + 34);
      }

      var ratio = c.patience / c.maxP;
      if (ratio > 1) ratio = 1;
      if (ratio < 0) ratio = 0;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      rrect(x - 28, BAR_Y, 56, 8, 4);
      ctx.fill();
      ctx.fillStyle = ratio > 0.5 ? '#4ade80' : (ratio > 0.25 ? '#fbbf24' : '#f87171');
      if (ratio > 0.02){
        rrect(x - 28, BAR_Y, 56 * ratio, 8, 4);
        ctx.fill();
      }
    }

    ctx.font = efont(42);
    ctx.fillText(c.emo, x, CUST_Y);
  }
}

function drawSushi(){
  for (var i = 0; i < belt.length; i++){
    var it = belt[i];
    if (it.x < -40 || it.x > 520) continue;
    ctx.fillStyle = 'rgba(203,213,225,0.85)';
    ctx.beginPath();
    ctx.ellipse(it.x, SUSHI_Y + 14, 24, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fafaf9';
    rrect(it.x - 15, SUSHI_Y + 2, 30, 13, 6);
    ctx.fill();
    ctx.font = efont(26);
    ctx.fillText(NETA[it.neta].emo, it.x, SUSHI_Y - 8);
  }
}

function drawParts(){
  for (var i = 0; i < parts.length; i++){
    var p = parts[i];
    var a = p.life / p.max;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    ctx.globalAlpha = a;
    ctx.font = efont(p.size);
    ctx.fillText(p.emo, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawInfo(){
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  rrect(12, INFO_Y, 456, 84, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.textAlign = 'left';
  ctx.fillStyle = '#fcd34d';
  ctx.font = bfont(17);
  ctx.fillText('資金 ¥' + wallet, 32, INFO_Y + 28);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#a8a29e';
  ctx.font = efont(16);
  ctx.fillText('廃棄 ' + discards + '皿', 448, INFO_Y + 28);

  ctx.textAlign = 'center';
  if (rushOn){
    var a = 0.6 + 0.4 * Math.sin(elapsed * 9);
    ctx.fillStyle = 'rgba(249,115,22,' + a.toFixed(2) + ')';
    ctx.font = bfont(19);
    ctx.fillText('🏮 ラッシュタイム！ 🏮', 240, INFO_Y + 62);
  } else {
    ctx.fillStyle = '#78716c';
    ctx.font = efont(16);
    ctx.fillText('通常営業中…', 240, INFO_Y + 62);
  }
  ctx.textAlign = 'center';
}

function drawButtons(){
  var canBuy = !delivOn && wallet >= TUNE.restockCost.v;
  ctx.fillStyle = canBuy ? '#9a3412' : '#3f3f46';
  rrect(12, BTN_Y, 224, BTN_H, 14);
  ctx.fill();
  ctx.strokeStyle = canBuy ? '#fb923c' : '#52525b';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = canBuy ? '#fff7ed' : '#a1a1aa';
  ctx.font = bfont(19);
  if (delivOn){
    ctx.fillText('🚚 お届け中…', 124, BTN_Y + 26);
    var pr = 1 - delivT / DELIV_TIME;
    if (pr < 0) pr = 0;
    if (pr > 1) pr = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    rrect(36, BTN_Y + 48, 176, 14, 7);
    ctx.fill();
    if (pr > 0.02){
      ctx.fillStyle = '#4ade80';
      rrect(36, BTN_Y + 48, 176 * pr, 14, 7);
      ctx.fill();
    }
  } else {
    ctx.fillText('🚚 仕入れ ¥' + TUNE.restockCost.v, 124, BTN_Y + 38);
  }

  var teaOk = teaCD <= 0;
  ctx.fillStyle = teaOk ? '#166534' : '#3f3f46';
  rrect(244, BTN_Y, 224, BTN_H, 14);
  ctx.fill();
  ctx.strokeStyle = teaOk ? '#4ade80' : '#52525b';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = teaOk ? '#f0fdf4' : '#a1a1aa';
  ctx.font = bfont(19);
  if (teaOk) ctx.fillText('🍵 お茶を出す', 356, BTN_Y + 38);
  else ctx.fillText('🍵 あと' + teaCD.toFixed(1) + '秒', 356, BTN_Y + 38);
  ctx.textAlign = 'center';
}

function drawNetaButtons(){
  ctx.textAlign = 'center';
  for (var i = 0; i < 7; i++){
    var r = netaRects[i];
    var cx = r.x + r.w / 2;
    var unlocked = i < unlockedMax;
    var have = stock[i];

    if (!unlocked){
      ctx.fillStyle = '#26262c';
      rrect(r.x, r.y, r.w, r.h, 12);
      ctx.fill();
      ctx.strokeStyle = '#3f3f46';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#ffffff';
      ctx.font = efont(28);
      ctx.fillText(NETA[i].emo, cx, r.y + 40);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#71717a';
      ctx.font = bfont(14);
      ctx.fillText('ロック', cx, r.y + 78);
      ctx.fillStyle = '#fbbf24';
      ctx.fillText('⭐' + UNLOCK_REP[i].toFixed(1), cx, r.y + 106);
      continue;
    }

    ctx.fillStyle = have > 0 ? '#2c2418' : '#3a1c1c';
    rrect(r.x, r.y, r.w, r.h, 12);
    ctx.fill();
    ctx.strokeStyle = have > 0 ? '#b45309' : '#7f1d1d';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (have <= 0) ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#ffffff';
    ctx.font = efont(30);
    ctx.fillText(NETA[i].emo, cx, r.y + 40);
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#e7e5e4';
    ctx.font = bfont(14);
    ctx.fillText(NETA[i].name, cx, r.y + 76);

    ctx.fillStyle = have > 0 ? '#4ade80' : '#f87171';
    ctx.font = bfont(18);
    ctx.fillText('×' + have, cx, r.y + 100);

    ctx.fillStyle = '#d6d3d1';
    ctx.font = efont(14);
    ctx.fillText('¥' + NETA[i].price, cx, r.y + 122);
  }
  ctx.textAlign = 'center';
}

function draw(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#150f0c';
  ctx.fillRect(0, 0, W, H);

  var ox = 0;
  if (shake > 0) ox = (Math.random() * 2 - 1) * shake * 12;

  ctx.save();
  ctx.translate(ox, 0);

  var g = ctx.createLinearGradient(0, 56, 0, 240);
  g.addColorStop(0, '#3b2417');
  g.addColorStop(1, '#241610');
  ctx.fillStyle = g;
  ctx.fillRect(0, 56, W, 184);

  drawNoren();
  drawCounter();
  drawBelt();
  drawSushi();
  drawCustomers();
  drawParts();

  ctx.restore();

  drawInfo();
  drawButtons();
  drawNetaButtons();

  if (rushOn){
    var a2 = 0.35 + 0.25 * Math.sin(elapsed * 10);
    ctx.strokeStyle = 'rgba(249,115,22,' + a2.toFixed(2) + ')';
    ctx.lineWidth = 8;
    ctx.strokeRect(4, BELT_Y - 4, W - 8, BELT_H + 8);
  }
}

function tapNeta(i){
  if (i >= unlockedMax){ Game.toast('評価⭐' + UNLOCK_REP[i].toFixed(1) + 'で解禁！'); return; }
  if (stock[i] <= 0){ Game.toast(NETA[i].name + 'の在庫切れ！仕入れよう'); return; }
  stock[i]--;
  var nx = -20;
  if (belt.length > 0){
    var last = belt[belt.length - 1];
    if (last.x < 0) nx = Math.min(-20, last.x - 36);
  }
  belt.push({ x: nx, neta: i, wrap: false });
}

function doRestock(){
  if (delivOn){ Game.toast('仕入れは配送中…'); return; }
  var cost = TUNE.restockCost.v;
  if (wallet < cost){ Game.toast('資金が足りない…'); return; }
  wallet -= cost;
  delivOn = true;
  delivT = DELIV_TIME;
  Game.toast('仕入れを発注（5秒で到着）');
}

function doTea(){
  if (teaCD > 0) return;
  var any = false;
  for (var i = 0; i < 5; i++){
    var c = seats[i];
    if (c && c.state === 'wait'){
      c.patience = Math.min(c.maxP + 5, c.patience + 5);
      addPart(seatX(i), 176, '🍵', 20, 0.8, -50);
      any = true;
    }
  }
  if (any){
    teaCD = TEA_CD;
    Game.toast('お茶でごきげん！待ち時間アップ');
  } else {
    Game.toast('お客さんがいない…');
  }
}

function onDown(x, y){
  if (ended) return;
  for (var i = 0; i < 7; i++){
    var r = netaRects[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h){ tapNeta(i); return; }
  }
  if (x >= 12 && x <= 236 && y >= BTN_Y && y <= BTN_Y + BTN_H){ doRestock(); return; }
  if (x >= 244 && x <= 468 && y >= BTN_Y && y <= BTN_Y + BTN_H){ doTea(); return; }
}

</script>
