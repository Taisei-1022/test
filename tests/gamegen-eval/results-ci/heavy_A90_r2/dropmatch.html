<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}

.vp-ov h1{font-size:28px}

.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  fallInterval: { v: 0.85, label: '落下の速さ(秒/マス)', min: 0.15, max: 2, step: 0.05 },
  speedPerLevel: { v: 0.82, label: 'レベル毎の加速率', min: 0.5, max: 0.98, step: 0.02 },
  levelStep: { v: 400, label: 'レベルアップ点数', min: 100, max: 2000, step: 50 },
  ojamaInterval: { v: 14, label: '焦げごはんの間隔(秒)', min: 4, max: 40, step: 1 },
  noriRate: { v: 0.09, label: 'のりの出現率', min: 0, max: 0.3, step: 0.01 },
  startColors: { v: 3, label: '最初の具の種類', min: 3, max: 5, step: 1 },
  maxColors: { v: 5, label: '最大の具の種類', min: 3, max: 5, step: 1 }
};
var COLS = 6, ROWS = 12, CELL = 52, BX = 14, BY = 68, SBX = 402;
var OJAMA = 6, NORI = 10;
var EMO = ['', '🔴', '🟠', '🟤', '⚪', '🟫'];
var BASEC = ['', '#c0304f', '#e07a2c', '#3f6b2a', '#9fb0c4', '#7a4a1e'];
var sprites = {}, bgCanvas = null;
var grid, piece, nextQ, score, level, fallT, ojamaT, particles, shake, slowT;
var popupT, popupTxt, popupSub, dead, ptrs, holdT, tAcc;

function init(){
  grid = [];
  for (var r = 0; r < ROWS; r++){
    var row = [];
    for (var c = 0; c < COLS; c++) row.push(0);
    grid.push(row);
  }
  score = 0; level = 1; fallT = 0;
  ojamaT = TUNE.ojamaInterval.v * 0.75;
  particles = []; shake = 0; slowT = 0;
  popupT = 0; popupTxt = ''; popupSub = '';
  dead = false; ptrs = {}; holdT = 0; tAcc = 0;
  piece = null; nextQ = [];
  buildBG();
  buildSprites();
  for (var i = 0; i < 2; i++) nextQ.push(makePair());
  spawnPiece();
  Game.score(0);
  Game.hud('Lv.1');
}

function shade(hex, amt){
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, r + amt));
  g = Math.max(0, Math.min(255, g + amt));
  b = Math.max(0, Math.min(255, b + amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function orbKey(val){
  if (val >= NORI) return 'n' + (val - NORI);
  return 'v' + val;
}

function drawOrbInto(g, S, val){
  var cx = S / 2, cy = S / 2, R = S * 0.44;
  var base = '#888';
  if (val === OJAMA) base = '#4a4038';
  else if (val >= NORI) base = '#2f8f3e';
  else base = BASEC[val] || '#888';
  g.fillStyle = 'rgba(0,0,0,0.4)';
  g.beginPath(); g.arc(cx, cy + S * 0.04, R, 0, 6.2832); g.fill();
  var gr = g.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.08, cx, cy, R * 1.08);
  gr.addColorStop(0, shade(base, 55));
  gr.addColorStop(0.55, base);
  gr.addColorStop(1, shade(base, -55));
  g.fillStyle = gr;
  g.beginPath(); g.arc(cx, cy, R, 0, 6.2832); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.30)';
  g.lineWidth = S * 0.022;
  g.beginPath(); g.arc(cx, cy, R * 0.94, 0, 6.2832); g.stroke();
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = Math.round(S * 0.60) + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  var em = '⚪';
  if (val === OJAMA) em = '⬛';
  else if (val >= NORI) em = '🟩';
  else em = EMO[val] || '⚪';
  g.fillText(em, cx, cy + S * 0.02);
  if (val >= NORI){
    g.fillStyle = BASEC[val - NORI] || '#ffffff';
    g.beginPath(); g.arc(cx + R * 0.58, cy - R * 0.58, R * 0.30, 0, 6.2832); g.fill();
    g.strokeStyle = '#ffffff'; g.lineWidth = S * 0.018; g.stroke();
  }
}

function buildSprites(){
  var vals = [1, 2, 3, 4, 5, OJAMA, NORI + 1, NORI + 2, NORI + 3, NORI + 4, NORI + 5];
  for (var i = 0; i < vals.length; i++){
    var v = vals[i];
    var k = orbKey(v);
    if (sprites[k]) continue;
    var S = CELL * 2;
    var oc = document.createElement('canvas');
    oc.width = S; oc.height = S;
    drawOrbInto(oc.getContext('2d'), S, v);
    sprites[k] = oc;
  }
}

function drawSprite(cx, cy, val, size){
  var s = sprites[orbKey(val)];
  if (!s) return;
  ctx.drawImage(s, cx - size / 2, cy - size / 2, size, size);
}

function buildBG(){
  if (bgCanvas) return;
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W; bgCanvas.height = H;
  var g = bgCanvas.getContext('2d');
  var grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#171d33');
  grad.addColorStop(0.5, '#121728');
  grad.addColorStop(1, '#0b0e1a');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  var R = 46;
  g.strokeStyle = 'rgba(130,160,230,0.085)';
  g.lineWidth = 1.5;
  var rows = Math.ceil(H / (R / 2)) + 2;
  for (var row = -1; row < rows; row++){
    for (var col = -1; col * R < W + R; col++){
      var cx = col * R + (((row % 2) + 2) % 2 ? R / 2 : 0);
      var cy = row * R / 2;
      for (var k = 1; k <= 3; k++){
        g.beginPath();
        g.arc(cx, cy, R * k / 3, Math.PI, Math.PI * 2);
        g.stroke();
      }
    }
  }
  g.strokeStyle = 'rgba(230,200,130,0.10)';
  g.lineWidth = 2;
  for (var yy = 56; yy < H; yy += 52){
    g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy); g.stroke();
  }
  var vg = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}

function randColor(){
  var n = Math.min(TUNE.maxColors.v, TUNE.startColors.v + level - 1);
  if (n < 3) n = 3;
  return 1 + Math.floor(Math.random() * n);
}

function makePair(){
  var a = randColor(), b = randColor();
  var res = [a, b];
  if (Math.random() < TUNE.noriRate.v){
    var k = Math.random() < 0.5 ? 0 : 1;
    res[k] = NORI + res[1 - k];
  }
  return res;
}

function orbPos(r, c, state, idx){
  if (idx === 0) return { r: r, c: c };
  if (state === 0) return { r: r - 1, c: c };
  if (state === 1) return { r: r, c: c + 1 };
  if (state === 2) return { r: r + 1, c: c };
  return { r: r, c: c - 1 };
}

function fits(c, r, state){
  for (var i = 0; i < 2; i++){
    var p = orbPos(r, c, state, i);
    if (p.c < 0 || p.c >= COLS || p.r < 0 || p.r >= ROWS) return false;
    if (grid[p.r][p.c] !== 0) return false;
  }
  return true;
}

function colHasPiece(c){
  if (!piece) return false;
  for (var i = 0; i < 2; i++){
    if (orbPos(piece.r, piece.c, piece.state, i).c === c) return true;
  }
  return false;
}

function curSpeed(){
  var s = TUNE.fallInterval.v * Math.pow(TUNE.speedPerLevel.v, level - 1);
  if (slowT > 0) s *= 2.6;
  return Math.max(0.06, s);
}

function spawnPiece(){
  if (dead) return;
  var pr = nextQ.shift();
  nextQ.push(makePair());
  piece = { c: 2, r: 1, state: 0, colors: pr };
  fallT = 0;
  if (grid[1][2] !== 0 || grid[0][2] !== 0){
    piece = null;
    gameOver();
  }
}

function gameOver(){
  if (dead) return;
  dead = true;
  Game.over(score);
}

function moveSide(d){
  if (!piece || dead) return;
  if (fits(piece.c + d, piece.r, piece.state)) piece.c += d;
}

function rotate(){
  if (!piece || dead) return;
  var ns = (piece.state + 1) % 4;
  if (fits(piece.c, piece.r, ns)){ piece.state = ns; return; }
  if (fits(piece.c - 1, piece.r, ns)){ piece.c -= 1; piece.state = ns; return; }
  if (fits(piece.c + 1, piece.r, ns)){ piece.c += 1; piece.state = ns; return; }
  if (fits(piece.c, piece.r - 1, ns)){ piece.r -= 1; piece.state = ns; }
}

function hardDrop(){
  if (!piece || dead) return;
  var guard = 0;
  while (fits(piece.c, piece.r + 1, piece.state) && guard < 30){ piece.r++; guard++; }
  fallT = 0;
  lockPiece();
}

function lockPiece(){
  if (!piece) return;
  var pc = piece;
  for (var i = 0; i < 2; i++){
    var p = orbPos(pc.r, pc.c, pc.state, i);
    if (p.r >= 0 && p.r < ROWS && p.c >= 0 && p.c < COLS) grid[p.r][p.c] = pc.colors[i];
  }
  piece = null;
  fallT = 0;
  var nset = noriSet();
  settle(nset);
  if (dead) return;
  spawnPiece();
}

function noriSet(){
  var set = null;
  for (var r = 0; r < ROWS; r++){
    for (var c = 0; c < COLS; c++){
      var v = grid[r][c];
      if (v < NORI) continue;
      var target = v - NORI;
      for (var rr = 0; rr < ROWS; rr++){
        if (grid[rr][c] === target){
          if (!set) set = {};
          set[rr + ',' + c] = 1;
        }
      }
      if (!set) set = {};
      set[r + ',' + c] = 1;
      Game.float(BX + c * CELL + CELL / 2, BY + r * CELL - 8, 'のり！', '#7ee08a');
    }
  }
  return set;
}

function findGroupSet(){
  var seen = [];
  for (var r0 = 0; r0 < ROWS; r0++){
    var rw = [];
    for (var c0 = 0; c0 < COLS; c0++) rw.push(false);
    seen.push(rw);
  }
  var set = null;
  for (var r = 0; r < ROWS; r++){
    for (var c = 0; c < COLS; c++){
      var v = grid[r][c];
      if (v < 1 || v > 5 || seen[r][c]) continue;
      var stack = [[r, c]], cells = [];
      seen[r][c] = true;
      while (stack.length){
        var p = stack.pop();
        cells.push(p);
        var nb = [[p[0] - 1, p[1]], [p[0] + 1, p[1]], [p[0], p[1] - 1], [p[0], p[1] + 1]];
        for (var k = 0; k < 4; k++){
          var rr = nb[k][0], cc = nb[k][1];
          if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
          if (seen[rr][cc]) continue;
          if (grid[rr][cc] !== v) continue;
          seen[rr][cc] = true;
          stack.push([rr, cc]);
        }
      }
      if (cells.length >= 3){
        if (!set) set = {};
        for (var m = 0; m < cells.length; m++) set[cells[m][0] + ',' + cells[m][1]] = 1;
      }
    }
  }
  return set;
}

function addOjamaAdjacent(set){
  var add = [];
  for (var key in set){
    var ps = key.split(',');
    var r = parseInt(ps[0], 10), c = parseInt(ps[1], 10);
    var nb = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
    for (var k = 0; k < 4; k++){
      var rr = nb[k][0], cc = nb[k][1];
      if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
      if (grid[rr][cc] === OJAMA && !set[rr + ',' + cc]) add.push(rr + ',' + cc);
    }
  }
  for (var i = 0; i < add.length; i++) set[add[i]] = 1;
}

function applyGravity(){
  for (var c = 0; c < COLS; c++){
    var w = ROWS - 1;
    for (var r = ROWS - 1; r >= 0; r--){
      if (grid[r][c] !== 0){
        if (w !== r){ grid[w][c] = grid[r][c]; grid[r][c] = 0; }
        w--;
      }
    }
  }
}

function settle(initSet){
  var chain = 0, gained = 0, totalCells = 0;
  var sxp = 0, syp = 0, cnp = 0;
  var pend = initSet || null;
  while (true){
    var set = pend;
    pend = null;
    if (!set) set = findGroupSet();
    if (!set) break;
    addOjamaAdjacent(set);
    var cells = [];
    for (var key in set){
      var pp = key.split(',');
      cells.push([parseInt(pp[0], 10), parseInt(pp[1], 10)]);
    }
    if (cells.length === 0) break;
    chain++;
    var mult = Math.pow(2, chain - 1);
    if (mult > 512) mult = 512;
    gained += cells.length * mult;
    totalCells += cells.length;
    for (var i = 0; i < cells.length; i++){
      var rr = cells[i][0], cc = cells[i][1];
      sxp += BX + cc * CELL + CELL / 2;
      syp += BY + rr * CELL + CELL / 2;
      cnp++;
      spawnBurst(BX + cc * CELL + CELL / 2, BY + rr * CELL + CELL / 2);
      grid[rr][cc] = 0;
    }
    applyGravity();
  }
  if (chain > 0){
    score += gained;
    Game.score(score);
    if (totalCells >= 3){
      popupTxt = chain >= 2 ? chain + 'れんさ！' : 'そろった！';
      popupSub = '+' + gained;
      popupT = 1;
      if (cnp > 0) Game.float(sxp / cnp, syp / cnp - 24, '+' + gained, '#ffd166');
    }
    if (chain >= 10){ slowT = 3.5; Game.toast('職人の握り！'); }
    shake = Math.min(0.75, 0.15 + chain * 0.07);
    checkLevel();
  }
}

function checkLevel(){
  var nl = 1 + Math.floor(score / TUNE.levelStep.v);
  if (nl > level){
    level = nl;
    Game.hud('Lv.' + level);
    Game.toast('レベル ' + level + ' ！');
  }
}

function riseOjama(){
  if (dead) return;
  var cols = [];
  for (var c = 0; c < COLS; c++){
    if (grid[0][c] !== 0 || grid[1][c] !== 0) continue;
    if (colHasPiece(c)) continue;
    cols.push(c);
  }
  if (cols.length === 0) return;
  var n = Math.random() < 0.45 ? 2 : 1;
  for (var i = 0; i < n && cols.length > 0; i++){
    var idx = Math.floor(Math.random() * cols.length);
    var cc = cols.splice(idx, 1)[0];
    for (var r = 0; r < ROWS - 1; r++) grid[r][cc] = grid[r + 1][cc];
    grid[ROWS - 1][cc] = OJAMA;
    for (var k = 0; k < 3; k++) spawnBurst(BX + cc * CELL + CELL / 2, BY + (ROWS - 1) * CELL + CELL / 2);
  }
  shake = Math.max(shake, 0.3);
  Game.toast('焦げごはん！');
}

function spawnBurst(x, y){
  if (particles.length > 190) return;
  for (var i = 0; i < 2; i++){
    particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 45, vy: -30 - Math.random() * 45, life: 0.75, max: 0.75, t: 0, r: 6 + Math.random() * 7 });
  }
  particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 95, vy: -60 - Math.random() * 60, life: 0.65, max: 0.65, t: 1, r: 0 });
}

function updateParticles(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t === 0){ p.vy -= 34 * dt; p.vx *= (1 - 1.5 * dt); p.r += 14 * dt; }
    else { p.vy += 130 * dt; }
  }
}

function updateHold(dt){
  var p = null;
  for (var k in ptrs){ if (!ptrs[k].consumed){ p = ptrs[k]; break; } }
  if (!p || !piece || dead){ holdT = 0; return; }
  if (tAcc - p.t < 0.34){ holdT = 0; return; }
  holdT += dt;
  if (holdT >= 0.1){ holdT = 0; moveSide(p.x < W / 2 ? -1 : 1); }
}

function update(dt){
  tAcc += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 2.2);
  if (slowT > 0) slowT = Math.max(0, slowT - dt);
  if (popupT > 0) popupT = Math.max(0, popupT - dt);
  updateParticles(dt);
  if (dead) return;
  updateHold(dt);
  if (!piece) return;
  var spd = curSpeed();
  fallT += dt;
  var guard = 0;
  while (fallT >= spd && guard < 4){
    guard++;
    fallT -= spd;
    if (fits(piece.c, piece.r + 1, piece.state)) piece.r++;
    else { lockPiece(); break; }
    if (!piece || dead) break;
  }
  if (dead || !piece) return;
  ojamaT -= dt;
  if (ojamaT <= 0){ ojamaT = TUNE.ojamaInterval.v; riseOjama(); }
}

function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawBoard(){
  var bw = COLS * CELL, bh = ROWS * CELL;
  var x0 = BX - 6, y0 = BY - 6, w0 = bw + 12, h0 = bh + 12;
  ctx.fillStyle = 'rgba(8,10,20,0.86)';
  rrect(x0, y0, w0, h0, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(232,202,132,0.45)';
  ctx.lineWidth = 2.5;
  rrect(x0, y0, w0, h0, 16); ctx.stroke();
  ctx.strokeStyle = 'rgba(232,202,132,0.14)';
  ctx.lineWidth = 1;
  rrect(x0 + 5, y0 + 5, w0 - 10, h0 - 10, 12); ctx.stroke();
  for (var r = 0; r < ROWS; r++){
    for (var c = 0; c < COLS; c++){
      var x = BX + c * CELL, y = BY + r * CELL;
      ctx.fillStyle = ((r + c) % 2 === 0) ? 'rgba(255,255,255,0.028)' : 'rgba(255,255,255,0.055)';
      ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
    }
  }
  for (var r2 = 0; r2 < ROWS; r2++){
    for (var c2 = 0; c2 < COLS; c2++){
      var v = grid[r2][c2];
      if (v) drawSprite(BX + c2 * CELL + CELL / 2, BY + r2 * CELL + CELL / 2, v, CELL);
    }
  }
}

function drawGhost(){
  if (!piece) return;
  var gr = piece.r;
  var guard = 0;
  while (fits(piece.c, gr + 1, piece.state) && guard < 20){ gr++; guard++; }
  if (gr === piece.r) return;
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.strokeStyle = '#ffe9a8';
  ctx.lineWidth = 2;
  for (var i = 0; i < 2; i++){
    var p = orbPos(gr, piece.c, piece.state, i);
    ctx.beginPath();
    ctx.arc(BX + p.c * CELL + CELL / 2, BY + p.r * CELL + CELL / 2, CELL * 0.42, 0, 6.2832);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPiece(){
  if (!piece) return;
  var off = 0;
  if (fits(piece.c, piece.r + 1, piece.state)){
    var k = fallT / curSpeed();
    if (k > 0.95) k = 0.95;
    if (k < 0) k = 0;
    off = k * 0.9;
  }
  for (var i = 0; i < 2; i++){
    var p = orbPos(piece.r, piece.c, piece.state, i);
    drawSprite(BX + p.c * CELL + CELL / 2, BY + (p.r + off) * CELL + CELL / 2, piece.colors[i], CELL);
  }
}

function drawParticles(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    var a = p.life / p.max;
    if (a < 0) a = 0;
    if (p.t === 0){
      ctx.globalAlpha = a * 0.42;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    } else {
      ctx.globalAlpha = a;
      ctx.font = Math.round(15 + 11 * (1 - a)) + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('✨', p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

function drawSidebar(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(244,224,176,0.92)';
  ctx.font = 'bold 17px sans-serif';
  ctx.fillText('つぎの具', SBX, 84);
  for (var i = 0; i < 2; i++){
    var pr = nextQ[i];
    if (!pr) continue;
    var s = i === 0 ? 44 : 34;
    var y = i === 0 ? 142 : 250;
    ctx.save();
    if (i === 1) ctx.globalAlpha = 0.8;
    drawSprite(SBX, y, pr[1], s);
    drawSprite(SBX, y + s * 0.94, pr[0], s);
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(232,202,132,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(SBX - 52, 300); ctx.lineTo(SBX + 52, 300); ctx.stroke();
  ctx.fillStyle = 'rgba(200,214,240,0.55)';
  ctx.font = '14px sans-serif';
  ctx.fillText('左右タップ', SBX, 560);
  ctx.fillText('で移動', SBX, 582);
  ctx.fillText('↓スワイプ', SBX, 618);
  ctx.fillText('で落下', SBX, 640);
  ctx.fillText('2本指で回転', SBX, 676);
}

function drawPopup(){
  if (popupT <= 0) return;
  var k = 1 - popupT;
  if (k > 1) k = 1;
  var sc = 0.6 + 0.45 * Math.min(1, k * 6);
  var a = Math.min(1, popupT * 3.5);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(BX + COLS * CELL / 2, BY + ROWS * CELL * 0.38);
  ctx.scale(sc, sc);
  ctx.font = 'bold 40px sans-serif';
  ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(18,10,28,0.9)';
  ctx.strokeText(popupTxt, 0, 0);
  ctx.fillStyle = '#ffd166';
  ctx.fillText(popupTxt, 0, 0);
  if (popupSub){
    ctx.font = 'bold 22px sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeText(popupSub, 0, 36);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(popupSub, 0, 36);
  }
  ctx.restore();
}

function draw(){
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);
  else { ctx.fillStyle = '#0f1322'; ctx.fillRect(0, 0, W, H); }
  var ox = 0, oy = 0;
  if (shake > 0.01){
    ox = (Math.random() - 0.5) * shake * 16;
    oy = (Math.random() - 0.5) * shake * 16;
  }
  ctx.save();
  ctx.translate(ox, oy);
  drawBoard();
  drawGhost();
  drawPiece();
  drawParticles();
  if (slowT > 0){
    ctx.fillStyle = 'rgba(255,214,130,' + (0.12 * Math.min(1, slowT)) + ')';
    ctx.fillRect(BX - 6, BY - 6, COLS * CELL + 12, ROWS * CELL + 12);
  }
  ctx.restore();
  drawSidebar();
  drawPopup();
}

function onDown(x, y, id){
  if (dead) return;
  ptrs[id] = { x: x, y: y, sx: x, sy: y, t: tAcc, consumed: false };
  var fresh = 0;
  for (var k in ptrs){ if (!ptrs[k].consumed) fresh++; }
  if (fresh >= 2){
    for (var k2 in ptrs) ptrs[k2].consumed = true;
    rotate();
  }
}

function onMove(x, y, id){
  var p = ptrs[id];
  if (!p) return;
  p.x = x; p.y = y;
  if (p.consumed || dead) return;
  var dy = y - p.sy, dx = x - p.sx;
  if (dy > 48 && dy > Math.abs(dx) * 1.2){
    p.consumed = true;
    hardDrop();
  }
}

function onUp(x, y, id){
  var p = ptrs[id];
  delete ptrs[id];
  if (!p || p.consumed || dead) return;
  if (tAcc - p.t < 0.3) moveSide(p.sx < W / 2 ? -1 : 1);
}

/*__VAPPA_JS_END__*/
