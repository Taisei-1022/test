<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、
   箱ごと実画面へ拡縮する（座標系はゲーム内で常に1つ） */
#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}
#vpdom{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#vpdom *{pointer-events:auto}
.vp-hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;pointer-events:none;z-index:5;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.vp-hud span{background:rgba(8,12,26,.55);border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px 12px}
.vp-hud span:empty{display:none}
.vp-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,9,18,.86);text-align:center;padding:26px;z-index:10}
.vp-ov h1{font-size:28px}
.vp-ov p{color:#b9c1de;font-size:14.5px;line-height:1.8;max-width:340px;white-space:pre-line}
.vp-ov .vp-big{font-size:44px;font-weight:900;color:#ffd166}
.vp-btn{background:#ffd166;color:#3a2a00;border:0;border-radius:14px;padding:.85rem 1.9rem;font:inherit;font-weight:900;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.vp-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.vp-toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(18,24,44,.92);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 15px;font-size:13px;font-weight:800;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
[hidden]{display:none!important}
</style>

<div id="vpstage">

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
 bulletSpeedMul: { v: 1, label: '弾速倍率', min: 0.5, max: 2, step: 0.05 },
 bossHpMul: { v: 1, label: 'ボスHP倍率', min: 0.4, max: 3, step: 0.1 },
 fireIntervalMul: { v: 1, label: '弾幕の間隔', min: 0.4, max: 2, step: 0.05 },
 grazeDist: { v: 16, label: 'グレイズ距離', min: 6, max: 34, step: 1 },
 playerLives: { v: 3, label: 'ライフ数', min: 1, max: 9, step: 1 },
 bombs: { v: 3, label: 'ボム数', min: 0, max: 9, step: 1 },
 powerNeed: { v: 3, label: '強化に必要な🔸', min: 1, max: 6, step: 1 },
 loopSpeed: { v: 1.5, label: '2周目の弾速', min: 1, max: 2.5, step: 0.1 }
};
var BOSSES = [
 { e: '🐙', pat: 'ring', hp: 900, col: '#c084fc' },
 { e: '🦂', pat: 'aim', hp: 1300, col: '#fb923c' },
 { e: '🐲', pat: 'spiral', hp: 1800, col: '#22d3ee' },
 { e: '👁️', pat: 'mix', hp: 2500, col: '#f472b6' }
];
var PLAY_TOP = 56, PLAY_BOT = 712, MAXEB = 240;
var stars, player, pbul, ebul, zakos, powers, parts, boss;
var state, score, lives, bombs, powerCount, wlvl, dead;
var warningT, interT, zakoT, slowmo, flash, shake, invT, fireT;
var bossIdx, loopN, bossHitFlag, targetX, targetY, lastTapT, tapX, tapY, tAcc, bgGrad;

function init(){
 dead = false;
 stars = [];
 for (var i = 0; i < 70; i++){
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: 1 + Math.random() * 2, v: 25 + Math.random() * 95 });
 }
 player = { x: W / 2, y: 620, r: 5 };
 pbul = []; ebul = []; zakos = []; powers = []; parts = [];
 boss = null;
 score = 0; lives = TUNE.playerLives.v; bombs = TUNE.bombs.v;
 powerCount = 0; wlvl = 0;
 warningT = 0; interT = 0; zakoT = 0; slowmo = 0; flash = 0; shake = 0; invT = 1.5;
 fireT = 0; bossIdx = 0; loopN = 0; bossHitFlag = false;
 targetX = player.x; targetY = player.y;
 lastTapT = 0; tapX = 0; tapY = 0; tAcc = 0; bgGrad = null;
 Game.score(0);
 updateHud();
 startWarning();
}

function updateHud(){
 Game.hud('❤️'.repeat(Math.max(0, lives)) + ' ' + '💣'.repeat(Math.max(0, bombs)));
}

function startWarning(){
 state = 'warning';
 warningT = 2.0;
 boss = null;
 ebul = [];
}

function spawnBoss(){
 var d = BOSSES[bossIdx];
 var hp = Math.round(d.hp * TUNE.bossHpMul.v * (1 + loopN * 0.6));
 boss = { e: d.e, pat: d.pat, col: d.col, hp: hp, maxHp: hp, x: W / 2, y: 150, dir: 1, t: 0, phase2: false, patternT: 0.9, a1: 0, cy: 0 };
 bossHitFlag = false;
 state = 'boss';
 if (invT < 1.0) invT = 1.0;
 addPart(boss.x, boss.y, 16, d.col);
}

function defeatBoss(){
 var bx = boss.x, by = boss.y;
 score += 300;
 var perf = !bossHitFlag;
 if (perf) score += 500;
 Game.score(score);
 flash = 1; slowmo = 1.3; shake = 0.9;
 for (var i = 0; i < 34; i++) addPart(bx, by, 1, i % 2 ? '#fbbf24' : '#fb7185');
 Game.float(bx, by - 30, perf ? 'PERFECT +500' : '撃破 +300', '#fde047');
 Game.float(bx, by + 30, '💥', '#fbbf24');
 boss = null;
 ebul = [];
 bossIdx++;
 if (bossIdx >= BOSSES.length){
  bossIdx = 0;
  loopN++;
  Game.toast('2周目 突入！弾が速くなる');
 }
 state = 'inter';
 interT = 5.0;
 zakoT = 0.4;
}

function spawnZako(){
 if (zakos.length > 6) return;
 zakos.push({ x: 70 + Math.random() * (W - 140), y: PLAY_TOP + 16, vy: 70 + Math.random() * 55, hp: 30, t: Math.random() * 6.28, shootT: 1.1 + Math.random() * 1.4 });
}

function killZako(i){
 var z = zakos[i];
 addPart(z.x, z.y, 12, '#86efac');
 powers.push({ x: z.x, y: z.y, vy: 115 });
 score += 20;
 Game.score(score);
 Game.float(z.x, z.y, '+20', '#86efac');
 zakos.splice(i, 1);
}

function collectPower(){
 powerCount++;
 score += 30;
 Game.score(score);
 addPart(player.x, player.y, 7, '#fde047');
 var nl = Math.min(2, Math.floor(powerCount / TUNE.powerNeed.v));
 if (nl > wlvl){
  wlvl = nl;
  flash = 0.3;
  Game.toast(wlvl === 1 ? 'パワーアップ！ 3列ショット' : 'パワーアップ！ 5列ショット');
 } else if (wlvl >= 2){
  score += 50;
  Game.score(score);
  Game.float(player.x, player.y - 34, '+50', '#fde047');
 }
}

function shoot(){
 var py = player.y - 24;
 if (wlvl === 0){
  pbul.push({ x: player.x, y: py, vx: 0, vy: -690, dmg: 10 });
 } else if (wlvl === 1){
  for (var i = -1; i <= 1; i++) pbul.push({ x: player.x + i * 16, y: py, vx: 0, vy: -690, dmg: 10 });
 } else {
  for (var k = -2; k <= 2; k++) pbul.push({ x: player.x + k * 15, y: py, vx: 0, vy: -690, dmg: 10 });
 }
}

function eb(x, y, vx, vy, r, c){
 if (ebul.length >= MAXEB) return;
 ebul.push({ x: x, y: y, vx: vx, vy: vy, r: r, c: c, graze: false });
}

function fireRing(n, spd, col, off){
 for (var i = 0; i < n; i++){
  var a = off + i * 6.2832 / n;
  eb(boss.x, boss.y, Math.cos(a) * spd, Math.sin(a) * spd, 7, col);
 }
}

function fireAim(n, spread, spd, col){
 var a = Math.atan2(player.y - boss.y, player.x - boss.x);
 for (var i = 0; i < n; i++){
  var aa = a + (i - (n - 1) / 2) * spread;
  eb(boss.x, boss.y, Math.cos(aa) * spd, Math.sin(aa) * spd, 7, col);
 }
}

function bossFire(dt){
 var spd = TUNE.bulletSpeedMul.v * Math.pow(TUNE.loopSpeed.v, loopN) * (boss.phase2 ? 1.35 : 1);
 var fm = TUNE.fireIntervalMul.v * (boss.phase2 ? 0.72 : 1);
 var col = boss.phase2 ? '#fde047' : boss.col;
 boss.patternT -= dt;
 if (boss.patternT > 0) return;
 if (boss.pat === 'ring'){
  boss.patternT = 1.4 * fm;
  fireRing(10 + loopN * 2 + (boss.phase2 ? 4 : 0), 135 * spd, col, boss.t * 0.8);
 } else if (boss.pat === 'aim'){
  boss.patternT = 0.95 * fm;
  fireAim(boss.phase2 ? 5 : 3, 0.16, 235 * spd, col);
 } else if (boss.pat === 'spiral'){
  boss.patternT = 0.08 * fm;
  boss.a1 += 0.46;
  eb(boss.x, boss.y, Math.cos(boss.a1) * 180 * spd, Math.sin(boss.a1) * 180 * spd, 7, col);
  eb(boss.x, boss.y, Math.cos(boss.a1 + Math.PI) * 180 * spd, Math.sin(boss.a1 + Math.PI) * 180 * spd, 7, col);
 } else {
  boss.cy++;
  var m = boss.cy % 14;
  if (m === 0){
   boss.patternT = 1.1 * fm;
   fireRing(16, 145 * spd, col, boss.t);
  } else if (m === 5){
   boss.patternT = 0.6 * fm;
   fireAim(boss.phase2 ? 7 : 5, 0.2, 240 * spd, col);
  } else if (m === 9){
   boss.patternT = 0.6 * fm;
   boss.a1 += 0.7;
   for (var k = 0; k < 6; k++){
    var a = boss.a1 + k * Math.PI / 3;
    eb(boss.x, boss.y, Math.cos(a) * 185 * spd, Math.sin(a) * 185 * spd, 7, col);
   }
  } else {
   boss.patternT = 0.09 * fm;
   boss.a1 += 0.5;
   eb(boss.x, boss.y, Math.cos(boss.a1) * 175 * spd, Math.sin(boss.a1) * 175 * spd, 7, col);
   eb(boss.x, boss.y, Math.cos(boss.a1 + Math.PI) * 175 * spd, Math.sin(boss.a1 + Math.PI) * 175 * spd, 7, col);
  }
 }
}

function hitPlayer(){
 lives--;
 invT = 2.0;
 bossHitFlag = true;
 shake = 0.8;
 flash = 0.4;
 addPart(player.x, player.y, 26, '#f87171');
 ebul = [];
 player.x = W / 2; player.y = 620;
 targetX = W / 2; targetY = 620;
 updateHud();
 if (lives <= 0){
  dead = true;
  Game.over(score);
 } else {
  Game.toast('被弾！ 残り ' + lives);
 }
}

function useBomb(){
 if (dead || bombs <= 0) return;
 bombs--;
 updateHud();
 flash = 0.6;
 shake = 0.8;
 if (invT < 1.2) invT = 1.2;
 for (var i = 0; i < ebul.length; i++) addPart(ebul[i].x, ebul[i].y, 1, '#fef08a');
 ebul = [];
 if (boss){
  var d = Math.round(boss.maxHp * 0.22) + 60;
  boss.hp -= d;
  score += d;
  Game.score(score);
  addPart(boss.x, boss.y, 30, '#fde047');
  Game.float(boss.x, boss.y + 44, 'BOMB!', '#fde047');
 }
 for (var k = 0; k < 22; k++) addPart(player.x, player.y, 1, '#fef08a');
 Game.toast('ボム💣！');
}

function addPart(x, y, n, col){
 for (var i = 0; i < n; i++){
  if (parts.length > 200) return;
  var a = Math.random() * 6.2832;
  var sp = 30 + Math.random() * 180;
  parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.35 + Math.random() * 0.5, max: 0.85, c: col, r: 1.5 + Math.random() * 2.5 });
 }
}

function update(dt){
 if (dead) return;
 if (slowmo > 0){ slowmo -= dt; dt *= 0.35; }
 tAcc += dt;
 if (flash > 0) flash -= dt * 2.5;
 if (shake > 0) shake -= dt * 2.5;
 if (invT > 0) invT -= dt;

 var i, j;
 for (i = 0; i < stars.length; i++){
  var st = stars[i];
  st.y += st.v * dt;
  if (st.y > H + 4){ st.y = -4; st.x = Math.random() * W; }
 }

 player.x += (targetX - player.x) * Math.min(1, dt * 18);
 player.y += (targetY - player.y) * Math.min(1, dt * 18);
 if (player.x < 16) player.x = 16;
 if (player.x > W - 16) player.x = W - 16;
 if (player.y < PLAY_TOP + 40) player.y = PLAY_TOP + 40;
 if (player.y > PLAY_BOT - 16) player.y = PLAY_BOT - 16;

 fireT -= dt;
 if (fireT <= 0){ fireT = 0.13; shoot(); }

 if (state === 'warning'){
  warningT -= dt;
  if (warningT <= 0) spawnBoss();
 } else if (state === 'boss' && boss){
  boss.t += dt;
  boss.x += boss.dir * (55 + bossIdx * 12 + loopN * 15) * dt;
  if (boss.x < 84){ boss.x = 84; boss.dir = 1; }
  if (boss.x > W - 84){ boss.x = W - 84; boss.dir = -1; }
  boss.y = 150 + Math.sin(boss.t * 1.7) * 14;
  if (!boss.phase2 && boss.hp <= boss.maxHp * 0.5){
   boss.phase2 = true;
   flash = 0.45;
   shake = 0.4;
   addPart(boss.x, boss.y, 26, '#fde047');
   Game.toast('第2形態！');
  }
  bossFire(dt);
  if (boss.hp <= 0) defeatBoss();
 } else if (state === 'inter'){
  interT -= dt;
  zakoT -= dt;
  if (zakoT <= 0){
   spawnZako();
   zakoT = Math.max(0.5, 1.3 - loopN * 0.15);
  }
  if (interT <= 0) startWarning();
 }

 for (i = pbul.length - 1; i >= 0; i--){
  var pb = pbul[i];
  pb.x += pb.vx * dt;
  pb.y += pb.vy * dt;
  if (pb.y < PLAY_TOP - 30 || pb.x < -20 || pb.x > W + 20){ pbul.splice(i, 1); continue; }
  var hit = false;
  if (boss && Math.abs(pb.x - boss.x) < 36 && Math.abs(pb.y - boss.y) < 36){
   boss.hp -= pb.dmg;
   score += pb.dmg;
   Game.score(score);
   addPart(pb.x, pb.y - 6, 2, '#a5f3fc');
   hit = true;
  }
  if (!hit){
   for (j = zakos.length - 1; j >= 0; j--){
    var z0 = zakos[j];
    if (Math.abs(pb.x - z0.x) < 20 && Math.abs(pb.y - z0.y) < 20){
     z0.hp -= pb.dmg;
     addPart(pb.x, pb.y, 3, '#86efac');
     if (z0.hp <= 0) killZako(j);
     hit = true;
     break;
    }
   }
  }
  if (hit) pbul.splice(i, 1);
 }

 for (i = zakos.length - 1; i >= 0; i--){
  var z = zakos[i];
  z.t += dt;
  z.y += z.vy * dt;
  z.x += Math.sin(z.t * 2.2) * 45 * dt;
  z.shootT -= dt;
  if (z.shootT <= 0 && z.y > PLAY_TOP + 60 && z.y < player.y - 60){
   z.shootT = 1.5 + Math.random() * 1.2;
   var za = Math.atan2(player.y - z.y, player.x - z.x);
   var zs = 165 * TUNE.bulletSpeedMul.v;
   eb(z.x, z.y, Math.cos(za) * zs, Math.sin(za) * zs, 6, '#4ade80');
  }
  if (z.y > PLAY_BOT + 30 || z.x < -40 || z.x > W + 40) zakos.splice(i, 1);
 }

 var grazeR = TUNE.grazeDist.v;
 for (i = ebul.length - 1; i >= 0; i--){
  var e = ebul[i];
  e.x += e.vx * dt;
  e.y += e.vy * dt;
  if (e.x < -40 || e.x > W + 40 || e.y < PLAY_TOP - 50 || e.y > H + 40){ ebul.splice(i, 1); continue; }
  var dx = e.x - player.x, dy = e.y - player.y;
  var d2 = dx * dx + dy * dy;
  if (invT <= 0){
   var hr = player.r + e.r;
   if (d2 < hr * hr){ ebul.splice(i, 1); hitPlayer(); break; }
  }
  var gr = grazeR + e.r;
  if (!e.graze && d2 < gr * gr){
   e.graze = true;
   score += 5;
   Game.score(score);
   addPart(e.x, e.y, 3, '#a5f3fc');
  }
 }
 if (dead) return;

 for (i = powers.length - 1; i >= 0; i--){
  var p = powers[i];
  p.y += p.vy * dt;
  if (Math.abs(p.x - player.x) < 34 && Math.abs(p.y - player.y) < 34){
   powers.splice(i, 1);
   collectPower();
   continue;
  }
  if (p.y > H + 24) powers.splice(i, 1);
 }

 for (i = parts.length - 1; i >= 0; i--){
  var q = parts[i];
  q.x += q.vx * dt;
  q.y += q.vy * dt;
  q.vx *= 0.94;
  q.vy *= 0.94;
  q.life -= dt;
  if (q.life <= 0) parts.splice(i, 1);
 }
}

function draw(){
 if (!bgGrad){
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0c1030');
  bgGrad.addColorStop(0.55, '#070a18');
  bgGrad.addColorStop(1, '#120720');
 }
 ctx.fillStyle = bgGrad;
 ctx.fillRect(0, 0, W, H);

 var i;
 for (i = 0; i < stars.length; i++){
  var s = stars[i];
  ctx.fillStyle = s.v > 80 ? '#cbd5f5' : (s.v > 50 ? '#8e9cd8' : '#465080');
  ctx.fillRect(s.x, s.y, s.s, s.s * 2);
 }

 ctx.save();
 if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
 ctx.textAlign = 'center';
 ctx.textBaseline = 'middle';

 ctx.font = "26px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
 for (i = 0; i < powers.length; i++) ctx.fillText('🔸', powers[i].x, powers[i].y);

 for (i = 0; i < zakos.length; i++){
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#4ade80';
  ctx.beginPath();
  ctx.arc(zakos[i].x, zakos[i].y, 20, 0, 6.2832);
  ctx.fill();
 }
 ctx.globalAlpha = 1;
 ctx.font = "34px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
 for (i = 0; i < zakos.length; i++) ctx.fillText('👾', zakos[i].x, zakos[i].y);

 if (boss){
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = boss.phase2 ? '#fbbf24' : boss.col;
  ctx.beginPath();
  ctx.arc(boss.x, boss.y, 50, 0, 6.2832);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.font = "76px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  ctx.fillText(boss.e, boss.x, boss.y);
 }

 ctx.globalCompositeOperation = 'lighter';
 ctx.fillStyle = '#7df9ff';
 for (i = 0; i < pbul.length; i++){
  ctx.globalAlpha = 0.35;
  ctx.beginPath();
  ctx.arc(pbul[i].x, pbul[i].y, 7, 0, 6.2832);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillRect(pbul[i].x - 2, pbul[i].y - 8, 4, 15);
 }
 ctx.globalAlpha = 1;
 ctx.globalCompositeOperation = 'source-over';

 ctx.globalCompositeOperation = 'lighter';
 for (i = 0; i < ebul.length; i++){
  var e = ebul[i];
  ctx.globalAlpha = 0.26;
  ctx.fillStyle = e.c;
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r * 2.2, 0, 6.2832);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r, 0, 6.2832);
  ctx.fill();
 }
 ctx.globalAlpha = 1;
 ctx.globalCompositeOperation = 'source-over';

 ctx.strokeStyle = 'rgba(103,232,249,0.35)';
 ctx.lineWidth = 1.5;
 ctx.beginPath();
 ctx.arc(player.x, player.y, TUNE.grazeDist.v, 0, 6.2832);
 ctx.stroke();
 var blink = invT > 0 && Math.floor(tAcc * 16) % 2 === 0;
 if (!blink){
  ctx.font = "42px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
  ctx.fillText('✈️', player.x, player.y);
 }
 ctx.fillStyle = '#67e8f9';
 ctx.beginPath();
 ctx.arc(player.x, player.y, 3, 0, 6.2832);
 ctx.fill();

 ctx.globalCompositeOperation = 'lighter';
 for (i = 0; i < parts.length; i++){
  var q = parts[i];
  ctx.globalAlpha = Math.max(0, q.life / q.max);
  ctx.fillStyle = q.c;
  ctx.beginPath();
  ctx.arc(q.x, q.y, q.r, 0, 6.2832);
  ctx.fill();
 }
 ctx.globalAlpha = 1;
 ctx.globalCompositeOperation = 'source-over';
 ctx.restore();

 if (state === 'warning') drawWarning();
 drawHpBar();

 if (flash > 0){
  ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.85, flash) + ')';
  ctx.fillRect(0, 0, W, H);
 }
}

function hazard(y, h){
 ctx.save();
 ctx.beginPath();
 ctx.rect(0, y, W, h);
 ctx.clip();
 ctx.fillStyle = '#facc15';
 ctx.fillRect(0, y, W, h);
 ctx.fillStyle = '#111827';
 var off = (tAcc * 60) % 44;
 for (var x = -80; x < W + 80; x += 44){
  ctx.beginPath();
  ctx.moveTo(x + off, y - 2);
  ctx.lineTo(x + off + 22, y - 2);
  ctx.lineTo(x + off + 22 - h, y + h + 2);
  ctx.lineTo(x + off - h, y + h + 2);
  ctx.closePath();
  ctx.fill();
 }
 ctx.restore();
}

function drawWarning(){
 var h = 40;
 hazard(PLAY_TOP, h);
 hazard(PLAY_BOT - h, h);
 ctx.textAlign = 'center';
 ctx.textBaseline = 'middle';
 ctx.font = "84px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
 ctx.globalAlpha = 0.28;
 ctx.fillText(BOSSES[bossIdx].e, W / 2, 420);
 ctx.globalAlpha = 0.55 + 0.45 * Math.sin(tAcc * 12);
 ctx.font = 'bold 46px sans-serif';
 ctx.lineWidth = 8;
 ctx.strokeStyle = '#111827';
 ctx.strokeText('WARNING', W / 2, 300);
 ctx.fillStyle = '#facc15';
 ctx.fillText('WARNING', W / 2, 300);
 ctx.globalAlpha = 1;
}

function drawHpBar(){
 if (!boss) return;
 var bx = 64, bw = 352, by = 62, bh = 12;
 ctx.textAlign = 'center';
 ctx.textBaseline = 'middle';
 ctx.font = "24px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
 ctx.fillText(boss.e, 38, 68);
 ctx.fillStyle = 'rgba(255,255,255,0.13)';
 ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
 var f = Math.max(0, boss.hp / boss.maxHp);
 ctx.fillStyle = boss.phase2 ? '#fbbf24' : boss.col;
 ctx.fillRect(bx, by, bw * f, bh);
 ctx.strokeStyle = 'rgba(255,255,255,0.45)';
 ctx.lineWidth = 1;
 ctx.strokeRect(bx, by, bw, bh);
 if (loopN > 0){
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('2周目 x' + loopN, W / 2, 88);
 }
}

function onDown(x, y){
 if (dead) return;
 var now = Date.now();
 if (now - lastTapT < 300 && Math.abs(x - tapX) < 70 && Math.abs(y - tapY) < 70){
  lastTapT = 0;
  useBomb();
  return;
 }
 lastTapT = now;
 tapX = x;
 tapY = y;
 targetX = x;
 targetY = y - 55;
}

function onMove(x, y){
 if (dead) return;
 targetX = x;
 targetY = y - 55;
}

function onUp(x, y){
}

function onResize(){
 bgGrad = null;
}

/*__VAPPA_JS_END__*/
</script>
</body></html>
