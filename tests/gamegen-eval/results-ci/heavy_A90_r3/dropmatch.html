<style>

html,body{height:100%;overflow:hidden;background:#0f1322;font-family:"Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff}
#vpc{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* vpstage＝論理480x720（2:3）の箱。HUD・オーバーレイ・ゲームDOMを全部この中に入れ、

#vpstage{position:fixed;left:0;top:0;width:480px;height:720px;transform-origin:0 0;z-index:1;overflow:hidden}

<script id="vpimgs">
/* ユーザー素材画像 {名前:dataURL}。中身はビルド後にアプリが注入（AIには名前だけ渡る） */
window.__VP_IMGS=/*__VAPPA_IMGS__*/{}/*__VAPPA_IMGS_END__*/;

<script>
window.Arcade=window.Arcade||{ready:function(){},gameOver:function(){},submitScore:function(){},event:function(){},onPause:function(){},onResume:function(){},onRestart:function(){}};
var cv=document.getElementById("vpc"),ctx=cv.getContext("2d");
// iOS Safari は fillStyle がグラデーション/パターンのオブジェクトのままだと
// カラー絵文字を fillText できない（何も描かれない）。生成コードは
// 「背景をグラデで塗る→そのまま絵文字を描く」形を高頻度で書くため、
// 絵文字を含む fillText の間だけ fillStyle を単色に退避して確実に描く。
(function(){
  var _ft=ctx.fillText;
  function hasEmo(s){
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if((c>=0x2100&&c<=0x2BFF)||(c>=0xD800&&c<=0xDFFF)||c===0xFE0F)return true;
    }
    return false;
  }
  ctx.fillText=function(t,x,y,mw){
    var s=String(t);
    if(typeof this.fillStyle!=="string"&&hasEmo(s)){
      var f=this.fillStyle;this.fillStyle="#000";
      try{mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);}
      finally{this.fillStyle=f;}
    }else{
      mw===undefined?_ft.call(this,s,x,y):_ft.call(this,s,x,y,mw);
    }
  };
})();
// 論理画面は 480x720（2:3）固定。全端末でこのサイズとして描き、ランタイムが
// vpstage（HUD・オーバーレイ・ゲームDOMを含む箱）ごと実画面へ拡縮する。
// ゲームコードは端末差を一切考えなくてよい（入力座標も論理系で届く）。
var W=480,H=720;
var __SC=1,__OX=0,__OY=0;   // 実画面変換：scale と余白オフセット（入力の逆変換にも使う）
(function(){
"use strict";
var DPR=Math.min(2,window.devicePixelRatio||1);
function rs(){
  var vw=window.innerWidth,vh=window.innerHeight;
  __SC=Math.min(vw/W,vh/H);
  __OX=(vw-W*__SC)/2;__OY=(vh-H*__SC)/2;
  cv.width=vw*DPR;cv.height=vh*DPR;
  ctx.setTransform(DPR*__SC,0,0,DPR*__SC,DPR*__OX,DPR*__OY);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();   // 論理画面の外（レターボックス帯）には描かせない
  var st=document.getElementById("vpstage");
  if(st){st.style.transform="scale("+__SC+")";st.style.left=__OX+"px";st.style.top=__OY+"px";}
  if(typeof window.onResize==="function"){try{window.onResize();}catch(e){}}
}
window.addEventListener("resize",rs);rs();
// 実画面座標→論理座標（タッチ入力用）
function toLX(x){return (x-__OX)/__SC;}
function toLY(y){return (y-__OY)/__SC;}
var playing=false,paused=false,ended=false,crashed=false,floats=[],unit="点";
// ユーザー素材画像のプリロード（Game.img(名前) で <img> を返す）
var IMGS={};(function(){var d=window.__VP_IMGS||{};for(var k in d){var m=new Image();m.src=d[k];IMGS[k]=m;}})();
var hud=document.getElementById("vphud"),hl=document.getElementById("vphl"),hr=document.getElementById("vphr");
var ov=document.getElementById("vpov"),toastEl=document.getElementById("vptoast"),tt=null,last=performance.now();
window.Game={
  img:function(n){return IMGS[n]||null;},
  score:function(n){hl.textContent=(n|0)+unit;},
  hud:function(t){hr.textContent=t==null?"":String(t);},
  float:function(x,y,t,c){floats.push({x:x,y:y,t:String(t),c:c||"#fff",age:0});},
  toast:function(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toastEl.style.opacity=0;},2000);},
  over:function(s){
    if(!playing||ended)return;ended=true;playing=false;s=Math.max(0,Math.floor(Number(s)||0));
    ov.innerHTML='<h1>おわり！</h1><div class="vp-big">'+s+'<small style="font-size:20px">'+unit+'</small></div><button class="vp-btn" id="vpagain">もういちど</button>';
    ov.hidden=false;
    document.getElementById("vpagain").addEventListener("click",start);
    try{window.Arcade.gameOver(s);}catch(e){}
  }
};
function crash(e){
  if(crashed)return;crashed=true;playing=false;
  try{window.__VP_ERR=String(e&&(e.stack||e.message)||e).slice(0,600);}catch(x){}
  ov.innerHTML='<h1>😢 エラーが発生</h1><p>ゲームにエラーが起きました。<br>作成チャットで「エラーを直して」と伝えると修理できるよ。</p><button class="vp-btn" id="vpagain">もういちど</button>';
  ov.hidden=false;
  document.getElementById("vpagain").addEventListener("click",start);
}
function start(){
  floats=[];ended=false;crashed=false;
  try{window.init();}catch(e){crash(e);return;}
  window.Game.score(0);ov.hidden=true;hud.hidden=false;playing=true;last=performance.now();
}
document.getElementById("vpstart").addEventListener("click",start);
function fire(fn,x,y,id){
  if(!playing||paused)return;
  if(typeof window[fn]==="function"){try{window[fn](x,y,id);}catch(err){crash(err);}}
}
// pointer と touch を両対応（iOSのiframe内などpointerが飛ばない環境へのフォールバック）。
// pointerが一度でも来たらtouchは無視して二重発火を防ぐ。
var seenPointer=false;
window.addEventListener("pointerdown",function(e){seenPointer=true;fire("onDown",toLX(e.clientX),toLY(e.clientY),e.pointerId);fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointermove",function(e){fire("onMove",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
window.addEventListener("pointerup",function(e){fire("onUp",toLX(e.clientX),toLY(e.clientY),e.pointerId);});
// タッチの扱い（iOS対策の要点）：
//  - touchstart は preventDefault しない
//  - touchmove は非passiveで preventDefault → パン/スクロール横取りはこれで止まる
//  - touchend はボタン類「以外」でだけ preventDefault → iOSのダブルタップズーム
//    （touch-action:noneでは止まらない端末がある）を殺しつつ、ボタンの click 合成は守る
//  - preventDefault すると iOS は click を合成しない → 生成コードが div/span で
//    自作ボタンを作った場合に全操作不能になる。そこで「タップ」（移動が小さく
//    短いタッチ）に限り、こちらで click を合成して補う。本物の button 等は
//    preventDefault しない＝ネイティブ click が来るので合成しない（二重防止）
//  - pointerイベントが来る環境では発火だけ二重防止（seenPointer）
function tfire(fn,e){
  if(seenPointer)return;
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];fire(fn,toLX(t.clientX),toLY(t.clientY),t.identifier);
    if(fn==="onDown")fire("onMove",toLX(t.clientX),toLY(t.clientY),t.identifier);}
}
function uiTouch(e){var t=e.target;return !!(t&&t.closest&&t.closest("button,a,input,select,label"));}
var tstart={};
window.addEventListener("touchstart",function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];tstart[t.identifier]={x:t.clientX,y:t.clientY,at:Date.now()};}
  tfire("onDown",e);
},{passive:true});
window.addEventListener("touchmove",function(e){if(e.cancelable)e.preventDefault();tfire("onMove",e);},{passive:false});
window.addEventListener("touchend",function(e){
  var prevented=false;
  if(e.cancelable&&!uiTouch(e)){e.preventDefault();prevented=true;}
  if(prevented){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i],s=tstart[t.identifier];
      if(s&&Math.abs(t.clientX-s.x)<14&&Math.abs(t.clientY-s.y)<14&&Date.now()-s.at<1500){
        var el=document.elementFromPoint(t.clientX,t.clientY)||e.target;
        if(el){try{el.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true,view:window,clientX:t.clientX,clientY:t.clientY}));}catch(err){}}
      }
    }
  }
  for(var j=0;j<e.changedTouches.length;j++)delete tstart[e.changedTouches[j].identifier];
  tfire("onUp",e);
},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault();});
window.addEventListener("mousedown",function(e){if(!seenPointer)fire("onDown",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mousemove",function(e){if(!seenPointer)fire("onMove",toLX(e.clientX),toLY(e.clientY),0);});
window.addEventListener("mouseup",function(e){if(!seenPointer)fire("onUp",toLX(e.clientX),toLY(e.clientY),0);});
window.Arcade.onPause(function(){paused=true;});
window.Arcade.onResume(function(){paused=false;last=performance.now();});
window.Arcade.onRestart(start);
document.addEventListener("visibilitychange",function(){if(document.hidden){paused=true;}else{paused=false;last=performance.now();}});
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(crashed)return;
  if(playing&&!paused){try{window.update(dt);}catch(e){crash(e);return;}}
  if(playing||ended){try{window.draw();}catch(e){crash(e);return;}}
  for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.age+=dt;
    if(f.age>1){floats.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,1-f.age);ctx.font="bold 16px sans-serif";ctx.textAlign="center";
    ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y-f.age*30);ctx.restore();}
}
requestAnimationFrame(loop);
window.Arcade.ready();
// 自動テストプレイ用フック：親(アプリ)がスモークテストで入力を一発流すのに使う
window.__vpTap=function(){
  fire("onDown",W/2,H/2,1);fire("onMove",W/2+40,H/2,1);fire("onUp",W/2+40,H/2,1);
};
})();
</script>
<script id="vpgame">
/*__VAPPA_JS__*/
var TUNE = {
  dropInterval:    { v: 0.85, label: '落下間隔(秒)',        min: 0.3, max: 1.6,  step: 0.05 },
  levelUpScore:    { v: 800,  label: 'レベルアップ点数',     min: 300, max: 2500, step: 100 },
  startColors:     { v: 3,    label: '開始の具の種類',       min: 2,   max: 5,    step: 1 },
  noriRate:        { v: 0.07, label: 'のりの出現率',         min: 0,   max: 0.3,  step: 0.01 },
  garbageInterval: { v: 22,   label: '焦げごはんの間隔(秒)', min: 8,   max: 45,   step: 1 },
  chainSlow:       { v: 10,   label: '職人の握り連鎖数',     min: 5,   max: 20,   step: 1 }
};
var COLS = 6, ROWS = 12, CELL = 54, BX = 8, BY = 62;
var GARBAGE = -1, NORI = -2, TAU = 6.2831853;
var EMO = ['🔴','🟠','🟤','⚪','🟫'];
var RING = ['#ff5566','#ff9d3c','#b5825a','#cfd8e3','#5b3a22'];
var DIRS = [[0,1],[1,0],[0,-1],[-1,0]];
var grid, queue, falling, level, score, chain, phase, clearT, clearList, clearingMap;
var particles, chainT, chainNum, slowT, garbageT, garbagePending, dropT, shake, bgCanvas;
var ptrs, multiTouch, holdId, holdRep;

function init(){
  grid = [];
  for (var r = 0; r < ROWS; r++){
    var row = [];
    for (var c = 0; c < COLS; c++) row.push(null);
    grid.push(row);
  }
  level = 1; score = 0; chain = 0; phase = 'fall';
  dropT = 0; clearT = 0; clearList = []; clearingMap = {};
  particles = []; chainT = 0; chainNum = 0; slowT = 0; shake = 0;
  garbageT = TUNE.garbageInterval.v; garbagePending = false;
  ptrs = {}; multiTouch = false; holdId = null; holdRep = 0.14;
  queue = [];
  for (var i = 0; i < 2; i++) queue.push(makePiece());
  falling = null;
  Game.score(0);
  Game.hud('Lv.1');
  if (!bgCanvas) buildBG();
  spawnPiece();
}

function activeColors(){ return Math.min(5, TUNE.startColors.v + (level - 1)); }

function makePiece(){
  var n = activeColors();
  var a = Math.floor(Math.random() * n);
  var b;
  if (Math.random() < TUNE.noriRate.v) b = NORI;
  else b = Math.floor(Math.random() * n);
  return { a: a, b: b };
}

function pieceCells(p){
  var d = DIRS[p.ori];
  return [ { c: p.c, r: p.r, t: p.a }, { c: p.c + d[0], r: p.r + d[1], t: p.b } ];
}

function canPlace(p, c, r, ori){
  var d = DIRS[ori];
  var cs = [[c, r], [c + d[0], r + d[1]]];
  for (var i = 0; i < 2; i++){
    var cc = cs[i][0], rr = cs[i][1];
    if (cc < 0 || cc >= COLS || rr < 0 || rr >= ROWS) return false;
    if (grid[rr][cc] !== null) return false;
  }
  return true;
}

function spawnPiece(){
  var p = queue.shift();
  queue.push(makePiece());
  if (grid[0][2] !== null || grid[1][2] !== null){ gameOver(); return; }
  falling = { c: 2, r: 0, ori: 0, a: p.a, b: p.b };
  dropT = 0;
  phase = 'fall';
}

function gameOver(){
  if (phase === 'over') return;
  phase = 'over';
  falling = null;
  Game.over(score);
}

function currentInterval(){
  return Math.max(0.11, TUNE.dropInterval.v * Math.pow(0.87, level - 1));
}

function garbageDelay(){
  return Math.max(6, TUNE.garbageInterval.v * Math.max(0.45, 1 - (level - 1) * 0.07));
}

function checkLevel(){
  var nl = Math.min(12, 1 + Math.floor(score / TUNE.levelUpScore.v));
  if (nl > level){
    level = nl;
    Game.hud('Lv.' + level);
    Game.toast('レベル' + level + '！');
  }
}

function update(dt){
  var raw = dt;
  if (slowT > 0){ slowT -= dt; dt *= 0.35; }
  if (shake > 0) shake -= raw;
  if (chainT > 0) chainT -= raw;
  updateParticles(dt);
  if (phase === 'over') return;

  if (phase === 'clear'){
    clearT -= dt;
    if (clearT <= 0){
      for (var i = 0; i < clearList.length; i++){
        var cc = clearList[i];
        grid[cc.r][cc.c] = null;
      }
      clearList = []; clearingMap = {};
      applyGravity();
      resolveStep();
    }
    return;
  }

  if (phase === 'fall'){
    if (falling){
      dropT += dt;
      if (dropT >= currentInterval()){ dropT = 0; stepDown(); }
    }
    if (!garbagePending){
      garbageT -= dt;
      if (garbageT <= 0){ garbageT = 0; garbagePending = true; }
    }
    handleHold(raw);
  }
}

function handleHold(dt){
  if (!holdId || !ptrs[holdId]) return;
  var p = ptrs[holdId];
  if (p.moved || phase !== 'fall') return;
  p.t += dt;
  if (p.t > 0.28){
    if (!p.acted){ p.acted = true; move(p.dir); holdRep = 0.14; }
    else { holdRep -= dt; if (holdRep <= 0){ holdRep = 0.11; move(p.dir); } }
  }
}

function move(dc){
  if (phase !== 'fall' || !falling) return;
  if (canPlace(falling, falling.c + dc, falling.r, falling.ori)) falling.c += dc;
}

function hardDrop(){
  if (phase !== 'fall' || !falling) return;
  while (canPlace(falling, falling.c, falling.r + 1, falling.ori)) falling.r++;
  shake = 0.22;
  lockPiece();
}

function rotatePiece(){
  if (phase !== 'fall' || !falling) return;
  var no = (falling.ori + 1) % 4;
  var kicks = [[0,0],[-1,0],[1,0],[0,1],[-2,0],[2,0]];
  for (var i = 0; i < kicks.length; i++){
    var nc = falling.c + kicks[i][0], nr = falling.r + kicks[i][1];
    if (canPlace(falling, nc, nr, no)){ falling.c = nc; falling.r = nr; falling.ori = no; return; }
  }
}

function stepDown(){
  if (!falling) return;
  if (canPlace(falling, falling.c, falling.r + 1, falling.ori)) falling.r++;
  else lockPiece();
}

function lockPiece(){
  if (!falling) return;
  var cells = pieceCells(falling);
  var noris = [];
  for (var i = 0; i < cells.length; i++){
    var cc = cells[i];
    if (cc.t === NORI) noris.push(cc);
    else grid[cc.r][cc.c] = cc.t;
  }
  falling = null;
  for (var j = 0; j < noris.length; j++) doNori(noris[j].c, noris[j].r);
  chain = 0;
  resolveStep();
}

function doNori(c, r){
  var counts = [0,0,0,0,0];
  for (var rr = 0; rr < ROWS; rr++){
    var t = grid[rr][c];
    if (t !== null && t >= 0) counts[t]++;
  }
  var best = -1, bn = 0;
  for (var i = 0; i < 5; i++){ if (counts[i] > bn){ bn = counts[i]; best = i; } }
  if (best < 0) return;
  var n = 0;
  for (var rr2 = 0; rr2 < ROWS; rr2++){
    if (grid[rr2][c] === best){
      grid[rr2][c] = null; n++;
      burst(BX + c * CELL + CELL / 2, BY + rr2 * CELL + CELL / 2, best);
    }
  }
  if (n > 0){
    score += n;
    Game.score(score);
    Game.float(BX + c * CELL + CELL / 2, BY + Math.max(0, r) * CELL, 'のり！', '#4ade80');
    applyGravity();
  }
}

function neighborsOf(c, r){
  var out = [];
  if (c > 0) out.push({ c: c - 1, r: r });
  if (c < COLS - 1) out.push({ c: c + 1, r: r });
  if (r > 0) out.push({ c: c, r: r - 1 });
  if (r < ROWS - 1) out.push({ c: c, r: r + 1 });
  return out;
}

function findIn(list, c, r){
  for (var i = 0; i < list.length; i++){ if (list[i].c === c && list[i].r === r) return true; }
  return false;
}

function findGroups(){
  var seen = [];
  for (var r = 0; r < ROWS; r++){
    var row = [];
    for (var c = 0; c < COLS; c++) row.push(false);
    seen.push(row);
  }
  var out = [];
  for (var r2 = 0; r2 < ROWS; r2++){
    for (var c2 = 0; c2 < COLS; c2++){
      var t = grid[r2][c2];
      if (t === null || t < 0 || seen[r2][c2]) continue;
      seen[r2][c2] = true;
      var stack = [[c2, r2]];
      var g = [];
      while (stack.length){
        var p = stack.pop();
        g.push({ c: p[0], r: p[1], t: t });
        var nb = neighborsOf(p[0], p[1]);
        for (var k = 0; k < nb.length; k++){
          var ncell = nb[k];
          if (!seen[ncell.r][ncell.c] && grid[ncell.r][ncell.c] === t){
            seen[ncell.r][ncell.c] = true;
            stack.push([ncell.c, ncell.r]);
          }
        }
      }
      if (g.length >= 3) out.push(g);
    }
  }
  return out;
}

function applyGravity(){
  for (var c = 0; c < COLS; c++){
    var write = ROWS - 1;
    for (var r = ROWS - 1; r >= 0; r--){
      if (grid[r][c] !== null){
        var v = grid[r][c];
        grid[r][c] = null;
        grid[write][c] = v;
        write--;
      }
    }
  }
}

function resolveStep(){
  var groups = findGroups();
  if (groups.length === 0){
    chain = 0;
    if (garbagePending){
      garbagePending = false;
      garbageT = garbageDelay();
      riseGarbage();
      if (phase === 'over') return;
    }
    spawnPiece();
    return;
  }
  chain++;
  var cells = [];
  for (var i = 0; i < groups.length; i++){
    var g = groups[i];
    for (var j = 0; j < g.length; j++) cells.push({ c: g[j].c, r: g[j].r, t: g[j].t });
  }
  var extra = [];
  for (var m = 0; m < cells.length; m++){
    var nx = neighborsOf(cells[m].c, cells[m].r);
    for (var k = 0; k < nx.length; k++){
      var ncell = nx[k];
      if (grid[ncell.r][ncell.c] === GARBAGE && !findIn(extra, ncell.c, ncell.r) && !findIn(cells, ncell.c, ncell.r)){
        extra.push({ c: ncell.c, r: ncell.r, t: GARBAGE });
      }
    }
  }
  var mult = Math.pow(2, chain - 1);
  var gain = cells.length * mult;
  score += gain;
  Game.score(score);
  checkLevel();

  chainNum = chain;
  chainT = 1.1;
  if (chain >= TUNE.chainSlow.v){ slowT = 2.0; Game.toast('職人の握り！'); }
  if (chain >= 3) shake = 0.22;

  clearList = cells.concat(extra);
  clearingMap = {};
  for (var q = 0; q < clearList.length; q++){
    var cc = clearList[q];
    clearingMap[cc.r * COLS + cc.c] = true;
    burst(BX + cc.c * CELL + CELL / 2, BY + cc.r * CELL + CELL / 2, cc.t);
  }
  var fc = cells[Math.floor(cells.length / 2)];
  Game.float(BX + fc.c * CELL + CELL / 2, BY + fc.r * CELL + CELL / 2, '+' + gain, '#ffd166');
  clearT = 0.32;
  phase = 'clear';
}

function riseGarbage(){
  for (var c = 0; c < COLS; c++){
    if (grid[0][c] !== null){ gameOver(); return; }
  }
  for (var r = 0; r < ROWS - 1; r++) grid[r] = grid[r + 1];
  var row = [];
  for (var c2 = 0; c2 < COLS; c2++) row.push(null);
  var n = Math.min(COLS, 1 + Math.floor(level / 2));
  for (var i = 0; i < n; i++){
    row[Math.floor(Math.random() * COLS)] = GARBAGE;
  }
  grid[ROWS - 1] = row;
  shake = 0.25;
}

function burst(x, y, t){
  var col = (t >= 0) ? RING[t] : '#9ca3af';
  for (var i = 0; i < 4; i++){
    particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 130, vy: -40 - Math.random() * 90,
      life: 0.55, max: 0.55, r: 2 + Math.random() * 3, kind: 0, col: col });
  }
  for (var j = 0; j < 2; j++){
    particles.push({ x: x + (Math.random() - 0.5) * 14, y: y, vx: (Math.random() - 0.5) * 24,
      vy: -25 - Math.random() * 30, life: 0.85, max: 0.85, r: 7 + Math.random() * 7, kind: 1, col: '#ffffff' });
  }
  if (particles.length > 180) particles.splice(0, particles.length - 180);
}

function updateParticles(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 0) p.vy += 320 * dt;
    else { p.vy -= 20 * dt; p.r += 14 * dt; }
  }
}

function rr(x, y, w, h, rad){
  var r = Math.min(rad, w / 2, h / 2);
  if (r < 0) r = 0;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

var EMOJI_FONT = 'px \'Apple Color Emoji\',\'Noto Color Emoji\',sans-serif';

function emojiFont(size){
  return Math.round(size) + "px 'Apple Color Emoji','Noto Color Emoji',sans-serif";
}

function drawBall(x, y, t, cell, alpha, scale){
  var s = scale === undefined ? 1 : scale;
  var a = alpha === undefined ? 1 : alpha;
  var sz = cell * s;
  ctx.globalAlpha = a;
  var em, ring, fs;
  if (t === GARBAGE){ em = '⬛'; ring = '#7a4326'; fs = sz * 0.46; }
  else if (t === NORI){ em = '🟩'; ring = '#3f8f4a'; fs = sz * 0.54; }
  else { em = EMO[t]; ring = RING[t]; fs = sz * 0.70; }
  ctx.beginPath();
  ctx.arc(x, y, sz * 0.45, 0, TAU);
  ctx.fillStyle = ring;
  ctx.fill();
  ctx.font = emojiFont(fs);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(em, x, y + 1);
  ctx.globalAlpha = 1;
}

function buildBG(){
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W;
  bgCanvas.height = H;
  var g = bgCanvas.getContext('2d');
  var grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#151d3a');
  grad.addColorStop(0.55, '#101731');
  grad.addColorStop(1, '#0c1124');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);
  var glow = g.createRadialGradient(W / 2, 90, 10, W / 2, 90, 320);
  glow.addColorStop(0, 'rgba(220,70,80,0.20)');
  glow.addColorStop(1, 'rgba(220,70,80,0)');
  g.fillStyle = glow;
  g.fillRect(0, 0, W, 420);
  g.strokeStyle = 'rgba(120,170,255,0.10)';
  g.lineWidth = 2;
  var R = 50;
  for (var row = 0; row * R * 0.5 < H + R; row++){
    var oy = row * R * 0.5;
    var ox = (row % 2) ? R : 0;
    for (var x = -R; x < W + R; x += R * 2){
      for (var k = 1; k <= 2; k++){
        g.beginPath();
        g.arc(x + ox, oy, R * k * 0.5, Math.PI, 0);
        g.stroke();
      }
    }
  }
}

function draw(){
  ctx.drawImage(bgCanvas, 0, 0);
  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random() - 0.5) * shake * 34, (Math.random() - 0.5) * shake * 34);
  }
  drawBoard();
  drawFalling();
  drawParticles();
  drawChainText();
  drawPanel();
  ctx.restore();
}

function drawBoard(){
  rr(BX - 5, BY - 5, COLS * CELL + 10, ROWS * CELL + 10, 12);
  ctx.fillStyle = 'rgba(18,24,50,0.88)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(140,170,255,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(120,150,220,0.10)';
  ctx.lineWidth = 1;
  for (var c = 1; c < COLS; c++){
    ctx.beginPath();
    ctx.moveTo(BX + c * CELL, BY);
    ctx.lineTo(BX + c * CELL, BY + ROWS * CELL);
    ctx.stroke();
  }
  for (var r = 1; r < ROWS; r++){
    ctx.beginPath();
    ctx.moveTo(BX, BY + r * CELL);
    ctx.lineTo(BX + COLS * CELL, BY + r * CELL);
    ctx.stroke();
  }
  for (var r2 = 0; r2 < ROWS; r2++){
    for (var c2 = 0; c2 < COLS; c2++){
      var t = grid[r2][c2];
      if (t === null) continue;
      var x = BX + c2 * CELL + CELL / 2;
      var y = BY + r2 * CELL + CELL / 2;
      if (clearingMap[r2 * COLS + c2]){
        var k = 1 - clearT / 0.32;
        if (k < 0) k = 0;
        if (k > 1) k = 1;
        drawBall(x, y, t, CELL, 1 - k * 0.75, 1 + 0.3 * k);
        ctx.globalAlpha = (1 - k) * 0.7;
        ctx.beginPath();
        ctx.arc(x, y, CELL * 0.44, 0, TAU);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        drawBall(x, y, t, CELL, 1, 1);
      }
    }
  }
}

function drawFalling(){
  if (!falling) return;
  var cells = pieceCells(falling);
  var gr = falling.r;
  while (canPlace(falling, falling.c, gr + 1, falling.ori)) gr++;
  if (gr !== falling.r){
    for (var i = 0; i < cells.length; i++){
      var cc = cells[i];
      var gx = BX + cc.c * CELL + CELL / 2;
      var gy = BY + (cc.r + gr - falling.r) * CELL + CELL / 2;
      drawBall(gx, gy, cc.t, CELL, 0.20, 0.85);
    }
  }
  for (var j = 0; j < cells.length; j++){
    var c2 = cells[j];
    var x = BX + c2.c * CELL + CELL / 2;
    var y = BY + c2.r * CELL + CELL / 2;
    drawBall(x, y, c2.t, CELL, 1, 1);
  }
}

function drawParticles(){
  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    var a = p.life / p.max;
    if (p.kind === 0){
      ctx.globalAlpha = a;
      ctx.fillStyle = p.col;
    } else {
      ctx.globalAlpha = a * 0.30;
      ctx.fillStyle = '#eaf2ff';
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawChainText(){
  if (chainT <= 0 || chainNum < 2) return;
  var elapsed = 1.1 - chainT;
  var s = 1 + 0.45 * Math.max(0, 1 - elapsed / 0.22);
  var a = Math.min(1, chainT / 0.35);
  var txt = chainNum + 'れんさ！';
  ctx.save();
  ctx.translate(BX + COLS * CELL / 2, BY + 300);
  ctx.scale(s, s);
  ctx.globalAlpha = a * 0.35;
  ctx.fillStyle = '#ffb703';
  ctx.beginPath();
  ctx.arc(0, 0, 92, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = a;
  ctx.font = 'bold 40px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#6b1f0a';
  ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = '#ffe066';
  ctx.fillText(txt, 0, 0);
  ctx.restore();
}

function miniBall(x, y, t, sz){
  if (t === NORI) drawBall(x, y, NORI, sz, 1, 1);
  else drawBall(x, y, t, sz, 1, 1);
}

function drawPanel(){
  var pcx = 406;
  rr(340, 62, 132, 300, 12);
  ctx.fillStyle = 'rgba(18,24,50,0.80)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(140,170,255,0.20)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillStyle = '#9fb3d9';
  ctx.fillText('NEXT', pcx, 84);

  for (var i = 0; i < 2; i++){
    var p = queue[i];
    if (!p) continue;
    var cy = i === 0 ? 132 : 232;
    var sz = i === 0 ? 40 : 30;
    ctx.globalAlpha = i === 0 ? 1 : 0.7;
    miniBall(pcx, cy - sz * 0.56, p.a, sz);
    miniBall(pcx, cy + sz * 0.56, p.b, sz);
    ctx.globalAlpha = 1;
  }

  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#c98a52';
  ctx.fillText('⬛ せり上がり', pcx, 292);

  var mw = 104, mx = pcx - mw / 2, my = 310, mh = 12;
  var d = garbageDelay();
  var prog = garbagePending ? 1 : 1 - Math.max(0, garbageT) / d;
  if (prog < 0) prog = 0;
  if (prog > 1) prog = 1;
  rr(mx, my, mw, mh, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fill();
  if (prog > 0.03){
    rr(mx, my, Math.max(6, mw * prog), mh, 6);
    ctx.fillStyle = garbagePending ? '#ff7a45' : '#a16a35';
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(140,170,255,0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(352, 350);
  ctx.lineTo(460, 350);
  ctx.stroke();

  ctx.font = '16px sans-serif';
  ctx.fillStyle = 'rgba(160,185,230,0.42)';
  var vt = 'おにぎり職人';
  for (var k = 0; k < vt.length; k++) ctx.fillText(vt.charAt(k), pcx, 386 + k * 24);

  ctx.font = emojiFont(54);
  ctx.globalAlpha = 0.85;
  ctx.fillText('🍙', pcx, 620);
  ctx.globalAlpha = 1;
}

function onDown(x, y, id){
  var n = 0;
  for (var k in ptrs) n++;
  ptrs[id] = { x: x, y: y, x0: x, y0: y, t: 0, dir: x < W / 2 ? -1 : 1, moved: false, acted: false };
  n++;
  if (n >= 2){
    multiTouch = true;
    rotatePiece();
  } else {
    holdId = id;
    holdRep = 0.14;
  }
}

function onMove(x, y, id){
  var p = ptrs[id];
  if (!p) return;
  p.x = x; p.y = y;
  var dy = y - p.y0, dx = x - p.x0;
  if (!p.moved && dy > 55 && Math.abs(dy) > Math.abs(dx) * 1.2){
    p.moved = true;
    hardDrop();
  }
}

function onUp(x, y, id){
  var p = ptrs[id];
  if (!p) return;
  delete ptrs[id];
  var wasMulti = multiTouch;
  var n = 0;
  for (var k in ptrs) n++;
  if (n === 0) multiTouch = false;
  if (holdId === id) holdId = null;
  if (wasMulti) return;
  if (p.moved || p.acted) return;
  if (p.y - p.y0 > 40) return;
  move(p.dir);
}

function onResize(){}

/*__VAPPA_JS_END__*/
</script>
